: "C", "text": "Vì chủ nghĩa xã hội thực hiện sự thống trị của giai cấp, tầng lớp nghèo nàn trong xã hội"}, {"key": "D", "text": "Vì chủ nghĩa xã hội là giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa"}], "answer": ["A"], "note": "", "block": 1}, {"id": 16, "text": "Nguồn gốc gây nên tình trạng thống trị của người đàn ông trong gia đình, sự bất bình đẳng nam, nữ, giữa vợ chồng, sự nô dịch đối với phụ nữ trong gia đình là gì?", "options": [{"key": "A", "text": "Là chế độ phong kiến"}, {"key": "B", "text": "Là chế độ hôn nhân phụ hệ"}, {"key": "C", "text": "Là chế độ tư hữu về tư liệu sản xuất"}, {"key": "D", "text": "Là các quan niệm đạo đức lỗi thời"}], "answer": ["C"], "note": "", "block": 1}, {"id": 17, "text": "Có bao nhiêu phương hướng được đề ra tại Văn kiện Đại hội đại biểu toàn quốc lần thứ XI trong thời kỳ quá độ lên chủ nghĩa xã hội?", "options": [{"key": "A", "text": "5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "8"}, {"key": "D", "text": "9"}], "answer": ["C"], "note": "", "block": 1}, {"id": 18, "text": "Điểm khác biệt cơ bản nhất giữa cách hiểu về dân chủ thời cổ đại và hiện nay là gì? (Chọn 2 đáp án)", "options": [{"key": "A", "text": "Tính chất trực tiếp của mối quan hệ sở hữu quyền lực công cộng"}, {"key": "B", "text": "Nội hàm khái niệm nhân dân"}, {"key": "C", "text": "Giai Cấp tổ chức quyền lực dân chủ"}, {"key": "D", "text": "Tính triệt để hay không triệt để của dân chủ"}], "answer": ["A", "B"], "note": "", "block": 1}, {"id": 19, "text": "Ở nước ta, nội dung chính trị của liên minh công - nông - trí thức thể hiện ở điểm gì?", "options": [{"key": "A", "text": "Giữ vững lập trường chính trị - tư tưởng của giai cấp công nhân, vai trò lãnh đạo của Đảng Cộng sản Việt Nam, giữ vững độc lập dân tộc và định hướng đi lên chủ nghĩa xã hội"}, {"key": "B", "text": "Giữ vững nền kinh tế thị trường theo hướng hiện đại, kiên định con đường đi lên chủ nghĩa xã hội"}, {"key": "C", "text": "Giữ vững địa vị thống trị của giai cấp công nhân thông qua Đảng Cộng sản Việt Nam trong mối liên minh giai cấp"}, {"key": "D", "text": "Giữ vững vai trò định hướng, kim chỉ nam của kinh tế nhà nước trong nền kinh tế thị trường tự do hiện đại"}], "answer": ["A"], "note": "", "block": 1}, {"id": 20, "text": "Hình thức dân chủ ở Việt Nam mà người dân bầu ra cơ quan quyền lực nhà nước cao nhất, ủy quyền cho họ thực hiện quyền lực của nhân dân được gọi là hình thức dân chủ gì?", "options": [{"key": "A", "text": "Hình thức dân chủ trực tiếp"}, {"key": "B", "text": "Hình thức dân chủ gián tiếp"}, {"key": "C", "text": "Hình thức dân chủ đại nghị"}, {"key": "D", "text": "Hình thức dân chủ công khai"}], "answer": ["B"], "note": "", "block": 1}, {"id": 21, "text": "Trên lĩnh vực kinh tế, trong thời kỳ quá độ lên chủ nghĩa xã hội tất yếu tồn tại nền kinh tế như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Kinh tế nhiều thành phần, trong đó có thành phần đối lập"}, {"key": "B", "text": "Kinh tế kế hoạch hóa tập trung cao độ"}, {"key": "C", "text": "Kinh tế thị trường tự do"}, {"key": "D", "text": "Kinh tế hàng hóa giản đơn"}], "answer": ["A"], "note": "", "block": 1}, {"id": 22, "text": "Nguyên nhân nào làm xuất hiện các tầng lớp xã hội mới?", "options": [{"key": "A", "text": "Cơ cấu xã hội biến đổi phức tạp, đa dạng"}, {"key": "B", "text": "Cơ cấu giai cấp biến đổi phức tạp, đa dạng"}, {"key": "C", "text": "Cơ cấu xã hội - giai cấp thiếu tính đồng bộ"}, {"key": "D", "text": "Cơ cấu xã hội - giai cấp biến đổi phức tạp, đa dạng"}], "answer": ["D"], "note": "", "block": 1}, {"id": 23, "text": "Giai cấp công nhân Việt Nam ra đời trong bối cảnh nào?", "options": [{"key": "A", "text": "Trong bối cảnh của các cuộc khai thác thuộc địa của thực dân Pháp ở Việt Nam"}, {"key": "B", "text": "Trong giai đoạn công nghiệp hóa phát triển mạnh mẽ ở nước ta"}, {"key": "C", "text": "Trong phong trào đấu tranh giành chính quyền từ khi có Đảng Cộng sản"}, {"key": "D", "text": "Trong lúc Đảng Cộng sản đã giành được chính quyền"}], "answer": ["A"], "note": "", "block": 1}, {"id": 24, "text": "Chức năng chính trị của gia đình thể hiện điều gì?", "options": [{"key": "A", "text": "Gia đình là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và hưởng lợi từ hệ thống chính sách, pháp luật đó"}, {"key": "B", "text": "Gia đình là một công cụ thực thi quyền lực thống trị chính trị, mang bản chất của giai cấp cầm quyền"}, {"key": "C", "text": "Gia đình là tổ chức chính trị nhỏ nhất trong xã hội, thực thi quyền lực thống trị của người giữ vai trò quyết định kinh tế"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 1}, {"id": 25, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội ở nước ta hiện nay, giai Cấp nông dân có sự biến đã theo xu hướng nào?", "options": [{"key": "A", "text": "Giảm dân về số lượng và tỷ lệ trong cơ Cấu xã hội - giai Cấp"}, {"key": "B", "text": "Tăng dân vệ sở lương và tỷ lệ trong cơ Cấu xã hội - giai Cấp"}, {"key": "C", "text": "Giảm dần về Số lượng nhưng tăng dân Về tỷ lệ trong cơ cảu xã hội - giai Cấp"}, {"key": "D", "text": "Tăng dân Về SỐ lượng nhưng giảm dân Về tỷ lệ trong cơ Cấu xã hội - giai Cấp"}], "answer": ["A"], "note": "", "block": 1}, {"id": 26, "text": "Nội dung giáo dục gia đình hiện nay ở Việt Nam hướng đến giáo dục điều gì?", "options": [{"key": "A", "text": "Giáo dục kiến thức khoa học hiện đại, trang bị công cụ để con cái hòa nhập với thế giới"}, {"key": "B", "text": "Giáo dục tinh thần làm giàu, kinh doanh, sản mà"}, {"key": "C", "text": "Giáo dục con cái hướng đến các giá trị truyền thống xưa"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 1}, {"id": 27, "text": "Điền cụm từ thích hợp vào (...): \"cần phải có một thời kỳ quá độ khá lâu dài từ ... lên ...\"(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chủ nghĩa tư bản/ Chủ nghĩa xã hội"}, {"key": "B", "text": "Người bị bóc lột/ lên làm chủ"}, {"key": "C", "text": "Giai cấp công nhân/ người nắm chính quyền"}, {"key": "D", "text": "Chủ nghĩa xã hội/ Chủ nghĩa cộng sản"}], "answer": ["A"], "note": "", "block": 1}, {"id": 28, "text": "Những đặc điểm cơ bản của thời kì quá độ lên chủ nghĩa xã hội là gì?\n(Chọn 2 đáp án)", "options": [{"key": "A", "text": "Thời kì cải tạo cách mạng sâu sắc, triệt để xã hội tư bản chủ nghĩa trên mọi lĩnh vực"}, {"key": "B", "text": "Thời kì xây dựng từng bước cơ sở vật chất - kỹ thuật và đời sống tinh thần của chủ nghĩa xã hội"}, {"key": "C", "text": "Thời kì đấu tranh giai cấp khi tương quan lực lượng cân bằng"}, {"key": "D", "text": "Thời kì thực hiện nền chuyên chính lao động"}], "answer": ["A", "B"], "note": "", "block": 1}, {"id": 29, "text": "Vai trò của giai cấp công nhân là:(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Là khách thể của quá trình sản xuất vật chất để sản xuất ra của cải vật chất ngày càng nhiều đáp ứng nhu cầu ngày càng tăng của con ngưòi và xã hội"}, {"key": "B", "text": "Là chủ thể của quá trình sản xuất vật chất đã sản xuất ra của cải vật chất ngày càng nhiều đáp ứng nhu cầu ngày càng tăng của con người và xã hội"}, {"key": "C", "text": "Là chủ thể của quá trình sản xuất nông nghiệp"}, {"key": "D", "text": "Là chủ thể của quá trình sản xuất tinh thần"}], "answer": ["B"], "note": "", "block": 1}, {"id": 30, "text": "Theo nghĩa hẹp, chủ nghĩa xã hội khoa học được hiểu là gì?", "options": [{"key": "A", "text": "Là một trong ba bộ phận hợp thành chủ nghĩa Mác - Lênin"}, {"key": "B", "text": "Là những thành tựu của con người đạt được trong quá trình đấu tranh giai cấp"}, {"key": "C", "text": "Là sự chuyển biến tất yếu của xã hội loài người từ chủ nghĩa tư bản lên một xã hội tốt đẹp hơn"}, {"key": "D", "text": "Là một hình thái kinh tế - xã hội"}], "answer": ["A"], "note": "", "block": 1}, {"id": 31, "text": "Ngày nay, xu hướng \"trí tuệ hóa\" tăng nhanh, đã tạo ra hệ quả gì cho giai cấp công nhân?", "options": [{"key": "A", "text": "Giai cấp công nhân tham gia ở những vị trí, cấp bậc cao hơn trong các công xưởng, doanh nghiệp và ngày càng có xu hướng thỏa hiệp với giai cấp tư sản"}, {"key": "B", "text": "Nhu cầu vật chất, tinh thần ngày càng tăng, phong phú và đa dạng hơn"}, {"key": "C", "text": "Xu hướng đình công, bãi công ngày càng diễn ra rộng rãi"}, {"key": "D", "text": "Giai cấp công nhân có trí tuệ cao hơn, có xu hướng chuyển biến thành giai cấp tư sản"}], "answer": ["B"], "note": "", "block": 1}, {"id": 32, "text": "Theo chủ nghĩa Mác - Lênin, hình thái kinh tế- xã hội cộng sản chủ nghĩa có khác biệt đặc trưng nào với các hình thái kinh tế xã hội chiếm hữu nô lệ, phong kiến và tư bản chủ nghĩa?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Hình thái kinh tế- xã hội công sản chủ nghĩa là giai đoạn phát triển cao nhất và cuối cùng của lịch sử loài người"}, {"key": "B", "text": "Hình thái kinh tế — xã hội công sản chủ nghĩa khác biệt về chất, đó là xã hội không có giai Cấp đối kháng như các xã hội trước đó"}, {"key": "C", "text": "Hình thái kinh tế — xã hội công sản chủ nghĩa là phiên bản điều chỉnh tốt hơn tứ tư bản chủ nghĩa"}, {"key": "D", "text": "Hình thái kinh tế - xã hội cộng sản chủ nghĩa là quay trở lại công sản nguyên thủy"}], "answer": ["B"], "note": "", "block": 1}, {"id": 33, "text": "Tại sao nói việc sở hữu một lượng tư liệu sản xuất xã hội thông qua chế độ cổ phần không làm thay đổi bản chất bị bóc lột của giai cấp công nhân trong xã hội tư bản chủ nghĩa?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Do quá trình sản xuất và phân chia lợi nhuận vẫn bị phụ thuộc vào các nhà tư sản lớn"}, {"key": "B", "text": "Do tỷ lệ sở hữu của giai cấp công nhân không cao"}, {"key": "C", "text": "Tất cả các đáp án đều đúng"}, {"key": "D", "text": "Do việc làm và lao động vẫn là nhân tố quyết định mức thu nhập và đời sống của công nhân"}], "answer": ["A"], "note": "", "block": 1}, {"id": 34, "text": "Trong hai mặt của vấn đề tôn giáo, mặt nào phản ánh mâu thuẫn mang tính chất đối kháng giữa các giai cấp và các thế lực lợi dụng tôn giáo chống lại sự nghiệp cách mạng của nhân dân lao động?", "options": [{"key": "A", "text": "Mặt chính trị"}, {"key": "B", "text": "Mặt tư tưởng"}, {"key": "C", "text": "Không có mặt nào có tính chất mâu thuẫn đối kháng"}, {"key": "D", "text": "Cả hai mặt đều có tính chất mâu thuẫn đối kháng"}], "answer": ["A"], "note": "", "block": 1}, {"id": 35, "text": "Dân chủ được hiểu là:", "options": [{"key": "A", "text": "Một giá trị xã hội phản ánh các quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại"}, {"key": "B", "text": "Một giá trị xã hội phản ảnh các quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp tư sản cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại"}, {"key": "C", "text": "Một giá trị xã hội phản ánh các quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp thống trị cầm quyền; có quá trình ra đời, phát triển từ xã hội chiếm hữu nô lệ"}, {"key": "D", "text": "Một giá trị xã hội phản ánh các quyền cơ bản của con người; là một hình thức tổ chức"}], "answer": ["A"], "note": "", "block": 1}, {"id": 36, "text": "Cho đến nay, hình thức quá độ lên chủ nghĩa xã hội nào chưa từng diễn ra trên thực tế?", "options": [{"key": "A", "text": "Quá độ toàn diện"}, {"key": "B", "text": "Quả độ trực tiếp"}, {"key": "C", "text": "Quá độ bộ phận"}, {"key": "D", "text": "Quá độ gián tiếp"}], "answer": ["B"], "note": "", "block": 1}, {"id": 37, "text": "Nguyên tắc phân phối chủ yếu của chủ nghĩa xã hội là gì?", "options": [{"key": "A", "text": "Làm theo năng lực, hướng theo nhu cầu"}, {"key": "B", "text": "Làm theo năng lực, hướng theo lao động"}, {"key": "C", "text": "Làm theo năng lực, hướng theo phúc lợi xã hội"}, {"key": "D", "text": "Làm theo công việc, hướng theo tiền lương"}], "answer": ["B"], "note": "", "block": 1}, {"id": 38, "text": "Cùng với sự phát triển mạnh mẽ của nền đại công nghiệp cơ khí là sự trưởng thành vượt bậc cả về số lượng và chất lượng của giai cấp nào?", "options": [{"key": "A", "text": "Công nhân"}, {"key": "B", "text": "Nông dân"}, {"key": "C", "text": "Tư sản"}, {"key": "D", "text": "Chủ nô"}], "answer": ["A"], "note": "", "block": 1}, {"id": 39, "text": "Tác phẩm nào đánh dấu sự ra đời của chủ nghĩa xã hội khoa học?", "options": [{"key": "A", "text": "Tuyên ngôn của Đảng Cộng sản"}, {"key": "B", "text": "Tình cảnh nước Anh"}, {"key": "C", "text": "Bộ Tư bản"}, {"key": "D", "text": "Góp phần phê phán triết học pháp quyền của Hêghen - Lời nói đầu"}], "answer": ["A"], "note": "", "block": 1}, {"id": 40, "text": "Bản chất dân chủ của Chế độ nước ta hiện nay được hiểu như thế nào?", "options": [{"key": "A", "text": "Chế độ ta là do nhân dân làm chủ, quyền lực thuộc vệ nhân dân"}, {"key": "B", "text": "Chế đó ta là do Đảng Cộng sản Việt Nam làm chủ, là đai diện ý chí, nguyện vọng của nhân dân"}, {"key": "C", "text": "Chế đó ta là do giai Cấp công nhân làm chủ, quyền lực thuộc về giai Cấp công nhân"}, {"key": "D", "text": "Chế đó ta là do Cá nhân làm chủ, được hiện thực hóa thông qua vai trò làm chủ duy nhất của Đảng Cộng sản Việt Nam"}], "answer": ["A"], "note": "", "block": 1}, {"id": 41, "text": "Tiền đề kinh tế- xã hội dẫn tới sự sụp đổ không tránh khỏi của chủ nghĩa tư bản là:", "options": [{"key": "A", "text": "Sự phát triển về lực lượng sản xuất và sự trưởng thành của giai cấp công nhân"}, {"key": "B", "text": "Sự phát triển về quan hệ sản xuất và sự trưởng thành của giai cấp công nhân"}, {"key": "C", "text": "Sự phát triển về lực lượng sản xuất và sự trưởng thành của giai cấp nông dân"}, {"key": "D", "text": "Sự phát triển về lực lượng sản xuất và sự trưởng thành của tầng lớp tri thức"}], "answer": ["A"], "note": "", "block": 1}, {"id": 42, "text": "Điều kiện và tiền đề kinh tế - XH để xây dựng gia đình trong CNXH là gì?", "options": [{"key": "A", "text": "Xóa bỏ chế tư hữu, xác lập chế độ công hữu về tư liệu sản xuất."}, {"key": "B", "text": "Phát triển kinh tế - XH"}, {"key": "C", "text": "Nhà nước XHCN ban hành và thực hiện luật hôn nhân và nâng cao trình độ văn hóa và dân trí cho mọi người dân"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 1}, {"id": 43, "text": "Ai đã khẳng định: \"Từ khi bộ Tư bản ra đời... quan niệm duy vật lịch sử không còn là một giả thuyết của, ma la một nguyên lý đã được chứng minh một cách khoa học?", "options": [{"key": "A", "text": "V.I.Lênin"}, {"key": "B", "text": "Các Mác"}, {"key": "C", "text": "Ph.Ăngghen"}, {"key": "D", "text": "S.Phurie"}], "answer": ["A"], "note": "", "block": 1}, {"id": 44, "text": "Phát hiện ra sự phân chia xã hội thành giai Cấp và đấu tranh giai Cấp là công lao của ai?", "options": [{"key": "A", "text": "Các Mác"}, {"key": "B", "text": "V.I. Lênin"}, {"key": "C", "text": "Ph.Ảng ghen"}, {"key": "D", "text": "Các nhà sử học tư sản trước Mác"}], "answer": ["D"], "note": "", "block": 1}, {"id": 45, "text": "Để tạo sức mạnh tổng hợp đảm bảo cho thắng lợi của cuộc cách mạng xã hội chủ nghĩa thì cần phải có sự lãnh đạo của tổ chức nào?", "options": [{"key": "A", "text": "Công đoàn"}, {"key": "B", "text": "Đảng Cộng sản"}, {"key": "C", "text": "Hội Thanh niên"}, {"key": "D", "text": "Đoàn Thanh niên Cộng sản Hồ Chí Minh"}], "answer": ["B"], "note": "", "block": 1}, {"id": 46, "text": "Hành vi nào dưới đây được cho là lợi dụng tín ngưỡng, tôn giáo mà Nhà nước Việt Nam nghiêm cấm?(Chọn 3)", "options": [{"key": "A", "text": "Hoạt động mê tín dị đoan"}, {"key": "B", "text": "Lợi dụng giáo dân và tôn giáo để hoạt động trái pháp luật và chính sách của Nhà nước"}, {"key": "C", "text": "Kích động chia rẽ nhân dân, chia rẽ dân tộc, gây rối, xâm phạm an ninh quốc gia"}, {"key": "D", "text": "Kêu gọi sự giúp đỡ từ tổ chức tôn giáo quốc tế đối với các tôn giáo du nhập từ bên ngoài"}], "answer": ["A", "B", "C"], "note": "", "block": 1}, {"id": 47, "text": "Dân chủ xã hội chủ nghĩa chỉ có thể có và được duy trì với điều kiện tiên quyết là gì?", "options": [{"key": "A", "text": "Giai cấp công nhân phải nắm được quyền thống trị xã hội"}, {"key": "B", "text": "Bảo đảm vai trò lãnh đạo duy nhất của Đảng Cộng sản"}, {"key": "C", "text": "Thực hiện dân chủ rộng rãi đối với mọi giai cấp, tầng lớp"}, {"key": "D", "text": "Thực hiện đa nguyên chính trị"}], "answer": ["B"], "note": "", "block": 1}, {"id": 48, "text": "Gia đình Việt Nam hiện đại có mấy thế hệ cùng sống chung?", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "4"}, {"key": "D", "text": "3"}], "answer": ["B"], "note": "", "block": 1}, {"id": 49, "text": "Sự kiện gì đánh dấu việc V.I.Lênin đã biến chủ nghĩa xã hội từ khoa học, lý luận thành hiện thực?", "options": [{"key": "A", "text": "Cách mạng tháng Mười Nga và sự ra đời của Nhà nước Xô - viết Nga 1917"}, {"key": "B", "text": "Sự ra đời của Liên Xô"}, {"key": "C", "text": "Sự chiến thắng của nước Nga trong giai đoạn nội chiến"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 1}, {"id": 50, "text": "Đâu là điều kiện tiên quyết để xây dựng nền dân chủ xã hội chủ nghĩa Việt Nam?", "options": [{"key": "A", "text": "Xây dựng Đảng Cộng sản Việt Nam trong sạch, vững mạnh"}, {"key": "B", "text": "Xây dựng nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân"}, {"key": "C", "text": "Xây dựng khối đại đoàn kết dân tộc"}, {"key": "D", "text": "Xây dựng nhà nước phát triển và hợp tác quốc tế tốt"}], "answer": ["A"], "note": "", "block": 1}, {"id": 51, "text": "Trong Văn kiện Đại hội đại biểu toàn quốc lần thứ IX, Đảng Cộng sản Việt Nam đã nêu rõ:", "options": [{"key": "A", "text": "Vấn đề dân tộc có vai trò quan trọng đối với sự nghiệp phát hiện kinh tế- xã hội ở nước ta hiện nay."}, {"key": "B", "text": "Vấn đề dân tộc và đoàn kết các dân tộc luôn có vị trí chiến lược trong sự nghiệp cách mạng."}, {"key": "C", "text": "Vấn đề dân tộc và đoàn kết các dân tộc có vị trí quyết định đến sự sống còn của dân tộc ta hiện nay."}, {"key": "D", "text": "Vấn đề dân tộc và tăng cường khối đại đoàn kết toàn dân tộc là vấn đề chiến lược của Việt Nam hiện nay."}], "answer": ["B"], "note": "(Kiểu hỏi khác: Đảng Cộng sản Việt Nam đã nêu rõ vấn để nào trong Văn kiện Đại hội đại biểu toàn quốc lần thứ XII?)", "block": 2}, {"id": 52, "text": "Xây dựng gia đình Việt Nam hiện nay là xây dựng mô hình gia đình như thế nào?", "options": [{"key": "A", "text": "Hiện đại với tiến trình công nghiệp hóa, hiện đại hóa đất nước và hội nhập kinh tế quốc tế"}, {"key": "B", "text": "Hiện đại, phù hợp với tiến trình công nghiệp hóa, hiện đại hóa đất nước và hội nhập kinh tế quốc tế"}, {"key": "C", "text": "Phù hợp với tiến trình công nghiệp hóa, hiện đại hóa đất nước và hội nhập kinh tế quốc tế"}, {"key": "D", "text": "Hiện đại, phù hợp với tiến trình công nghiệp hóa đất nước và hội nhập kinh tế quốc tế"}], "answer": ["B"], "note": "", "block": 2}, {"id": 53, "text": "Dựa trên phương diện chính trị - xã hội, giai cấp công nhân được hiểu là:", "options": [{"key": "A", "text": "Là những người nông dân nghèo bị bóc lột sức lao động"}, {"key": "B", "text": "Là những người tri thức tham gia vào sản xuất"}, {"key": "C", "text": "Là sản phẩm xã hội của quá trình phát triển tư bản chủ nghĩa"}, {"key": "D", "text": "A và B đều đúng"}], "answer": ["C"], "note": "", "block": 2}, {"id": 54, "text": "Các khẩu hiệu \"sống có việc làm hay là chết trong đấu tranh\" (1831) và \"cộng hòa hay là chết (1834) xuất hiện trong phong trào đấu tranh của công nhân dệt ở Lion (Pháp) có ý nghĩa gì?", "options": [{"key": "A", "text": "Phong trào đấu tranh của giai cấp công nhân đã chuyển từ mục đích kinh tế sang mục đích chính trị"}, {"key": "B", "text": "Phong trào đấu tranh của giai cấp công nhân đã có lý luận soi đường"}, {"key": "C", "text": "Phong trào đấu tranh của giai cấp công nhân đã có những thắng lợi to lớn"}, {"key": "D", "text": "Phong trào đấu tranh của giai cấp công nhân chuyển từ tự phát sang tự giác"}], "answer": ["A"], "note": "", "block": 2}, {"id": 55, "text": "Vấn đề: \"Tập hợp đồng bào theo tín ngưỡng, tôn giáo và đồng bào không theo tín ngưỡng, tôn giáo xây dựng khối đại đoàn kết toàn dân tộc, xây dựng và bảo vệ Tổ quốc\" được đề cập trong Luật nào?", "options": [{"key": "A", "text": "Luật tín ngưỡng, tôn giáo"}, {"key": "B", "text": "Luật phòng, chống bạo lực gia đình"}, {"key": "C", "text": "Luật giáo dục"}, {"key": "D", "text": "Luật mê tín, tôn giáo"}], "answer": ["A"], "note": "", "block": 2}, {"id": 56, "text": "Mức đó tác động của gia đình đối với xã hội phụ thuộc vào yếu tố nào?(Chọn 3)", "options": [{"key": "A", "text": "Vào bản chất của từng chế độ xã hội"}, {"key": "B", "text": "Vào đường lối, chủ trương của giai Cấp cầm quyền"}, {"key": "C", "text": "Vào bản thân mô hình, kết cấu, đặc điểm của mới hình thức gia đình trong lịch sử"}, {"key": "D", "text": "Vào ý chí, nguyện vọng của các thành viên trong gia đình"}], "answer": ["A", "B", "C"], "note": "", "block": 2}, {"id": 57, "text": "Sự ra đời của Đảng Cộng sản Việt Nam có tính đặc thù gì so với quy luật chung của sự ra đời các Đảng Cộng sản theo chủ nghĩa Mác - Lênin?", "options": [{"key": "A", "text": "Có sự kết hợp với phong trào yêu nước của dân tộc"}, {"key": "B", "text": "Có lãnh tụ xuất sắc"}, {"key": "C", "text": "Có sự ủng hộ của các Đảng Cộng sản khác"}, {"key": "D", "text": "Có sự liên kết với giai cấp nông dân"}], "answer": ["A"], "note": "", "block": 2}, {"id": 58, "text": "Quan hệ nào được coi là quan hệ cơ bản nhất trong gia đình?", "options": [{"key": "A", "text": "Quan hệ hôn nhân và huyết thống"}, {"key": "B", "text": "Quan hệ quân tụ trong một không gian sinh tồn"}, {"key": "C", "text": "Quan hệ hôn nhân"}, {"key": "D", "text": "Quan hệ nuôi dưỡng"}], "answer": ["A"], "note": "", "block": 2}, {"id": 59, "text": "Thực chất của liên minh công - nông - tri thức ở nước ta Về nội dung kinh tế là gì?", "options": [{"key": "A", "text": "Là sự hợp tác giữa họ, đồng thời mở rộng liên kết với các lực lượng khác để xây dựng nền kinh tế mới xã hội chủ nghĩa hiện đại"}, {"key": "B", "text": "Là sự hợp tác giữa họ, đồng thời mô rộng liên kết với các lực lượng khác để xây dựng nền kinh tế thị trường tự do hiện đại"}, {"key": "C", "text": "Là sự hợp tác và đấu tranh giữa họ, đồng thời mở rộng liên kết và đấu tranh với các lực lượng khác để xây dựng nền kinh tế mới"}, {"key": "D", "text": "Là sự hợp tác giữa họ, đồng thời mở rộng liên kết với các lực lượng khác để xây dựng nền chính trị dân chủ"}], "answer": ["A"], "note": "", "block": 2}, {"id": 60, "text": "\"Dân chủ quân sự\" dùng để chỉ chế độ dân chủ nào?", "options": [{"key": "A", "text": "Chế độ cộng sản nguyên thủy"}, {"key": "B", "text": "Chế độ tư bản chủ nghĩa"}, {"key": "C", "text": "Chế độ phong kiến"}, {"key": "D", "text": "Chế độ chiếm hữu nô lệ"}], "answer": ["A"], "note": "", "block": 2}, {"id": 61, "text": "Tôn giáo nào du nhập vào Việt Nam mà không chịu ảnh hưởng của bản sắc văn hóa Việt Nam?", "options": [{"key": "A", "text": "Phật giáo"}, {"key": "B", "text": "Công giáo"}, {"key": "C", "text": "Hồi giáo"}, {"key": "D", "text": "Không có"}], "answer": ["D"], "note": "", "block": 2}, {"id": 62, "text": "Cơ sở chính trị - xã hội để xây dựng gia đình trong chủ nghĩa xã hội là gì?", "options": [{"key": "A", "text": "Tất cả các đáp án đều đúng"}, {"key": "B", "text": "Thiết lập chế độ công hữu về tư liệu sản xuất"}, {"key": "C", "text": "Xây dựng văn hóa xã hội chủ nghĩa"}, {"key": "D", "text": "Thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa"}], "answer": ["D"], "note": "", "block": 2}, {"id": 63, "text": "Giáo dục gia đình và giáo dục của xã hội có vị trí, vai trò như thế nào trong quá trình phát triển của mỗi cá nhân?", "options": [{"key": "A", "text": "Giáo dục gia đình đóng vai trò quyết định sự phát triển của cá nhân"}, {"key": "B", "text": "Giáo dục của xã hội đóng vai trò quyết định sự phát triển của cá nhân"}, {"key": "C", "text": "Giáo dục gia đình gắn liền với giáo dục của xã hội trong quá trình phát triển của mỗi cá nhân"}, {"key": "D", "text": "Giáo dục gia đình và giáo dục của xã hội chịu sự chi phối của quá trình nhận thức riêng biệt của mỗi cá nhân dựa trên tâm tư, tình cảm, tri thức chủ quan của cá nhân đó"}], "answer": ["C"], "note": "", "block": 2}, {"id": 64, "text": "Nền dân chủ xã hội chủ nghĩa mang bản chất của giai cấp nào?", "options": [{"key": "A", "text": "Giai cấp công nhân"}, {"key": "B", "text": "Giai cấp tư sản"}, {"key": "C", "text": "Giai cấp tiểu tư sản"}, {"key": "D", "text": "Giai cấp nông dân"}], "answer": ["A"], "note": "", "block": 2}, {"id": 65, "text": "Sứ mệnh của nhà nước xã hội chủ nghĩa là gì?", "options": [{"key": "A", "text": "Xây dựng thành công chủ nghĩa công sản, đưa tất cả các giai cấp, tầng lớp lên địa vị làm chủ trên tất cả các mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội cộng sản chủ nghĩa"}, {"key": "B", "text": "Xây dựng thành công chủ nghĩa xã hội, đưa giai cấp công nhân lên địa vị thống trị trên tất cả các mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội xã hội chủ nghĩa"}, {"key": "C", "text": "Xây dựng thành công chủ nghĩa xã hội, đưa nhân dân lao động lên địa vị làm chủ trên tất cả các mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội xã hội chủ nghĩa"}, {"key": "D", "text": "Xây dựng thành công xã hội chủ nghĩa, đưa tất cà các giai cấp, tầng lớp lên địa vị"}], "answer": ["C"], "note": "", "block": 2}, {"id": 66, "text": "Theo chủ nghĩa Mác - Lênin, tính chất chính trị của tôn giáo xuất hiện từ khi nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Khi xã hội đã có phân chia giai cấp và đối kháng giai cấp"}, {"key": "B", "text": "Khi xă hội đã thủ tiêu được giai Cấp"}, {"key": "C", "text": "Khi loài người bước vào đêm trường trung cổ"}, {"key": "D", "text": "Khi chủ nghĩa Mác - Lênin ra đời"}], "answer": ["A"], "note": "", "block": 2}, {"id": 67, "text": "Nhằm xây dựng thành công chủ nghĩa xã hội, thì cơ cấu kinh tế trong thời kỳ quá độ lên chủ nghĩa xã hội cần vận động theo cơ chế nào?", "options": [{"key": "A", "text": "Cơ chế kinh tế"}, {"key": "B", "text": "Cơ chế quản lý"}, {"key": "C", "text": "Cơ chế định hướng xã hội chủ nghĩa"}, {"key": "D", "text": "Cơ chế thị trường"}], "answer": ["D"], "note": "", "block": 2}, {"id": 68, "text": "Theo chủ nghĩa Mác - Lênin, chủ nghĩa xã hội được hiểu là:(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa"}, {"key": "B", "text": "Một hình thái kinh tế - xã hội"}, {"key": "C", "text": "Là một chế độ xã hội, trong đó sự thống trị của giai cấp công nhân được xác lập"}, {"key": "D", "text": "Là giai đoạn phát triển cao của hình thái kinh tế - xãa hội cộng sản chủ nghĩa"}], "answer": ["A"], "note": "", "block": 2}, {"id": 69, "text": "Cuộc đấu tranh của giai cấp vô sản chống lại nội dung gì của giai cấp tư sản?", "options": [{"key": "A", "text": "Chống lại sự thống trị, áp bức"}, {"key": "B", "text": "Chống lại chế độ độc tài"}, {"key": "C", "text": "Chống lại sự bóc lột"}, {"key": "D", "text": "Chống lại sự thống trị, độc tôn"}], "answer": ["A"], "note": "", "block": 2}, {"id": 70, "text": "Trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay, giai cấp, tầng lớp nào đang đóng góp tích cực vào việc thực hiện chiến lược phát triển kinh tế - xã hội, tạo việc làm cho người lao động?", "options": [{"key": "A", "text": "Giai cấp công nhân"}, {"key": "B", "text": "Giai cấp nông dân"}, {"key": "C", "text": "Tầng lớp trí thức"}, {"key": "D", "text": "Tầng lớp doanh nhân"}], "answer": ["D"], "note": "", "block": 2}, {"id": 71, "text": "Cơ sở văn hóa để xây dựng gia đình trong chủ nghĩa xã hội là gì?", "options": [{"key": "A", "text": "Thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa"}, {"key": "B", "text": "Thiết lập chế độ công hữu về tư liệu sản xuất"}, {"key": "C", "text": "Giá trị văn hóa được xây dựng trên nền tảng hệ tư tưởng chính trị của giai cấp công nhân"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["C"], "note": "", "block": 2}, {"id": 72, "text": "Nội dung văn hóa - xã hội trong liên minh giai cấp, tầng lớp ở nước ta hiện nay đòi hỏi phải đảm bảo điều gì?", "options": [{"key": "A", "text": "Gắn tăng trưởng kinh tế với phát hiện văn hóa, phát triển con người và thực hiện tiến bộ, công bằng xã hội"}, {"key": "B", "text": "Gắn tăng trưởng kinh tế với độc lập, tự do, phát huy nguồn lực lãnh đạo của kinh tế tư nhân"}, {"key": "C", "text": "Thực hiện tăng trưởng kinh tế bằng mọi giá, tiến nhanh đến nền kinh tế thị trường hiện đại"}, {"key": "D", "text": "Tiếp thu toàn bộ các yếu tố văn hóa nhân loại trong tiến trình hội nhập và tăng trưởng kinh tế"}], "answer": ["A"], "note": "", "block": 2}, {"id": 73, "text": "Dân chủ trong lĩnh vực nào là quan trọng hàng đầu và nổi bật nhất?", "options": [{"key": "A", "text": "Trong lĩnh vưc kinh tế và chính trị"}, {"key": "B", "text": "Trong lĩnh vưc văn hóa tinh thần và tư tưởng"}, {"key": "C", "text": "Trong lĩnh vực chính trị và tư tưởng"}, {"key": "D", "text": "Trong lĩnh vực kinh tế và tư tưởng"}], "answer": ["A"], "note": "", "block": 2}, {"id": 74, "text": "Trong giai đoạn hiện nay, lực lượng nào đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa, gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên và môi trường?", "options": [{"key": "A", "text": "Công nhân tri thức"}, {"key": "B", "text": "Giai cấp công nhân"}, {"key": "C", "text": "Giai cấp nông dân"}, {"key": "D", "text": "Tiểu tư sản"}], "answer": ["B"], "note": "", "block": 2}, {"id": 75, "text": "Sự biến đổi của cơ cấu xã hội nào sẽ tất yếu dẫn đến sự biến đổi của các cơ cấu xã hội khác và đồng thời làm biến đổi toàn bộ cơ câu xã hội nói chung?", "options": [{"key": "A", "text": "Cơ cấu xã hội - chính trị"}, {"key": "B", "text": "Cơ cấu xã hội - giai cấp"}, {"key": "C", "text": "Cơ cấu xã hội - dân tộc"}, {"key": "D", "text": "Cơ cấu xã hội - kinh tế"}], "answer": ["B"], "note": "", "block": 2}, {"id": 76, "text": "Việc thờ cúng các vị thần như: Bà Thiên Hậu, Quan Thánh Đế Quân, Na Tra, Thái Thượng Lão Quân trong cộng đồng người Hoa ở Việt Nam được gọi là gì?", "options": [{"key": "A", "text": "Tôn giáo"}, {"key": "B", "text": "Tín ngưỡng"}, {"key": "C", "text": "Mê tín"}, {"key": "D", "text": "Mê tín dị đoan"}], "answer": ["B"], "note": "", "block": 2}, {"id": 77, "text": "Đại hội XIII của Đảng Cộng sản Việt Nam đã đề ra mục tiêu gì vào năm 2030 trên con đường xây dựng chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Là nước đang phát triển, có thu nhập trung bình"}, {"key": "B", "text": "Là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao"}, {"key": "C", "text": "Là nước phát triển, có thu nhập trung bình cao"}, {"key": "D", "text": "Là nước phát triển, có thu nhập cao"}], "answer": ["B"], "note": "", "block": 2}, {"id": 78, "text": "Đại hội XIII của Đảng Cộng sản Việt Nam đã đề ra mục tiêu gì vào năm 2025 trên con đường xây dựng chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Là nước đang phát triển, có công nghiệp theo hướng hiện đại, vượt qua mức thu nhập trung bình thấp"}, {"key": "B", "text": "Là nước phát triển, có công nghiệp hóa, hiện đại hóa cao, đạt mức thu nhập cao"}, {"key": "C", "text": "Là nước đang phát triển, có công nghiệp theo hướng hiện đại, đạt được mức thu nhập trung bình"}, {"key": "D", "text": "Là nước phát triển, có thành tựu khoa học - kỹ thuật hiện đại, phát triển nguồn lực nội sinh"}], "answer": ["A"], "note": "", "block": 2}, {"id": 79, "text": "Đại hội XIII của Đảng Cộng sản Việt Nam đã đề ra mục tiêu gì vào năm 2045 trên con đường xây dựng chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Trở thành nước phát triển, thu nhập cao"}, {"key": "B", "text": "Trở thành con rồng châu Á"}, {"key": "C", "text": "Trở thành nước phát triển thu nhập trung bình cao"}, {"key": "D", "text": "Trở thành nước phát triển, có kinh tế tri thức, thu nhập trung bình cao"}], "answer": ["A"], "note": "", "block": 2}, {"id": 80, "text": "Trong giai đoạn 1843 -1844, C. Mác và Ph. Ăng ghen đã chuyển biến lập trường của mình như thế nào?( Chọn 2 Đáp án)", "options": [{"key": "A", "text": "Từ thế giới quan duy tâm sang thế giới quan duy vật"}, {"key": "B", "text": "Từ lập trường dân chủ cách mạng sang lập trường cộng sản chủ nghĩa"}, {"key": "C", "text": "Từ lập trường cách mạng dân chủ sang lập trường dân tộc chủ nghĩa"}, {"key": "D", "text": "Từ phương pháp luận siêu hình sang phương pháp luận biện chứng"}], "answer": ["A", "B"], "note": "", "block": 2}, {"id": 81, "text": "Sự thống trị của giai cấp tư sản, đặc biệt của bộ phận tư sản đại công nghiệp là điều kiện ban đầu cho sự phát triển của giai cấp nào?", "options": [{"key": "A", "text": "Sự phát triển giai cấp tư sản"}, {"key": "B", "text": "Sự phát triển giai cấp chủ nô"}, {"key": "C", "text": "Sự phát triển giai cấp nông dân"}, {"key": "D", "text": "Sự phát triển giai cấp công nhân"}], "answer": ["D"], "note": "", "block": 2}, {"id": 82, "text": "Đâu là một trong những nội dung của mối quan hệ lớn trong xây dựng chủ nghĩa xã hội ở Việt Nam hiện nay?", "options": [{"key": "A", "text": "Giữa tăng trưởng kinh tế, thực hiện tiến bộ, công bằng xã hội, bảo vệ môi trường sống"}, {"key": "B", "text": "Giữa tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, bảo vệ môi trường, y tế, giáo dục"}, {"key": "C", "text": "Giữa tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, công bằng xã hội, bảo vệ môi trường"}, {"key": "D", "text": "Giữa tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, công bằng xã hội"}], "answer": ["D"], "note": "", "block": 2}, {"id": 83, "text": "Theo quan điểm của Đảng Cộng Sản Việt Nam, quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa, tức là:(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa"}, {"key": "B", "text": "Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất tư bản chủ nghĩa"}, {"key": "C", "text": "Bỏ qua việc xác lập vị trí thống trị của kiến trúc thượng tầng chủ nghĩa xã hội"}, {"key": "D", "text": "Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng chủ nghĩa xã hội"}], "answer": ["A"], "note": "", "block": 2}, {"id": 84, "text": "Chủ nghĩa xã hội có mấy đặc trưng bản chất?", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": ["C"], "note": "", "block": 2}, {"id": 85, "text": "Thuật ngữ \"giai cấp công nhân\" được các nhà kinh điển xác định theo bao nhiêu phương diện cơ bản?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "3"}, {"key": "C", "text": "4"}, {"key": "D", "text": "5"}], "answer": ["A"], "note": "", "block": 2}, {"id": 86, "text": "Dân chủ xã hội chủ nghĩa có vai trò như thế nào đối với nhà nước xã hội chủ nghĩa?", "options": [{"key": "A", "text": "Dân chủ xã hội chủ nghĩa tạo ra cơ chế hạn chế quyền lực của nhà nước xã hội chủ nghĩa"}, {"key": "B", "text": "Dân chủ xã hội chủ nghĩa là nguyên nhân sinh ra nhà nước xã hội chủ nghĩa"}, {"key": "C", "text": "Dân chủ xã hội chủ nghĩa là cơ sở, nền tảng cho việc xây dựng và hoạt động của nhà nước xã hội chủ nghĩa"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["C"], "note": "", "block": 2}, {"id": 87, "text": "Trong quá trình giải quyết vấn đề tôn giáo, chúng ta cần phân biệt hai mặt nào của tôn giáo?", "options": [{"key": "A", "text": "Chính trị và pháp quyền"}, {"key": "B", "text": "Chính trị và tư tưởng"}, {"key": "C", "text": "Tư tưởng và văn hóa"}, {"key": "D", "text": "Giáo dục và tư tưởng"}], "answer": ["B"], "note": "", "block": 2}, {"id": 88, "text": "Giai cấp nào có sứ mệnh thủ tiêu chủ nghĩa tư bản, xây dựng thành công chủ nghĩa xã hội và chủ nghĩa cộng sản?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Nông dân"}, {"key": "B", "text": "Tư sản"}, {"key": "C", "text": "Chủ nô"}, {"key": "D", "text": "Công nhân"}], "answer": ["D"], "note": "", "block": 2}, {"id": 89, "text": "Một trong những hướng phát triển dân chủ mà Chủ tịch Hồ Chí Minh đã đề ra là", "options": [{"key": "A", "text": "Dân chủ là một giá trị nhân loại chung"}, {"key": "B", "text": "Dân chủ là người dân được tự do, hạnh phúc"}, {"key": "C", "text": "Dân chủ là phát triển đất nước Xã hội chủ nghĩa ở Việt Nam"}, {"key": "D", "text": "B và C đều đúng"}], "answer": ["A"], "note": "", "block": 2}, {"id": 90, "text": "Tại sao chủ nghĩa xã hội khoa học tập trung nghiên cứu cơ cấu xã hội - giai cấp mà không phải là các cơ cấu xã hội khác?", "options": [{"key": "A", "text": "Vì cơ cấu xã hội -giai cấp là cơ cấu phổ biến rộng rãi nhất"}, {"key": "B", "text": "Vì bản chất của chủ nghĩa xã hội là trấn áp giai Cấp"}, {"key": "C", "text": "Vì đó là một trong những cơ sở để nghiên cứu văn đề liên minh giai cấp - tầng lớp trong một chế độ xã hội nhất định"}, {"key": "D", "text": "Vì đó là một trong những cơ sở để nghiên cứu văn đề phân chia quyền lực trong một Chế độ xã hội nhất định"}], "answer": ["C"], "note": "", "block": 2}, {"id": 91, "text": "Theo V.I.Lênin: Thời kỳ quá độ ở nước Nga tồn tại bao nhiều thành phần kinh tế?", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": ["C"], "note": "(5:- KT gia trưởng- KT hàng hóa nhỏ- KT tư bản- KT tư bản nhà nước- KT xã hội chủ nghĩa)", "block": 2}, {"id": 92, "text": "Về phương diện chính trị - xã hội, giai cấp công nhân có vị trí như thế nào?", "options": [{"key": "A", "text": "Là những người nắm giữ tư liệu sản xuất của xã hội tư bản chủ nghĩa, tư tổ chức sản xuất kinh doanh lớn mà không hợp tác với giai Cấp nào"}, {"key": "B", "text": "Là những người không có sở hữu tư liệu sản xuất chủ yếu của xã hội, phải bán sức lao động cho nhà tư bản và bị bóc lột giá trị thặng dư"}, {"key": "C", "text": "Là những người số hữu tư liệu sản xuất, hợp tác với nhà tư bản để kiếm sống"}, {"key": "D", "text": "Là những người có số hữu một số tư liệu sản xuất nhỏ, có thể tự sản xuất, nhưng nhỏ lẻ, để phá sản nên phải bán sức lao động cho nhà tư bản là chính"}], "answer": ["B"], "note": "", "block": 2}, {"id": 93, "text": "Đâu không phải là một chức năng của gia đình?", "options": [{"key": "A", "text": "Chức năng nghề nghiệp"}, {"key": "B", "text": "Chức năng nuôi dưỡng, giáo dục"}, {"key": "C", "text": "Chức năng kinh tế và tổ chức tiêu dùng"}, {"key": "D", "text": "Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm"}], "answer": ["A"], "note": "", "block": 2}, {"id": 94, "text": "Đặc điểm nào trong 06 đặc điểm dân tộc ở Việt Nam đã tạo điều kiện thuận lợi để các dân tộc tăng cường hiểu biết, mở rộng giao lưu, giúp đỡ nhau cùng phát triển?", "options": [{"key": "A", "text": "Có sự chênh lệch vệ dân số giữa các tộc người"}, {"key": "B", "text": "Dân tộc thiểu số ở Việt Nam phân bố chủ yếu ở các địa bàn có vị trí chiến lược quan trọng"}, {"key": "C", "text": "Dân tộc ở Việt Nam có trình độ phát triển không đều"}, {"key": "D", "text": "Các dân tộc cư trú xen kẽ nhau"}], "answer": ["D"], "note": "", "block": 2}, {"id": 95, "text": "Trong giai đoạn hiện nay, Cách mạng công nghiệp lần thứ tư đang phát triển mạnh mẽ thì vai trò của lực lượng nào trong xã hội càng trở nên quan trọng?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Công nhân"}, {"key": "B", "text": "Nông dân"}, {"key": "C", "text": "Trí thức"}, {"key": "D", "text": "Doanh nhân"}], "answer": ["C"], "note": "", "block": 2}, {"id": 96, "text": "Điều kiện chủ quan đề giai cấp công nhân thực hiện sứ mệnh lịch sử của mình là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Sự phát triển của bản thân giai cấp công nhân về cả số lượng và chất lượng"}, {"key": "B", "text": "Phải có Đảng Cộng sản lãnh đạo"}, {"key": "C", "text": "Phải có sự liên minh giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp lao động khác"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 2}, {"id": 97, "text": "Chế độ hôn nhân tiến bộ được đảm bảo trên nguyên tắc nào? (chọn 3)", "options": [{"key": "A", "text": "Hôn nhân tư nguyên"}, {"key": "B", "text": "Hôn nhân một vợ một chồng, vợ chồng bỉnh đảng"}, {"key": "C", "text": "Hôn nhân được đảm bảo về mặt pháp lý"}, {"key": "D", "text": "Hôn nhân được đảm bảo về mặt kinh tế"}], "answer": ["A", "B", "C"], "note": "", "block": 2}, {"id": 98, "text": "Ở nước ta, cư trú của các dân tộc có đặc trưng như thế nào?", "options": [{"key": "A", "text": "Mỗi dân tộc tập trung cư trú duy nhất trên một địa bàn, ngoại trừ dân tộc Kinh"}, {"key": "B", "text": "Các dân tộc cư trú xen kẽ nhau, không có một dân tộc nào tập trung duy nhất trên một địa bàn"}, {"key": "C", "text": "Các dân tộc phân bổ đồng đều"}, {"key": "D", "text": "Các dân tộc được phân chia lãnh thổ theo vị trí địa lý và đặc điểm ra đời, phát triển của dân tộc đó"}], "answer": ["D"], "note": "", "block": 2}, {"id": 99, "text": "Theo chủ nghĩa Mác - Lenin, để thực hiện được sứ mệnh lịch sử của mình, giai cấp công nhân phải thiết lập được sự liên minh với giai cấp, tầng lớp nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Liên minh với giai cấp công nhân thế giới"}, {"key": "B", "text": "Liên minh với giai cấp nông dân và các tầng lớp lao động khác"}, {"key": "C", "text": "Liên minh với một bộ phận giai cấp tư sản tiến bộ"}, {"key": "D", "text": "Liên minh với giai cấp nông dân và tầng lớp tiểu tư sản"}], "answer": ["B"], "note": "", "block": 2}, {"id": 100, "text": "Ở Việt Nam, từ những năm 70 và 80 của thế kỉ XX, Nhà nước đã tuyên truyền, phổ biến và vận động, khuyến khích mỗi cặp vợ chồng có bao nhiêu con? (NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chỉ nên có từ 1 đến 2 con"}, {"key": "B", "text": "Có từ 4 con trở lên"}, {"key": "C", "text": "Có đủ 3 con"}, {"key": "D", "text": "Còn đông con càng tốt"}], "answer": ["A"], "note": "", "block": 2}, {"id": 101, "text": "Cùng với sự phát triển của đại công nghiệp, các giai cấp khác đều suy tàn và tiêu vong, giai cấp nào là sản phẩm của bản thân nền đại công nghiệp?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Nô lệ"}, {"key": "B", "text": "Tư sản"}, {"key": "C", "text": "Công nhân"}, {"key": "D", "text": "Nông dân"}], "answer": ["C"], "note": "", "block": 3}, {"id": 102, "text": "Trong hệ thống chính sách xã hội của nước ta, các chính sách liên quan đến cơ cấu xã hội nào phải được đặt lên vị trí hàng đầu?", "options": [{"key": "A", "text": "Cơ Cấu xã hội - giai Cấp"}, {"key": "B", "text": "Cơ cấu xã hội - kinh tế"}, {"key": "C", "text": "Cơ Cấu xã hội - nghề nghiệp"}, {"key": "D", "text": "Cơ Cấu xã hội - dân tộc"}], "answer": ["A"], "note": "", "block": 3}, {"id": 103, "text": "Theo nghĩa rộng, chủ nghĩa xã hội khoa học được hiểu là gì?", "options": [{"key": "A", "text": "Là một trong ba bộ phận hợp thành chủ nghĩa Mác - Lênin"}, {"key": "B", "text": "Là chủ nghĩa Mác - Lênin, luận giải từ các giác độ triết học, kinh tế học chính trị và chính trị xã hội về sự chuyển biến tất yếu của xã hội loài người từ chủ nghĩa tư bản lên chủ nghĩa xã hội và chủ nghĩa cộng sản"}, {"key": "C", "text": "Là một học thuyết trình bày sự ra đời, phát triển và suy vong của chủ nghĩa tư bản"}, {"key": "D", "text": "Là một hình thái kinh tế - xã hội trong tiến trình lịch sử tự nhiên của loài người"}], "answer": ["B"], "note": "", "block": 3}, {"id": 104, "text": "Nơi nào được xem là cộng đồng xã hội đầu tiên mà mỗi cá nhân sinh sống?", "options": [{"key": "A", "text": "Gia đình"}, {"key": "B", "text": "Trường học"}, {"key": "C", "text": "Quê hương"}, {"key": "D", "text": "Xã hội"}], "answer": ["A"], "note": "", "block": 3}, {"id": 105, "text": "Ai đã khẳng định vấn đề sau: \"Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ\"?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "C.Mác"}, {"key": "B", "text": "V.I.Lênin"}, {"key": "C", "text": "Ph.Ăngghen"}, {"key": "D", "text": "Chủ tịch Hồ Chí Minh"}], "answer": ["D"], "note": "", "block": 3}, {"id": 106, "text": "Ưu tiên đầu tư phát triển kinh tế - xã hội ở các vùng dân tộc và miền núi, trước hết, tập trung vào phát triển vẫn đề gì?", "options": [{"key": "A", "text": "Giao thông và cơ sở hạ tầng, xóa đói giảm nghèo"}, {"key": "B", "text": "Cơ sở hạ tầng kỹ thuật, xóa đói giảm nghèo, y tế, giáo dục"}, {"key": "C", "text": "Giao thông và kiến trúc thượng tầng, xóa đói giảm nghèo"}, {"key": "D", "text": "Giao thông và cơ sở hạ tầng, y tế, giáo dục"}], "answer": ["B"], "note": "", "block": 3}, {"id": 107, "text": "Ở nước ta, nhân dân có quyền bầu ra những người đại diện cho mình để thực thi quyền làm chủ, đồng thời với quyền đó là quyền gì?", "options": [{"key": "A", "text": "Quyền giải tán hệ thống chính trị"}, {"key": "B", "text": "Quyền bãi miễn những đại biểu không xứng đáng"}, {"key": "C", "text": "Quyền tự mình tham gia trở thành đại biểu không qua bầu cử"}, {"key": "D", "text": "Quyền tự do ngôn luận"}], "answer": ["B"], "note": "", "block": 3}, {"id": 108, "text": "Công tác tôn giáo ở nước ta hiện nay là trách nhiệm của ai?", "options": [{"key": "A", "text": "Của Đảng Cộng sản Việt Nam"}, {"key": "B", "text": "Của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam"}, {"key": "C", "text": "Của cả hệ thống chính trị"}, {"key": "D", "text": "Của quần chúng nhân dân"}], "answer": ["C"], "note": "", "block": 3}, {"id": 109, "text": "Sự kiện gì được xem là cuộc cách mạng vô sản đầu tiên trên thế giới xóa bỏ được giai cấp tư sản và thiết lập chính quyền của giai cấp vô sản?", "options": [{"key": "A", "text": "Công xã Pari"}, {"key": "B", "text": "Phong trào Hiến chương Anh"}, {"key": "C", "text": "Cách mạng tháng Mười Nga"}, {"key": "D", "text": "Sự ra đời của Quốc tế I"}], "answer": ["C"], "note": "", "block": 3}, {"id": 110, "text": "Ai đã đánh giá về chủ nghĩa của C. Mác là: \"Học thuyết của Mác là học thuyết vạn năng vì nó là một học thuyết chính xác\"?", "options": [{"key": "A", "text": "Tập Cận Binh"}, {"key": "B", "text": "Chủ tịch Hồ Chi Minh"}, {"key": "C", "text": "Ph.Ăngghen"}, {"key": "D", "text": "V.I.Lênin"}], "answer": ["D"], "note": "", "block": 3}, {"id": 111, "text": "Trong phạm vi một quốc gia, xu hướng nào thể hiện sự nỗ lực của từng dân tộc để đi tới sự tự do, bình đẳng và phồn vinh của dân tộc mình?", "options": [{"key": "A", "text": "Cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc độc lập"}, {"key": "B", "text": "Cộng đồng dân cư của một quốc gia thành lập cộng đồng dân tộc độc lập"}, {"key": "C", "text": "Cộng đồng xã hội muốn tách ra để phát triển đất nước"}, {"key": "D", "text": "Cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc"}], "answer": ["A"], "note": "", "block": 3}, {"id": 112, "text": "Điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân là gì? ( Chọn 2 đáp án )", "options": [{"key": "A", "text": "Là giai cấp có khả năng thống trị được toàn thể xã hội xây dựng xã hội mới"}, {"key": "B", "text": "Xuất thân từ giai cấp nông dân trong xã hội phong kiến cũ"}, {"key": "C", "text": "Địa vị chính trị - xã hội của giai cấp công nhân"}, {"key": "D", "text": "Địa vị kinh tế của giai cấp công nhân"}], "answer": ["C", "D"], "note": "", "block": 3}, {"id": 113, "text": "Khó khăn về xuất phát điểm của Việt Nam khi tiến vào thời kỳ quá độ lên chủ nghĩa xã hội là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Xuất phát từ một xã hội vốn là thuộc địa, nửa phong kiến, lực lượng sản xuất rất thấp, chiến tranh kéo dài, để lại nhiều tàn dư tiêu cực"}, {"key": "B", "text": "Xuất phát từ một xã hội phong kiến phát triển, trải qua thời kỳ thuộc địa nên bị đồng hóa nhiều về tư tưởng, văn hóa"}, {"key": "C", "text": "Xuất phát từ một xã hội phong kiến lạc hậu, trình độ lực lượng sản xuất nông nghiệp kém, được sử khai hóa của thực dân Pháp nhưng không có sự cải biến tốt hơn"}, {"key": "D", "text": "Xuất phát từ một nước công nghiệp phát hiện tiến lên chủ nghĩa xã hội"}], "answer": ["A"], "note": "", "block": 3}, {"id": 114, "text": "Vấn đề: ... phải \"bắc những nhịp cầu nhỏ\" đi xuyên qua kinh tế tư bản để từng bước xây dựng Chủ nghĩa xã hội. Đồng thời, lưu ý \"chúng ta phải hiểu những đường lối, thể thức, thủ đoạn và phương sách trung gian cần thiết để chuyển từ những quan hệ tiền tư bản chủ nghĩa lên chủ nghĩa xã hội. Đó là mẫu chốt của vấn đề. Thông qua vấn đề trên hãy cho biết VILênin muốn đề cập đến đó là hình thức cơ bản nào của thời kỳ quá độ lên chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Trực tiếp"}, {"key": "B", "text": "Vừa trực tiếp vừa gián tiếp"}, {"key": "C", "text": "Gián tiếp"}, {"key": "D", "text": "Không trải qua"}], "answer": ["C"], "note": "", "block": 3}, {"id": 115, "text": "Theo C.Mác và Ph.Ăngghen: \"giai cấp tư sản không chỉ tạo ra vũ khí sẽ giết chết mình mà còn tạo ra những người sử dụng vũ khí đó ...\" - những người đó là ai?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai cấp công nhân hiện đại"}, {"key": "B", "text": "Giai cấp nông dân hiện đại"}, {"key": "C", "text": "Những nhà tư sản trí thức"}, {"key": "D", "text": "Tầng lớp trí thức"}], "answer": ["A"], "note": "", "block": 3}, {"id": 116, "text": "Cho đến nay, kinh tế gia đình Việt Nam đã có bước chuyển biến mang tính bước ngoặt nào? ( chọn 2 đáp án)", "options": [{"key": "A", "text": "Từ kinh tế tự cấp, tự túc thành kinh tế hàng hóa"}, {"key": "B", "text": "Từ đơn vị kinh tế đáp ứng nhu cầu của thị trường quốc gia thành đơn vị kinh tế đáp ứng nhu cầu của thị trướng toàn cầu"}, {"key": "C", "text": "Từ kinh tế hàng hóa thành kinh tế tự cấp, tự túc"}, {"key": "D", "text": "Từ kinh tế kế hoạch hóa tập trung sang kinh tế thị trường tự do"}], "answer": ["A", "B"], "note": "", "block": 3}, {"id": 117, "text": "Vấn đề \"Giai cấp tư sản, trong quá trình thống trị giai cấp chưa đầy một thế kỷ, đã tạo ra những lực lượng sản xuất nhiều hơn và đồ số hơn lực lượng sản xuất của tất cả các thế hệ trước kia gộp lại\" được C.Mác và PhĂngghen viết trong tác phẩm nào dưới đây ?", "options": [{"key": "A", "text": "Tuyên ngôn của Đảng Cộng sản"}, {"key": "B", "text": "Tư bản"}, {"key": "C", "text": "Góp phần phê phán triết học pháp quyền của Hêghen"}, {"key": "D", "text": "Gia đình thần thánh"}], "answer": ["A"], "note": "", "block": 3}, {"id": 118, "text": "Đối tượng nghiên cứu của chủ nghĩa xã hội khoa học là gì?", "options": [{"key": "A", "text": "Là những quy luật và tính quy luật chính trị -xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội cộng sản chủ nghĩa"}, {"key": "B", "text": "Là những quy luật hình thành, phát triển và hoàn thiện của các hình thái kinh tế - xã hội"}, {"key": "C", "text": "Là những quy luật và tính quy luật chính trị -xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội chủ nghĩa xã hội"}, {"key": "D", "text": "Tất Cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 3}, {"id": 119, "text": "Chị B tuổi Dần quen với Anh A tuổi Hợi. Anh A đã dẫn chị B về nhà ra mắt gia đình để thảo luận về chuyện hôn nhân. Khi mẹ của Anh A biết chị B tuổi Dần, còn bản thân mình tuổi Tỵ, bà lập tức phán đoán về chuyện hôn sự. Bà cho rằng \"khác tuổi\", và nếu Anh A và Chị B kết hôn, gia đình sẽ gặp xui xẻo và chết. Đây được xem là mê tín (loại hình) nào sau đây?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tôn giáo"}, {"key": "B", "text": "Mê tín dị đoan"}, {"key": "C", "text": "Tín ngưỡng"}, {"key": "D", "text": "Mê tín"}], "answer": ["B"], "note": "", "block": 3}, {"id": 120, "text": "Chủ nghĩa xã hội khoa học ra đời dựa trên mấy tiền đề?", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "3"}, {"key": "C", "text": "4"}, {"key": "D", "text": "5"}], "answer": ["A"], "note": "", "block": 3}, {"id": 121, "text": "Sau Hội nghị Mátxcơva (1960), hoạt động lý luận và thực tiễn của Đảng Cộng sản và công nhân như thế nào?", "options": [{"key": "A", "text": "Tăng cường hơn trước"}, {"key": "B", "text": "Chỉ có công nhân phát triển"}, {"key": "C", "text": "Bị chủ nghĩa tư bản thủ tiêu"}, {"key": "D", "text": "Không phát triển"}], "answer": ["A"], "note": "", "block": 3}, {"id": 122, "text": "Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam hiện nay tồn tại hình thức phân phối nào?", "options": [{"key": "A", "text": "Phân phối theo tiền lương"}, {"key": "B", "text": "Phân phối theo bao cấp"}, {"key": "C", "text": "Phân phối theo lao động, theo mức độ đóng góp và quỹ phúc lợi xã hội"}, {"key": "D", "text": "Phân phối theo tiền lương và phân phối theo nhu cầu"}], "answer": ["C"], "note": "", "block": 3}, {"id": 123, "text": "Nền sản xuất đại công nghiệp và phương thức sản xuất tiên tiến đã rèn luyện giai cấp công nhân có những phẩm chất gì đặc biệt hơn các giai cấp khác?", "options": [{"key": "A", "text": "Tinh thần yêu thương. đùm bọc lẫn nhau"}, {"key": "B", "text": "Tính tổ chức. kỷ luật lao động. tinh thần hợp tác cao"}, {"key": "C", "text": "Phẩm chất cần cù. siêng năng và chịu khó"}, {"key": "D", "text": "Sự' khổ luyện. kiên trì lao động vì tiền lương"}], "answer": ["B"], "note": "", "block": 3}, {"id": 124, "text": "Dân chủ xã hội chủ nghĩa đã được phôi thai từ khi nào?", "options": [{"key": "A", "text": "Thực tiễn đấu tranh giai cấp ở Việt Nam"}, {"key": "B", "text": "Thực tiến đấu tranh giai cấp ở Pháp và Công xã Pari năm 1871"}, {"key": "C", "text": "Thành công của cách mạng tháng 8 năm 1945"}, {"key": "D", "text": "Phong trào cách mạng 1930 -1931"}], "answer": ["B"], "note": "", "block": 3}, {"id": 125, "text": "V.I.Lênin gọi thời kỳ quá độ lên chủ nghĩa xã hội là gì?", "options": [{"key": "A", "text": "\"Cuộc đấu tranh giai cấp trong bôi cảnh mới\""}, {"key": "B", "text": "\"Quá trình gian nan. phức tạp\""}, {"key": "C", "text": "\"Những cơn đau đẻ kéo dài\""}, {"key": "D", "text": "\"Sự đảo lộn trật tự\" sâu sắc\""}], "answer": ["C"], "note": "", "block": 3}, {"id": 126, "text": "Nguyên tắc cơ bản của nền dân chủ xã hội chủ nghĩa là:", "options": [{"key": "A", "text": "Không ngừng mở rộng kiến trúc thượng tầng, nâng cao mức độ giải phóng cho những ngưòi lao động, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội"}, {"key": "B", "text": "Không ngừng mở rộng kinh tế, nâng cao mức độ giải phóng cho những người thống trị, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội"}, {"key": "C", "text": "Không ngừng mở rộng dân chủ, nâng cao mức độ giải phóng cho những người lao động,thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội"}, {"key": "D", "text": "Không ngừng mở rộng cơ sở hạ tầng, nâng cao mức độ giải phóng cho những người lao động, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản l"}], "answer": ["C"], "note": "", "block": 3}, {"id": 127, "text": "Đâu là căn cứ cơ bản để xây dựng chính sách phát triển kinh tế, văn hóa, xã hội của mỗi xã hội trong từng giai đoạn lịch sử cụ thể?", "options": [{"key": "A", "text": "Cơ cấu văn hóa, tư tưởng, giáo dục"}, {"key": "B", "text": "Cơ cấu tổ chức, quản lý và đào tạo"}, {"key": "C", "text": "Cơ cấu xã hội - giai cấp"}, {"key": "D", "text": "Cơ cấu kinh tế - xã hội"}], "answer": ["C"], "note": "", "block": 3}, {"id": 128, "text": "Bản chất chính trị của dân chủ xã hội chủ nghĩa được thể hiện như thế nào?", "options": [{"key": "A", "text": "Thực hiện dân chủ đối với tất cả mọi người"}, {"key": "B", "text": "Nền dân chủ do Đảng Cộng sản là đảng duy nhất lãnh đạo, thực hiện quyền lợi và lợi ích của toàn thể nhân dân lao động"}, {"key": "C", "text": "Nền dân chủ do các đáng phải đòi lập nhau cạnh tranh công bằng để nhận được sự tín nhiệm của mọi người"}, {"key": "D", "text": "Thực hiện nhất quân một nguyên tắc duy nhất là tập trung dân chủ"}], "answer": ["B"], "note": "", "block": 3}, {"id": 129, "text": "Một trong ba phát kiến vĩ đại của C.Mác và Phăng ghen là gì?", "options": [{"key": "A", "text": "Ủng hộ nhân dân lao động"}, {"key": "B", "text": "A và B đều đúng"}, {"key": "C", "text": "Thành lập quốc tế cộng sản"}, {"key": "D", "text": "Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân"}], "answer": ["D"], "note": "", "block": 3}, {"id": 130, "text": "Ai đã đưa ra quan niệm \"chủ nghĩa xã hội là sự phản kháng và đấu tranh chống sự bóc lột người lao động, mục tiêu cuộc đấu tranh nhằm hoàn toàn xóa bỏ sự bóc lột\"?", "options": [{"key": "A", "text": "S.Phuriê"}, {"key": "B", "text": "V.l.Lênin"}, {"key": "C", "text": "C.Mác"}, {"key": "D", "text": "Ph.Ănghen"}], "answer": ["B"], "note": "", "block": 3}, {"id": 131, "text": "Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa là tạo ra sự biến đổi như thế nào của xã hội trên tất cả các lĩnh vực?", "options": [{"key": "A", "text": "Biến đổi về lượng"}, {"key": "B", "text": "Biến đổi về chất"}, {"key": "C", "text": "Khuynh hướng phát triển"}, {"key": "D", "text": "Thực hiện bước nhảy"}], "answer": ["B"], "note": "", "block": 3}, {"id": 132, "text": "Về nội dung kinh tế, sứ mệnh lịch sử của giai Cấp công nhân được thể hiện như thế nào?", "options": [{"key": "A", "text": "Giai cấp công nhân tạo tiền đề vật chất - kỹ thuật cho sự ra đời của xã hội mới"}, {"key": "B", "text": "Tất cả các đáp án đều đúng"}, {"key": "C", "text": "Giai cấp công nhân thực hiện tiến bộ và công bằng xã hội thông qua các nguyên tắc sở hữu. quản lí và phân phối phù hợp"}, {"key": "D", "text": "Giai cấp công nhân thiết lập một quan hệ sản xuất mới phù hợp với sự phát triển của lực lượng sản xuất"}], "answer": ["B"], "note": "(Nếu không có Tất cả thì chọn D)", "block": 3}, {"id": 133, "text": "Nội dung cơ bản và trực tiếp để xây dựng gia đình ở Việt Nam hiện nay là gì?", "options": [{"key": "A", "text": "Phát triển kinh tế - xã hội"}, {"key": "B", "text": "Xây dựng gia đình no ấm, bình đẳng, tiến bộ và hạnh phúc"}, {"key": "C", "text": "Giải phóng người phụ nữ"}, {"key": "D", "text": "Nâng cao trình độ dân trí cho nhân dân lao động"}], "answer": ["B"], "note": "", "block": 3}, {"id": 134, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội giai cấp tư sản có vị thế như thế nào?", "options": [{"key": "A", "text": "Đã bị đánh bại nhưng vẫn còn sức mạnh về kinh tế"}, {"key": "B", "text": "Đã tự thân mình chuyển biến thành giai cấp liên minh với giai cấp cách mạng"}, {"key": "C", "text": "Đã bị loại bỏ hoàn toàn"}, {"key": "D", "text": "Đã bị chuyển hóa thành giai cấp công nhân"}], "answer": ["A"], "note": "", "block": 3}, {"id": 135, "text": "Theo chủ nghĩa Mác - Lênin, quy luật chung, phố biển cho sự ra đời của Đảng Cộng sản là gì?", "options": [{"key": "A", "text": "Là sự kết hợp giữa phong trào công nhân với phong trào nông dân"}, {"key": "B", "text": "Là sự kết hợp giữa chủ nghĩa xã hội khoa học với phong trào công nhân"}, {"key": "C", "text": "Là sự kết hợp giữa chủ nghĩa xã hội khoa học và phong trào yêu nước"}, {"key": "D", "text": "Là sự kết hợp giữa phong trào công nhân và phong trào yêu nước"}], "answer": ["B"], "note": "", "block": 3}, {"id": 136, "text": "Đại hội XI đã đề ra phương hướng phát triển nền kinh tế như thế nào trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam trong giai đoạn tới?", "options": [{"key": "A", "text": "Phát triển nền kinh tế thị trường xã hội chủ nghĩa"}, {"key": "B", "text": "Phát triển nền kinh tế thị trường hiệp đồng"}, {"key": "C", "text": "Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa"}, {"key": "D", "text": "Phát triển nền kinh tế kế hoạch hóa tập trung"}], "answer": ["C"], "note": "", "block": 3}, {"id": 137, "text": "Trong thời kỳ quá độ lên chủ nghĩa xã hội, các giai cấp và tầng lớp tồn tại như thế nào?", "options": [{"key": "A", "text": "Chỉ còn tồn tại giai cấp công nhân và các tầng lớp nhân dân lao động"}, {"key": "B", "text": "Tồn tại nhiều giai cấp. tầng lớp. mâu thuẫn. xung đột ngày càng gay gắt với nhau"}, {"key": "C", "text": "Không còn tồn tại giai cấp và đối kháng giai cấp"}, {"key": "D", "text": "Tồn tại nhiều giai cấp, tầng lớp, có sự khác biệt, vừa hợp tác, vừa đấu tranh với nhau"}], "answer": ["D"], "note": "", "block": 3}, {"id": 138, "text": "Làm thế nào để có thể tạo sự đồng thuận và phát huy tinh thần đoàn kết thống nhất giữa các lực lượng trong khối liên minh và toàn xã hội Việt Nam hiện nay?", "options": [{"key": "A", "text": "Xây dựng chủ trương, chính sách phù hợp, đúng dân, giải quyết hài hòa lợi ích của từng đã tượng liên minh cụ thể và đảm bảo lợi ích chung"}, {"key": "B", "text": "Mọi văn đề, mọi pháp luật khi đưa ra đều phải thông qua tất cả công dân để được ban hành, đảm bảo tinh cũng thuận tuyệt đối"}, {"key": "C", "text": "Có chính sách gắn kết, ràng buộc lợi ích kinh tế giữa các giai Cấp, tầng lớp đã họ thông nhất ký ích kinh tế với nhau, từ đó đồng thuận và đoàn kết trong mọi Vấn đề"}, {"key": "D", "text": "Tất cả đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 3}, {"id": 139, "text": "Đâu không phải là một trong những chính sách đối với đội ngũ trí thức nhằm phát huy vai trò của tầng lớp này, trong cơ cấu xã hỏi - giai cấp ở Việt Nam hiện nay?", "options": [{"key": "A", "text": "Tôn trong và phát huy tư do tư tường trong hoạt động nghiên cứu. sáng tạo"}, {"key": "B", "text": "Đảm bảo tư tường của giai Cấp công nhân giữ vị trí chủ đạo trong hoat động nghiên cứu, sáng tạo"}, {"key": "C", "text": "Trong dụng trí thức trên cơ số đánh giá đúng phẩm chất, năng lưc và kết quả công hiện"}, {"key": "D", "text": "Bảo Vệ quyền sở hữu trí tuệ, đãi ngộ và tôn Vinh xứng đáng những cống hiến của đội ngũ trí thức"}], "answer": ["B"], "note": "", "block": 3}, {"id": 140, "text": "Với tư cách là một hình thái nhà nước, nền dân chủ nào là nền dân chủ của tất cả mọi người", "options": [{"key": "A", "text": "Dân chủ xã hội chủ nghĩa"}, {"key": "B", "text": "Dân chủ chủ nô"}, {"key": "C", "text": "Dân chủ tư sản"}, {"key": "D", "text": "Không có bất cứ nền dân chủ nào là của tất cả mọi người"}], "answer": ["D"], "note": "", "block": 3}, {"id": 141, "text": "Nội dung cương lĩnh dân tộc của chủ nghĩa Mác — Lênin là:", "options": [{"key": "A", "text": "Các dân tộc hoàn toàn bình đẳng, các dân tộc được quyền tự quyết, liên hiệp công nhân tất cả các dân tộc lại."}, {"key": "B", "text": "Các dân tộc đoàn kết, bình đẳng và liên hiệp công nhân tất cả các dân tộc lại."}, {"key": "C", "text": "Các dân tộc có quyền tự quyết, các dân tộc có quyền bình đẳng, liên hiệp công nhân tất cả các dân tộc lại."}, {"key": "D", "text": "Các dân tộc hoàn toàn bình đẳng, tự quyết và liên hiệp công nhân các nước."}], "answer": ["A"], "note": "", "block": 3}, {"id": 142, "text": "Chức năng cơ bản nào của gia đình được xem là chức năng đặc thù nhất?", "options": [{"key": "A", "text": "Chức năng nuôi dưỡng, giáo dục"}, {"key": "B", "text": "Chức năng kinh tế và tổ chức tiêu dùng"}, {"key": "C", "text": "Chức năng tái sản xuất ra con người"}, {"key": "D", "text": "Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đinh"}], "answer": ["C"], "note": "(Trong 04 chức năng cơ bản của gia đình, thì chức năng nào được xem là chức năng đặc thủ của gia đình?)", "block": 3}, {"id": 143, "text": "Chính sách dân tộc của nước ta về chính trị hướng tới đảm bảo đại đoàn kết toàn dân tộc thống nhất vì mục tiêu chung là gì?", "options": [{"key": "A", "text": "Lợi ích kinh tế"}, {"key": "B", "text": "Điêu hòa mâu thuẫn giữa các dân tộc"}, {"key": "C", "text": "Dân giàu, nước mạnh, dân chủ, công bằng và văn minh"}, {"key": "D", "text": "Lợi ích thiết thân của từng dân tộc"}], "answer": ["C"], "note": "", "block": 3}, {"id": 144, "text": "Dựa trên phương diện kinh tế - xã hội, giai cấp công nhân được hiểu là:", "options": [{"key": "A", "text": "Sản phẩm của nền sản xuất đại công nghiệp"}, {"key": "B", "text": "Chủ thể của nền sản xuất đại công nghiệp"}, {"key": "C", "text": "Là người mua sức lao động và đi bóc lột giá trị thặng dư"}, {"key": "D", "text": "A và B đều đúng"}], "answer": ["A"], "note": "", "block": 3}, {"id": 145, "text": "Sự biến đổi của cơ cấu xã hội - giai cấp tất yếu sẽ ảnh hưởng và tác động như thế nào đến toàn bộ cơ cấu xã hội?", "options": [{"key": "A", "text": "Tác động đến sự biến đổi của toàn bộ cơ cấu xã hội"}, {"key": "B", "text": "Ảnh hưởng đến sự biến đổi của các cơ cấu xã hội khác và tác động đến sự biến đổi của toàn bộ cơ cấu xã hội"}, {"key": "C", "text": "Ảnh hưởng đến sự phát triển và quản lý xã hội"}, {"key": "D", "text": "Ảnh hưởng đến sự biến đổi của các cơ cấu xã hội"}], "answer": ["B"], "note": "", "block": 3}, {"id": 146, "text": "Đảng Cộng sản Việt Nam chủ trương xây dựng chế độ dân chủ xã hội chủ nghĩa, mở rộng và phát huy quyền làm chủ của nhân dân dựa trên tư tưởng của ai?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "PhAngghen."}, {"key": "B", "text": "V.I.Lênin"}, {"key": "C", "text": "C.Mác"}, {"key": "D", "text": "Chủ tịch Hồ Chí Minh"}], "answer": ["D"], "note": "", "block": 3}, {"id": 147, "text": "Chức năng tái sản xuất ra con người của gia đình nên được thực hiện theo xu hướng hạn chế hay khuyến khích?", "options": [{"key": "A", "text": "Tùy theo từng nơi, theo từng nhu cầu cụ thể của xã hôi"}, {"key": "B", "text": "Cần khuyến khích phát triển để phát triển kinh tế"}, {"key": "C", "text": "Cần hạn chế để tránh dân số quá đông"}, {"key": "D", "text": "Không nên can thiệp, vì đây là chức năng tự nhiên. quyền tự do của mỗi gia đình"}], "answer": ["A"], "note": "", "block": 3}, {"id": 148, "text": "Phong trào công nhân ở Việt Nam vào thế kỉ XX cho thấy đặc trưng của giai cấp công nhân Việt Nam khác với giai cấp công nhân các nước tư bản như thế nào?", "options": [{"key": "A", "text": "Giai cấp công nhân Việt Nam chưa hăng hái tỏng các phong trào đấu tranh như công nhân các nước tư bản chủ nghĩa"}, {"key": "B", "text": "Giai cấp công nhân Việt Nam khi ra đời chưa có sự lãnh đạo kịp thời của Đảng Cộng sản như các nước tư bản chủ nghĩa"}, {"key": "C", "text": "Giai cấp công nhân Việt Nam thể hiện đặc tính cách mạng về ý thức giai cấp và cả về ý thức dân tộc"}, {"key": "D", "text": "Mâu thuẫn giữa giai cấp công nhân Việt Nam và giai cấp tư sản trong giai đoạn này chưa gay gắt như các nước tư bản chủ nghĩa"}], "answer": ["C"], "note": "", "block": 3}, {"id": 149, "text": "Theo chủ nghĩa Mác - Lênin, điều cần thiết trước hết để khắc phục dân các ảnh hưởng tiêu cực của tôn giáo là gì?", "options": [{"key": "A", "text": "Thực thi mệnh lệnh hành chính giảm bớt các tôn giáo"}, {"key": "B", "text": "Tuyên truyền chủ nghĩa Mác — Lênin"}, {"key": "C", "text": "Can thiệp vào công việc nội bộ của các tôn giáo"}, {"key": "D", "text": "Xác lập một thế giới hiện thực không có áp bức. bất công. nghèo đói và thất học..."}], "answer": ["D"], "note": "", "block": 3}, {"id": 150, "text": "Điền cụm từ thích hợp vào (...): \"Tôn trọng, bảo đảm quyền tự do ... và không ... của nhân dân\".", "options": [{"key": "A", "text": "Tôn giáo"}, {"key": "B", "text": "Tín ngưỡng"}, {"key": "C", "text": "Tín ngưỡng và tôn giáo"}, {"key": "D", "text": "Tôn giáo và tín ngưỡng"}], "answer": ["B"], "note": "", "block": 3}, {"id": 151, "text": "Tại sao nói dân chủ trong xã hội chiếm hữu nô lệ là dân chủ thiểu số?", "options": [{"key": "A", "text": "Vì số lượng con người thời đó rất ít"}, {"key": "B", "text": "Vì nội hàm của khái niệm \"dân\" chỉ bao gồm giai cấp chủ nô và một bộ phân nhỏ công dân tư do"}, {"key": "C", "text": "Vì sức tập trung lãnh thổ của các lãnh chúa nhỏ bé"}, {"key": "D", "text": "Vì quyền lực thực sự thuộc vào tay một lãnh chúa lớn nhất"}], "answer": ["B"], "note": "", "block": 4}, {"id": 152, "text": "Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam hiện nay, hình thức phân phối nào giữ vai trò chủ đạo?", "options": [{"key": "A", "text": "Phân phối theo nhu cầu"}, {"key": "B", "text": "Phân phối theo lao động"}, {"key": "C", "text": "Phân phối theo bao cấp"}, {"key": "D", "text": "Phân phối quỹ phúc lợi xã hội"}], "answer": ["B"], "note": "", "block": 4}, {"id": 153, "text": "Quan hệ nào là quan hệ tự nhiên, là yếu tố mạnh mẽ nhất gắn kết các thành viên trong gia đình với nhau?", "options": [{"key": "A", "text": "Quan hệ nuôi dưỡng"}, {"key": "B", "text": "Quan hệ huyết thống"}, {"key": "C", "text": "Quan hệ kinh tế"}, {"key": "D", "text": "Quan hệ hôn nhân"}], "answer": ["B"], "note": "", "block": 4}, {"id": 154, "text": "Quan hệ dân tộc và tôn giáo ở Việt Nam chịu sự chi phối mạnh mẽ bởi yếu tố nào?", "options": [{"key": "A", "text": "Yếu tố giai Cấp"}, {"key": "B", "text": "Yếu tố quản lý của Nhà nước"}, {"key": "C", "text": "Yếu tố tín ngưỡng truyền thống"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["C"], "note": "", "block": 4}, {"id": 155, "text": "Đâu là một phương hướng trong việc phát huy vai trò của phụ nữ trong cơ cấu xã hội Việt Nam hiện nay?", "options": [{"key": "A", "text": "Có kế hoạch chăm sóc sức khỏe sinh sản, đảm bảo quyền tự do kế hoạch hóa gia đình của phụ nữ"}, {"key": "B", "text": "Tăng tỷ lệ phụ nữ tham gia vào các cấp ủy và bộ máy quản lý các cấp"}, {"key": "C", "text": "Có chính sách ưu đãi xã hội đối với nữ giới để đảm bảo quyền bình đẳng"}, {"key": "D", "text": "Tăng cường đội ngũ doanh nhân nữ giới"}], "answer": ["B"], "note": "", "block": 4}, {"id": 156, "text": "Quan hệ dân tộc và tôn giáo ở nước ta được thiết lập và cũng cố trên cơ sở nào?", "options": [{"key": "A", "text": "Sự thống nhất quản lý của Đảng Cộng sản Việt Nam"}, {"key": "B", "text": "sự thông nhất lợi ích kinh tế giữa các giai cấp"}, {"key": "C", "text": "Sự thống nhất trong cùng cộng đồng quốc gia - dân tộc"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["C"], "note": "", "block": 4}, {"id": 157, "text": "Cần làm gì để tăng cường công tác giám sát, phản biện xã hội, phát huy quyền làm chủ của ta?", "options": [{"key": "A", "text": "Công khai hóa, pháp luật hóa chủ trương, chính sách của Đảng và Nhà nước"}, {"key": "B", "text": "Công khai hóa, minh bạch hóa, dân chủ hóa về thông tin, chủ trương, chính sách của Đảng và Nhà nước"}, {"key": "C", "text": "Công khai hóa, thực thi hóa chủ trương, chính sách của Đảng, Nhà nước và của cả hệ thống chính trị"}, {"key": "D", "text": "Triển khai mạnh mẽ, đồng bộ hóa hệ thống pháp luật"}], "answer": ["B"], "note": "", "block": 4}, {"id": 158, "text": "Theo quan điểm của chủ nghĩa Mác - Lênin, loài người đã trải qua các hình thức cộng đồng từ thấp đến cao theo thứ tự là", "options": [{"key": "A", "text": "Thị tộc, bộ lạc, bộ tộc và dân tộc"}, {"key": "B", "text": "Bộ tộc, bộ lạc, thị tộc và dân tộc"}, {"key": "C", "text": "Dân tộc, thị tộc, bộ lạc và bộ tộc"}, {"key": "D", "text": "Bộ lạc, bộ tộc, thị tộc và dân tộc"}], "answer": ["A"], "note": "", "block": 4}, {"id": 159, "text": "Câu nói sau do ai khẳng định: \"Nếu không giải phóng phụ nữ là xây dựng chủ nghĩa xã hội chỉ một nửa\" là của ai?", "options": [{"key": "A", "text": "V.I.Lênin"}, {"key": "B", "text": "C.Mác"}, {"key": "C", "text": "Chủ tịch Hồ Chí Minh"}, {"key": "D", "text": "Ph.Ăngghen"}], "answer": ["C"], "note": "", "block": 4}, {"id": 160, "text": "Trong các nền dân chủ đã và đang tồn tại trong lịch sử loài người, thì nền dân chủ nào là nền dân chủ phát triển cao nhất về chất?", "options": [{"key": "A", "text": "Dân chủ xã hội chủ nghĩa"}, {"key": "B", "text": "Dân chủ cộng sản chủ nghĩa"}, {"key": "C", "text": "Dân chủ tư sản"}, {"key": "D", "text": "Dân chủ chủ nô"}], "answer": ["A"], "note": "", "block": 4}, {"id": 161, "text": "Nội dung cốt lõi của công tác tôn giáo ở nước ta hiện nay là gì?", "options": [{"key": "A", "text": "Công tác giáo dục chủ nghĩa duy vật biện chứng"}, {"key": "B", "text": "Công tác cảm hóa giáo dân"}, {"key": "C", "text": "Công tác vận động quần chúng"}, {"key": "D", "text": "Công tác điều hòa mâu thuẫn giữa các tôn giáo"}], "answer": ["C"], "note": "", "block": 4}, {"id": 162, "text": "Các tôn giáo ở nước ta có đặc điểm tồn tại như thể nào trong lòng quốc gia - dân tộc?", "options": [{"key": "A", "text": "Thống nhất dưới sự thống trị của Đảng Cộng sản Việt Nam"}, {"key": "B", "text": "Đa dạng, đan xen, đấu tranh với nhau để giành vị trí thống trị"}, {"key": "C", "text": "Đa dạng, đan xen, cạnh tranh với nhau"}, {"key": "D", "text": "Đa dạng, đan xen, chúng sống hóa bình và không có xung đột, chiến tranh tôn giáo"}], "answer": ["D"], "note": "", "block": 4}, {"id": 163, "text": "Quan hệ dân tộc và tôn giáo là gì?", "options": [{"key": "A", "text": "Là sự liên kết, tác động qua lại, chi phối lẫn nhau giữa dân tộc với tôn giáo trong nội bộ một quốc gia, hoặc giữa các quốc gia với nhau trong mọi lĩnh vực đời sống xã hội"}, {"key": "B", "text": "Là sự liên kết, tác động qua lại, chi phối lẫn nhau giữa dân tộc với tôn giáo trong nội bộ một quốc gia trong mọi lĩnh vưc đời sống xã hội"}, {"key": "C", "text": "Là sự liên kết, tác động qua tại, chi phối lẫn nhau giữa dân tộc với tôn giáo giữa các quốc gia với nhau trong mọi lĩnh vực đời sống xã hội"}, {"key": "D", "text": "Là đấu tranh bài trừ lẫn nhau giữa dân tộc với tôn giáo trong nội bộ một quốc gia, hoặc giữa các quốc gia với nhau trong mọi lĩnh vực đời sống xã hội"}], "answer": ["A"], "note": "", "block": 4}, {"id": 164, "text": "Quy mô gia đình ở Việt Nam hiện nay tồn tại theo xu hướng nào?", "options": [{"key": "A", "text": "Thu nhỏ số lượng thành viên trong gia đình"}, {"key": "B", "text": "Mở rộng số lượng thành viên trong gia đình"}, {"key": "C", "text": "Liên kết các gia đình đơn"}, {"key": "D", "text": "Quy mô nhỏ ở nông thôn và quy mô lớn ở thành thị"}], "answer": ["A"], "note": "", "block": 4}, {"id": 165, "text": "Các yếu tố của chủ nghĩa xã hội xuất hiện", "options": [{"key": "A", "text": "Trong lòng xã hội chiếm hữu nô lệ"}, {"key": "B", "text": "Trong lòng xã hội tư bản"}, {"key": "C", "text": "Trong lòng xã hội phong kiến"}], "answer": ["B"], "note": "", "block": 4}, {"id": 166, "text": "Cuộc cải tổ xã hội chủ nghĩa diễn ra đầu tiên tại", "options": [{"key": "A", "text": "Liên Xô"}, {"key": "B", "text": "Việt Nam"}, {"key": "C", "text": "Trung Quốc"}], "answer": ["A"], "note": "", "block": 4}, {"id": 167, "text": "Theo chủ nghĩa Mác - Lênin, sự thay thế hình thái kinh tế - xã hội tư bản chủ nghĩa bằng hình thái kinh tế - xã hội cộng sản chủ nghĩa là:", "options": [{"key": "A", "text": "Một sự cải biến mang tính chất chủ quan"}, {"key": "B", "text": "Một bước ngoặt phát triễn mới, đưa nhân loại thoát khỏi lối mòn cũ"}, {"key": "C", "text": "Một quá trình lịch sử - tự nhiên"}, {"key": "D", "text": "Một quá trình can thiệp của con người bằng ý chỉ nhằm cải biến lịch sử theo hướng nhân văn, tích cực hơn"}], "answer": ["C"], "note": "", "block": 4}, {"id": 168, "text": "Liên Xô và Đông Âu sụp đổ là do", "options": [{"key": "A", "text": "Bản chất của chủ nghĩa Mác- Lênin"}, {"key": "B", "text": "Vận dụng sai chủ nghĩa Mác- Lênin"}, {"key": "C", "text": "Sai lầm của chủ nghĩa Mác- Lênin"}], "answer": ["B"], "note": "", "block": 4}, {"id": 169, "text": "Theo C.Mác và Ph.Ăngghen, khi thực hiện cách mạng xã hội chủ nghĩa xóa bỏ được tình trạng người bóc lột người, giai cấp này bóc lột giai cấp khác thì có thể tiến tới xóa bỏ điều gì?", "options": [{"key": "A", "text": "Xóa bỏ tình trạng dân tộc này bóc lột dân tộc khác"}, {"key": "B", "text": "Xóa bỏ sự tồn tại của chế độ sở hữu tư nhân về công cụ lao động"}, {"key": "C", "text": "Xóa bỏ được tệ nạn xã hội"}, {"key": "D", "text": "Xóa bỏ được tôn giáo"}], "answer": ["A"], "note": "", "block": 4}, {"id": 170, "text": "Cuộc cải cách và mở cửa diễn ra đầu tiên tại", "options": [{"key": "A", "text": "Liên Xô"}, {"key": "B", "text": "Đông Âu"}, {"key": "C", "text": "Trung Quốc"}], "answer": ["C"], "note": "", "block": 4}, {"id": 171, "text": "Cách mạng xã hội chủ nghĩa muốn thành công phải bằng phương pháp", "options": [{"key": "A", "text": "Bạo lực"}, {"key": "B", "text": "Kinh tế"}, {"key": "C", "text": "Chính trị"}], "answer": ["A"], "note": "", "block": 4}, {"id": 172, "text": "Phát kiến nào của C.Mác và Ph.Ăngghen đã khắc phục triệt để được những hạn chế có tính lịch sử của chủ nghĩa xã hội không tưởng Pháp?", "options": [{"key": "A", "text": "Chủ nghĩa duy vật lịch sử"}, {"key": "B", "text": "Chủ nghĩa duy vật biện chứng"}, {"key": "C", "text": "Học thuyết về giá trị thặng dư"}, {"key": "D", "text": "Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân"}], "answer": ["D"], "note": "", "block": 4}, {"id": 173, "text": "Ở Việt Nam hiện nay, tổ chức nào đại diện cho quyền lợi, lợi ích hợp pháp và là nơi để giai cấp công nhân chủ động, tích cực tham gia xây dựng, chỉnh đốn Đảng, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ nhân dân?", "options": [{"key": "A", "text": "Hệ thống tố chức Công đoàn"}, {"key": "B", "text": "Quốc hội"}, {"key": "C", "text": "Mặt trận Tổ quốc Việt Nam"}, {"key": "D", "text": "Hội đồng nhân dân các Cấp"}], "answer": ["A"], "note": "", "block": 4}, {"id": 174, "text": "Mô hình kinh tế mới tại Liên Xô viết tắt là", "options": [{"key": "A", "text": "USR"}, {"key": "B", "text": "NEP"}, {"key": "C", "text": "CCCP"}], "answer": ["B"], "note": "", "block": 4}, {"id": 175, "text": "Cuộc cách mạng xã hội chủ nghĩa đầu tiên trên thể giới là", "options": [{"key": "A", "text": "Cách mạng tháng Tám"}, {"key": "B", "text": "Cách mạng Tân Hợi"}, {"key": "C", "text": "Cách mạng tháng Mười Nga"}], "answer": ["C"], "note": "", "block": 4}, {"id": 176, "text": "Cách mạng xã hội chân chính và triệt để phải(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giải phóng loài người ra khỏi áp bức bóc lột"}, {"key": "B", "text": "Giải phóng xã hội ra khỏi áp bức bóc lột"}, {"key": "C", "text": "Giải phóng giai cấp công nhân ra khỏi áp bức bóc lột"}], "answer": ["A"], "note": "", "block": 4}, {"id": 177, "text": "Trích dẫn: \"... các giai cấp khác đều suy tàn và tiêu vong cùng với sự phát triển của đại công nghiệp, còn giai cấp vô sản lại là sản phẩm của bản thân nền đại công nghiệp đó\" được C.Mác Và Ph.Ăngghen đề cập trong tác phẩm nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tình cảnh công nhân Anh"}, {"key": "B", "text": "Bộ Tư bản"}, {"key": "C", "text": "Tuyên ngôn của Đảng Cộng sản"}, {"key": "D", "text": "Chống Đuyrinh"}], "answer": ["C"], "note": "", "block": 4}, {"id": 178, "text": "Sau khi lật đổ được sự thống trị của giai cấp thống trị, sứ mệnh lịch sử của giai cấp công nhân được tiếp tục thực hiện như thế nào?", "options": [{"key": "A", "text": "Thiết lập nhà nước kiểu mới, mang bản chất giai cấp công nhân"}, {"key": "B", "text": "Xây dựng nền dân chủ xã hội chủ nghĩa"}, {"key": "C", "text": "Thực hiện quyền lực, quyền làm chủ của tuyệt đại đa số nhân dân lao động"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 4}, {"id": 179, "text": "Về mặt thực tiễn, việc nghiên cứu chủ nghĩa xã hội khoa học có ý nghĩa gì?", "options": [{"key": "A", "text": "Thấy rõ khoảng cách giữa lý luận chủ nghĩa xã hội khoa học và thực tiễn vận dung nó"}, {"key": "B", "text": "Sự sụp đổ của Liên Xô và Đông Âu là do đã nhận thức và hành động trên nhiều vấn đề trái Với chủ nghĩa xã hội khoa học, trải với chủ nghĩa Mác - Lênin chủ không phải là do đi theo chủ nghĩa xã hội khoa học làm cho các nước này khủng hoảng"}, {"key": "C", "text": "Cần có bản lĩnh vững vàng, sáng suốt và sáng tạo trong việc vận dụng chủ nghĩa xã hội khoa học và bối cảnh lịch sử cụ thể của từng quốc gia, tránh giáo điều, bảo thủ, duy ý chí."}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 4}, {"id": 180, "text": "Một bộ phận giai cấp công nhân đã tham gia vào sở hữu một lượng tư liệu sản xuất của xã hội thông qua chế độ cổ phần là một biểu hiện của xu hướng nào của giai cấp công nhân trong thời đại hiện nay?", "options": [{"key": "A", "text": "Xu hướng thỏa hiệp"}, {"key": "B", "text": "Xu hướng \"trung lưu hóa\""}, {"key": "C", "text": "Xu hướng cải cách"}, {"key": "D", "text": "Xu hướng \"trí tuệ hóa\""}], "answer": ["B"], "note": "", "block": 4}, {"id": 181, "text": "*Công cuộc đổi mới xã hội chủ nghĩa diễn ra ở nước nào sau đây", "options": [{"key": "A", "text": "Cu Ba"}, {"key": "B", "text": "Trung Quốc"}, {"key": "C", "text": "Việt Nam"}], "answer": ["C"], "note": "", "block": 4}, {"id": 182, "text": "Trong thời kỳ quá độ lên chủ nghĩ

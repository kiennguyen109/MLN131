a xã hội ở Việt Nam, hình thức sở hữu và thành phần kinh tế nào tuy còn tồn tại nhưng không giữ vai trò chủ đạo?", "options": [{"key": "A", "text": "Sở hữu tư nhân tư bản chủ nghĩa và thành phần kình tế tập thể"}, {"key": "B", "text": "Sở hữu tư nhân tư bản chủ nghĩa và thành phần kinh tế tư nhân tư bản chủ nghĩa"}, {"key": "C", "text": "Sở hữu tập thể và thành phần kinh tế tập thể"}, {"key": "D", "text": "Sở hữu hổn hợp và thành phần kinh tế tư nhân tư bản chủ nghĩa"}], "answer": ["B"], "note": "", "block": 4}, {"id": 183, "text": "Vị trí của gia đình trong xã hội là:", "options": [{"key": "A", "text": "Gia đình là tớ ấm mang lại các giá trị hạnh phúc, sự hài hòa trong đười sóng Cả nhân của môi thành viện"}, {"key": "B", "text": "Gia đình là cầu nối giữa cá nhân và xã hội"}, {"key": "C", "text": "Gia đình là tế bào của xã hội"}, {"key": "D", "text": "Tất Cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 4}, {"id": 184, "text": "Nội dung cơ bản, lâu dài tạo điều kiện cho liên minh giai cấp, tầng lớp phát triển bền vững ở nước ta là gì?(Chọn 3 đáp án)", "options": [{"key": "A", "text": "Nâng cao chất lượng nguồn nhân lực, xóa đói giảm nghèo"}, {"key": "B", "text": "Thực hiện tốt chính sách xã hội đối với các thành phần liên minh"}, {"key": "C", "text": "Chăm lo sức khỏe, nâng cao chất lượng sống, nâng cao dân trí cho mọi tầng lớp nhân dân"}, {"key": "D", "text": "Đảm bảo phân chia lợi ích kinh tế công bằng trong mô hình kinh tế thị trường tư do hiện đại"}], "answer": ["A", "B", "C"], "note": "", "block": 4}, {"id": 185, "text": "Tôn giáo là một phạm trù lịch sử bởi vì:", "options": [{"key": "A", "text": "Là sản phẩm của con người"}, {"key": "B", "text": "Là do điều kiện kinh tế - xã hội sinh ra"}, {"key": "C", "text": "Tôn giáo ra đời, tồn tại và biến đã trong một giai doan lịch sử nhất định của loài người"}, {"key": "D", "text": "Tôn giáo sẽ tồn tại và phát triển cùng Với sự phát triển của lịch sử nhân loại"}], "answer": ["C"], "note": "", "block": 4}, {"id": 186, "text": "Đặc trưng cơ bản đầu tiên của chủ nghĩa xã hội là:", "options": [{"key": "A", "text": "Chủ nghĩa xã hội có nhà nước kiểu mới mang bản chất giai cấp công nhân, đại biểu cho lợi ích, quyền lực và ý chỉ của nhân dân lao động"}, {"key": "B", "text": "Chủ nghĩa xã hội là xã hội do nhân dân lao động làm chủ"}, {"key": "C", "text": "Chủ nghĩa xã hội có nền kinh tế phát triễn cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất chủ yếu"}, {"key": "D", "text": "Chủ nghĩa xã hội giải phóng giai cấp, giải phóng dân tộc, giải phóng xã hội, giải phóng con người, tạo điều kiện để con người phát triển toàn diện"}], "answer": ["D"], "note": "", "block": 4}, {"id": 187, "text": "Sau khi chế độ xã hội chủ nghĩa Liên Xô và Đông Âu sụp đổ, chủ nghĩa xã hội khoa học được bổ sung và phát triển như thế nào?", "options": [{"key": "A", "text": "Được giới tri thức thế giới nghiên cứu như một học thuyết đã lỗi thời"}, {"key": "B", "text": "Được các nước Xã hội chủ nghĩa bổ sung và phát triển trong tình hình mới, phù hợp với bối cảnh từng nước"}, {"key": "C", "text": "Các nước tư bản chủ nghĩa nghiên cứu chủ nghĩa xã hội khoa học như một học thuyết nhằm khắc phục các khuyết tật của thời đại mới"}, {"key": "D", "text": "Được dung hòa cùng với các học thuyết tư sản khác"}], "answer": ["B"], "note": "", "block": 4}, {"id": 188, "text": "Xu hướng phát triển cơ cấu xã hội - giai cấp ở Việt Nam trong thời kỳ quá độ mang tính đa dạng và thống nhất chủ yếu do yếu tố nào quyết định?", "options": [{"key": "A", "text": "Tất cả đều đúng"}, {"key": "B", "text": "Do sự mong muốn của giai cấp công nhân"}, {"key": "C", "text": "Do nền kinh tế nhiều thành phần"}, {"key": "D", "text": "Do trình độ phát triển không đồng đều"}], "answer": ["C"], "note": "", "block": 4}, {"id": 189, "text": "Cơ cấu xã hội - giai cấp của nước ta trước thời kì đổi mới bao gồm các giai cấp, tầng lớp nào?(Chọn 3 đáp án)", "options": [{"key": "A", "text": "Đội ngũ đảng viên"}, {"key": "B", "text": "Đội ngũ tri thức"}, {"key": "C", "text": "Giai cấp công nhân"}, {"key": "D", "text": "Giai cấp nông dân"}], "answer": ["B", "C", "D"], "note": "", "block": 4}, {"id": 190, "text": "C.Mác và Ph.Ăngghen đánh giá: \"Giai cấp tư sản trong quá trình thống trị giai cấp chưa đầy một thế kỉ đã tạo ra một lực lượng sản xuất nhiều hơn và đồ sộ hơn lực lượng của tất cả các thế hệ trước đây gộp lại\" trong tác phẩm nào?", "options": [{"key": "A", "text": "Chống Đuyrinh"}, {"key": "B", "text": "Lược khảo khoa kinh tế - chính trị"}, {"key": "C", "text": "Tuyên ngôn của Đảng Cộng sản"}, {"key": "D", "text": "Bộ Tư bản"}], "answer": ["C"], "note": "", "block": 4}, {"id": 191, "text": "Từ sau khi V.I.Lênin mất đến năm 1953, ai là người có ảnh hưởng trực tiếp trong việc vận dụng và phát triển chủ nghĩa xã hội khoa học?", "options": [{"key": "A", "text": "J.Xtalin"}, {"key": "B", "text": "S.Phurie"}, {"key": "C", "text": "G.Đi-mi-trốp"}, {"key": "D", "text": "S.Simon"}], "answer": ["A"], "note": "", "block": 4}, {"id": 192, "text": "Nhà nước xã hội chủ nghĩa ra đời là kết quả của:", "options": [{"key": "A", "text": "Cuộc cách mạng do giai Cấp vô sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản"}, {"key": "B", "text": "Sự chuyển biến tích cực của nhà nước tư sản"}, {"key": "C", "text": "Cuộc cách mạng tư sản do giai Cấp tư sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản"}, {"key": "D", "text": "Cuộc cách mạng vô sản do giai Cấp nông nhân tiến hành"}], "answer": ["A"], "note": "", "block": 4}, {"id": 193, "text": "Cương lĩnh xây dựng đất nước trong thời quá độ lên chủ nghĩa xã hội (Bổ sung và phát triển năm 2011) xác định phương hưởng đầu tiên, phản ánh con đường đi lên chủ nghĩa xã hội ở nước ta là :", "options": [{"key": "A", "text": "Đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên, môi trường"}, {"key": "B", "text": "Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa"}, {"key": "C", "text": "Xây dựng nền văn hoá tiên tiến, đậm đà bản sắc dân tộc; xây dựng con người, nâng cao đời sống nhân dân, thưc hiện tiến bộ và công bằng xã hội"}, {"key": "D", "text": "Bảo đảm vững chắc quốc phòng và an ninh quốc gia, trật tự, an toàn xã hội"}], "answer": ["A"], "note": "", "block": 4}, {"id": 194, "text": "Cương lĩnh xây dựng đất nước trong thời quá độ lên chủ nghĩa xã hội (Bổ sung và phát triển năm 2011) xác định phương hướng thứ hai, phản ánh con đường đi lên chủ nghĩa xã hội ở nước ta là:", "options": [{"key": "A", "text": "Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa"}, {"key": "B", "text": "Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc; xây dựng con người, nâng cao đời sống nhân dân, thực hiện tiến bộ và công bằng xã hội"}, {"key": "C", "text": "Bảo đảm vững chắc quốc phòng và an ninh quốc gia, trật tự, an toàn xã hội"}, {"key": "D", "text": "Thực hiện đường lối đối ngoại độc lập, tự chủ, hòa bình, hữu nghị, hợp tác và phát triển; chủ động và tích cực hội nhập quốc tế"}], "answer": ["A"], "note": "", "block": 4}, {"id": 195, "text": "Đại hội XI, trong Cương lĩnh xây dựng đất nước trong thời quá độ lên chủ nghĩa xã hội (Bổ sung và phát triển năm 2011) xác định bao nhiêu phương hướng phản ánh con đường đi lên chủ nghĩa xã hội ở nước ta?", "options": [{"key": "A", "text": "5"}, {"key": "B", "text": "6"}, {"key": "C", "text": "7"}, {"key": "D", "text": "8"}], "answer": ["D"], "note": "", "block": 4}, {"id": 196, "text": "Nền kinh tế thị trường phát triển mạnh với tính cạnh tranh cao, cộng với xu thế hội nhập ngày càng sâu rộng trong thời đại hiện nay đã làm cho các giai cấp, tầng lớp trong xã hội chuyển biến như thế nào?", "options": [{"key": "A", "text": "Làm cho các giai cấp, tầng lớp trở nên năng động, có khả năng thích ứng nhanh, chủ động và sáng tạo hơn"}, {"key": "B", "text": "Tất cả các đáp án đều đúng"}, {"key": "C", "text": "Làm thay đổi bản chất của các giai cấp cách mạng, chạy theo lợi nhuận mà đánh mất sứ mệnh lịch sử của mình"}, {"key": "D", "text": "Làm cho một bộ phận giai cấp công nhân, nông dân và trí thức không còn tin tưởng vào lí tưởng xã hội chủ nghĩa"}], "answer": ["A"], "note": "", "block": 4}, {"id": 197, "text": "Xây dựng gia đình mới ở Việt Nam hiện nay cần phải kế thừa, phát huy truyền thống nào của gia đình truyền thống?", "options": [{"key": "A", "text": "Phong tục cưới hỏi"}, {"key": "B", "text": "Uy quyền tuyệt đối của người chồng"}, {"key": "C", "text": "Sự cố kết chặt chẽ giữa các thành viên"}, {"key": "D", "text": "Gia đình đông con"}], "answer": ["C"], "note": "", "block": 4}, {"id": 198, "text": "Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam coi yếu tố nào là chủ thể, là trung tâm của sự phát triển?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai cấp công nhân"}, {"key": "B", "text": "Nhân dân lao động"}, {"key": "C", "text": "Con người"}, {"key": "D", "text": "Đảng Cộng sản Việt Nam"}], "answer": ["C"], "note": "", "block": 4}, {"id": 199, "text": "Trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay, giai cấp, tầng lớp nào là lực lượng sáng tạo đặc biệt quan trọng trong tiến trình đẩy mạnh công nghiệp hóa, hiện đại hóa, xây dựng nền kinh tế tri thức?", "options": [{"key": "A", "text": "Giai cấp công nhân"}, {"key": "B", "text": "Giai Cấp nông dân"}, {"key": "C", "text": "Tầng lớp trí thức"}, {"key": "D", "text": "Tầng lớp doanh nhân"}], "answer": ["C"], "note": "", "block": 4}, {"id": 200, "text": "Dân chủ trong 2 lĩnh vực nổi bật và quan trọng nhất là:", "options": [{"key": "A", "text": "Trong lĩnh vực chính trị và tư tưởng"}, {"key": "B", "text": "Trong lĩnh vực kinh tế và chính trị"}, {"key": "C", "text": "Trong lĩnh vực kinh tế và tư tưởng"}, {"key": "D", "text": "Trong lĩnh vực văn hóa tinh thần và tư tưởng"}], "answer": ["B"], "note": "", "block": 4}, {"id": 201, "text": "Đâu không phải là một tầng lớp xã hội mới xuất hiện và phát triển trong thời kì quá độ lên chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Tầng lớp doanh nhân, tiểu chủ"}, {"key": "B", "text": "Tầng lớp những người giàu có"}, {"key": "C", "text": "Tầng lớp trung lưu"}, {"key": "D", "text": "Tầng lớp trí thức"}], "answer": ["D"], "note": "", "block": 5}, {"id": 202, "text": "Trong thời đại hiện nay, ở các nước xã hội chủ nghĩa, sứ mệnh lịch sử của giai cấp công nhân hội là gì?", "options": [{"key": "A", "text": "Đấu tranh giành chính quyền về tay giai cấp công nhân và nhân dân lao động"}, {"key": "B", "text": "Chống bất công, bất bình đẳng xã hội"}, {"key": "C", "text": "Lãnh đạo công cuộc đổi mới, giải quyết thành công các nhiệm vụ trong thời kỳ quá độ lên chủ nghĩa xã hội"}, {"key": "D", "text": "Đấu tranh đòi các quyền tự do, dân chủ"}], "answer": ["C"], "note": "", "block": 5}, {"id": 203, "text": "Cơ cấu xã hội nào có vai trò quan trọng nhất?", "options": [{"key": "A", "text": "Cơ cấu giai cấp"}, {"key": "B", "text": "Cơ cấu dân tộc"}, {"key": "C", "text": "Cơ cấu dân cư"}, {"key": "D", "text": "Cơ cấu nghề nghiệp"}], "answer": ["A"], "note": "", "block": 5}, {"id": 204, "text": "Chế độ dân chủ nhân dân ở nước ta được xác lập khi nào?", "options": [{"key": "A", "text": "Từ khi cách mạng tháng Tám thành công"}, {"key": "B", "text": "Từ sau chiến thắng Điện Biên Phủ 1954"}, {"key": "C", "text": "Ngay sau khi thống nhất đất nước vào năm 1975"}, {"key": "D", "text": "Từ khi tiến hành đổi mới vào năm 1986"}], "answer": ["A"], "note": "", "block": 5}, {"id": 205, "text": "Cấu trúc cơ bản của một hình thái kinh tế - xã hội là:", "options": [{"key": "A", "text": "Lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng"}, {"key": "B", "text": "Tất cả đều đúng"}, {"key": "C", "text": "Cơ sở kinh tế và thể chế nhà nước"}, {"key": "D", "text": "Lực lượng sản xuất và quan hệ sản xuất"}], "answer": ["A"], "note": "", "block": 5}, {"id": 206, "text": "Nhà nước xã hội chủ nghĩa có vai trò như thế nào đối với dân chủ Xã hội chủ nghĩa?", "options": [{"key": "A", "text": "Nhà nước xã hội chủ nghĩa là công cụ trấn áp dân chủ Xã hội chủ nghĩa"}, {"key": "B", "text": "Nhà nước Xã hội chủ nghĩa trở thành công cụ quan trọng cho việc thực thi quyền làm chủ của người dân"}, {"key": "C", "text": "Nhà nước xã hội chủ nghĩa là động lực, nền tảng thực hiện dân chủ Xã hội chủ nghĩa"}, {"key": "D", "text": "Nhà nước Xã hội chủ nghĩa là cơ sở, điều kiện tiên quyết cho việc tổ chức dân chủ triệt để đối với mọi giai cấp"}], "answer": ["B"], "note": "", "block": 5}, {"id": 207, "text": "Chức năng nào được coi là chức năng cơ bản và riêng có của gia đình?", "options": [{"key": "A", "text": "Tổ chức đời sống gia đình"}, {"key": "B", "text": "Tái sản xuất ra con người"}, {"key": "C", "text": "Giáo dục gia đình"}, {"key": "D", "text": "Thỏa mãn tâm sinh lý"}], "answer": ["B"], "note": "", "block": 5}, {"id": 208, "text": "Để tăng cường, củng cố khối đại đoàn kết dân tộc ở nước ta hiện nay thì chính sách cụ thể nào của Đảng và Nhà nước ta được coi là vấn đề cực kỳ quan trọng?", "options": [{"key": "A", "text": "Tôn trọng lợi ích, truyền thống, văn hoá của các dân tộc."}, {"key": "B", "text": "Phát huy truyền thống đoàn kết giữa các dân tộc."}, {"key": "C", "text": "Phát triển kinh tế hàng hoá ở các vùng dân tộc thiểu số."}, {"key": "D", "text": "Tăng cường bồi dưỡng, đào tạo đội ngũ cán bộ là người dân tộc thiểu số."}], "answer": ["B"], "note": "", "block": 5}, {"id": 209, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội, các giai cấp, tầng lớp trong cơ cấu xã hội - giai cấp biến đổi trong mối quan hệ như thế nào?", "options": [{"key": "A", "text": "Đấu tranh với nhau trong bối cảnh mới"}, {"key": "B", "text": "Không còn sự phân chia giai cấp"}, {"key": "C", "text": "Vừa hợp tác vừa đấu tranh và ngày càng xích lại gần nhau"}, {"key": "D", "text": "Hợp tác, liên minh toàn diện với nhau"}], "answer": ["C"], "note": "", "block": 5}, {"id": 210, "text": "Nội dung nào quan trọng nhất trong các nội dung liên minh công-nông-trí thức ?", "options": [{"key": "A", "text": "Chính trị"}, {"key": "B", "text": "Kinh tế"}, {"key": "C", "text": "Tư tưởng"}, {"key": "D", "text": "Văn hóa-xã hội"}], "answer": ["B"], "note": "", "block": 5}, {"id": 211, "text": "Các thế lực thù địch sử dụng chiến lược \"diễn biến hòa bình\" chống phá sự nghiệp xây dựng Tổ quốc xã hội chủ nghĩa của nhân dân ta trên phương diện nào?", "options": [{"key": "A", "text": "Kinh tế, chính trị - xã hội"}, {"key": "B", "text": "Đạo đức, lối sống"}, {"key": "C", "text": "Tất cả các đáp án đều đúng"}, {"key": "D", "text": "Ngoại giao"}], "answer": ["C"], "note": "(Kiểu hỏi khác: Các thế lực thủ địch sử dụng chiến lược \"diễn biến hòa bình\" chống phá sự nghiệp xây dựng Tổ quốc xã hội chủ nghĩa của nhân dân ta trên phương diện trọng yếu nào?\n\nA. Ngoại giao\n\nB. Chính trị, tư tưởng\n\nC. Đạo đức, lối sống\n\nD. Quân sự, chạy đua vũ trang)", "block": 5}, {"id": 212, "text": "Điều gì vừa là thách thức vừa tạo ra thời cơ cho Việt Nam trong thời kỳ quá độ chủ nghĩa xã hội hiện nay?", "options": [{"key": "A", "text": "Cuộc cách mạng khoa học công nghệ và xu thế toàn cầu hóa"}, {"key": "B", "text": "Sự trở dậy của chủ nghĩa xã hội, tiêu biểu là Trung Quốc"}, {"key": "C", "text": "Sự thay đổi trật tự thế giới"}, {"key": "D", "text": "Sự gia tăng nhanh chóng của lực lượng lao động nước ta"}], "answer": ["A"], "note": "", "block": 5}, {"id": 213, "text": "Khi nghiên cứu thực tiễn phong trào đấu tranh của giai cấp công nhân châu Âu từ giữa thế kỉ XIX, C.Mác và Ph.Ăngghen cho rằng giai cấp công nhân thất bại là do đã không liên minh được với \"người bạn đồng hành tự nhiên\" của mình. Người bạn đó là giai cấp nào?", "options": [{"key": "A", "text": "Giai cấp nông dân"}, {"key": "B", "text": "Giai cấp tư sản"}, {"key": "C", "text": "Giai cấp địa chủ phong kiến"}, {"key": "D", "text": "Tầng lớp doanh nhân"}], "answer": ["A"], "note": "", "block": 5}, {"id": 214, "text": "Lợi ích cơ bản của giai cấp công nhân có quan hệ như thế nào với lợi ích cơ bản của các giai cấp khác trong xã hội? ( 2 đáp án)", "options": [{"key": "A", "text": "Đối lập trực tiếp với lợi ích cơ bản của giai cấp tư sản"}, {"key": "B", "text": "Thống nhất với lợi ích cơ bản của đa số nhân dân tao động"}, {"key": "C", "text": "Đối lập trực tiếp với lợi ích cơ bản của giai cấp nông dân"}, {"key": "D", "text": "Thống nhất với lợi ích cơ bản của giai cấp tư sản"}], "answer": ["A", "B"], "note": "", "block": 5}, {"id": 215, "text": "Những nhược điểm, hạn chế vốn có do hoàn cảnh lịch sử và nguồn gốc xã hội sinh ra của giai Cấp công nhân Việt Nam là gì?", "options": [{"key": "A", "text": "Tâm lý tiểu nông, thói quen, tập quán lạc hậu tứ truyền thông xã hội nông nghiệp cổ truyền"}, {"key": "B", "text": "Tư tưởng dễ thỏa hiệp, không kiên quyết đấu tranh đến cùng"}, {"key": "C", "text": "Sư tư phát, lẻ tế trong phong trào công nhân, không được giác ngộ tư tưởng chính trị"}, {"key": "D", "text": "Tâm lý chịu đựng, mê tín dị đoan"}], "answer": ["A"], "note": "", "block": 5}, {"id": 216, "text": "Đâu không phải là một hình thái kinh tế - xã hội theo phân kì lịch sử loài người của chủ nghĩa Mác - Lênin?", "options": [{"key": "A", "text": "Xã hội chủ nghĩa"}, {"key": "B", "text": "Tư bản chủ nghĩa"}, {"key": "C", "text": "Cộng sản chủ nghĩa"}, {"key": "D", "text": "Phong kiến"}], "answer": ["A"], "note": "", "block": 5}, {"id": 217, "text": "Mâu thuẫn cơ bản và chủ yếu trong xã hội tư bản chủ nghĩa, bắt buộc nó phải được thay thế bằng hình thái kinh tế - xã hội khác phù hợp hơn là gì?", "options": [{"key": "A", "text": "Mâu thuẫn giữa tính chất chuyên môn hóa của lực lượng sản xuất với chế độ chiếm hữu tập thể tư bản chủ nghĩa về tư liệu sản xuất"}, {"key": "B", "text": "Mâu thuẫn giữa tính chất xã hội hóa về lực lượng sản xuất với chế độ chiếm hữu công cộng về tư liệu sản xuất"}, {"key": "C", "text": "Mâu thuẫn giữa tính chất xã hội hóa của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất"}, {"key": "D", "text": "Mâu thuẫn giữa tính chất tư nhân hóa của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất"}], "answer": ["C"], "note": "", "block": 5}, {"id": 218, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội ở Việt Nam hiện nay, giai cấp công nhân có vị trí, vai trò như thế nào trong khối liên minh giai cấp?", "options": [{"key": "A", "text": "Là lực lượng nòng cốt, tiên phong trong liên minh giai cấp"}, {"key": "B", "text": "Là lực lượng hỗ trợ duy trì liên minh"}, {"key": "C", "text": "Là lực lượng duy trì khối đại đoàn kết của giai cấp công nhân, nông dân với tư sản và trí thức"}, {"key": "D", "text": "Tất cả đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 5}, {"id": 219, "text": "Đâu là tiền đề khoa học tự nhiên cho sự ra đời của chủ nghĩa xã hội khoa học?", "options": [{"key": "A", "text": "Định luật bảo toàn và chuyển hóa năng lượng"}, {"key": "B", "text": "Học thuyết tế bào"}, {"key": "C", "text": "Tất cả các đáp án đều đúng"}, {"key": "D", "text": "Học thuyết tiến hóa"}], "answer": ["C"], "note": "", "block": 5}, {"id": 220, "text": "Theo chủ nghĩa Mác - Lênin, chất lượng của giai cấp công nhân được thế hiện thông qua yếu tố nào?", "options": [{"key": "A", "text": "Sư chuyên nghiệp trong tác phong, kỷ luật lao động"}, {"key": "B", "text": "Năng lực tập hợp, vận động và thống trị nhân dân lao động thông qua đội tiên phong của mình - Đảng Cộng sản"}, {"key": "C", "text": "Năng lực tổ chức khởi nghĩa giành chính quyền"}, {"key": "D", "text": "Trình độ trưởng thành về ý thức chính trị của một giai cấp cách mạng"}], "answer": ["D"], "note": "", "block": 5}, {"id": 221, "text": "Nếu thiếu đi cơ sở văn hóa, hoặc cơ sở văn hóa không đi liền với cơ sở kinh tế, chính tri, thì sẽ ảnh hưởng đến vấn đề gì?", "options": [{"key": "A", "text": "Việc phát triển xã hội"}, {"key": "B", "text": "Việc nhận thức về thế giới xung quanh của con người bị hạn chế"}, {"key": "C", "text": "Việc xây dựng gia đình sẽ lệch lạc, không đạt hiệu quả cao"}, {"key": "D", "text": "Việc phát triển tâm sinh lý của con người"}], "answer": ["A"], "note": "", "block": 5}, {"id": 222, "text": "Cơ cấu xã hội - giai cấp trong thời kì quá độ lên chủ nghĩa xã hội có sư đan xen giữa cái cũ và cái mới, biểu hiện về mặt kinh tế của nó là gì?", "options": [{"key": "A", "text": "Tồn tại nhiều hình thức liên doanh, liên kết tư bản nước ngoài"}, {"key": "B", "text": "Tồn tại nhiều giai cấp, tầng lớp đối lập với nhau"}, {"key": "C", "text": "Tồn tại kết cấu kinh tế nhiều thành phần"}, {"key": "D", "text": "Tồn tại nhiều chủ sở hữu trong cùng một doanh nghiệp"}], "answer": ["C"], "note": "", "block": 5}, {"id": 223, "text": "Trong cách mạng xã hội chủ nghĩa, giai cấp công nhân phải liên minh được với giai cấp nông dân và các tầng lớp nhân dân lao động khác trong giai đoạn nào? ( chọn 2 đáp án )", "options": [{"key": "A", "text": "Giai đoạn xóa bỏ giai cấp sau khi xây dựng thành công chủ nghĩa xã hội"}, {"key": "B", "text": "Giai đoạn xây dựng chế độ xã hội mới"}, {"key": "C", "text": "Giai đoạn đấu tranh đòi các quyền tư do, dân chủ"}, {"key": "D", "text": "Giai đoạn giành chính quyền"}], "answer": ["B", "D"], "note": "", "block": 5}, {"id": 224, "text": "Quan hệ dân tộc và tôn giáo Việt Nam chịu sự chỉ phối mạnh mẽ bởi vấn đề gì?", "options": [{"key": "A", "text": "Tín ngưỡng truyền thống"}, {"key": "B", "text": "Giáo dục truyền thông"}, {"key": "C", "text": "Mê tín dị đoan"}, {"key": "D", "text": "Văn hóa tín ngưỡng"}], "answer": ["A"], "note": "", "block": 5}, {"id": 225, "text": "Tính chất xã hội hóa cao của lực lượng sản xuất đòi hỏi vấn đề gì?", "options": [{"key": "A", "text": "Một quan hệ sản xuất mới, phù hợp với chế độ công hữu các tư liệu sản xuất chủ yếu của xã hội"}, {"key": "B", "text": "Một cơ sở ha tầng mới, phù hợp với chế độ công hữu các tư liệu sản xuất chủ yếu của xã hội"}, {"key": "C", "text": "Một lực lượng sản xuất mới, phù hợp với chế độ công hữu các tư liệu sản xuất chủ yếu của xã hội"}, {"key": "D", "text": "Một kiến trúc thượng tầng mới, phù hợp với lực lượng sản xuất mới"}], "answer": ["A"], "note": "", "block": 5}, {"id": 226, "text": "Điền vào chỗ trống: Kiện toàn tổ chức, đổi mới phương thức và nâng cao hiệu quả hoạt động của Quốc hội để đảm bảo đây là cơ quan...", "options": [{"key": "A", "text": "Quyền lực của nhân dân"}, {"key": "B", "text": "Quyền lực cao nhất của nhà nước"}, {"key": "C", "text": "Quyền lực cao nhất của nhân dân"}, {"key": "D", "text": "Quyền lực cao nhất của giai cấp"}], "answer": ["C"], "note": "", "block": 5}, {"id": 227, "text": "Để một tôn giáo ra đời cần bao nhiêu nguồn gốc?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "3"}, {"key": "C", "text": "6"}, {"key": "D", "text": "5"}], "answer": ["B"], "note": "", "block": 5}, {"id": 228, "text": "Đặc trưng nổi bật trong quan hệ giữa các dân tộc ở nước ta là:", "options": [{"key": "A", "text": "Là các dân tộc có bản sắc văn hoá riêng, đa dạng, phong phú"}, {"key": "B", "text": "Là sự phân bố đan xen nhau, không một dân tộc nào có lãnh thổ riêng"}, {"key": "C", "text": "Là sự cố kết dân tộc, hoà hợp dân tộc trong một cộng đồng thông nhất"}, {"key": "D", "text": "Là có sự chênh lệch về trình độ phát triển kinh tế - xã hội giữa các dân tộc"}], "answer": ["C"], "note": "", "block": 5}, {"id": 229, "text": "Bản chất dân chủ xã hội chủ nghĩa ở Việt Nam được thực hiện thông qua hình thức nào? (chọn 2 câu)(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Hình thức dân chủ trực tiếp"}, {"key": "B", "text": "Hình thức dân chủ gián tiếp"}, {"key": "C", "text": "Hình thức dân chủ đại nghị"}, {"key": "D", "text": "Hình thức dân chủ công khai"}], "answer": ["A", "B"], "note": "", "block": 5}, {"id": 230, "text": "Liên Xô, Đông Âu và các nước xã hội chủ nghĩa hiện nay, đã và đang quá độ lên chủ nghĩa xã hội bằng hình thức nào?", "options": [{"key": "A", "text": "Quá độ gián tiếp"}, {"key": "B", "text": "Quá độ trực tiếp"}, {"key": "C", "text": "Quá độ bộ phận"}, {"key": "D", "text": "Quá độ toàn diện"}], "answer": ["A"], "note": "", "block": 5}, {"id": 231, "text": "Trong nhà nước xã hội chủ nghĩa Việt Nam, cơ quan nào là cơ quan quyền lực nhà nước cao nhất?", "options": [{"key": "A", "text": "Chính phủ"}, {"key": "B", "text": "Viện kiểm sát nhân dân"}, {"key": "C", "text": "Tòa án nhân dân"}, {"key": "D", "text": "Quốc hội"}], "answer": ["D"], "note": "", "block": 5}, {"id": 232, "text": "Thời kỳ quá độ lên chủ nghĩa xã hội là thời kỳ đấu tranh giai cấp trong điều kiện mới, điều kiện đó là gì?", "options": [{"key": "A", "text": "Đảng Cộng sản đã được thành lập, và ngày càng thể hiện vai trò lãnh đạo tích cực trong phong trào đấu tranh giành chính quyền"}, {"key": "B", "text": "Giai cấp tư sản đã trở thành lực lượng phản động"}, {"key": "C", "text": "Giai cấp công nhân và nhân dân lao động đã trở thành giai cấp cầm quyền"}, {"key": "D", "text": "Sự phát triển của công nghiệp hóa dẫn đến thất nghiệp tràn lan"}], "answer": ["C"], "note": "", "block": 5}, {"id": 233, "text": "Đâu là một tôn giáo nội sinh của Việt Nam?", "options": [{"key": "A", "text": "Đạo Cao đài"}, {"key": "B", "text": "Tin lành"}, {"key": "C", "text": "Phật giáo"}, {"key": "D", "text": "Hội Thánh Đức chúa trời"}], "answer": ["A"], "note": "", "block": 5}, {"id": 234, "text": "Căn cứ vào tính chất của quyền lực nhà nước, chức năng nào của nhà nước xã hội chủ nghĩa là quan trọng nhất, mang ý nghĩa then chốt, quyết định?", "options": [{"key": "A", "text": "Chức năng giai Cấp (trấn áp)"}, {"key": "B", "text": "Chúc năng đối nội"}, {"key": "C", "text": "Chức năng đối ngoại"}, {"key": "D", "text": "Chức năng xã hội (tổ chức và xây dựng)"}], "answer": ["D"], "note": "", "block": 5}, {"id": 235, "text": "Đâu là các đại biểu của chủ nghĩa xã hội không tưởng phê phán Pháp? ( Chọn 3 đáp án)", "options": [{"key": "A", "text": "Xanh Ximông"}, {"key": "B", "text": "S. Phurie"}, {"key": "C", "text": "R.Oen"}, {"key": "D", "text": "Ph.Hêghen"}], "answer": ["A", "B", "C"], "note": "", "block": 5}, {"id": 236, "text": "Các chủ trương, chính sách phát triển kinh tế - xã hội miền núi, vùng đồng bào các dân tộc thiểu số ở nước ta nhằm mục đích gì?", "options": [{"key": "A", "text": "Phát huy tiềm năng phát triển, rút ngắn khoảng cách chênh lệch giữa các vùng, các dân tộc"}, {"key": "B", "text": "Bù đắp cho đồng bào ở các nơi này để động viên họ cố gắng giữ gìn bờ cõi quốc gia"}, {"key": "C", "text": "Giảm thiểu sự lợi dụng điều kiện sống cực khổ của các nơi này để kích động thực hiện mưu đồ chia rẽ"}, {"key": "D", "text": "Tận dụng mọi nguồn lực để tăng trưởng kinh tế khi ở các vùng đồng bằng đã cạn kiệt"}], "answer": ["A"], "note": "", "block": 5}, {"id": 237, "text": "Trong quá trình xây dựng chủ nghĩa xã hội, chủ trương bảo vệ chế độ hôn nhân một vợ, một chồng nhằm mục đích gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tất cả các đáp án đều đúng"}, {"key": "B", "text": "Điều hòa mâu thuẫn trong gia đình"}, {"key": "C", "text": "Thực hiện bình đẳng trong gia đình, giải phóng phụ nữ"}, {"key": "D", "text": "Hạn chế các tệ nạn xã hội như mại dâm, bạo lực gia đình"}, {"key": "E", "text": "Đảm bảo hiệu quả cho sự quản lý nhà nước về gia đình"}], "answer": ["A"], "note": "(Nếu không có a chọn c)", "block": 5}, {"id": 238, "text": "Quá độ từ xã hội tiền tư bản chủ nghĩa phát triển lên chủ nghĩa xã hội là hình thức quá độ nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Quá độ gián tiếp"}, {"key": "B", "text": "Quá độ trực tiếp"}, {"key": "C", "text": "Quá độ bộ phận"}, {"key": "D", "text": "Quá độ toàn diện"}], "answer": ["A"], "note": "", "block": 5}, {"id": 239, "text": "Tổ chức quyền lực của Nhà nước pháp quyền xã hội chủ nghĩa đảm bảo quyền lực nhà nước là:(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Đồng nhât, có sự phân công và phối hợp giữa các cơ quan nhà nước"}, {"key": "B", "text": "Cùng nhau, có sự phân công và phối hợp giữa các cơ quan nhà nước"}, {"key": "C", "text": "Thống nhất, có sự phản công và phối hợp giữa các cơ quan nhà nước"}, {"key": "D", "text": "Chia đều, có sự phân công và phối hợp giữa các cơ quan nhà nước"}], "answer": ["C"], "note": "", "block": 5}, {"id": 240, "text": "Xét trên phương diện kinh tế - xã hội, thì giai cấp nào là những người lao động trực tiếp hay gián tiếp vận hành các công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại và xã hội hóa cao?", "options": [{"key": "A", "text": "Địa chủ"}, {"key": "B", "text": "Tư sản"}, {"key": "C", "text": "Công nhân"}, {"key": "D", "text": "Nông dân"}], "answer": ["C"], "note": "", "block": 5}, {"id": 241, "text": "Tại sao nói gia đình là tế bào của xã hội?", "options": [{"key": "A", "text": "Vì bất kì ai cũng có gia đình riêng, có con cái và cha mẹ"}, {"key": "B", "text": "Tất cả các đáp án đều đúng"}, {"key": "C", "text": "Vì gia đình là cơ chế quản lý xã hội ở cấp độ nhỏ nhất, không thể phân chia được nữa"}, {"key": "D", "text": "Vì gia đình sản xuất ra tư liệu tiêu dùng, tư liệu sản xuất và tái sản xuất ra con người"}], "answer": ["D"], "note": "", "block": 5}, {"id": 242, "text": "Những giá trị nào sau đây được nhân loại thừa nhận và phấn đấu thực hiện?", "options": [{"key": "A", "text": "Lao động, sáng tạo, công bằng, dân chủ, bình đẳng, phát triển"}, {"key": "B", "text": "Lao động, sáng tạo, công bằng, dân chủ, tự do"}, {"key": "C", "text": "Lao động, sáng tạo, công bằng, dân chủ, bình đẳng, tự do"}, {"key": "D", "text": "Lao động, sáng tạo, công bằng, dân chủ, bình đẳng"}], "answer": ["C"], "note": "", "block": 5}, {"id": 243, "text": "Theo quan điểm của chủ nghĩa Mác - Lênin, từ chủ nghĩa tư bản lên chủ nghĩa xã hội tất yếu phải trải qua thời kỳ gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Phát triển của loài người"}, {"key": "B", "text": "Phát triển lực lượng sản xuất và quan hệ sản xuất"}, {"key": "C", "text": "Quá độ chính trị"}, {"key": "D", "text": "Thay đổi phương thức sản xuất"}], "answer": ["C"], "note": "", "block": 5}, {"id": 244, "text": "Vấn đề sau đây do ai khẳng định: \"Trong mọi thời đại lịch sử, sản xuất kinh tế và cơ cấu xã hội - cơ cấu này tất yếu phải do sản xuất kinh tế mà ra, - cả hai cái đó cấu thành cơ sở của lịch sử chính trị và lịch sử tư tưởng của thời đại ấy...\"?", "options": [{"key": "A", "text": "Chủ tịch Hồ Chí Minh"}, {"key": "B", "text": "C.Mác"}, {"key": "C", "text": "Ph.Ăngghen"}, {"key": "D", "text": "V.I.Lênin"}], "answer": ["C"], "note": "", "block": 5}, {"id": 245, "text": "Trong bối cảnh hội nhập kinh tế quốc tế và cạnh tranh hàng hóa trong khu vực và thế giới, kinh té gia đình gặp khó khăn, trở ngại do nguyên nhân gì?", "options": [{"key": "A", "text": "Do thói quen, tập quán an phận, ngại thay đổi của nền tảng gia đình cũ"}, {"key": "B", "text": "Do chính sách đều tiết của Nhà nước thúc đẩy kinh tế hộ gia đình phát triển thành doanh nghiệp"}, {"key": "C", "text": "Do gia đình ngày càng ít thành viên hơn"}, {"key": "D", "text": "Do kinh tế gia đình phần lớn có quy mô nhỏ, lao động ít, tự sản xuất là chính"}], "answer": ["D"], "note": "", "block": 5}, {"id": 246, "text": "Các dân tộc đều có quyền và nghĩa vụ ngang nhau trên tất cả các lĩnh vực đời sống xã hội, không phân biệt dân tộc lớn hay nhỏ, trình độ phát triển cao hay thấp là quyền gì trong Cương lĩnh dân tộc của V.I.Lênin?", "options": [{"key": "A", "text": "Quyền công bằng xã hội"}, {"key": "B", "text": "Quyền hoàn toàn bình đẳng giữa các dân tộc"}, {"key": "C", "text": "Quyền dân tộc tự quyết"}, {"key": "D", "text": "Quyền sống, quyền tự do và quyền hạnh phúc của các dân tộc"}], "answer": ["B"], "note": "", "block": 5}, {"id": 247, "text": "Dân chủ với tư cách là một giá trị xã hội, thì nó là:", "options": [{"key": "A", "text": "Phạm trù lịch sử, tồn tại ngoài chế độ quân chủ phong kiến"}, {"key": "B", "text": "Pham trù vĩnh viễn, tồn tại trong mọi chế độ xã hội"}, {"key": "C", "text": "Phạm trù lịch sử, mất đi khi tiến lên chủ nghĩa xã hội"}, {"key": "D", "text": "Pham trù lịch sử, mất đi khi nhà nước tiêu vong"}], "answer": ["B"], "note": "", "block": 5}, {"id": 248, "text": "Sứ mệnh lịch sử thế giới của giai cấp công nhân là:", "options": [{"key": "A", "text": "Xóa bỏ sự thống trị áp bức của chủ nghĩa tự bản, xây dựng thành công chế độ xã hội mới - xã hội chủ nghĩa và cộng sản chủ nghĩa, tiến tới một xã hội không còn giai cấp"}, {"key": "B", "text": "Xóa bỏ sự thống trị áp bức của chế độ phong kiến, xây dựng thành công chế độ xã hội mới - xã hội chủ nghĩa và cộng sản chủ nghĩa, tiến tới một xã hội không còn giai cấp"}, {"key": "C", "text": "Xóa bỏ sự thống trị áp bức của chế độ công xã nguyên thủy, xây dựng thành công chế độ xã hội mới - xã hội chủ nghĩa và cộng sản chủ nghĩa, tiến tới một xã hội không còn giai cấp"}, {"key": "D", "text": "Xóa bỏ sự thống trị áp bức của chủ nghĩa tư bản, xây dựng thành công chế độ xã hội mới - phong kiến"}], "answer": ["A"], "note": "", "block": 5}, {"id": 249, "text": "Vấn đề: \"Dân chủ là quyền lực thuộc về nhân dân, nhân dân là chủ nhân của nhà nước\" được đề cập trên phương diện nào theo chủ nghĩa Mác - Lênin Về dân chủ?", "options": [{"key": "A", "text": "Phương diện tổ chức và quản lý xã hội"}, {"key": "B", "text": "Phương diện quyền lực"}, {"key": "C", "text": "Phương diện chế độ xã hội và trong lĩnh vực chính trị"}, {"key": "D", "text": "Phương diện bảo vệ xã hội"}], "answer": ["B"], "note": "", "block": 5}, {"id": 250, "text": "Đâu được xem là điều kiện tiên quyết để xây dựng nền dân chủ xã hội chủ nghĩa Việt Nam?", "options": [{"key": "A", "text": "Giải phóng dân tộc, giải phóng giai cấp"}, {"key": "B", "text": "Chăm lo giáo dục, y tế cho người dân"}, {"key": "C", "text": "Độc lập, tự chủ, hòa bình"}, {"key": "D", "text": "Xây dựng Đảng Cộng sản Việt Nam trong sạch, vững mạnh"}], "answer": ["D"], "note": "", "block": 5}, {"id": 251, "text": "Trong thời gian qua, việc tăng cường các chương trình đào tạo quốc tế, hướng đến công dân toàn cầu, người lao động có trình độ cao thích ứng với toàn cầu hóa nằm trong giải pháp thứ mấy của các giải pháp xây dựng giai cấp công nhân hiện nay?", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "3"}, {"key": "D", "text": "4"}], "answer": ["D"], "note": "", "block": 6}, {"id": 252, "text": "Theo V.l.Lênin: Giai Cấp công nhân nếu không liên minh với giai cấp nào thì không thể có được chính quyền của giai cấp vô sản?", "options": [{"key": "A", "text": "Nông dân"}, {"key": "B", "text": "Bóc lột"}, {"key": "C", "text": "Tư sản"}, {"key": "D", "text": "Địa chủ"}], "answer": ["A"], "note": "", "block": 6}, {"id": 253, "text": "Theo chủ nghĩa Mác - Lênin, tôn giáo là gì?", "options": [{"key": "A", "text": "Là một thiết chế xã hội phản ảnh chân thật hiện thưc khách quan"}, {"key": "B", "text": "Là một hình thái ý thức xã hội, phản ánh hư ảo hiện thực khách quan"}, {"key": "C", "text": "Là một cơ sở xã hội, phản ánh các ý chí, nguyện vọng của tin đó theo một giáo lý nào đó"}, {"key": "D", "text": "Là một thực thể xã hội, điều chỉnh tâm lý con người hiệu quả"}], "answer": ["B"], "note": "", "block": 6}, {"id": 254, "text": "Đâu là một trong tám đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam được đề cập trong Văn kiện Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Dân giàu, nước mạnh, dân chủ, văn minh"}, {"key": "B", "text": "Dân giàu, nước mạnh, con người có cuộc sông ấm no"}, {"key": "C", "text": "Do nhân dân làm chủ"}, {"key": "D", "text": "Nhà nước pháp quyền xã hội chủ nghĩa, nhà nước của nhân dân lao động"}], "answer": ["C"], "note": "(-Một là: Dân giàu, nước mạnh, dân chủ, công bằng, văn minh.\n-Hai là: Do nhân dân làm chủ.\n-Ba là: Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại vàquan hệ sản xuất tiến bộ phù hợp.\n-Bốn là: Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc.\n-Năm là: Con người có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện pháttriển toàn diện.\n-Sáu là: Các dân tộc trong cộng đồng Việt Nam bình đẳng, đoàn kết, tôn trọngvà giúp nhau cùng phát triển.\n-Bảy là: Có Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân,vì nhân dân do Đảng Cộng sản lãnh đạo.\n-Tám là: Có quan hệ hữu nghị và hợp tác với các nước trên thế giớ)", "block": 6}, {"id": 255, "text": "Nhà nước Xã hội chủ nghĩa là nhà nước của", "options": [{"key": "A", "text": "Thiểu số thống trị đa Số"}, {"key": "B", "text": "Đa số thống trị thiểu số"}, {"key": "C", "text": "Sự dung hòa lợi ích các giai cấp"}, {"key": "D", "text": "Sự đấu tranh quyền lực trong bối cảnh mới"}], "answer": ["B"], "note": "", "block": 6}, {"id": 256, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội, bên cạnh sự liên minh chặt chẽ trên cơ sở thống nhất lợi ích kinh tế giữa giai cấp công nhân, nông dân và trí thức, còn xuất hiện vấn đề gì?", "options": [{"key": "A", "text": "Xuất hiện những mâu thuẫn lợi ích ở những mức độ khác nhau"}, {"key": "B", "text": "Xuất hiện sự đấu tranh kịch liệt trong hệ thống chuyên chính vô sản"}, {"key": "C", "text": "Xuất hiện sự chống phá của các giai cấp trong liên minh"}, {"key": "D", "text": "Xuất hiện sự chuyên quyền, độc đoán của một bộ phận"}], "answer": ["A"], "note": "", "block": 6}, {"id": 257, "text": "Quá trình phát triển của nền dân chủ xã hội chủ nghĩa được diễn ra như thế nào?", "options": [{"key": "A", "text": "Từ thấp đến cao, từ chưa hoàn thiện đến hoàn thiện"}, {"key": "B", "text": "Từ thấp đến cao, từ đơn giản đến phức tạp"}, {"key": "C", "text": "Từ thấp đến cao, diễn ra khó khăn"}, {"key": "D", "text": "Từ thấp đến cao, diễn ra một cách từ từ"}], "answer": ["A"], "note": "", "block": 6}, {"id": 258, "text": "Theo V.I.Lênin, mục đích cao cả nhất mà chủ nghĩa xã hội cần đạt đến là gì? ( Choose 3 answers)", "options": [{"key": "A", "text": "Xóa bỏ sự phân chia xã hội thành giai cấp"}, {"key": "B", "text": "Biến tất cả thành viên trong xã hội thành người lao động"}, {"key": "C", "text": "Tiêu diệt cơ sở của mọi tình trạng người bóc lột người"}, {"key": "D", "text": "Thiết lập quyền thống trị xã hội của giai cấp công nhân và nhân dân lao động"}], "answer": ["A", "B", "C"], "note": "", "block": 6}, {"id": 259, "text": "Gia đình văn hóa là một mô hình gia đình như thế nào?", "options": [{"key": "A", "text": "Phát triển"}, {"key": "B", "text": "Tiến bộ"}, {"key": "C", "text": "Huyết thống"}, {"key": "D", "text": "Không được bảo vệ"}], "answer": ["B"], "note": "", "block": 6}, {"id": 260, "text": "Hôn nhân một vợ một chồng xuất hiện lần đầu tiên khi nào?", "options": [{"key": "A", "text": "Khi có sự thắng lợi của chế độ tư hữu đối với chế độ công hữu nguyên thủy"}, {"key": "B", "text": "Khi có sự thắng thế của chế độ tư bản đối với chế độ phong kiến"}, {"key": "C", "text": "Khi các quốc gia bước vào thời kỳ quá độ lên chủ nghĩa xã hội"}, {"key": "D", "text": "Khi con người xuất hiện"}], "answer": ["A"], "note": "", "block": 6}, {"id": 261, "text": "\"Sống có việc làm hay là chết trong đấu tranh\" là khẩu hiệu của giai cấp công nhân ở đâu?", "options": [{"key": "A", "text": "Công xã Pari"}, {"key": "B", "text": "Vương Quôc Anh"}, {"key": "C", "text": "Đức"}, {"key": "D", "text": "Nhà máy dệt Lion"}], "answer": ["D"], "note": "", "block": 6}, {"id": 262, "text": "Vấn đề chiến lược, cơ bản, lâu dài và cấp bách trong việc giải quyết mối quan hệ dân tộc và tôn giáo ở Việt Nam hiện nay là gì?", "options": [{"key": "A", "text": "Đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam, tuân thủ nguyên tắc, lập trường chính trị của giai cấp công nhân"}, {"key": "B", "text": "Đảm bảo các tôn giáo, dân tộc chuyển biến tích cực"}, {"key": "C", "text": "Đảm bảo hài hòa lợi ích, giảm thiểu tới mức tối đa mâu thuẫn lợi ích, nhất là mâu thuẫn lợi ích kinh tế"}, {"key": "D", "text": "Củng cố mối quan hệ tốt đẹp giữa dân tộc và tôn giáo, củng cố khối đại đoàn kết toàn dân tộc và đoàn kết tôn giáo"}], "answer": ["D"], "note": "", "block": 6}, {"id": 263, "text": "Dân chủ xã hội chủ nghĩa có bản chất kinh tế khác với dân chủ tư sản ở điểm nào? (Chọn 2)", "options": [{"key": "A", "text": "Chế độ công hữu về tư liệu sản xuất chủ yếu"}, {"key": "B", "text": "Thực hiện chế độ phân phối lợi ích theo kết quả lao động là chủ yếu"}, {"key": "C", "text": "Sự tố chức quyền lực nhà nước do đảng cộng sản lãnh đạo"}, {"key": "D", "text": "Sự đa dạng, phong phú về chế độ sở hữu chủ yếu"}], "answer": ["A", "B"], "note": "", "block": 6}, {"id": 264, "text": "Theo quan điểm của chủ nghĩa Mác - Lênin, Về bản Chất, tôn giáo do ai sáng tạo ra?", "options": [{"key": "A", "text": "Chúa trời"}, {"key": "B", "text": "Đức Phật"}, {"key": "C", "text": "Các thế lực siêu nhiên"}, {"key": "D", "text": "Con người"}], "answer": ["D"], "note": "", "block": 6}, {"id": 265, "text": "Những lực lượng nào đóng vai trò quan trọng trong việc đẩy mạnh nghiên cứu sáng tạo và ứng dụng các thành tựu khoa học - công nghệ hiện đại?", "options": [{"key": "A", "text": "Đội ngũ trí thức, đội ngũ doanh nhân"}, {"key": "B", "text": "Giai cấp công nhân, đội ngũ trí thức"}, {"key": "C", "text": "Đội ngũ trí thức, giai cấp nông dân"}, {"key": "D", "text": "Đội ngũ doanh nhân, tầng lớp lao động trong xã hội"}], "answer": ["A"], "note": "", "block": 6}, {"id": 266, "text": "Tại sao trong gia đình Việt Nam truyền thống trước kia lại quan niệm có càng đông con càng tốt và nhất thiết phải có con trai nối dõi?", "options": [{"key": "A", "text": "Do dân số ít và nam giới quá hiếm"}, {"key": "B", "text": "Do không có các biện pháp kế hoạch hóa gia đình"}, {"key": "C", "text": "Do con cái mang họ cha"}, {"key": "D", "text": "Do ảnh hưởng phong tục, tập quán và nhu cầu sản xuất nông nghiệp"}], "answer": ["D"], "note": "", "block": 6}, {"id": 267, "text": "Ba bộ phận hợp thành chủ nghĩa Mác - Lênin là gì?", "options": [{"key": "A", "text": "Triết học Mác - Lênin, Kinh tế chính trị Mác - Lênin và Chủ nghĩa xã hội không tưởng phê phán"}, {"key": "B", "text": "Kinh tế chính trị Mác - Lênin, Tư tưởng Hồ Chí Minh và Chủ nghĩa xã hội không tưởng phê phán"}, {"key": "C", "text": "Triết học Mác - Lênin, Tư tưởng Hồ Chí Minh và Kinh tế chính trị học cổ điển Anh"}, {"key": "D", "text": "Triết học Mác - Lênin, Kinh tế chính trị Mác - Lênin và Chủ nghĩa xã hội khoa học"}], "answer": ["D"], "note": "", "block": 6}, {"id": 268, "text": "Chủ nghĩa xã hội khoa học có chức năng giác ngộ và hướng dẫn giai cấp công nhân thực hiện sứ mệnh lịch sử của mình trong thời kỳ nào?", "options": [{"key": "A", "text": "Thời kỳ đấu tranh lật đổ sự thống trị của giai cấp tư sản, giành chính quyền"}, {"key": "B", "text": "Thời kỳ thiết lập sự thống trị của giai cấp công nhân, thực hiện sự nghiệp cải tạo và xây dựng chủ nghĩa xã hội"}, {"key": "C", "text": "Thời kỳ phát triển chủ nghĩa xã hội tiến lên chủ nghĩa cộng sản"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 6}, {"id": 269, "text": "Theo chủ nghĩa Mác - Lênin thi lịch sử xã hội đã trải qua mấy hình thái kinh tế - xã hội?", "options": [{"key": "A", "text": "2"}, {"key": "B", "text": "3"}, {"key": "C", "text": "4"}, {"key": "D", "text": "5"}], "answer": ["D"], "note": "(Kiểu hỏi khác: Chủ nghĩa Mác Lênin đã chia lịch sử vận động và phát triển của xã hội thành mấy hình thái kinh tế xã hội?)", "block": 6}, {"id": 270, "text": "Phương thức căn bản và quan trọng để thực hiện và tăng cường liên minh công - nông - trí thức ở Việt Nam hiện nay là gì?", "options": [{"key": "A", "text": "Đẩy mạnh công nghiệp hóa, hiện đại hóa; xây dựng nông thôn mới; phát triển kinh tế tri thức, nâng cao trình độ khoa học, công nghệ trong các ngành, lĩnh vực"}, {"key": "B", "text": "Đẩy mạnh nghiên cứu, sáng tạo các giải pháp mới nhằm thu hẹp nông thôn, mở rộng công nghiệp, chuyển đổi nhanh chóng cơ cấu kinh tế theo hướng dịch vụ và công nghiệp"}, {"key": "C", "text": "Từng bước xác lập vị trí chủ đạo của nền kinh tế tri thức và vai trò quan trong bật nhất của đội ngũ trí thức"}, {"key": "D", "text": "Từng bước xác lập vị trí then chốt của kinh tế thị trường và vai trò quan trọng bật nhất của đội ngũ doanh nhân"}], "answer": ["A"], "note": "", "block": 6}, {"id": 271, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội, yếu tố nào quyết định mối quan hệ hợp tác và gắn bó chặt chẽ giữa các giai cấp, tầng lớp và các nhóm xã hội?", "options": [{"key": "A", "text": "Họ cùng nhau chung sức cải tạo xã hội cũ, xây dưng xã hội mới trong mọi lĩnh vực của đời sống xã hội"}, {"key": "B", "text": "Họ cùng nhau phân chia quyền lực trong một chế độ nhà nước, vừa canh tranh, vữa động hành cùng nhau trong mọi lĩnh vực của đời sống xã hội"}, {"key": "C", "text": "Họ cùng sống trong một chế độ xã hội, một quốc gia dân tộc cụ thể, cho nên tính dân tộc bắt buộc họ phải gắn bó chặt chẽ với nhau"}, {"key": "D", "text": "Tất cả đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 6}, {"id": 272, "text": "Hình thức gia đình nào hình thành sớm nhất trong lịch sử?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Gia đình một vợ một chồng"}, {"key": "B", "text": "Gia đình phụ hệ"}, {"key": "C", "text": "Đại gia đình phụ hệ"}, {"key": "D", "text": "Gia đình mẫu hệ"}], "answer": ["D"], "note": "", "block": 6}, {"id": 273, "text": "Trong thời đại ngày nay, mục tiêu chính trị chủ yếu của mọi quốc gia khi giải quyết các vấn đề quốc gia - dân tộc là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Độc lập dân tộc"}, {"key": "B", "text": "Lợi ích kinh tế"}, {"key": "C", "text": "Phân chia quyền lực nhà nước"}, {"key": "D", "text": "Tất cả đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 6}, {"id": 274, "text": "Các quan hệ gia đình biến đổi, phát triển phụ thuộc vào điều gì?", "options": [{"key": "A", "text": "Trình độ phát triển kinh tế và thể chế chính trị - xã hội"}, {"key": "B", "text": "Số lượng thành viên trong gia đình"}, {"key": "C", "text": "Điều kiện kinh tế của từng cá nhân trong gia đình"}, {"key": "D", "text": "Các yếu tố đạo đức của một xã hội"}], "answer": ["A"], "note": "", "block": 6}, {"id": 275, "text": "Tại sao nói nhà nước xã hội chủ nghĩa là nhà nước kiểu mới?", "options": [{"key": "A", "text": "Vì nó xuất hiện trễ nhất trong các kiểu nhà nước"}, {"key": "B", "text": "Vì bản chất của nó đối lập với các kiểu nhà nước bóc lột từng có trong lịch sử"}, {"key": "C", "text": "Vì do không tuân theo các quy tắc tổ chức nhà nước cổ điển"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["B"], "note": "", "block": 6}, {"id": 276, "text": "Xã hội loài người đã trải qua 5 hình thái kinh tế - xã hội đó, hình thái nào được xem là \"thai nghén\" trong lòng xã hội tư bản chủ nghĩa?", "options": [{"key": "A", "text": "Hình thái kinh tế - xã hội chiếm hữu nô lệ"}, {"key": "B", "text": "Hình thái kinh tế - xã hội phong kiến"}, {"key": "C", "text": "Hình thái kinh tế - xã hội tư bản chủ nghĩa"}, {"key": "D", "text": "Hình thái kinh tế - xã hội cộng sản chủ nghĩa"}], "answer": ["D"], "note": "", "block": 6}, {"id": 277, "text": "Với sự phát triển của hệ thống giáo dục xã hội và sự phát triển kinh tế hiện nay, vai trò giáo dục của các chủ thể trong gia đình có sự biến đổi như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Vai trò giáo dục của các thành viên trong gia đình có xu hướng giảm xuống"}, {"key": "B", "text": "Vai trò giáo dục của các thành viên trong gia đình có xu hướng gia tăng"}, {"key": "C", "text": "Vai trò giáo dục của cha mẹ ngày càng được tăng cường, dành nhiều thời gian chăm sóc, giáo dục con cái hơn"}, {"key": "D", "text": "Vai trò giáo dục của ông bà ngày càng quan trọng hơn"}], "answer": ["A"], "note": "", "block": 6}, {"id": 278, "text": "Hôn nhân tiến bộ là hôn nhân xuất phát từ đâu?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Từ tình yêu giữa nam và nữ"}, {"key": "B", "text": "Từ quan hệ kinh tế - xã hội"}, {"key": "C", "text": "Từ cơ sở pháp lý được xã hội công nhân"}, {"key": "D", "text": "Từ các yếu tố đạo đức truyền thống"}], "answer": ["A"], "note": "", "block": 6}, {"id": 279, "text": "Trong các chế độ xã hội trước, sự thống trị của người đàn ông trong gia đình là kết quả của việc gì?", "options": [{"key": "A", "text": "Của sự thống trị về kinh tế"}, {"key": "B", "text": "Của sự phát triển chế độ quân chủ"}, {"key": "C", "text": "Của sự thống trị về văn hóa"}, {"key": "D", "text": "Của sự thống trị về chính trị"}], "answer": ["A"], "note": "", "block": 6}, {"id": 280, "text": "Điền cụm từ thích hợp vào (...): \"Giai cấp ..., trong quá trình thống trị giai cấp chưa đầy một thế kỷ, đã tạo ra những ... nhiều hơn và đồ sộ hơn lực lượng sản xuất của tất cả các thế hệ trước kia gộp lại\".", "options": [{"key": "A", "text": "Tư sản/ Lực lượng sản xuất"}, {"key": "B", "text": "Tư sản/ Quan hệ sản xuất"}, {"key": "C", "text": "Vô sản/ Tư sản"}, {"key": "D", "text": "Vô sản/ Giai cấp nông dân"}], "answer": ["A"], "note": "", "block": 6}, {"id": 281, "text": "\"Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp\" được đề cập tại Đại hội lần thứ bao nhiêu của Đảng?", "options": [{"key": "A", "text": "X"}, {"key": "B", "text": "XI"}, {"key": "C", "text": "XII"}, {"key": "D", "text": "XIII"}], "answer": ["D"], "note": "", "block": 6}, {"id": 282, "text": "Theo C.Mác và Ph.Ăngghen thì hình thái kinh tế - xã hội cộng sản chủ nghĩa phát triển như thế nào?", "options": [{"key": "A", "text": "Phát triển theo hình xoáy ốc"}, {"key": "B", "text": "Phát triển ý muốn chủ quan của con người"}, {"key": "C", "text": "Phát triển theo sở thích của một đấng siêu nhiên nào đó trong vũ trụ"}, {"key": "D", "text": "Phát triển từ thấp lên cao"}], "answer": ["D"], "note": "", "block": 6}, {"id": 283, "text": "Để các nước đang trong thời kỳ quá độ lên chủ nghĩa xã hội xây dựng được cơ sở kinh tế vững mạnh, chế độ chính trị xã hội ngày càng được củng cố vững chắc thì cần phải có sự liên minh của những lực lượng nào?", "options": [{"key": "A", "text": "Giai cấp công nhân, giai cấp nông dân, tầng lớp nhân dân lao động khác"}, {"key": "B", "text": "Giai cấp nông dân, giai cấp tư sản, chính quyền"}, {"key": "C", "text": "Giai cấp nông dân, đội ngũ trí thức, đội ngũ doanh nghiệp"}, {"key": "D", "text": "Giai cấp công nhân, đội ngũ trí thức, đội ngũ doanh nghiệp"}], "answer": ["A"], "note": "", "block": 6}, {"id": 284, "text": "Vấn đề: \"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh\" là đặc trưng thứ mấy trong 08 đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam? (Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội bổ sung, phát triển năm 2011)", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "3"}, {"key": "C", "text": "6"}, {"key": "D", "text": "8"}], "answer": ["A"], "note": "", "block": 6}, {"id": 285, "text": "Mâu thuẫn cơ bản của hình thái kinh tế - xã hội tư bản chủ nghĩa biểu hiện về mặt xã hội là:(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Mâu thuẫn xung đột lợi ích của các nhà tư sản khác nhau"}, {"key": "B", "text": "Cuộc đấu tranh của giai cấp công nhân chống lại giai cấp tư sản ngày càng gay gắt"}, {"key": "C", "text": "Cuộc cạnh tranh giành việc làm của những người công nhân để tránh không bị thất nghiệp"}, {"key": "D", "text": "Cuộc đấu tranh giành quyền điều hành quốc gia của các đáng phải tư sản"}], "answer": ["B"], "note": "", "block": 6}, {"id": 286, "text": "Trong thời đại ngày nay ở Việt Nam, đội ngũ công nhân trong thành phần kinh tế nào là tiêu biểu, đóng vai trò nòng cốt và chủ đạo?", "options": [{"key": "A", "text": "Thành phần kinh tế tư nhân"}, {"key": "B", "text": "Thành phần kinh tế tập thế"}, {"key": "C", "text": "Thành phần kinh tế nhà nước"}, {"key": "D", "text": "Thành phần kinh tế có Vốn đầu tư nước ngoài"}], "answer": ["C"], "note": "", "block": 6}, {"id": 287, "text": "Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam mang bản chất giai cấp của giai cấp nào?", "options": [{"key": "A", "text": "Công nhân"}, {"key": "B", "text": "Nông dân"}, {"key": "C", "text": "Tư sản"}, {"key": "D", "text": "Tri thức"}], "answer": ["A"], "note": "", "block": 6}, {"id": 288, "text": "Cơ cấu xã hội ở Việt Nam muốn biến đổi theo hướng tích cực phải dựa trên cơ sở gì?", "options": [{"key": "A", "text": "Tăng trưởng kinh tế bảng moi giá"}, {"key": "B", "text": "Sư giàu mạnh của các tố chức, tập đoàn kinh tế lớn, canh tranh được với nước ngoài"}, {"key": "C", "text": "Sự phát triển của thành phần kinh tế nhà nước và tập thể"}, {"key": "D", "text": "Tăng trưởng, phát triển kinh tế nhanh và bền vững"}], "answer": ["D"], "note": "", "block": 6}, {"id": 289, "text": "Cơ sở để xác định thời đại và phân chia thời đại là gì?", "options": [{"key": "A", "text": "Hình thái kinh tế - xã hội và vị trí của một giai cấp đứng ở vị trí trung tâm"}, {"key": "B", "text": "Vị trí của một giai cấp đứng ở vị trí trung tâm"}, {"key": "C", "text": "Sư phát triển của lực lượng sản xuất và một quan hệ sản xuất phù hợp"}, {"key": "D", "text": "Cách mạng xã hội chủ nghĩa do giai cấp công nhân lãnh đạo thành công"}], "answer": ["A"], "note": "", "block": 6}, {"id": 290, "text": "Chính sách dân tộc của nước ta hiện nay giải quyết văn đề văn hóa của các dân tộc như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tăng cường phát huy văn hóa tiên tiến của đồng bảo dân tộc Kinh, vì chiếm đa số trong xã hội"}, {"key": "B", "text": "Loại bỏ các giá trị văn hóa truyền thông của các dân tộc thiểu sỡ đẽ phù hợp hơn với thời đai"}, {"key": "C", "text": "Giữ gìn và phát huy giá trị văn hóa truyền thống của các tộc người, phát triễn ngôn ngữ, nâng cao trình độ văn hóa cho nhân dân các dân tộc"}, {"key": "D", "text": "Tăng cường cải tạo văn hóa của các dân tộc để thống nhất chung một bản sắc văn hóa Việt Nam"}], "answer": ["C"], "note": "", "block": 6}, {"id": 291, "text": "Đúng hay sai khi cho rằng dân chủ ở nước ta là mọi công dân đều có quyền tự do tuyệt đối trong tất cả các mặt của đời sống xã hội mà không cần phải tuân theo bất kì điều gì?", "options": [{"key": "A", "text": "Đúng, dân chủ thật sự phải thực hiện được mọi nguyện vọng của bất kì người dân nào"}, {"key": "B", "text": "Không, đó là hệ giá trị dân chủ rộng rãi nhất mà nhân loại hướng tới, nhưng hiện tại ở nước ta chưa đạt tới trình độ đó"}, {"key": "C", "text": "Không đúng, dân chủ phải trong khuôn khổ của kỷ cương, pháp luật"}, {"key": "D", "text": "Không có đáp án nào dùng"}], "answer": ["C"], "note": "", "block": 6}, {"id": 292, "text": "Theo nghĩa rộng, khái niệm dân tộc dùng để chỉ:", "options": [{"key": "A", "text": "Một quốc gia, toàn bộ nhân dân của một nước"}, {"key": "B", "text": "Một dân tộc cụ thể cùng chung sống trong một lãnh thổ quốc gia nhất định"}, {"key": "C", "text": "Tất cả các quốc gia đang sinh sống trên trái đất"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 6}, {"id": 293, "text": "Đâu không phải là một trong những loại của cơ cấu xã hội?", "options": [{"key": "A", "text": "Cơ cấu xã hội - giai Cấp"}, {"key": "B", "text": "Cơ Cấu xã hội - nghề nghiệp"}, {"key": "C", "text": "Cơ Cấu xã hội - hạ tầng"}, {"key": "D", "text": "Cơ cấu xã hội - tôn giáo"}], "answer": ["C"], "note": "", "block": 6}, {"id": 294, "text": "Gia đình được hình thành, củng cố và duy trì dựa trên mối quan hệ nào? (chọn 3 đáp án)(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Quan hệ hôn nhân"}, {"key": "B", "text": "Quan hệ huyết thống"}, {"key": "C", "text": "Quan hệ nuôi dưỡng"}, {"key": "D", "text": "Quan hệ kinh tế"}], "answer": ["A", "B", "C"], "note": "", "block": 6}, {"id": 295, "text": "Cơ Cấu xã hội - giai Cấp của nước ta trong thời kì quá độ lên chủ nghĩa xã hội hiện nay bao gồm những giai cấp, tầng lớp cơ bản nào? (chọn 3)", "options": [{"key": "A", "text": "Giai Cấp công nhân"}, {"key": "B", "text": "Giai Cấp nông dân"}, {"key": "C", "text": "Đội ngũ trí thức và đội ngũ doanh nhân"}, {"key": "D", "text": "Đội ngũ trí thức và đội ngũ đảng viên"}], "answer": ["A", "B", "C"], "note": "", "block": 6}, {"id": 296, "text": "Đâu không phải là một trong những điều kiện kinh tế - xã hội cho sự ra đời của chủ nghĩa xã hội khoa học?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Các thành tựu khoa học tự nhiên của nhân loại thế kỉ XIX"}, {"key": "B", "text": "Sự xuất hiện của nền đại công nghiệp"}, {"key": "C", "text": "Sự ra đời của hai giai Cấp: giai Cấp tư sản và giai Cấp vô sản"}, {"key": "D", "text": "Phong trào đấu tranh của giai cấp vô sản chống lại sự thống trị áp bức của giai cấp tư sản"}], "answer": ["A"], "note": "", "block": 6}, {"id": 297, "text": "Trong một quốc gia đa tộc người thì văn đề gì cần giải quyết được coi là có ý nghĩa cơ bản nhất để thực hiện quyền bình đẳng giữa các dân tộc?", "options": [{"key": "A", "text": "Ban hành hệ thống hiến pháp và pháp luật về quyền bình đẳng giữa các dân tộc"}, {"key": "B", "text": "Nâng cao trình độ dân trí, văn hoá cho động bảo"}, {"key": "C", "text": "Chống tư tưởng phân biệt chủng tộc, kì thị và chia rẽ dân tộc"}, {"key": "D", "text": "Xoá bỏ dần sư chênh lệch Về mọi mặt giữa các dân tộc do lịch sử đế lại"}], "answer": ["D"], "note": "", "block": 6}, {"id": 298, "text": "Nếu trước kia, gia đình Việt Nam tiêu dùng sản phẩm do mình làm ra là chính, thì hiện nay, gia tỉnh Việt Nam đang tiến tới xu hướng tiêu dùng chủ yếu nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Xu hướng sử dụng hàng hóa, dịch vụ của phúc lợi Nhà nước"}, {"key": "B", "text": "Xu hướng tiêu dùng sản phẩm do người khác làm ra"}, {"key": "C", "text": "Xu hướng tiêu dùng sản phẩm nước ngoài"}, {"key": "D", "text": "Tiêu dùng sản phẩm được cấp phát"}], "answer": ["B"], "note": "", "block": 6}, {"id": 299, "text": "Tư tưởng xã hội chủ nghĩa là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Là một hệ thống những quan niệm phản ánh những nhu cầu, những ước mơ, nguyện vọng của các giai cấp lao động về một xã hội không có áp bức và bóc lột, mọi người đều bình đẳng và có cuộc sống ấm no, hạnh phúc."}, {"key": "B", "text": "Là những thành tựu của con người đạt được trong quá trình đấu tranh giải phóng giai cấp."}, {"key": "C", "text": "Là chế độ xã hội không có áp bức bóc lột, mọi người đều bình đẳng tự do."}, {"key": "D", "text": "Cả a, b, c"}], "answer": ["D"], "note": "", "block": 6}, {"id": 300, "text": "Tai sao trong thời gian đầu, giai Cấp công nhân Việt Nam chậm phát triển?", "options": [{"key": "A", "text": "Vi sinh ra và lớn lên ở một nước thuộc địa, nứa phong kiến dưới ách thống trị của thưc dân Pháp"}, {"key": "B", "text": "Vì lưc lượng không thưc sự đông đảo"}, {"key": "C", "text": "Vì không có tinh thần kỷ luật và cách mạng triệt đế như đặc điếm chung của giai Cấp công nhân các nước\ntư bản phát triễn"}, {"key": "D", "text": "Vì chưa có tinh thần đấu tranh giai cấp, đấu tranh giải phóng dân tộc"}], "answer": ["A"], "note": "", "block": 6}, {"id": 301, "text": "Nhiệm vụ Cấp bách, lâu dài của quá trình xây dựng Nhà nước pháp quyền xã hội chủ nghĩa ở nước ta là:", "options": [{"key": "A", "text": "Phòng chống tham nhũng, lãng phí và thực hành tiết kiệm"}, {"key": "B", "text": "Miễn nhiệm những người không hoàn thành nhiệm vụ"}, {"key": "C", "text": "Nâng cao chất lượng đội ngũ cán bộ, công chức"}, {"key": "D", "text": "Có chính sách đãi ngộ, động viên, khuyến khích cán bộ, công chức"}], "answer": ["A"], "note": "", "block": 7}, {"id": 302, "text": "Khác biệt Về sự ra đời của hình thái kinh tế - xã hội cộng sản chủ nghĩa với sự ra đời của các hình thái kinh tế-xã hội trước đây là gì?", "options": [{"key": "A", "text": "Phải được thực hiện thông qua cuộc cách mạng vô sản"}, {"key": "B", "text": "Phải được thưc hiện thông qua cuộc cách mạng tư sản"}, {"key": "C", "text": "Phải được thưc hiện thông qua một sự cải biến sâu sắc về trình độ phát triển của công nghiệp và người lao động"}, {"key": "D", "text": "Phải có sự hội tụ đầy đủ các yếu tố Về kinh tế và chính trị"}], "answer": ["A"], "note": "", "block": 7}, {"id": 303, "text": "Trong thời kì quá độ lên chủ nghĩa xã hội, vấn đề tín ngưỡng và tôn giáo của nhân dân cần được giải quyết trên cơ sở nguyên tắc nào?", "options": [{"key": "A", "text": "Hạn chế sự tham gia vào tôn giáo của nhân dân bằng các chính sách xã hội, không can thiệp bằng mệnh lệnh hành chính"}, {"key": "B", "text": "Quyền tự do tín ngưỡng, tôn giáo được tôn trong và bảo vệ, không ai có quyền can thiệp bằng bất cứ hình thức nào"}, {"key": "C", "text": "Nhà nước liên hiệp với giáo hội các tôn giáo để đĩệu chính họ theo hướng duy vật, vô thần dần dần theo thời gian"}, {"key": "D", "text": "Có những ưu tiên đối với công dân không theo bất cứ tôn giáo nào"}], "answer": ["B"], "note": "", "block": 7}, {"id": 304, "text": "Về mặt lý thuyết, con đường cách mạng vô sản nào có thể tiến hành, nhưng vô cùng hiếm, quý và chưa từng xảy ra trên thực tế?", "options": [{"key": "A", "text": "Con đường bao lưc cách mang"}, {"key": "B", "text": "Con đường hòa bình"}, {"key": "C", "text": "Con đường khởi nghĩa Vũ trang"}, {"key": "D", "text": "Con đường bạo động lật đổ"}], "answer": ["B"], "note": "", "block": 7}, {"id": 305, "text": "Thực chất của thời kỳ quá độ lên chủ nghĩa xã hội là gì?", "options": [{"key": "A", "text": "Là thời kỳ cải biến cách mạng từ xã hội tiền tư bản và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa"}, {"key": "B", "text": "Là thời kỳ cải biến cách mang từ xã hội công sản nguyên thủy lên xã hội xã hội chủ nghĩa"}, {"key": "C", "text": "Là thời kỳ cải biển cách mạng tư xã hội chiếm hữu nô lệ lên xã hội xã hội chủ nghĩa"}, {"key": "D", "text": "Là thời kỳ Cải biến cách mạng từ xã hội xã hội chủ nghĩa lên xã hội cộng sản chủ nghĩa"}], "answer": ["A"], "note": "", "block": 7}, {"id": 306, "text": "Nâng cao chất lượng đội ngũ cán bộ, công chức về những phẩm chất nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Bản lĩnh kinh tế, phẩm chất đạo đức, nấng lưc lãnh đạo, điều hành quản lý đất nước"}, {"key": "B", "text": "Bản lĩnh chính trị, phẩm chất đạo đức, năng lực lãnh đạo, điều hành quản lý đất nước"}, {"key": "C", "text": "Bản lĩnh quốc phòng, phẩm chất đạo đức, năng lưc lãnh đạo, điều hành quản lý đất nước"}, {"key": "D", "text": "Bản lĩnh xã hội, phẩm chất đạo đức, năng lực lãnh đạo, điều hành quản lý đất nước"}], "answer": ["B"], "note": "", "block": 7}, {"id": 307, "text": "Trong thời đại hiện nay, sứ mệnh lịch sử của giai Cấp công nhân trong lĩnh vực văn hóa, tư tưởng là gì?", "options": [{"key": "A", "text": "Đấu tranh bảo Vệ nền tảng tư tưởng của Đảng Cộng sản, giáo dục nhận thức và cũng có nẽm tin khoa học đoi vôi lí tưởng, muc tiêu của chủ nghĩa xã hội"}, {"key": "B", "text": "Tuyên truyền cho quần chúng lao động vệ hệ tư tướng Mác - Lênin đê tiến đến chủ nghĩa cộng sản"}, {"key": "C", "text": "Xét lại, bổ sung chủ nghĩa Mác - Lênin để dung hợp với các học thuyết tư sản mới"}, {"key": "D", "text": "Tất Cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 7}, {"id": 308, "text": "Tính quần chúng của tôn giáo cho thấy điều gì?", "options": [{"key": "A", "text": "Tôn giáo là một hiện tượng cứu rồi dành cho những người yếu thế trong xã hội"}, {"key": "B", "text": "Tôn giáo là một hiện tượng xã hội phổ biến ở tất cả các quốc gia, dân tộc và châu lục"}, {"key": "C", "text": "Tôn giáo tồn tại trong suốt hàng nghìn năm lịch sử và được quần chúng nhân dân xây dựng và phát triển"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["B"], "note": "", "block": 7}, {"id": 309, "text": "Chức năng văn hóa của gia đình thể hiện điều gì?", "options": [{"key": "A", "text": "Gia đình là nơi lưu giữ truyền thống văn hóa của dân tộc, là nơi sáng tạo và thụ hưởng những giá trị văn hóa của xã hội"}, {"key": "B", "text": "Gia đình là nơi chịu sự chi phối, chế ước của các yếu tố văn hóa cũ và mới đan xen"}, {"key": "C", "text": "Gia đình là nơi thực thi các chính sách văn hóa, mang đậm dấu ấn của giai cấp thống trị"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 7}, {"id": 310, "text": "Tại đại hội X, theo quan điểm của đảng cộng sản Việt Nam, quá độ lên chủ nghĩa xã hội bộ qua chế độ tư bản chủ nghĩa là:", "options": [{"key": "A", "text": "Con đường cách mạng chủ quan, con đường xây dựng đất nước trong thời kỳ quá độ lên chủ nợía xă hội ở nước ta"}, {"key": "B", "text": "Con đường cách mạng tất yếu khách quan, con đường xây dựng đất nước trong thời kỳ quá độ lên phong kiến ở nước ta"}, {"key": "C", "text": "Con đường cách mạng tất yếu khách quan, con đường xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta"}, {"key": "D", "text": "Con đường mong muốn riêng của đất nước ta"}], "answer": ["C"], "note": "", "block": 7}, {"id": 311, "text": "Quá độ từ chủ nghĩa tư bản phát triển lên chủ nghĩa xã hội là hình thức quá độ nào?", "options": [{"key": "A", "text": "Quá độ gián tiếp"}, {"key": "B", "text": "Quá độ trực tiếp"}, {"key": "C", "text": "Quá độ bộ Phản"}, {"key": "D", "text": "Quá độ toàn diện"}], "answer": ["B"], "note": "", "block": 7}, {"id": 312, "text": "Đâu không phải là một trong những nhiệm vụ của các chính sách liên quan đến cơ cấu xã hội giai cấp?", "options": [{"key": "A", "text": "Giải quyết tốt các mối quan hệ nội bộ từng giai Cấp"}, {"key": "B", "text": "Hướng tới đảm bảo công bằng Xã hội, thu hẹp dần khoảng cách phát triển và sự phân hóa giàu nghèo giữa các giai Cấp, tầng lớp"}, {"key": "C", "text": "Giải quyết tốt các mối quan hệ giữa giai Cấp, tầng lớp này với giai Cấp, tầng lớp khác"}, {"key": "D", "text": "Tạo điều kiện thuận lợi để các giai Cấp công nhân có thể cạnh tranh tốt trên tất cả các lĩnh vực của đời sống xã hội"}], "answer": ["D"], "note": "", "block": 7}, {"id": 313, "text": "Thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội còn tồn tại nhiều tư tưởng khác nhau, chủ yếu là:(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tư tưởng vô sản và tư tưởng tư sản"}, {"key": "B", "text": "Tư tưởng vô sản và tư tưởng đia chủ phong kiến"}, {"key": "C", "text": "Tư tưởng chủ nó và tư tưởng tư sản"}, {"key": "D", "text": "Tư tưởng vô sản và tư tưởng chủ nô"}], "answer": ["A"], "note": "", "block": 7}, {"id": 314, "text": "Trong thời đại hiện nay, hao phí lao động chủ yếu của giai Cấp công nhân đã biến đổi như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giảm bớt hao phí sức lực cơ bắp, gia tăng hao phí về trí lực"}, {"key": "B", "text": "Đồng thời gia tăng cả hao phí sức lực và trí lực"}, {"key": "C", "text": "Gia tăng yếu tố tâm lực trong quá trình lao động"}, {"key": "D", "text": "Giảm bớt hao phí về trí lực, gia tăng hao phí sức lực"}], "answer": ["A"], "note": "", "block": 7}, {"id": 315, "text": "Trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay, giai cấp, tầng lớp nào có nhiệm vụ phát huy bản sắc văn hóa dân tộc và bảo vệ môi trường sinh thái?", "options": [{"key": "A", "text": "Giai Cấp công nhân"}, {"key": "B", "text": "Giai cấp nông dân"}, {"key": "C", "text": "Tầng lớp trí thức"}, {"key": "D", "text": "Đội ngũ doanh nhân"}], "answer": ["B"], "note": "", "block": 7}, {"id": 316, "text": "Với tư cách là một hình thái nhà nước, một chế độ chính trị, cho đến nay đã có những nền dân chủ nào đã và đang tồn tại? (chọn 3)", "options": [{"key": "A", "text": "Dân chủ chủ nô"}, {"key": "B", "text": "Dân chủ tư sản"}, {"key": "C", "text": "Dân chủ xã hội chủ nghĩa"}, {"key": "D", "text": "Dân chủ cộng sản chủ nghĩa"}], "answer": ["A", "B", "C"], "note": "", "block": 7}, {"id": 317, "text": "Điểm tương đồng giữa giáo dục gia đình truyền thông và giáo dục gia đình trong xã hội mới của Việt Nam hiện nay là gì?", "options": [{"key": "A", "text": "Tinh thần cô kết làng xã"}, {"key": "B", "text": "Nhấn mạnh sự hy sinh của cá nhân cho cộng đồng"}, {"key": "C", "text": "Ý thức vươn lên làm giàu"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["B"], "note": "", "block": 7}, {"id": 318, "text": "Các quy chế dân chủ từ cơ sở đến Trung ương và trong các tổ chức chính trị- xã hội ở nước ta đều thực hiện theo phương châm nào?", "options": [{"key": "A", "text": "Dân biết, dân bàn, dân kiểm tra, dân hưởng thụ"}, {"key": "B", "text": "Dân bàn, dân kiểm tra, dân làm, dân hưởng thụ"}, {"key": "C", "text": "Dân biết, dân bàn, dân làm, dân kiểm tra"}, {"key": "D", "text": "Dân bàn, dân làm, dân kiểm tra"}], "answer": ["C"], "note": "", "block": 7}, {"id": 319, "text": "Bản chất tư tưởng - văn hóa - xã hội của nền dân chủ xã hội chủ nghĩa là gì?", "options": [{"key": "A", "text": "Lấy hệ tư tưởng Mác - Lênin làm chủ đạo, kế thừa, phát huy tinh hoa truyền thống dân tộc và những giá trị tư tưởng - văn hóa văn minh, tiến bộ nhân loại"}, {"key": "B", "text": "Lấy hệ tư tưởng Mác - Lênin làm chủ đạo, kế thừa, phát huy toàn bộ tư tưởng - văn hóa nhân loại"}, {"key": "C", "text": "Lấy hệ tư tưởng Mác - Lênin làm hệ tư tưởng chính trị, kế thừa toàn bộ những yếu tố truyền thống của dân tộc"}, {"key": "D", "text": "Lấy hệ tư tưởng Mác - Lênin làm chủ đạo, kế thừa truyền thống tốt đẹp của dân tộc, ngăn chặn yếu tố ngoại lai xâm phạm"}], "answer": ["A"], "note": "", "block": 7}, {"id": 320, "text": "Đáp án nào không phải là một giải pháp nhằm cải cách thể chế và phương thức hoạt động của Nhà nước xã hội chủ nghĩa Việt Nam?", "options": [{"key": "A", "text": "Kiện toàn tổ chức, đổi mới phương thức và nâng cao hiệu quả hoạt động của Quốc hội"}, {"key": "B", "text": "Đẩy mạnh cải cách hành chính, giảm bớt và bãi bỏ các thủ tục hành chính gây phiền hà cho tổ chức và công dân"}, {"key": "C", "text": "Đẩy mạnh xã hội hóa các ngành dịch vụ công phù hợp với cơ chế thị trường định hướng xã hội chủ nghĩa"}, {"key": "D", "text": "Củng cố và nâng cao quyền lãnh đạo của Đảng Cộng sản Việt Nam đối với bộ máy nhà nước"}], "answer": ["D"], "note": "", "block": 7}, {"id": 321, "text": "Yếu tố nào quyết định sự liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Do có những lợi ích cơ bản thống nhất với nhau"}, {"key": "B", "text": "Do giai cấp công nhân mong muốn"}, {"key": "C", "text": "Do có cùng một kẻ thù là giai cấp tư sản"}, {"key": "D", "text": "Do mục tiêu về chính trị của giai cấp công nhân"}], "answer": ["A"], "note": "", "block": 7}, {"id": 322, "text": "Ở nước ta, các dân tộc thiểu số phân bố chủ yếu ở các địa bàn có đặc điểm như thế nào?", "options": [{"key": "A", "text": "Có vị trí chiến lược quan trọng"}, {"key": "B", "text": "Có điều kiện phát triển kinh tế - xã hội tốt nhất"}, {"key": "C", "text": "Ở đồng bằng trù phú"}, {"key": "D", "text": "Ở các hải đảo xa xôi"}], "answer": ["A"], "note": "", "block": 7}, {"id": 323, "text": "Cơ cấu xã hội là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Là những cộng đồng người hợp thành một chế độ xã hội"}, {"key": "B", "text": "Là những người trong cùng một giai cấp, tầng lớp thực hiện phần chia quyền lực"}, {"key": "C", "text": "Là những cộng đồng người cùng toàn bộ những mối quan hệ xã hội do sự tác động lẫn nhau của các cộng đồng ấy tạo nên"}, {"key": "D", "text": "Là những cộng đồng người cùng toàn bộ những mối quan hệ xã hội do sự tác động của cộng đồng người ấy với tự nhiên tạo nên"}], "answer": ["C"], "note": "", "block": 7}, {"id": 324, "text": "Đặc trưng bản chất của chủ nghĩa xã hội về phương diện kinh tế là gì? Chọn các đáp án đúng.", "options": [{"key": "A", "text": "Nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại"}, {"key": "B", "text": "Chế độ công hữu vẽ tư liệu sản xuất chủ yếu"}, {"key": "C", "text": "Nên kinh tế phát triển cao dựa trên lực lượng sản xuất công nghiệp cơ khí"}, {"key": "D", "text": "Chế độ sở hữu tập thể, hỗn hợp của tư nhân và công cộng"}], "answer": ["A", "B"], "note": "(Nếu chọn 1 thì chọn A)", "block": 7}, {"id": 325, "text": "Nội dung cơ bản của dân chủ về phương diện quyền lực là gì?", "options": [{"key": "A", "text": "Là quyền lực thuộc về nhân dân, nhân dân là chủ nhân của nhà nước"}, {"key": "B", "text": "Là một hình thái nhà nước"}, {"key": "C", "text": "Là một nguyên tắc tố chức xã hội"}, {"key": "D", "text": "Là quyền thống trị của nhân dân trong lĩnh vực kinh tế"}], "answer": ["A"], "note": "", "block": 7}, {"id": 326, "text": "Tại sao nói giai cấp công nhân là giai cấp có tinh thần cách mạng triệt để nhất?", "options": [{"key": "A", "text": "Vì giai cấp công nhân có lợi ích cơ bản thống nhất với đại đa số nhân dân lao động, có sứ mệnh lịch sử xóa bò mọi chế độ bóc lột, bất công"}, {"key": "B", "text": "Vì giai cấp công nhân là giai cấp đông đào nhất trong xã hội"}, {"key": "C", "text": "Vì giai cấp công nhân là giai cấp duy nhất bị bóc lột và có mâu thuẫn đối kháng trực tiếp với giai cấp thống trị"}, {"key": "D", "text": "Vì giai cấp công nhân được lãnh đạo bởi Đảng Cộng sản"}], "answer": ["A"], "note": "", "block": 7}, {"id": 327, "text": "Tôn trọng tự do tín ngưỡng cũng chính là tôn trọng vấn đề gì?", "options": [{"key": "A", "text": "Tôn trọng xã hội"}, {"key": "B", "text": "Tôn trọng pháp luật"}, {"key": "C", "text": "Tôn trọng quyền con người"}, {"key": "D", "text": "Tôn trọng tôn giáo"}], "answer": ["C"], "note": "", "block": 7}, {"id": 328, "text": "Theo quan điểm của Đảng công sản Việt Nam, quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa đòi hỏi phải:", "options": [{"key": "A", "text": "Tiếp thu, kế thừa những thành tựu mà nhân loại đã đạt được dưới chủ nghĩa tư bản"}, {"key": "B", "text": "Tiếp thu, kế thừa những thành tựu mà chế độ phong kiến đã đạt được"}, {"key": "C", "text": "Bò qua những thành tựu mà nhân loại đã đạt được trong chủ nghĩa tư bản"}, {"key": "D", "text": "Loại bỏ tất cả những gì có liên quan đến chủ nghĩa tư bản"}], "answer": ["A"], "note": "", "block": 7}, {"id": 329, "text": "Thuật ngữ \"dân chủ\" được ra đời khi nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Thế ký VI - VIII"}, {"key": "B", "text": "Thế kỷ VII - VI trước Công nguyên"}, {"key": "C", "text": "Thế kỳ V - IV trước Công nguyên"}, {"key": "D", "text": "Thế kỳ XXI"}], "answer": ["B"], "note": "", "block": 7}, {"id": 330, "text": "Theo quan điểm của chủ nghĩa Mác - Lênin, tôn giáo có các nguồn gốc nào? Chọn các đáp án đúng. (3 đáp án)", "options": [{"key": "A", "text": "Nguồn gốc tự nhiên, kinh tế - xã hội"}, {"key": "B", "text": "Nguồn gốc nhận thức"}, {"key": "C", "text": "Nguồn gốc tâm lý"}, {"key": "D", "text": "Nguồn gốc siêu nhiên"}], "answer": ["A", "B", "C"], "note": "", "block": 7}, {"id": 331, "text": "Hai yếu tố nào cầu thành cơ sở của lịch sử chính trị và lịch sử tư tưởng của thời đại?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chính trị xã hội và văn hóa"}, {"key": "B", "text": "Cơ sở hạ tầng và kiến trúc thượng tầng"}, {"key": "C", "text": "Sản xuất kinh tế và cơ cấu xã hội"}, {"key": "D", "text": "Lực lượng sản xuất và quan hệ sản xuất"}], "answer": ["C"], "note": "", "block": 7}, {"id": 332, "text": "Đặc trưng bản chất nào của chủ nghĩa xã hội thể hiện đây là chế độ xã hội vì con người, do con người?", "options": [{"key": "A", "text": "Chủ nghĩa xã hội có nên kinh tế phát triển cao, dựa trên chế độ tư hữu về tư liệu sản xuất chủ yếu"}, {"key": "B", "text": "Chủ nghĩa xã hội là chế độ xã hội do nhân dân lao động làm chủ"}, {"key": "C", "text": "Chủ nghĩa xã hội giài phóng giai cấp công nhân, nhân dân lao động và đông thời đàn áp giai cấp thống trị tàn bạo là giai cấp tư sản"}, {"key": "D", "text": "Chủ nghĩa xã hội có nhà nước kiểu mới mang bản chất giai cấp công nhân, đại biểu cho lợi ích, quyền lực và ý chí của riêng giai cấp công nhân"}], "answer": ["B"], "note": "", "block": 7}, {"id": 333, "text": "Đâu là một trong những phương hướng cơ bản xây dựng và phát triển gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Tiếp tục phát triển và nâng cao chất lượng phong trào xây dựng gia đình văn hóa"}, {"key": "B", "text": "Xây dựng gia định văn hóa, bình đẳng giới, con cái được học hành"}, {"key": "C", "text": "Gia đình từ một đến hai con, ấm no, hạnh phúc"}, {"key": "D", "text": "Mọi thành viên trong gia đình phải tôn trong, phát huy quyền làm chủ trong gia định"}], "answer": ["A"], "note": "", "block": 7}, {"id": 334, "text": "Giai cấp nào là đại biểu cho lực lượng sản xuất tiên tiến, cho phương thức sản xuất hiện đại?", "options": [{"key": "A", "text": "Tư sản"}, {"key": "B", "text": "Nông dân"}, {"key": "C", "text": "Công nhân"}, {"key": "D", "text": "Thống trị"}], "answer": ["C"], "note": "", "block": 7}, {"id": 335, "text": "Để giai cấp công nhân phát triển cả về số lượng và chất lượng, theo chủ nghĩa Mác - Lênin phải đặc biệt chú ý đến biện pháp nào?", "options": [{"key": "A", "text": "Phát triển công nghiệp và sự trưởng thành của Đảng Cộng sản"}, {"key": "B", "text": "Phát triển công - nông nghiệp phù hợp"}, {"key": "C", "text": "Kết nạp ngày càng nhiêu các giai cấp, tầng lớp lao động khác vào hàng ngũ của Đảng Cộng sản để tăng trường nhanh vê số lượng"}, {"key": "D", "text": "Đẩy mạnh phong trào công nhân từ tự giác đến tự phát"}], "answer": ["A"], "note": "", "block": 7}, {"id": 336, "text": "Cơ cấu kinh tế trong thời kỳ quả độ lên chủ nghĩa xã hội ở Việt Nam tuy vận động theo cơ chế thị trường, song có sự quản lý của:", "options": [{"key": "A", "text": "Giai cấp công nhân"}, {"key": "B", "text": "Đàng Cộng sản Việt Nam"}, {"key": "C", "text": "Nhà nước pháp quyền xã hội chủ nghĩa"}, {"key": "D", "text": "Tầng lớp thống trị trong xã hội"}], "answer": ["C"], "note": "", "block": 7}, {"id": 337, "text": "Trong hệ thống chính sách xã hội, các chính sách liên quan đến vẫn để gì được đặt lên vị trí hãng đầu?", "options": [{"key": "A", "text": "Tôn giáo, y tế"}, {"key": "B", "text": "Giáo dục, y tế"}, {"key": "C", "text": "Cơ cấu xã hội - giai cấp"}, {"key": "D", "text": "Cơ cầu giai cấp, giảo dục"}], "answer": ["C"], "note": "", "block": 7}, {"id": 338, "text": "Đâu không phải là một trong những chính sách đối với giai cấp nông dân để đảm bảo sự biến đối tích cực của giai cấp này trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Hỗ trợ, khuyến khích nông dân học nghề, chuyến dịch cơ cấu lao động"}, {"key": "B", "text": "Tạo điều kiện thuận lợi để tiếp nhận và ứng dụng khoa học - công nghệ, nâng cao năng suất lao động, và từng bước công nghiệp hóa nông nghiệp"}, {"key": "C", "text": "Tạo điều kiện thuận lợi để nông dẫn chuyển sang làm công nghiệp và dịch vụ"}, {"key": "D", "text": "Ngăn chặn tinh trạng chuyển đối mục đích sử dụng đất nông nghiệp thành các mục đích khác để đảm bảo sinh kế của người nông dân"}], "answer": ["D"], "note": "", "block": 7}, {"id": 339, "text": "Việc thực hiện chức năng nào của gia đình quyết định mật độ dân cư và nguồn lực lao động của một quốc gia và quốc tế?", "options": [{"key": "A", "text": "Chức năng kinh tế và tố chức tiêu dùng"}, {"key": "B", "text": "Chức năng định cư"}, {"key": "C", "text": "Chức năng tái sản xuất ra con người"}, {"key": "D", "text": "Chức năng giáo dục, nuôi dưỡng"}], "answer": ["C"], "note": "", "block": 7}, {"id": 340, "text": "Trong thời đại hiện nay, ở các nước tư bàn chủ nghĩa, mục tiêu đấu tranh lầu dài để thực hiện sứ mệnh lịch sử của giai cấp công nhân vẽ chính trị - xã hội là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chống bất công, bất bình đẳng xã hội"}, {"key": "B", "text": "Thoa hiệp với giai cấp tư sản để tiến tối chủ nghĩa xã hội bằng con đường hòa bình"}, {"key": "C", "text": "Giảnh chính quyền về tay giai cấp công nhân và nhân dân lao động"}, {"key": "D", "text": "Đấu tranh đồi các quyền tự do, dân chủ"}], "answer": ["C"], "note": "", "block": 7}, {"id": 341, "text": "Câu nói sau đây do ai nói: \"... nếu nghĩa vụ của vợ chồng là phải thương yêu nhau thì nghĩa vụ của những kẻ yêu nhau há chẳng phải là kết hôn với nhau và không được kết hôn với người khác hay sao?\"?", "options": [{"key": "A", "text": "Ph. Ăngghen"}, {"key": "B", "text": "V.I.Lênin"}, {"key": "C", "text": "Chủ tịch Hồ Chí Minh"}, {"key": "D", "text": "C.Mác"}], "answer": ["A"], "note": "", "block": 7}, {"id": 342, "text": "Tư duy của Nhà triết học nào được xem là \"cái hạt nhân\" hợp lý của phép biện chứng?", "options": [{"key": "A", "text": "V.I.Lênin"}, {"key": "B", "text": "C.Mác"}, {"key": "C", "text": "G.V.Ph.Hêghen"}, {"key": "D", "text": "Ph. Ăngghen"}], "answer": ["C"], "note": "", "block": 7}, {"id": 343, "text": "Đâu không phải là một trong những điểm tương đối ổn định của giai cấp công nhân ngày n

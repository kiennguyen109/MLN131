 lượng sản xuất mới\nAnswer: A\n\nQuestion: 226. Điền vào chỗ trống: Kiện toàn tổ chức, đổi mới phương thức và nâng cao hiệu quả hoạt động của Quốc hội để đảm bảo đây là cơ quan...\nA. Quyền lực của nhân dân\nB. Quyền lực cao nhất của nhà nước\nC. Quyền lực cao nhất của nhân dân\nD. Quyền lực cao nhất của giai cấp\nAnswer: C\n\nQuestion: 227. Để một tôn giáo ra đời cần bao nhiêu nguồn gốc?(NHUNG HOÀNG)\n\nA. 4\n\nB. 3\n\nC. 6\n\nD. 5\nAnswer: B\n\nQuestion: 228. Đặc trưng nổi bật trong quan hệ giữa các dân tộc ở nước ta là:\nA. Là các dân tộc có bản sắc văn hoá riêng, đa dạng, phong phú\nB. Là sự phân bố đan xen nhau, không một dân tộc nào có lãnh thổ riêng\nC. Là sự cố kết dân tộc, hoà hợp dân tộc trong một cộng đồng thông nhất\nD. Là có sự chênh lệch về trình độ phát triển kinh tế - xã hội giữa các dân tộc\nAnswer: C\n\nQuestion: 229. Bản chất dân chủ xã hội chủ nghĩa ở Việt Nam được thực hiện thông qua hình thức nào? (chọn 2 câu)(NHUNG HOÀNG)\n\nA. Hình thức dân chủ trực tiếp\n\nB. Hình thức dân chủ gián tiếp\n\nC. Hình thức dân chủ đại nghị\n\nD. Hình thức dân chủ công khai\nAnswer: AB\n\nQuestion: 230. Liên Xô, Đông Âu và các nước xã hội chủ nghĩa hiện nay, đã và đang quá độ lên chủ nghĩa xã hội bằng hình thức nào?\nA. Quá độ gián tiếp\nB. Quá độ trực tiếp\nC. Quá độ bộ phận\nD. Quá độ toàn diện\nAnswer: A\n\nQuestion: 231. Trong nhà nước xã hội chủ nghĩa Việt Nam, cơ quan nào là cơ quan quyền lực nhà nước cao nhất?\nA. Chính phủ\nB. Viện kiểm sát nhân dân\nC. Tòa án nhân dân\nD. Quốc hội\nAnswer: D\n\nQuestion: 232. Thời kỳ quá độ lên chủ nghĩa xã hội là thời kỳ đấu tranh giai cấp trong điều kiện mới, điều kiện đó là gì?\nA. Đảng Cộng sản đã được thành lập, và ngày càng thể hiện vai trò lãnh đạo tích cực trong phong trào đấu tranh giành chính quyền\nB. Giai cấp tư sản đã trở thành lực lượng phản động\nC. Giai cấp công nhân và nhân dân lao động đã trở thành giai cấp cầm quyền\nD. Sự phát triển của công nghiệp hóa dẫn đến thất nghiệp tràn lan\nAnswer: C\n\nQuestion: 233. Đâu là một tôn giáo nội sinh của Việt Nam?\nA. Đạo Cao đài\nB. Tin lành\nC. Phật giáo\nD. Hội Thánh Đức chúa trời\nAnswer: A\n\nQuestion: 234. Căn cứ vào tính chất của quyền lực nhà nước, chức năng nào của nhà nước xã hội chủ nghĩa là quan trọng nhất, mang ý nghĩa then chốt, quyết định?\nA. Chức năng giai Cấp (trấn áp)\nB. Chúc năng đối nội\nC. Chức năng đối ngoại\nD. Chức năng xã hội (tổ chức và xây dựng)\nAnswer: D\n\nQuestion: 235. Đâu là các đại biểu của chủ nghĩa xã hội không tưởng phê phán Pháp? ( Chọn 3 đáp án)\nA. Xanh Ximông\nB. S. Phurie\nC. R.Oen\nD. Ph.Hêghen\nAnswer: ABC\n\nQuestion: 236. Các chủ trương, chính sách phát triển kinh tế - xã hội miền núi, vùng đồng bào các dân tộc thiểu số ở nước ta nhằm mục đích gì?\nA. Phát huy tiềm năng phát triển, rút ngắn khoảng cách chênh lệch giữa các vùng, các dân tộc\nB. Bù đắp cho đồng bào ở các nơi này để động viên họ cố gắng giữ gìn bờ cõi quốc gia\nC. Giảm thiểu sự lợi dụng điều kiện sống cực khổ của các nơi này để kích động thực hiện mưu đồ chia rẽ\nD. Tận dụng mọi nguồn lực để tăng trưởng kinh tế khi ở các vùng đồng bằng đã cạn kiệt\nAnswer: A\n\nQuestion: 237. Trong quá trình xây dựng chủ nghĩa xã hội, chủ trương bảo vệ chế độ hôn nhân một vợ, một chồng nhằm mục đích gì?(NHUNG HOÀNG)\n\na. Tất cả các đáp án đều đúng\n\nb. Điều hòa mâu thuẫn trong gia đình\n\nc. Thực hiện bình đẳng trong gia đình, giải phóng phụ nữ\n\nd. Hạn chế các tệ nạn xã hội như mại dâm, bạo lực gia đình\n\ne.Đảm bảo hiệu quả cho sự quản lý nhà nước về gia đình\nAnswer: a\n(Nếu không có a chọn c)\n\nQuestion: 238. Quá độ từ xã hội tiền tư bản chủ nghĩa phát triển lên chủ nghĩa xã hội là hình thức quá độ nào?(NHUNG HOÀNG)\n\nA. Quá độ gián tiếp\n\nB. Quá độ trực tiếp\n\nC. Quá độ bộ phận\n\nD. Quá độ toàn diện\nAnswer: A\n\nQuestion: 239. Tổ chức quyền lực của Nhà nước pháp quyền xã hội chủ nghĩa đảm bảo quyền lực nhà nước là:(NHUNG HOÀNG)\n\nA. Đồng nhât, có sự phân công và phối hợp giữa các cơ quan nhà nước\n\nB. Cùng nhau, có sự phân công và phối hợp giữa các cơ quan nhà nước\n\nC. Thống nhất, có sự phản công và phối hợp giữa các cơ quan nhà nước\n\nD. Chia đều, có sự phân công và phối hợp giữa các cơ quan nhà nước\nAnswer: C\n\nQuestion: 240. Xét trên phương diện kinh tế - xã hội, thì giai cấp nào là những người lao động trực tiếp hay gián tiếp vận hành các công cụ sản xuất có tính chất công nghiệp ngày càng hiện đại và xã hội hóa cao?\nA. Địa chủ\nB. Tư sản\nC. Công nhân\nD. Nông dân\nAnswer: C\n\nQuestion: 241. Tại sao nói gia đình là tế bào của xã hội?\nA. Vì bất kì ai cũng có gia đình riêng, có con cái và cha mẹ\nB. Tất cả các đáp án đều đúng\nC. Vì gia đình là cơ chế quản lý xã hội ở cấp độ nhỏ nhất, không thể phân chia được nữa\nD. Vì gia đình sản xuất ra tư liệu tiêu dùng, tư liệu sản xuất và tái sản xuất ra con người\nAnswer: D\n\nQuestion: 242. Những giá trị nào sau đây được nhân loại thừa nhận và phấn đấu thực hiện?\nA. Lao động, sáng tạo, công bằng, dân chủ, bình đẳng, phát triển\nB. Lao động, sáng tạo, công bằng, dân chủ, tự do\nC. Lao động, sáng tạo, công bằng, dân chủ, bình đẳng, tự do\nD. Lao động, sáng tạo, công bằng, dân chủ, bình đẳng\nAnswer: C\n\nQuestion: 243. Theo quan điểm của chủ nghĩa Mác - Lênin, từ chủ nghĩa tư bản lên chủ nghĩa xã hội tất yếu phải trải qua thời kỳ gì?(NHUNG HOÀNG)\n\nA. Phát triển của loài người\n\nB. Phát triển lực lượng sản xuất và quan hệ sản xuất\n\nC. Quá độ chính trị\n\nD. Thay đổi phương thức sản xuất\nAnswer: C\n\nQuestion: 244. Vấn đề sau đây do ai khẳng định: \"Trong mọi thời đại lịch sử, sản xuất kinh tế và cơ cấu xã hội - cơ cấu này tất yếu phải do sản xuất kinh tế mà ra, - cả hai cái đó cấu thành cơ sở của lịch sử chính trị và lịch sử tư tưởng của thời đại ấy...\"?\nA. Chủ tịch Hồ Chí Minh\nB. C.Mác\nC. Ph.Ăngghen\nD. V.I.Lênin\nAnswer: C\n\nQuestion: 245. Trong bối cảnh hội nhập kinh tế quốc tế và cạnh tranh hàng hóa trong khu vực và thế giới, kinh té gia đình gặp khó khăn, trở ngại do nguyên nhân gì?\nA. Do thói quen, tập quán an phận, ngại thay đổi của nền tảng gia đình cũ\nB. Do chính sách đều tiết của Nhà nước thúc đẩy kinh tế hộ gia đình phát triển thành doanh nghiệp\nC. Do gia đình ngày càng ít thành viên hơn\nD. Do kinh tế gia đình phần lớn có quy mô nhỏ, lao động ít, tự sản xuất là chính\nAnswer: D\n\nQuestion: 246. Các dân tộc đều có quyền và nghĩa vụ ngang nhau trên tất cả các lĩnh vực đời sống xã hội, không phân biệt dân tộc lớn hay nhỏ, trình độ phát triển cao hay thấp là quyền gì trong Cương lĩnh dân tộc của V.I.Lênin?\nA. Quyền công bằng xã hội\nB. Quyền hoàn toàn bình đẳng giữa các dân tộc\nC. Quyền dân tộc tự quyết\nD. Quyền sống, quyền tự do và quyền hạnh phúc của các dân tộc\nAnswer: B\n\nQuestion: 247. Dân chủ với tư cách là một giá trị xã hội, thì nó là:\nA. Phạm trù lịch sử, tồn tại ngoài chế độ quân chủ phong kiến\nB. Pham trù vĩnh viễn, tồn tại trong mọi chế độ xã hội\nC. Phạm trù lịch sử, mất đi khi tiến lên chủ nghĩa xã hội\nD. Pham trù lịch sử, mất đi khi nhà nước tiêu vong\nAnswer: B\n\nQuestion: 248. Sứ mệnh lịch sử thế giới của giai cấp công nhân là:\nA. Xóa bỏ sự thống trị áp bức của chủ nghĩa tự bản, xây dựng thành công chế độ xã hội mới - xã hội chủ nghĩa và cộng sản chủ nghĩa, tiến tới một xã hội không còn giai cấp\nB. Xóa bỏ sự thống trị áp bức của chế độ phong kiến, xây dựng thành công chế độ xã hội mới - xã hội chủ nghĩa và cộng sản chủ nghĩa, tiến tới một xã hội không còn giai cấp\nC. Xóa bỏ sự thống trị áp bức của chế độ công xã nguyên thủy, xây dựng thành công chế độ xã hội mới - xã hội chủ nghĩa và cộng sản chủ nghĩa, tiến tới một xã hội không còn giai cấp\nD. Xóa bỏ sự thống trị áp bức của chủ nghĩa tư bản, xây dựng thành công chế độ xã hội mới - phong kiến\nAnswer: A\n\nQuestion: 249. Vấn đề: \"Dân chủ là quyền lực thuộc về nhân dân, nhân dân là chủ nhân của nhà nước\" được đề cập trên phương diện nào theo chủ nghĩa Mác - Lênin Về dân chủ?\nA. Phương diện tổ chức và quản lý xã hội\nB. Phương diện quyền lực\nC. Phương diện chế độ xã hội và trong lĩnh vực chính trị\nD. Phương diện bảo vệ xã hội\nAnswer: B\n\nQuestion: 250. Đâu được xem là điều kiện tiên quyết để xây dựng nền dân chủ xã hội chủ nghĩa Việt Nam?\nA. Giải phóng dân tộc, giải phóng giai cấp\nB. Chăm lo giáo dục, y tế cho người dân\nC. Độc lập, tự chủ, hòa bình\nD. Xây dựng Đảng Cộng sản Việt Nam trong sạch, vững mạnh\nAnswer: D\n\nQuestion: 251. Trong thời gian qua, việc tăng cường các chương trình đào tạo quốc tế, hướng đến công dân toàn cầu, người lao động có trình độ cao thích ứng với toàn cầu hóa nằm trong giải pháp thứ mấy của các giải pháp xây dựng giai cấp công nhân hiện nay?\nA. 1\nB. 2\nC. 3\nD. 4\nAnswer: D\n\nQuestion: 252. Theo V.l.Lênin: Giai Cấp công nhân nếu không liên minh với giai cấp nào thì không thể có được chính quyền của giai cấp vô sản?\nA. Nông dân\nB. Bóc lột\nC. Tư sản\nD. Địa chủ\nAnswer: A\n\nQuestion: 253. Theo chủ nghĩa Mác - Lênin, tôn giáo là gì?\nA. Là một thiết chế xã hội phản ảnh chân thật hiện thưc khách quan\nB. Là một hình thái ý thức xã hội, phản ánh hư ảo hiện thực khách quan\nC. Là một cơ sở xã hội, phản ánh các ý chí, nguyện vọng của tin đó theo một giáo lý nào đó\nD. Là một thực thể xã hội, điều chỉnh tâm lý con người hiệu quả\nAnswer: B\n\nQuestion: 254. Đâu là một trong tám đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam được đề cập trong Văn kiện Đại hội đại biểu toàn quốc lần thứ XI của Đảng Cộng sản Việt Nam?(NHUNG HOÀNG)\n\nA. Dân giàu, nước mạnh, dân chủ, văn minh\n\nB. Dân giàu, nước mạnh, con người có cuộc sông ấm no\n\nC. Do nhân dân làm chủ\n\nD. Nhà nước pháp quyền xã hội chủ nghĩa, nhà nước của nhân dân lao động\nAnswer: C\n(-Một là: Dân giàu, nước mạnh, dân chủ, công bằng, văn minh.\n-Hai là: Do nhân dân làm chủ.\n-Ba là: Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại vàquan hệ sản xuất tiến bộ phù hợp.\n-Bốn là: Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc.\n-Năm là: Con người có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện pháttriển toàn diện.\n-Sáu là: Các dân tộc trong cộng đồng Việt Nam bình đẳng, đoàn kết, tôn trọngvà giúp nhau cùng phát triển.\n-Bảy là: Có Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân,vì nhân dân do Đảng Cộng sản lãnh đạo.\n-Tám là: Có quan hệ hữu nghị và hợp tác với các nước trên thế giớ)\n\nQuestion: 255. Nhà nước Xã hội chủ nghĩa là nhà nước của\nA. Thiểu số thống trị đa Số\nB. Đa số thống trị thiểu số\nC. Sự dung hòa lợi ích các giai cấp\nD. Sự đấu tranh quyền lực trong bối cảnh mới\nAnswer: B\n\nQuestion: 256. Trong thời kì quá độ lên chủ nghĩa xã hội, bên cạnh sự liên minh chặt chẽ trên cơ sở thống nhất lợi ích kinh tế giữa giai cấp công nhân, nông dân và trí thức, còn xuất hiện vấn đề gì?\nA. Xuất hiện những mâu thuẫn lợi ích ở những mức độ khác nhau\nB. Xuất hiện sự đấu tranh kịch liệt trong hệ thống chuyên chính vô sản\nC. Xuất hiện sự chống phá của các giai cấp trong liên minh\nD. Xuất hiện sự chuyên quyền, độc đoán của một bộ phận\nAnswer: A\n\nQuestion: 257. Quá trình phát triển của nền dân chủ xã hội chủ nghĩa được diễn ra như thế nào?\nA. Từ thấp đến cao, từ chưa hoàn thiện đến hoàn thiện\nB. Từ thấp đến cao, từ đơn giản đến phức tạp\nC. Từ thấp đến cao, diễn ra khó khăn\nD. Từ thấp đến cao, diễn ra một cách từ từ\nAnswer: A\n\nQuestion: 258. Theo V.I.Lênin, mục đích cao cả nhất mà chủ nghĩa xã hội cần đạt đến là gì? ( Choose 3 answers)\nA. Xóa bỏ sự phân chia xã hội thành giai cấp\nB. Biến tất cả thành viên trong xã hội thành người lao động\nC. Tiêu diệt cơ sở của mọi tình trạng người bóc lột người\nD. Thiết lập quyền thống trị xã hội của giai cấp công nhân và nhân dân lao động\nAnswer: ABC\n\nQuestion: 259. Gia đình văn hóa là một mô hình gia đình như thế nào?\nA. Phát triển\nB. Tiến bộ\nC. Huyết thống\nD. Không được bảo vệ\nAnswer: B\n\nQuestion: 260. Hôn nhân một vợ một chồng xuất hiện lần đầu tiên khi nào?\nA. Khi có sự thắng lợi của chế độ tư hữu đối với chế độ công hữu nguyên thủy\nB. Khi có sự thắng thế của chế độ tư bản đối với chế độ phong kiến\nC. Khi các quốc gia bước vào thời kỳ quá độ lên chủ nghĩa xã hội\nD. Khi con người xuất hiện\nAnswer: A\n\nQuestion: 261. \"Sống có việc làm hay là chết trong đấu tranh\" là khẩu hiệu của giai cấp công nhân ở đâu?\nA. Công xã Pari\nB. Vương Quôc Anh\nC. Đức\nD. Nhà máy dệt Lion\nAnswer: D\n\nQuestion: 262. Vấn đề chiến lược, cơ bản, lâu dài và cấp bách trong việc giải quyết mối quan hệ dân tộc và tôn giáo ở Việt Nam hiện nay là gì?\nA. Đảm bảo sự lãnh đạo của Đảng Cộng sản Việt Nam, tuân thủ nguyên tắc, lập trường chính trị của giai cấp công nhân\nB. Đảm bảo các tôn giáo, dân tộc chuyển biến tích cực\nC. Đảm bảo hài hòa lợi ích, giảm thiểu tới mức tối đa mâu thuẫn lợi ích, nhất là mâu thuẫn lợi ích kinh tế\nD. Củng cố mối quan hệ tốt đẹp giữa dân tộc và tôn giáo, củng cố khối đại đoàn kết toàn dân tộc và đoàn kết tôn giáo\nAnswer: D\n\nQuestion: 263. Dân chủ xã hội chủ nghĩa có bản chất kinh tế khác với dân chủ tư sản ở điểm nào? (Chọn 2)\nA. Chế độ công hữu về tư liệu sản xuất chủ yếu\nB. Thực hiện chế độ phân phối lợi ích theo kết quả lao động là chủ yếu\nC. Sự tố chức quyền lực nhà nước do đảng cộng sản lãnh đạo\nD. Sự đa dạng, phong phú về chế độ sở hữu chủ yếu\nAnswer: AB\n\nQuestion: 264. Theo quan điểm của chủ nghĩa Mác - Lênin, Về bản Chất, tôn giáo do ai sáng tạo ra?\nA. Chúa trời\nB. Đức Phật\nC. Các thế lực siêu nhiên\nD. Con người\nAnswer: D\n\nQuestion: 265. Những lực lượng nào đóng vai trò quan trọng trong việc đẩy mạnh nghiên cứu sáng tạo và ứng dụng các thành tựu khoa học - công nghệ hiện đại?\nA. Đội ngũ trí thức, đội ngũ doanh nhân\nB. Giai cấp công nhân, đội ngũ trí thức\nC. Đội ngũ trí thức, giai cấp nông dân\nD. Đội ngũ doanh nhân, tầng lớp lao động trong xã hội\nAnswer: A\n\nQuestion: 266. Tại sao trong gia đình Việt Nam truyền thống trước kia lại quan niệm có càng đông con càng tốt và nhất thiết phải có con trai nối dõi?\nA. Do dân số ít và nam giới quá hiếm\nB. Do không có các biện pháp kế hoạch hóa gia đình\nC. Do con cái mang họ cha\nD. Do ảnh hưởng phong tục, tập quán và nhu cầu sản xuất nông nghiệp\nAnswer: D\n\nQuestion: 267. Ba bộ phận hợp thành chủ nghĩa Mác - Lênin là gì?\nA. Triết học Mác - Lênin, Kinh tế chính trị Mác - Lênin và Chủ nghĩa xã hội không tưởng phê phán\nB. Kinh tế chính trị Mác - Lênin, Tư tưởng Hồ Chí Minh và Chủ nghĩa xã hội không tưởng phê phán\nC. Triết học Mác - Lênin, Tư tưởng Hồ Chí Minh và Kinh tế chính trị học cổ điển Anh\nD. Triết học Mác - Lênin, Kinh tế chính trị Mác - Lênin và Chủ nghĩa xã hội khoa học\nAnswer: D\n\nQuestion: 268. Chủ nghĩa xã hội khoa học có chức năng giác ngộ và hướng dẫn giai cấp công nhân thực hiện sứ mệnh lịch sử của mình trong thời kỳ nào?\nA. Thời kỳ đấu tranh lật đổ sự thống trị của giai cấp tư sản, giành chính quyền\nB. Thời kỳ thiết lập sự thống trị của giai cấp công nhân, thực hiện sự nghiệp cải tạo và xây dựng chủ nghĩa xã hội\nC. Thời kỳ phát triển chủ nghĩa xã hội tiến lên chủ nghĩa cộng sản\nD. Tất cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 269. Theo chủ nghĩa Mác - Lênin thi lịch sử xã hội đã trải qua mấy hình thái kinh tế - xã hội?\nA. 2\nB. 3\nC. 4\nD. 5\nAnswer: D\n\n(Kiểu hỏi khác: Chủ nghĩa Mác Lênin đã chia lịch sử vận động và phát triển của xã hội thành mấy hình thái kinh tế xã hội?)\n\nQuestion: 270. Phương thức căn bản và quan trọng để thực hiện và tăng cường liên minh công - nông - trí thức ở Việt Nam hiện nay là gì?\nA. Đẩy mạnh công nghiệp hóa, hiện đại hóa; xây dựng nông thôn mới; phát triển kinh tế tri thức, nâng cao trình độ khoa học, công nghệ trong các ngành, lĩnh vực\nB. Đẩy mạnh nghiên cứu, sáng tạo các giải pháp mới nhằm thu hẹp nông thôn, mở rộng công nghiệp, chuyển đổi nhanh chóng cơ cấu kinh tế theo hướng dịch vụ và công nghiệp\nC. Từng bước xác lập vị trí chủ đạo của nền kinh tế tri thức và vai trò quan trong bật nhất của đội ngũ trí thức\nD. Từng bước xác lập vị trí then chốt của kinh tế thị trường và vai trò quan trọng bật nhất của đội ngũ doanh nhân\nAnswer: A\n\nQuestion: 271. Trong thời kì quá độ lên chủ nghĩa xã hội, yếu tố nào quyết định mối quan hệ hợp tác và gắn bó chặt chẽ giữa các giai cấp, tầng lớp và các nhóm xã hội?\nA. Họ cùng nhau chung sức cải tạo xã hội cũ, xây dưng xã hội mới trong mọi lĩnh vực của đời sống xã hội\nB. Họ cùng nhau phân chia quyền lực trong một chế độ nhà nước, vừa canh tranh, vữa động hành cùng nhau trong mọi lĩnh vực của đời sống xã hội\nC. Họ cùng sống trong một chế độ xã hội, một quốc gia dân tộc cụ thể, cho nên tính dân tộc bắt buộc họ phải gắn bó chặt chẽ với nhau\nD. Tất cả đáp án đều đúng\nAnswer: A\n\nQuestion: 272. Hình thức gia đình nào hình thành sớm nhất trong lịch sử?(NHUNG HOÀNG)\n\na. Gia đình một vợ một chồng\n\nb. Gia đình phụ hệ\n\nc. Đại gia đình phụ hệ\n\nd. Gia đình mẫu hệ\nAnswer: d\n\nQuestion: 273. Trong thời đại ngày nay, mục tiêu chính trị chủ yếu của mọi quốc gia khi giải quyết các vấn đề quốc gia - dân tộc là gì?(NHUNG HOÀNG)\n\na. Độc lập dân tộc\n\nb. Lợi ích kinh tế\n\nc. Phân chia quyền lực nhà nước\n\nd. Tất cả đáp án đều đúng\nAnswer: a\n\nQuestion: 274. Các quan hệ gia đình biến đổi, phát triển phụ thuộc vào điều gì?\n\na. Trình độ phát triển kinh tế và thể chế chính trị - xã hội\nb. Số lượng thành viên trong gia đình\nc. Điều kiện kinh tế của từng cá nhân trong gia đình\nd. Các yếu tố đạo đức của một xã hội\nAnswer: a\n\nQuestion: 275. Tại sao nói nhà nước xã hội chủ nghĩa là nhà nước kiểu mới?\n\na. Vì nó xuất hiện trễ nhất trong các kiểu nhà nước\nb. Vì bản chất của nó đối lập với các kiểu nhà nước bóc lột từng có trong lịch sử\nc. Vì do không tuân theo các quy tắc tổ chức nhà nước cổ điển\nd. Tất cả các đáp án đều đúng\nAnswer: b\n\nQuestion: 276. Xã hội loài người đã trải qua 5 hình thái kinh tế - xã hội đó, hình thái nào được xem là \"thai nghén\" trong lòng xã hội tư bản chủ nghĩa?\n\na. Hình thái kinh tế - xã hội chiếm hữu nô lệ\nb. Hình thái kinh tế - xã hội phong kiến\nc. Hình thái kinh tế - xã hội tư bản chủ nghĩa\nd. Hình thái kinh tế - xã hội cộng sản chủ nghĩa\nAnswer: d\n\nQuestion: 277. Với sự phát triển của hệ thống giáo dục xã hội và sự phát triển kinh tế hiện nay, vai trò giáo dục của các chủ thể trong gia đình có sự biến đổi như thế nào?(NHUNG HOÀNG)\n\na. Vai trò giáo dục của các thành viên trong gia đình có xu hướng giảm xuống\n\nb. Vai trò giáo dục của các thành viên trong gia đình có xu hướng gia tăng\n\nc. Vai trò giáo dục của cha mẹ ngày càng được tăng cường, dành nhiều thời gian chăm sóc, giáo dục con cái hơn\n\nd. Vai trò giáo dục của ông bà ngày càng quan trọng hơn\nAnswer: a\n\nQuestion: 278. Hôn nhân tiến bộ là hôn nhân xuất phát từ đâu?(NHUNG HOÀNG)\n\nA. Từ tình yêu giữa nam và nữ\n\nB. Từ quan hệ kinh tế - xã hội\n\nC. Từ cơ sở pháp lý được xã hội công nhân\n\nD. Từ các yếu tố đạo đức truyền thống\nAnswer: A\n\nQuestion: 279. Trong các chế độ xã hội trước, sự thống trị của người đàn ông trong gia đình là kết quả của việc gì?\n\na. Của sự thống trị về kinh tế\nb. Của sự phát triển chế độ quân chủ\nc. Của sự thống trị về văn hóa\nd. Của sự thống trị về chính trị\nAnswer: a\n\nQuestion: 280. Điền cụm từ thích hợp vào (...): \"Giai cấp ..., trong quá trình thống trị giai cấp chưa đầy một thế kỷ, đã tạo ra những ... nhiều hơn và đồ sộ hơn lực lượng sản xuất của tất cả các thế hệ trước kia gộp lại\".\n\na. Tư sản/ Lực lượng sản xuất\nb. Tư sản/ Quan hệ sản xuất\nc. Vô sản/ Tư sản\nd. Vô sản/ Giai cấp nông dân\nAnswer: a\n\nQuestion: 281. \"Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp\" được đề cập tại Đại hội lần thứ bao nhiêu của Đảng?\n\na. X\nb. XI\nc. XII\nd. XIII\nAnswer: d\n\nQuestion: 282. Theo C.Mác và Ph.Ăngghen thì hình thái kinh tế - xã hội cộng sản chủ nghĩa phát triển như thế nào?\n\na. Phát triển theo hình xoáy ốc\nb. Phát triển ý muốn chủ quan của con người\nc. Phát triển theo sở thích của một đấng siêu nhiên nào đó trong vũ trụ\nd. Phát triển từ thấp lên cao\nAnswer: d\n\nQuestion: 283. Để các nước đang trong thời kỳ quá độ lên chủ nghĩa xã hội xây dựng được cơ sở kinh tế vững mạnh, chế độ chính trị xã hội ngày càng được củng cố vững chắc thì cần phải có sự liên minh của những lực lượng nào?\n\na. Giai cấp công nhân, giai cấp nông dân, tầng lớp nhân dân lao động khác\nb. Giai cấp nông dân, giai cấp tư sản, chính quyền\nc. Giai cấp nông dân, đội ngũ trí thức, đội ngũ doanh nghiệp\nd. Giai cấp công nhân, đội ngũ trí thức, đội ngũ doanh nghiệp\nAnswer: a\n\nQuestion: 284. Vấn đề: \"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh\" là đặc trưng thứ mấy trong 08 đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam? (Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội bổ sung, phát triển năm 2011)\n\na. 1\nb. 3\nc. 6\nd. 8\nAnswer: a\n\nQuestion: 285. Mâu thuẫn cơ bản của hình thái kinh tế - xã hội tư bản chủ nghĩa biểu hiện về mặt xã hội là:(NHUNG HOÀNG)\n\nA. Mâu thuẫn xung đột lợi ích của các nhà tư sản khác nhau\n\nB. Cuộc đấu tranh của giai cấp công nhân chống lại giai cấp tư sản ngày càng gay gắt\n\nC. Cuộc cạnh tranh giành việc làm của những người công nhân để tránh không bị thất nghiệp\n\nD. Cuộc đấu tranh giành quyền điều hành quốc gia của các đáng phải tư sản\nAnswer: B\n\nQuestion: 286. Trong thời đại ngày nay ở Việt Nam, đội ngũ công nhân trong thành phần kinh tế nào là tiêu biểu, đóng vai trò nòng cốt và chủ đạo?\nA. Thành phần kinh tế tư nhân\nB. Thành phần kinh tế tập thế\nC. Thành phần kinh tế nhà nước\nD. Thành phần kinh tế có Vốn đầu tư nước ngoài\nAnswer: C\n\nQuestion: 287. Nhà nước pháp quyền xã hội chủ nghĩa ở Việt Nam mang bản chất giai cấp của giai cấp nào?\nA. Công nhân\nB. Nông dân\nC. Tư sản\nD. Tri thức\nAnswer: A\n\nQuestion: 288. Cơ cấu xã hội ở Việt Nam muốn biến đổi theo hướng tích cực phải dựa trên cơ sở gì?\nA. Tăng trưởng kinh tế bảng moi giá\nB. Sư giàu mạnh của các tố chức, tập đoàn kinh tế lớn, canh tranh được với nước ngoài\nC. Sự phát triển của thành phần kinh tế nhà nước và tập thể\nD. Tăng trưởng, phát triển kinh tế nhanh và bền vững\nAnswer: D\n\nQuestion: 289. Cơ sở để xác định thời đại và phân chia thời đại là gì?\nA. Hình thái kinh tế - xã hội và vị trí của một giai cấp đứng ở vị trí trung tâm\nB. Vị trí của một giai cấp đứng ở vị trí trung tâm\nC. Sư phát triển của lực lượng sản xuất và một quan hệ sản xuất phù hợp\nD. Cách mạng xã hội chủ nghĩa do giai cấp công nhân lãnh đạo thành công\nAnswer: A\n\nQuestion: 290. Chính sách dân tộc của nước ta hiện nay giải quyết văn đề văn hóa của các dân tộc như thế nào?(NHUNG HOÀNG)\n\nA. Tăng cường phát huy văn hóa tiên tiến của đồng bảo dân tộc Kinh, vì chiếm đa số trong xã hội\n\nB. Loại bỏ các giá trị văn hóa truyền thông của các dân tộc thiểu sỡ đẽ phù hợp hơn với thời đai\n\nC. Giữ gìn và phát huy giá trị văn hóa truyền thống của các tộc người, phát triễn ngôn ngữ, nâng cao trình độ văn hóa cho nhân dân các dân tộc\n\nD. Tăng cường cải tạo văn hóa của các dân tộc để thống nhất chung một bản sắc văn hóa Việt Nam\nAnswer: C\n\nQuestion: 291. Đúng hay sai khi cho rằng dân chủ ở nước ta là mọi công dân đều có quyền tự do tuyệt đối trong tất cả các mặt của đời sống xã hội mà không cần phải tuân theo bất kì điều gì?\nA. Đúng, dân chủ thật sự phải thực hiện được mọi nguyện vọng của bất kì người dân nào\nB. Không, đó là hệ giá trị dân chủ rộng rãi nhất mà nhân loại hướng tới, nhưng hiện tại ở nước ta chưa đạt tới trình độ đó\nC. Không đúng, dân chủ phải trong khuôn khổ của kỷ cương, pháp luật\nD. Không có đáp án nào dùng\nAnswer: C\n\nQuestion: 292. Theo nghĩa rộng, khái niệm dân tộc dùng để chỉ:\nA. Một quốc gia, toàn bộ nhân dân của một nước\nB. Một dân tộc cụ thể cùng chung sống trong một lãnh thổ quốc gia nhất định\nC. Tất cả các quốc gia đang sinh sống trên trái đất\nD.Tất cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 293. Đâu không phải là một trong những loại của cơ cấu xã hội?\nA. Cơ cấu xã hội - giai Cấp\nB. Cơ Cấu xã hội - nghề nghiệp\nC. Cơ Cấu xã hội - hạ tầng\nD. Cơ cấu xã hội - tôn giáo\nAnswer: C\n\nQuestion: 294. Gia đình được hình thành, củng cố và duy trì dựa trên mối quan hệ nào? (chọn 3 đáp án)(NHUNG HOÀNG)\n\nA. Quan hệ hôn nhân\n\nB. Quan hệ huyết thống\n\nC. Quan hệ nuôi dưỡng\n\nD. Quan hệ kinh tế\nAnswer: ABC\n\nQuestion: 295. Cơ Cấu xã hội - giai Cấp của nước ta trong thời kì quá độ lên chủ nghĩa xã hội hiện nay bao gồm những giai cấp, tầng lớp cơ bản nào? (chọn 3)\nA. Giai Cấp công nhân\nB. Giai Cấp nông dân\nC. Đội ngũ trí thức và đội ngũ doanh nhân\nD. Đội ngũ trí thức và đội ngũ đảng viên\nAnswer: ABC\n\nQuestion: 296. Đâu không phải là một trong những điều kiện kinh tế - xã hội cho sự ra đời của chủ nghĩa xã hội khoa học?(NHUNG HOÀNG)\n\nA. Các thành tựu khoa học tự nhiên của nhân loại thế kỉ XIX\n\nB. Sự xuất hiện của nền đại công nghiệp\n\nC. Sự ra đời của hai giai Cấp: giai Cấp tư sản và giai Cấp vô sản\n\nD. Phong trào đấu tranh của giai cấp vô sản chống lại sự thống trị áp bức của giai cấp tư sản\nAnswer: A\n\nQuestion: 297. Trong một quốc gia đa tộc người thì văn đề gì cần giải quyết được coi là có ý nghĩa cơ bản nhất để thực hiện quyền bình đẳng giữa các dân tộc?\nA. Ban hành hệ thống hiến pháp và pháp luật về quyền bình đẳng giữa các dân tộc\nB. Nâng cao trình độ dân trí, văn hoá cho động bảo\nC. Chống tư tưởng phân biệt chủng tộc, kì thị và chia rẽ dân tộc\nD. Xoá bỏ dần sư chênh lệch Về mọi mặt giữa các dân tộc do lịch sử đế lại\nAnswer: D\n\nQuestion: 298. Nếu trước kia, gia đình Việt Nam tiêu dùng sản phẩm do mình làm ra là chính, thì hiện nay, gia tỉnh Việt Nam đang tiến tới xu hướng tiêu dùng chủ yếu nào?(NHUNG HOÀNG)\n\nA. Xu hướng sử dụng hàng hóa, dịch vụ của phúc lợi Nhà nước\n\nB. Xu hướng tiêu dùng sản phẩm do người khác làm ra\n\nC. Xu hướng tiêu dùng sản phẩm nước ngoài\n\nD. Tiêu dùng sản phẩm được cấp phát\nAnswer: B\n\nQuestion: 299. Tư tưởng xã hội chủ nghĩa là gì?(NHUNG HOÀNG)\n\nA. Là một hệ thống những quan niệm phản ánh những nhu cầu, những ước mơ, nguyện vọng của các giai cấp lao động về một xã hội không có áp bức và bóc lột, mọi người đều bình đẳng và có cuộc sống ấm no, hạnh phúc. \n\nB. Là những thành tựu của con người đạt được trong quá trình đấu tranh giải phóng giai cấp.\n\nC. Là chế độ xã hội không có áp bức bóc lột, mọi người đều bình đẳng tự do.\n\nD. Cả a, b, c\nAnswer: D\n\nQuestion: 300. Tai sao trong thời gian đầu, giai Cấp công nhân Việt Nam chậm phát triển?\nA. Vi sinh ra và lớn lên ở một nước thuộc địa, nứa phong kiến dưới ách thống trị của thưc dân Pháp\nB. Vì lưc lượng không thưc sự đông đảo\nC. Vì không có tinh thần kỷ luật và cách mạng triệt đế như đặc điếm chung của giai Cấp công nhân các nước\ntư bản phát triễn\nD. Vì chưa có tinh thần đấu tranh giai cấp, đấu tranh giải phóng dân tộc\nAnswer: A\n\nQuestion: 301. Nhiệm vụ Cấp bách, lâu dài của quá trình xây dựng Nhà nước pháp quyền xã hội chủ nghĩa ở nước ta là:\nA. Phòng chống tham nhũng, lãng phí và thực hành tiết kiệm\nB. Miễn nhiệm những người không hoàn thành nhiệm vụ\nC. Nâng cao chất lượng đội ngũ cán bộ, công chức\nD. Có chính sách đãi ngộ, động viên, khuyến khích cán bộ, công chức\nAnswer: A\n\nQuestion: 302. Khác biệt Về sự ra đời của hình thái kinh tế - xã hội cộng sản chủ nghĩa với sự ra đời của các hình thái kinh tế-xã hội trước đây là gì?\nA. Phải được thực hiện thông qua cuộc cách mạng vô sản\nB. Phải được thưc hiện thông qua cuộc cách mạng tư sản\nC. Phải được thưc hiện thông qua một sự cải biến sâu sắc về trình độ phát triển của công nghiệp và người lao động\nD. Phải có sự hội tụ đầy đủ các yếu tố Về kinh tế và chính trị\nAnswer: A\n\nQuestion: 303. Trong thời kì quá độ lên chủ nghĩa xã hội, vấn đề tín ngưỡng và tôn giáo của nhân dân cần được giải quyết trên cơ sở nguyên tắc nào?\nA. Hạn chế sự tham gia vào tôn giáo của nhân dân bằng các chính sách xã hội, không can thiệp bằng mệnh lệnh hành chính\nB. Quyền tự do tín ngưỡng, tôn giáo được tôn trong và bảo vệ, không ai có quyền can thiệp bằng bất cứ hình thức nào\nC. Nhà nước liên hiệp với giáo hội các tôn giáo để đĩệu chính họ theo hướng duy vật, vô thần dần dần theo thời gian\nD. Có những ưu tiên đối với công dân không theo bất cứ tôn giáo nào\nAnswer: B\n\nQuestion: 304. Về mặt lý thuyết, con đường cách mạng vô sản nào có thể tiến hành, nhưng vô cùng hiếm, quý và chưa từng xảy ra trên thực tế?\nA. Con đường bao lưc cách mang\nB. Con đường hòa bình\nC. Con đường khởi nghĩa Vũ trang\nD. Con đường bạo động lật đổ\nAnswer: B\n\nQuestion: 305. Thực chất của thời kỳ quá độ lên chủ nghĩa xã hội là gì?\nA. Là thời kỳ cải biến cách mạng từ xã hội tiền tư bản và tư bản chủ nghĩa sang xã hội xã hội chủ nghĩa\nB. Là thời kỳ cải biến cách mang từ xã hội công sản nguyên thủy lên xã hội xã hội chủ nghĩa\nC. Là thời kỳ cải biển cách mạng tư xã hội chiếm hữu nô lệ lên xã hội xã hội chủ nghĩa\nD. Là thời kỳ Cải biến cách mạng từ xã hội xã hội chủ nghĩa lên xã hội cộng sản chủ nghĩa\nAnswer: A\n\nQuestion: 306. Nâng cao chất lượng đội ngũ cán bộ, công chức về những phẩm chất nào?(NHUNG HOÀNG)\n\nA. Bản lĩnh kinh tế, phẩm chất đạo đức, nấng lưc lãnh đạo, điều hành quản lý đất nước\n\nB. Bản lĩnh chính trị, phẩm chất đạo đức, năng lực lãnh đạo, điều hành quản lý đất nước\n\nC. Bản lĩnh quốc phòng, phẩm chất đạo đức, năng lưc lãnh đạo, điều hành quản lý đất nước\n\nD. Bản lĩnh xã hội, phẩm chất đạo đức, năng lực lãnh đạo, điều hành quản lý đất nước\nAnswer: B\n\nQuestion: 307. Trong thời đại hiện nay, sứ mệnh lịch sử của giai Cấp công nhân trong lĩnh vực văn hóa, tư tưởng là gì?\nA. Đấu tranh bảo Vệ nền tảng tư tưởng của Đảng Cộng sản, giáo dục nhận thức và cũng có nẽm tin khoa học đoi vôi lí tưởng, muc tiêu của chủ nghĩa xã hội\nB. Tuyên truyền cho quần chúng lao động vệ hệ tư tướng Mác - Lênin đê tiến đến chủ nghĩa cộng sản\nC. Xét lại, bổ sung chủ nghĩa Mác - Lênin để dung hợp với các học thuyết tư sản mới\nD. Tất Cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 308. Tính quần chúng của tôn giáo cho thấy điều gì?\nA. Tôn giáo là một hiện tượng cứu rồi dành cho những người yếu thế trong xã hội\nB. Tôn giáo là một hiện tượng xã hội phổ biến ở tất cả các quốc gia, dân tộc và châu lục\nC. Tôn giáo tồn tại trong suốt hàng nghìn năm lịch sử và được quần chúng nhân dân xây dựng và phát triển\nD. Tất cả các đáp án đều đúng\nAnswer: B\n\nQuestion: 309. Chức năng văn hóa của gia đình thể hiện điều gì?\nA. Gia đình là nơi lưu giữ truyền thống văn hóa của dân tộc, là nơi sáng tạo và thụ hưởng những giá trị văn hóa của xã hội\nB. Gia đình là nơi chịu sự chi phối, chế ước của các yếu tố văn hóa cũ và mới đan xen\nC. Gia đình là nơi thực thi các chính sách văn hóa, mang đậm dấu ấn của giai cấp thống trị\nD. Tất cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 310. Tại đại hội X, theo quan điểm của đảng cộng sản Việt Nam, quá độ lên chủ nghĩa xã hội bộ qua chế độ tư bản chủ nghĩa là:\nA. Con đường cách mạng chủ quan, con đường xây dựng đất nước trong thời kỳ quá độ lên chủ nợía xă hội ở nước ta\nB. Con đường cách mạng tất yếu khách quan, con đường xây dựng đất nước trong thời kỳ quá độ lên phong kiến ở nước ta\nC. Con đường cách mạng tất yếu khách quan, con đường xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội ở nước ta\nD. Con đường mong muốn riêng của đất nước ta\nAnswer: C\n\nQuestion: 311. Quá độ từ chủ nghĩa tư bản phát triển lên chủ nghĩa xã hội là hình thức quá độ nào?\nA. Quá độ gián tiếp\nB. Quá độ trực tiếp\nC. Quá độ bộ Phản\nD. Quá độ toàn diện\nAnswer: B\n\nQuestion: 312. Đâu không phải là một trong những nhiệm vụ của các chính sách liên quan đến cơ cấu xã hội giai cấp?\nA. Giải quyết tốt các mối quan hệ nội bộ từng giai Cấp\nB. Hướng tới đảm bảo công bằng Xã hội, thu hẹp dần khoảng cách phát triển và sự phân hóa giàu nghèo giữa các giai Cấp, tầng lớp\nC. Giải quyết tốt các mối quan hệ giữa giai Cấp, tầng lớp này với giai Cấp, tầng lớp khác\nD. Tạo điều kiện thuận lợi để các giai Cấp công nhân có thể cạnh tranh tốt trên tất cả các lĩnh vực của đời sống xã hội\nAnswer: D\n\nQuestion: 313. Thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội còn tồn tại nhiều tư tưởng khác nhau, chủ yếu là:(NHUNG HOÀNG)\n\nA. Tư tưởng vô sản và tư tưởng tư sản\n\nB. Tư tưởng vô sản và tư tưởng đia chủ phong kiến\n\nC. Tư tưởng chủ nó và tư tưởng tư sản\n\nD. Tư tưởng vô sản và tư tưởng chủ nô\nAnswer: A\n\nQuestion: 314. Trong thời đại hiện nay, hao phí lao động chủ yếu của giai Cấp công nhân đã biến đổi như thế nào?(NHUNG HOÀNG)\n\nA. Giảm bớt hao phí sức lực cơ bắp, gia tăng hao phí về trí lực\n\nB. Đồng thời gia tăng cả hao phí sức lực và trí lực\n\nC. Gia tăng yếu tố tâm lực trong quá trình lao động\n\nD. Giảm bớt hao phí về trí lực, gia tăng hao phí sức lực\nAnswer: A\n\nQuestion: 315. Trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay, giai cấp, tầng lớp nào có nhiệm vụ phát huy bản sắc văn hóa dân tộc và bảo vệ môi trường sinh thái?\nA. Giai Cấp công nhân\nB. Giai cấp nông dân\nC. Tầng lớp trí thức\nD. Đội ngũ doanh nhân\nAnswer: B\n\nQuestion: 316. Với tư cách là một hình thái nhà nước, một chế độ chính trị, cho đến nay đã có những nền dân chủ nào đã và đang tồn tại? (chọn 3)\nA. Dân chủ chủ nô\nB. Dân chủ tư sản\nC. Dân chủ xã hội chủ nghĩa\nD. Dân chủ cộng sản chủ nghĩa\nAnswer: ABC\n\nQuestion: 317. Điểm tương đồng giữa giáo dục gia đình truyền thông và giáo dục gia đình trong xã hội mới của Việt Nam hiện nay là gì?\nA. Tinh thần cô kết làng xã\nB. Nhấn mạnh sự hy sinh của cá nhân cho cộng đồng\nC. Ý thức vươn lên làm giàu\nD. Tất cả các đáp án đều đúng\nAnswer: B\n\nQuestion: 318. Các quy chế dân chủ từ cơ sở đến Trung ương và trong các tổ chức chính trị- xã hội ở nước ta đều thực hiện theo phương châm nào?\nA. Dân biết, dân bàn, dân kiểm tra, dân hưởng thụ\nB. Dân bàn, dân kiểm tra, dân làm, dân hưởng thụ\nC. Dân biết, dân bàn, dân làm, dân kiểm tra\nD. Dân bàn, dân làm, dân kiểm tra\nAnswer: C\n\nQuestion: 319. Bản chất tư tưởng - văn hóa - xã hội của nền dân chủ xã hội chủ nghĩa là gì?\n\na. Lấy hệ tư tưởng Mác - Lênin làm chủ đạo, kế thừa, phát huy tinh hoa truyền thống dân tộc và những giá trị tư tưởng - văn hóa văn minh, tiến bộ nhân loại\nb. Lấy hệ tư tưởng Mác - Lênin làm chủ đạo, kế thừa, phát huy toàn bộ tư tưởng - văn hóa nhân loại\nc. Lấy hệ tư tưởng Mác - Lênin làm hệ tư tưởng chính trị, kế thừa toàn bộ những yếu tố truyền thống của dân tộc\nd. Lấy hệ tư tưởng Mác - Lênin làm chủ đạo, kế thừa truyền thống tốt đẹp của dân tộc, ngăn chặn yếu tố ngoại lai xâm phạm\nAnswer: a\n\nQuestion: 320. Đáp án nào không phải là một giải pháp nhằm cải cách thể chế và phương thức hoạt động của Nhà nước xã hội chủ nghĩa Việt Nam?\n\na. Kiện toàn tổ chức, đổi mới phương thức và nâng cao hiệu quả hoạt động của Quốc hội\nb. Đẩy mạnh cải cách hành chính, giảm bớt và bãi bỏ các thủ tục hành chính gây phiền hà cho tổ chức và công dân\nc. Đẩy mạnh xã hội hóa các ngành dịch vụ công phù hợp với cơ chế thị trường định hướng xã hội chủ nghĩa\nd. Củng cố và nâng cao quyền lãnh đạo của Đảng Cộng sản Việt Nam đối với bộ máy nhà nước\nAnswer: d\n\nQuestion: 321. Yếu tố nào quyết định sự liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức?(NHUNG HOÀNG)\n\na. Do có những lợi ích cơ bản thống nhất với nhau\n\nb. Do giai cấp công nhân mong muốn\n\nc. Do có cùng một kẻ thù là giai cấp tư sản\n\nd. Do mục tiêu về chính trị của giai cấp công nhân\nAnswer: a\n\nQuestion: 322. Ở nước ta, các dân tộc thiểu số phân bố chủ yếu ở các địa bàn có đặc điểm như thế nào?\n\na. Có vị trí chiến lược quan trọng\nb. Có điều kiện phát triển kinh tế - xã hội tốt nhất\nc. Ở đồng bằng trù phú\nd. Ở các hải đảo xa xôi\nAnswer: a\n\nQuestion: 323. Cơ cấu xã hội là gì?(NHUNG HOÀNG)\n\na. Là những cộng đồng người hợp thành một chế độ xã hội\n\nb. Là những người trong cùng một giai cấp, tầng lớp thực hiện phần chia quyền lực\n\nc. Là những cộng đồng người cùng toàn bộ những mối quan hệ xã hội do sự tác động lẫn nhau của các cộng đồng ấy tạo nên\n\nd. Là những cộng đồng người cùng toàn bộ những mối quan hệ xã hội do sự tác động của cộng đồng người ấy với tự nhiên tạo nên\nAnswer: c\n\nQuestion: 324. Đặc trưng bản chất của chủ nghĩa xã hội về phương diện kinh tế là gì? Chọn các đáp án đúng.\nA. Nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại\nB. Chế độ công hữu vẽ tư liệu sản xuất chủ yếu\nC. Nên kinh tế phát triển cao dựa trên lực lượng sản xuất công nghiệp cơ khí\nD. Chế độ sở hữu tập thể, hỗn hợp của tư nhân và công cộng\nAnswer: AB (Nếu chọn 1 thì chọn A)\n\nQuestion: 325. Nội dung cơ bản của dân chủ về phương diện quyền lực là gì?\nA. Là quyền lực thuộc về nhân dân, nhân dân là chủ nhân của nhà nước\nB. Là một hình thái nhà nước\nC. Là một nguyên tắc tố chức xã hội\nD. Là quyền thống trị của nhân dân trong lĩnh vực kinh tế\nAnswer: A\n\nQuestion: 326. Tại sao nói giai cấp công nhân là giai cấp có tinh thần cách mạng triệt để nhất?\nA. Vì giai cấp công nhân có lợi ích cơ bản thống nhất với đại đa số nhân dân lao động, có sứ mệnh lịch sử xóa bò mọi chế độ bóc lột, bất công\nB. Vì giai cấp công nhân là giai cấp đông đào nhất trong xã hội\nC. Vì giai cấp công nhân là giai cấp duy nhất bị bóc lột và có mâu thuẫn đối kháng trực tiếp với giai cấp thống trị\nD. Vì giai cấp công nhân được lãnh đạo bởi Đảng Cộng sản\nAnswer: A\n\nQuestion: 327. Tôn trọng tự do tín ngưỡng cũng chính là tôn trọng vấn đề gì?\nA. Tôn trọng xã hội\nB. Tôn trọng pháp luật\nC. Tôn trọng quyền con người\nD. Tôn trọng tôn giáo\nAnswer: C\n\nQuestion: 328. Theo quan điểm của Đảng công sản Việt Nam, quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa đòi hỏi phải:\nA. Tiếp thu, kế thừa những thành tựu mà nhân loại đã đạt được dưới chủ nghĩa tư bản\nB. Tiếp thu, kế thừa những thành tựu mà chế độ phong kiến đã đạt được\nC. Bò qua những thành tựu mà nhân loại đã đạt được trong chủ nghĩa tư bản\nD. Loại bỏ tất cả những gì có liên quan đến chủ nghĩa tư bản\nAnswer: A\n\nQuestion: 329. Thuật ngữ \"dân chủ\" được ra đời khi nào?(NHUNG HOÀNG)\n\nA. Thế ký VI - VIII\n\nB. Thế kỷ VII - VI trước Công nguyên\n\nC. Thế kỳ V - IV trước Công nguyên\n\nD. Thế kỳ XXI\nAnswer: B\n\nQuestion: 330. Theo quan điểm của chủ nghĩa Mác - Lênin, tôn giáo có các nguồn gốc nào? Chọn các đáp án đúng. (3 đáp án)\nA. Nguồn gốc tự nhiên, kinh tế - xã hội\nB. Nguồn gốc nhận thức\nC. Nguồn gốc tâm lý\nD. Nguồn gốc siêu nhiên\nAnswer: ABC\n\nQuestion: 331. Hai yếu tố nào cầu thành cơ sở của lịch sử chính trị và lịch sử tư tưởng của thời đại?(NHUNG HOÀNG)\n\nA. Chính trị xã hội và văn hóa\n\nB. Cơ sở hạ tầng và kiến trúc thượng tầng\n\nC. Sản xuất kinh tế và cơ cấu xã hội\n\nD. Lực lượng sản xuất và quan hệ sản xuất\nAnswer: C\n\nQuestion: 332. Đặc trưng bản chất nào của chủ nghĩa xã hội thể hiện đây là chế độ xã hội vì con người, do con người?\nA. Chủ nghĩa xã hội có nên kinh tế phát triển cao, dựa trên chế độ tư hữu về tư liệu sản xuất chủ yếu\nB. Chủ nghĩa xã hội là chế độ xã hội do nhân dân lao động làm chủ\nC. Chủ nghĩa xã hội giài phóng giai cấp công nhân, nhân dân lao động và đông thời đàn áp giai cấp thống trị tàn bạo là giai cấp tư sản\nD. Chủ nghĩa xã hội có nhà nước kiểu mới mang bản chất giai cấp công nhân, đại biểu cho lợi ích, quyền lực và ý chí của riêng giai cấp công nhân\nAnswer: B\n\nQuestion: 333. Đâu là một trong những phương hướng cơ bản xây dựng và phát triển gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội?\nA. Tiếp tục phát triển và nâng cao chất lượng phong trào xây dựng gia đình văn hóa\nB. Xây dựng gia định văn hóa, bình đẳng giới, con cái được học hành\nC. Gia đình từ một đến hai con, ấm no, hạnh phúc\nD. Mọi thành viên trong gia đình phải tôn trong, phát huy quyền làm chủ trong gia định\nAnswer: A\n\nQuestion: 334. Giai cấp nào là đại biểu cho lực lượng sản xuất tiên tiến, cho phương thức sản xuất hiện đại?\nA. Tư sản\nB. Nông dân\nC. Công nhân\nD. Thống trị\nAnswer: C\n\nQuestion: 335. Để giai cấp công nhân phát triển cả về số lượng và chất lượng, theo chủ nghĩa Mác - Lênin phải đặc biệt chú ý đến biện pháp nào?\nA. Phát triển công nghiệp và sự trưởng thành của Đảng Cộng sản\nB. Phát triển công - nông nghiệp phù hợp\nC. Kết nạp ngày càng nhiêu các giai cấp, tầng lớp lao động khác vào hàng ngũ của Đảng Cộng sản để tăng trường nhanh vê số lượng\nD. Đẩy mạnh phong trào công nhân từ tự giác đến tự phát\nAnswer: A\n\nQuestion: 336. Cơ cấu kinh tế trong thời kỳ quả độ lên chủ nghĩa xã hội ở Việt Nam tuy vận động theo cơ chế thị trường, song có sự quản lý của:\nA. Giai cấp công nhân\nB. Đàng Cộng sản Việt Nam\nC. Nhà nước pháp quyền xã hội chủ nghĩa\nD. Tầng lớp thống trị trong xã hội\nAnswer: C\n\nQuestion: 337. Trong hệ thống chính sách xã hội, các chính sách liên quan đến vẫn để gì được đặt lên vị trí hãng đầu?\nA. Tôn giáo, y tế\nB. Giáo dục, y tế\nC. Cơ cấu xã hội - giai cấp\nD. Cơ cầu giai cấp, giảo dục\nAnswer: C\n\nQuestion: 338. Đâu không phải là một trong những chính sách đối với giai cấp nông dân để đảm bảo sự biến đối tích cực của giai cấp này trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay?(NHUNG HOÀNG)\n\nA. Hỗ trợ, khuyến khích nông dân học nghề, chuyến dịch cơ cấu lao động\n\nB. Tạo điều kiện thuận lợi để tiếp nhận và ứng dụng khoa học - công nghệ, nâng cao năng suất lao động, và từng bước công nghiệp hóa nông nghiệp\n\nC. Tạo điều kiện thuận lợi để nông dẫn chuyển sang làm công nghiệp và dịch vụ\n\nD. Ngăn chặn tinh trạng chuyển đối mục đích sử dụng đất nông nghiệp thành các mục đích khác để đảm bảo sinh kế của người nông dân\nAnswer: D\n\nQuestion: 339. Việc thực hiện chức năng nào của gia đình quyết định mật độ dân cư và nguồn lực lao động của một quốc gia và quốc tế?\nA. Chức năng kinh tế và tố chức tiêu dùng\nB. Chức năng định cư\nC. Chức năng tái sản xuất ra con người\nD. Chức năng giáo dục, nuôi dưỡng\nAnswer: C\n\nQuestion: 340. Trong thời đại hiện nay, ở các nước tư bàn chủ nghĩa, mục tiêu đấu tranh lầu dài để thực hiện sứ mệnh lịch sử của giai cấp công nhân vẽ chính trị - xã hội là gì?(NHUNG HOÀNG)\n\nA. Chống bất công, bất bình đẳng xã hội\n\nB. Thoa hiệp với giai cấp tư sản để tiến tối chủ nghĩa xã hội bằng con đường hòa bình\n\nC. Giảnh chính quyền về tay giai cấp công nhân và nhân dân lao động\n\nD. Đấu tranh đồi các quyền tự do, dân chủ\nAnswer: C\n\nQuestion: 341. Câu nói sau đây do ai nói: \"... nếu nghĩa vụ của vợ chồng là phải thương yêu nhau thì nghĩa vụ của những kẻ yêu nhau há chẳng phải là kết hôn với nhau và không được kết hôn với người khác hay sao?\"?\nA. Ph. Ăngghen\nB. V.I.Lênin\nC. Chủ tịch Hồ Chí Minh\nD. C.Mác\nAnswer: A\n\nQuestion: 342. Tư duy của Nhà triết học nào được xem là \"cái hạt nhân\" hợp lý của phép biện chứng?\nA. V.I.Lênin\nB. C.Mác\nC. G.V.Ph.Hêghen\nD. Ph. Ăngghen\nAnswer: C\n\nQuestion: 343. Đâu không phải là một trong những điểm tương đối ổn định của giai cấp công nhân ngày nay so với thế kỉ XIX?\nA. Giai cấp công nhân vẫn là lực lượng sản xuất hàng đầu của xã hội hiện đại\nB. Giai cấp công nhân vẫn bị chủ nghĩa tư bản và giai cấp tư sản bóc lột giá trị thặng dư\nC. Giai cấp công nhân vẫn có lợi ích cơ bản xung đột với lợi ích cơ bàn của giai cấp tư sản\nD. Giai cấp công nhân vẫn làm việc với cường độ cao, trình độ lao động ngày càng yếu kém\nAnswer: D\n\nQuestion: 344. Sự ra đời của công nghiệp cơ khí là bước tiến to lớn của lực lượng sản xuất trong cuộc cách mạng công nghiệp lần thứ mấy?\nA. Cách mạng công nghiệp lần thứ nhất\nB. Cách mạng công nghiệp lần thứ hai\nC. Cách mạng công nghiệp lần thứ ba\nD. Cách mạng công nghiệp lần thứ tư\nAnswer: A\n\nQuestion: 345. Trong gia đình truyền thống, ai được xem là trụ cột của gia đình?\nA. Người vợ\nB. Người chồng\nC. Cà vợ và chồng\nD. Người con trong gia đình\nAnswer: B\n\nQuestion: 346. Theo V.I.Lênin, đối với những nước chưa có chủ nghĩa tư bản phát triên cao thì cần phải có một thời kỳ gì để từ chủ nghĩa tư bản lên chủ nghĩa xã hội?\nA. Thời kỳ khai sáng\nB. Thời kỳ tiến lên\nC. Thời kỳ quá độ\nD. Thời kỳ phát triển\nAnswer: C\n\nQuestion: 347. Mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là:\nA. Mâu thuẫn giữa lực lượng sản xuất xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bàn chủ nghĩa về tư liệu sản xuất\nB. Mâu thuẫn giữa quan hệ sản xuất xã hội hóa ngày càng rộng lớn với lực lượng sàn xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất\nC. Mâu thuẫn giữa cơ sở hạ tầng và kiến trúc thượng tầng\nD. Mâu thuẫn giữa tôn tại xã hội và ý thức xã hội\nAnswer: A\n\n(Kiểu hỏi khác: \n\nMâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là:\n\na. Mâu thuẫn giữa giai cấp tư sản và giai cấp vô sản\n\nb. Mâu thuẫn giữa chủ nghĩa tư bản và chủ nghĩa xã hội\n\nc. Mâu thuẫn giữa lực lượng sản xuất xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất\n\nd. Mâu thuẫn giữa lực lượng sản xuất và quan hệ sản xuất)\n\nQuestion: 348. Nguyên tắc phân phối chủ yếu của chủ nghĩa cộng sản là gì?\nA. Làm theo năng lực, hướng theo nhu cầu\nB. Làm theo năng lực, hướng theo lao động\nC. Làm theo năng lực, hướng theo phúc lợi xã hội\nD. Làm theo công việc, hướng theo tiền lương\nAnswer: A\n\nQuestion: 349. Trình độ phát triển của các dân tộc ở Việt Nam như thế nào?\nA. Đồng đều, có sự hỗ trợ của nhà nước\nB. Không đồng đêu, có sự chênh lệch khá lớn\nC. Tương đối đồng đều, trong đó dẫn tộc Kinh phát triển cao nhất\nD. Không thế so sánh\nAnswer: B\n\nQuestion: 350. Trong các kiểu nhà nước dưới dây, nhà nước nào là nhà nước của tất cả mọi người, mọi giai cấp\nA. Nhà nước chiếm hữu nô lệ\nB. Nhà nước tư sản\nC. Nhà nước xã hội chủ nghĩa\nD. Không có kiểu nhà nước nào là của tất cả giai cấp\nAnswer: D\n\nQuestion: 351. Đánh giá sau được trích trong tác phẩm nào: \"tác phẩm chủ yếu và cơ bản ấy trình bày chủ nghĩa xã hội khoa học... những yếu tổ tử đó này sinh ra chế độ tương lai\"?\nA. Chống Đuyring\nB. Đường Kách mệnh\nC. Tuyên ngôn của Đảng Cộng sản\nD. Tư bản\nAnswer: D\n\nQuestion: 352. Ở Việt Nam hiện nay, tồn tại mô hình người chủ gia đình nào?\nA. Người đàn ông - người chồng làm chủ gia đình\nB. Người phụ nữ - người vợ làm chủ gia đình\nC. Cả hai vợ chồng cùng làm chủ gia đình\nD. Tất cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 353. Học thuyết về hình thái kinh tế - xã hội do ai khởi xướng, và sau đó được ai bổ sung, phát triển?\nA. C.Mác - V.I.Lênin khôi xướng, Ph. Ăngghen bổ sung phát triển\nB. C.Mác - Ph. Ăngghen khởi xướng, V.I Lênin bổ sung phát triển\nC. C.Mác - Ph. Ăngghen khởi xướng, Chủ tịch Hồ Chí Minh bố sung phát triển\nD. C.Mác khởi xướng, Ph. Ăngghen bổ sung phát triển\nAnswer: B\n\nQuestion: 354. Đâu là truyền thống quý báu của các dân tộc ở Việt Nam góp phần quyết định mọi thẳng lợi của dân tộc trong các giai đoạn lịch sử?\n\nA. Yêu nước, yêu quê hương\nB. Đoàn kết dân tộc\nC. Tinh thần học tập không ngừng\nD. Hiếu thảo với ông bà cha mẹ\nAnswer: A\n\n(Câu trả lời khác: Chống giặc ngoại xâm)\n\nQuestion: 355. Những biến đối và khác biệt của giai cấp công nhân hiện đại so với giai cấp công nhân thế ki XIX là gì? (Chọn 3)\n\nA. Xu hướng trí tuệ hóa tăng nhanh\nB. Xu hướng trung lưu hóa gia tăng\nC. Là giai cấp giữ vai trò lãnh đạo, cầm quyền trong quá trình xây dựng chủ nghĩa xã hội ở một số quốc gia\nD. Xu hưởng bần cùng hóa gia tăng nhanh chóng\nAnswer: ABC\n\nQuestion: 356. Tín đồ có chức vụ, phẩm sắc trong tôn giáo được gọi là gì?\n\nA. Lãnh đạo tôn giáo\nB. Quản lý tôn giáo\nC. Giáo chủ tôn giáo\nD. Chức sắc tôn giáo\nAnswer: D\n\nQuestion: 357. Quyền tự do kết hôn trên cơ sở tình yêu và quyền tự do ly hôn là hai quyền thực hiện nguyên tắc nào của chế độ hôn nhân tiến bộ?\nA. Hôn nhân tự nguyện\nB. Hôn nhân một vợ một chồng, vợ chồng bình đẳng\nC. Hôn nhân được đàm bảo về mặt pháp lý\nD. Hôn nhân được đàm bảo về mặt kinh tế\nAnswer: A\n\nQuestion: 358. Đâu không phải là hôn nhân tiến bộ?(NHUNG HOÀNG)\n\nA. Hôn nhân tự nguyện\n\nB. Hôn nhân một vợ, một chồng, vợ chồng bình đẳng\n\nC. Hôn nhân một vợ, một chồng, chồng nắm quyền\n\nD. Hôn nhân được đảm bảo về pháp lý\nAnswer: C\n\nQuestion: 359. Trong sứ mệnh lịch sử của giai cấp công nhân trên lĩnh vực văn hóa - tư tưởng, hệ giá trị mỗi mà giai cấp công nhân cần tập trung xây dựng là gì?\nA. Lao động, công bằng; dân chủ, bình đẳng và tự do\nB. Tự do; bình đẳng; bác ái\nC. Độc lập; tự do; dân chủ, văn minh\nD. Dân giàu, nước mạnh; công bằng dân chủ và văn minh\nAnswer: A\n\nQuestion: 360. Hôn nhân xuất phát từ tinh yêu giữa nam và nữ được xem là hôn nhân như thế nào?\nA. Hôn nhân chậm tiến bộ\nB. Hôn nhân tiến bộ\nC. Hôn nhân không được đàm bảo\nD. Hôn nhân huyết thống\nAnswer: B\n\nQuestion: 361. Nền dân chủ xã hội chủ nghĩa đầu tiên chính thức được xác lập khi nào?\nA. Cách mạng tháng 8 năm 1945 thành công\nB. Bản tuyên ngôn nhân quyền và dân quyền của Pháp (1789)\nC. Tuyên ngôn độc lập của Mỹ (1776)\nD. Cách mạng Tháng Mười Nga thành công với sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới (1917)\nAnswer: D\n\nQuestion: 362. Dân chủ xã hội chủ nghĩa được xem là phôi thai tử thực tiễn đấu tranh giai cấp ở quốc gia nào?\nA. Ở Đức\nB. Ở Pháp\nC. Ở Liên Xô\nD. Ở Trung Quốc\nAnswer: B\n\nQuestion: 363. Có bao nhiêu phương hướng cơ bản xây dựng và phát triển gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội?(NHUNG HOÀNG)\n\nA. 3\n\nB. 4\n\nC. 5\n\nD. 6\nAnswer: B\n\nQuestion: 364. Về nội dung văn hóa, tư tưởng, sứ mệnh lịch sử của giai cấp công nhân được thể hiện như thế nào?(NHUNG HOÀNG)\n\nA. Giai cấp công nhân thực hiện xây dựng và củng cố ý thức hệ tiên tiến của mình.\n\nB. Giai cấp công nhân thực hiện xây dựng đạo đức và lối sống mới xã hội chủ nghĩa\n\nC. Tất cả các đáp án đều đúng\n\nD. Giai cấp công nhân thực hiện xây dựng con người mới xã hội chủ nghĩa\nAnswer: C\n\nQuestion: 365. Sự biến đổi của cơ cấu xã hội - giai cấp gắn liền và được quy định bởi sự biến động của cơ cấu nào?\nA. Cơ cấu xã hội - dân số\nB. Cơ cấu xã hội - kinh tế\nC. Cơ cấu xã hội - dân tộc\nD. Cơ cấu xã hội - dân cư\nAnswer: B\n\nQuestion: 366. Điền cụm từ thích hợp vào (_):\"Các dân tộc hoàn toàn ..., các dân tộc được quyền tự quyết, liên hiệp... tất cả các dân tộc lại\"\nA. Bình đẳng/ công nhân\nB. Hòa bình/ công nhân\nC. Công nhân/ nông dân\nD. Hòa bình/ bình đẳng\nAnswer: A\n\nQuestion: 367. \"Tôn giáo là một hiện tượng xã hội - văn hóa do con người sáng tạo ra\" là khẳng định xuất phát từ:\nA. Tư tưởng Hồ Chí Minh\nB. Đảng Cộng sản Việt Nam\nC. Chủ nghĩa Mác - Lênin\nD. Ph. Ăngghen\nAnswer: C\n\nQuestion: 368. Điền cụm từ thích hợp vào (.): Tôn giáo là một hiện tượng ... -... do con người sáng tạo.\nA. Xã hội/ văn hóa\nB. Kinh tế/ văn hóa\nC. Chính trị/ xã hội\nD. Giáo dục/ y tế\nAnswer: A\n\nQuestion: 369. Trong gia đình Việt Nam hiện đại, sự bền vững của hôn nhân phụ thuộc rất nhiều vào yếu tố nào?\nA. Có con hay không có con\nB. Có con trai hay không có con trai\nC. Tâm lý, tình cảm, kinh tế\nD. Địa vị xã hội, kinh tế\nAnswer: C\n\nQuestion: 370. Hình thức dân chủ nào ở Việt Nam mà thông qua nó, người dân băng hành động của minh thực hiện quyền làm chủ nhà nước và xã hội, không thông qua chủ thế trung gian?\nA. Hình thức dân chủ trực tiếp\nB. Hình thức dân chủ gián tiếp\nC. Hình thức dân chủ đại nghị\nD. Hình thức dân chủ công khai\nAnswer: A\n\nQuestion: 371. Tuyên ngôn của Đảng Cộng sản đánh dấu sự ra đời của:\nA. Chủ nghĩa Mác - Lênin\nB. Kinh tế chính trị Mác - Lênin\nC. Chủ nghĩa xã hội khoa học\nD. Triết học Mác - Lênin\nAnswer: C\n\nQuestion: 372. Thách thức lớn nhất đặt ra cho các gia đình Việt Nam hiện nay là gì?\nA. Vấn đề thất nghiệp, mất ổn định về kinh tế\nB. Vẫn đề học tập, phát triển của con cái - thế hệ tương lai\nC. Vấn đề mâu thuẫn giữa các thế hệ do sự khác biệt về tuổi tác\nD. Vẫn đê kế hoạch hóa gia đình\nAnswer: C\n\nQuestion: 373. Cuối thế kỷ XIV - đầu thế ký XV, giai cấp tư sản với những tư tường tiến bộ về tự do, công bằng, dân chủ đã mở đường cho sự ra đời của nền dân chủ nào?(NHUNG HOÀNG)\n\nA. Dân chủ nông dân\n\nB. Dân chủ tư sản\n\nC. Dân chủ vô sản\n\nD. Dân chủ hòa bình\nAnswer: B\n\nQuestion: 374. Điền cụm từ thích hợp vào (...): \"Về lý luận, không thể nghi ngờ gì được rằng giữa ... và ..., có một thời kỳ quá độ nhất định\"(NHUNG HOÀNG)\n\nA. Chủ nghĩa tư bản/ chủ nghĩa cộng sản\n\nB. Chủ nghĩa tư băn/ Giai cấp công nhân\n\nC. Nhân dân lao động/ chính quyền\n\nD. Chính trị/ xã hội\nAnswer: A\n\nQuestion: 375. Làm sao để xóa bò triệt để ngay lập tức các giai cấp, tăng lớp của cơ cấu xã hội - giai cấp trong thời kì quá độ lên chủ nghĩa xã hội?\nA. Giai cấp công nhân, liên minh cùng với các giai cấp, tầng lớp khác tổ chức nhà nước và thực hiện công cụ chuyên chính vô sản thực thi xóa bò ngay lập tức giai cấp tư sản, và sau đó xóa bò luôn giai cấp mình\nB. Các giai cấp, tầng lớp chủ động đứng vào hàng ngũ của Đảng Cộng sản để thống nhất xóa bò sự tồn tại của giai cấp\nC. Sự tôn tại các giai cấp, tầng lớp trong thời kì quá độ lên chủ nghĩa xã hội là vấn đề mang tính quy luật, chỉ có thê cải tạo dần chứ chưa thế xóa bò triệt để, ngay lập tức được\nD. Quốc hữu hóa tất cà tài sản, tịch thu ruộng đất, gia\nAnswer: C\n\nQuestion: 376. Trong quá trình xây dựng chủ nghĩa xã hội, liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức dưới góc độ nào giữ vai trò quyết định?(NHUNG HOÀNG)\n\nA. Chính trị\n\nB. Kinh tế\n\nC. Văn hoá\n\nD. Tư tưởng\nAnswer: B\n\nQuestion: 377. Dân chủ với tư cách là một hình thức tổ chức thiết chế chính trị hay một hình thái nhà nước, thì nó là:\nA. Phạm trù vĩnh viễn, tồn tại trong mọi chế độ xã hội\nB. Phạm trù lịch sử, mất đi khi nhà nước tiêu vong\nC. Phạm trù lịch sử, mất đi khi tiến lên chủ nghĩa xã hội\nD. Phạm trù lịch sử, tồn tại trong các chế độ xã hội ngoài chế độ quân chủ phong kiến\nAnswer: B\n\nQuestion: 378. Theo nghĩa rộng, dân tộc có bao nhiêu đặc trưng cơ bản?\nA. 4\nB. 5\nC. 6\nD. 7\nAnswer: B\n\nQuestion: 379. Theo nghĩa hẹp, dân tộc có bao nhiêu đặc trưng cơ bản?\nA. 3\nB. 4\nC. 5\nD. 6\nAnswer: A\n\nQuestion: 380. Tổ chức và hoạt động của bộ máy nhà nước pháp quyền xã hội chủ nghĩa Việt Nam thực hiện theo nguyên tắc nào?\nA. Nguyên tắc tập trung dân chủ\nB. Nguyên tắc dân chủ rộng rãi\nC. Nguyên tắc cá nhân phụ trách\nD. Nguyên tắc lập pháp\nAnswer: A\n\nQuestion: 381. Công cuộc đổi mới do Đảng Cộng sản Việt Nam khởi xướng và lãnh đạo tại Đại hội lần thứ bao nhiêu?(NHUNG HOÀNG)\n\nA. Lần thứ IV\n\nB. Lần thứ VI\n\nC. Lần thứ X\n\nD. Lần thứ XIII\nAnswer: B\n\nQuestion: 382. Về mặt thực tiền, đâu không phải là một ý nghĩa của việc nghiên cứu chủ nghĩa xã hội khoa học?\nA. Thấy rõ khoảng cách giữa lý luận chủ nghĩa xã hội khoa học và thực tiễn vận dụng nó\nB. Sự sụp đổ của Liên Xô và Đông Âu là do đã nhận thức và hành động trên nhiều vẫn đê trái với chủ nghĩa xã hội khoa học, trái với chủ nghĩa Mác - Lênin chứ không phải là do đi theo chủ nghĩa xã hội khoa học làm cho các nước này khủng hoảng\nC. Cần có bản lĩnh vững vàng, sáng suốt và sáng tạo trong việc vận dụng chủ nghĩa xã hội khoa học vào bối cành lịch sử cụ thể của từng quốc gia, tránh giáo điều, bảo thủ, duy ý chí\nD. Giúp chúng ta có căn cứ nhận thức khoa học để luôn cảnh giác, phân tích đúng và đấu tranh chống\nAnswer: D\n\nQuestion: 383. Giải quyết hai vấn đề nào sau đây cần phải đặt trong mối quan hệ với cộng đồng quốc gia - dân tộc thống nhất theo định hướng xã hội chủ nghĩa?\nA. Văn hóa và hội nhập quốc tế\nB. Tư sản và vô sản\nC. Giáo dục và y tế\nD. Dân tộc và tôn giáo\nAnswer: D\n\nQuestion: 384. Trong thời kỳ quá độ lên chủ nghĩa xã hội, yếu tố nào quyết định mỗi quan hệ hợp tác, gẵn bó chặt chẽ giữa các giai cấp, tầng lớp?\nA. Họ cùng nhau cải tạo xã hội cũ, xây dựng xã hội mới trong mọi lĩnh vực của đời sống xã hội\nB. Họ cùng nhau xây dựng xã hội mới trong mọi lĩnh vực của đời sống xã hội\nC. Họ cùng nhau cải tạo xã hội cũ trong mọi lĩnh vực của đời sống xã hội\nD. Họ cùng nhau cải tạo xã hội cũ, xây dựng xã hội mới trong lĩnh vực kinh tế, chính trị\nAnswer: A\n\nQuestion: 385. Vấn đề: \"Xây dựng nhà nước do nhân dân lao động làm chủ, đó là Nhà nước của dân, do dân, vì dân\" là đặc điềm thứ mấy trong các đặc điểm của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam? (NHUNG HOÀNG)\n\nA. 1 \n\nB. 3 \n\nC. 5 \n\nD. 6\nAnswer: A\n\nQuestion: 386. Đâu không phải là hạn chế của chủ nghĩa xã hội không tưởng Pháp?\nA. Không chỉ ra được những biện pháp để hiện thực hóa học thuyết của mình\nB. Không phát hiện ra quy luật phát triển vận động của xã hội nói chung và của xã hội tư bản chủ nghĩa nói riêng\nC. Không phát hiện ra sứ mệnh lịch sử của giai cấp công nhân\nD. Không biết được vai trò của nô lệ trong cách mạng xã hội\nAnswer: D\n\nQuestion: 387. Vấn đề nổi bật nhất đối với việc thực hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay là gì?(NHUNG HOÀNG)\n\nA. Phát huy vai trò và trách nhiệm của lực lượng đi đầu trong sự nghiệp đấy mạnh công nghiệp hóa, hiện đại hóa đất nước\n\nB. Phát huy vai trò của lực lượng đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước\n\nC. Phát huy trách nhiệm của lực lượng đi đầu trong sự nghiệp đấy mạnh công nghiệp hóa, hiện đại hóa đất nước\n\nD. Phát huy sức chiến đấu của bản thân trong sự nghiệp đấy mạnh công nghiệp hóa, hiện đại hóa đất nước\nAnswer: A\n\nQuestion: 388. Quyền nào là cơ sở để thực hiện quyền dân tộc tự quyết và xây dựng mỗi quan hệ hữu nghị, hợp tác giữa các dân tộc?(NHUNG HOÀNG)\n\nA. Quyền tự quyết của các dân tộc\n\nB. Quyền tự do ngôn luận\n\nC. Quyền bình đẳng giữa các dân tộc\n\nD. Quyền lập pháp của các dân tộc\nAnswer: C\n\nQuestion: 389. Trong gia đình Việt Nam hiện nay, người chủ gia đình là ai? (NHUNG HOÀNG)\n\nA. Người lớn tuổi nhất trong gia đình \n\nB. Người có trình độ cao nhất trong gia đình \n\nC. Nguời lớn tuổi nhất và có trình độ cao nhất trong gia đình \n\nD. Có thể là người đàn ông, người phụ nữ hoặc cả hai\nAnswer: D\n\nQuestion: 390. Nếu thiếu đi cơ sở văn hóa, hoặc cơ sở văn hóa không đi liền với cơ sở kinh tế, chính trị thì việc xây dựng gia đình sẽ bị ảnh hưởng như thế nào?(NHUNG HOÀNG)\n\nA. Việc xây dựng gia đình sẽ lệch lạc, không đạt hiệu quả\n\nB. Hệ thống chính sách, pháp luật về xây dựng gia đình sẽ không thể hoàn thiện\n\nC. Việc xây dựng gia đình không còn dựa trên nền tảng hệ tư tưởng chính trị\n\nD. Việc xây dựng gia đình sẽ không hướng tới đời sống văn hóa, tinh thần\nAnswer: A\n\nQuestion: 391. Theo nghĩa hẹp, các tiêu chí xác định các đặc trưng cơ bản của một dân tộc - tộc người là gì? Lựa chọn các đáp án đúng. (3)\nA. Cộng đồng về ngôn ngữ\nB. Cộng đồng về văn hóa\nC. Ý thức tự giác tộc người\nD. Cộng đồng về lãnh thổ\nAnswer: ABC\n\nQuestion: 392. Trong các cơ cấu xã hội, cơ cấu xã hội nào có vị trí quan trọng hàng đầu, chi phối các loại hình cơ cấu xã hội khác?(NHUNG HOÀNG)\n\nA. Cơ cấu xã hội - dân tộc\n\nB. Cơ cấu xã hội dân cư\n\nC. Cơ cấu xã hội - nghề nghiệp\n\nD. Cơ cấu xã hội - giai cấp\nAnswer: D\n\nQuestion: 393. \"Do lực lượng sản xuất chưa phát triển, con người cảm thấy yếu đuối, bất lực, không giải thích được, nên con người đã gán cho tự nhiên một sức mạnh, quyền lực thần bí, vấn đề này nói lên nguồn gốc nào của tôn giáo?(NHUNG HOÀNG)\n\nA. Nguồn gốc tâm lý\n\nB. Nguồn gốc nhận thức\n\nC. Nguồn gốc tự nhiên, kinh tế - xã hội\n\nD. Nguồn gốc ý chí\nAnswer: C\n\nQuestion: 394. Giai cấp nào được xem là con đẻ của nền đại công nghiệp tư bản chủ nghĩa?(NHUNG HOÀNG)\n\nA. Tư sản\n\nB. Nông dân\n\nC. Công nhân\n\nD. Bị bóc lột\nAnswer: C\n\nQuestion: 395. Đâu không phải là một cơ sở xây dụng gia đình trong thời kì quá độ lên chủ nghĩa xã hội?(NHUNG HOÀNG)\n\nA. Cơ sở kinh tế - xã hội\n\nB. Cơ sở chính trị - xã hội\n\nC. Cơ sở văn hóa\n\nD. Cơ sở lao động, sản xuất\nAnswer: D\n\nQuestion: 396. Nhân tố nào sau đây có vai trò quyết định đến sự tồn tại và phát triển của xã hội? (NHUNG HOÀNG)\n\nA. Con người \n\nB. Gia đinh \n\nC. Tư duy \n\nD. Khoa học kỹ thuật\nAnswer: A\n\nQuestion: 397. Ở nước ta hiện nay, sự bền vững của hôn nhân phụ thuộc vào yếu tố nào?(NHUNG HOÀNG)\n\nA. Yếu tố con cái nhiều hay ít\n\nB. Yếu tố con cái là trai hay gái\n\nC. Yếu tố truyền thống gia trưởng\n\nD. Yếu tố tâm lý, tình cảm và kinh tế\nAnswer: D\n\nQuestion: 398. Chức năng và nhiệm vụ của chủ nghĩa xã hội khoa học là gì?\nA. Là trang bị những tri thức khoa học của chủ nghĩa Mác - Lênin đã phát hiện ra và luận giải về quá trình tất yếu lịch sử dẫn đến hình thành, phát triển hình thái kinh tế - xã hội cộng sản, giải phóng xã hội, giải phóng con người.\nB. Là giáo dục, trang bị lập trường tư tưởng chính trị của giai cấp công nhân cho đảng cộng sản, giai cấp công nhân và nhân dân lao động.\nC. Là định hướng về chính trị - xã hội cho mọi hoạt động của giai cấp công nhân, của đảng cộng sản, của nhà nước và của nhân dân lao động trên mọi lĩnh vực.\nD. Cả a, b và c đều đúng\nAnswer: D\n\nQuestion: 399. Nội dung văn hóa - xã hội của liên minh giai cấp, tầng lớp là gì?\nA. Xây dựng nền văn hóa và con người Việt Nam phát triễn toàn diện\nB. Xây dựng nền văn hóa và nhà nước của dân, do dân, vì dân\nC. Xây dựng nền văn hóa và xây dựng Đảng trong sạch, vững mạnh\nD. Xây dựng nền văn hóa và tăng cường bản chất giai cấp công nhân\nAnswer: A\n\nQuestion: 400. Vấn đê nào dễ dẫn tối nguy cơ gây mất ổn định chính trị, xã hội, dễ tạo cơ hội cho các thế lực thủ địch bên ngoài can thiệp vào công việc nội bộ của đất nước? (NHUNG HOÀNG)\n\nA. Vẫn đê tôn giáo và dẫn tộc \n\nB. Vãn đê mê tín dị đoan và thờ cúng ông bà \n\nC. Vấn đê ngoại giao \n\nD. Vấn đề chính trị\nAnswer: A\n\nQuestion: 401. Bản chất của chủ nghĩa xã hội ở nước Nga Xôviết có mấy đặc trưng?\nA. 3\nB. 4\nC. 5\nD. 6\nAnswer: D\n\nQuestion: 402. Về phương diện thế giới quan, đa số các tôn giáo mang thế giới quan nào?(NHUNG HOÀNG)\n\nA. Duy tâm\n\nB. Duy vật\n\nC. Duy vật biện chứng\n\nD. Duy vật siêu hình\nAnswer: A\n\nQuestion: 403. Cơ sở kinh tế - xã hội để xây dựng gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội là gì?\nA. Là sự phát triển của lực lượng sản xuất và tương ứng với nó là quan hệ sản xuất mới, xã hội chủ nghĩa\nB. Là sự phát triển của trình độ lao động, khoa học kỹ thuật của xã hội\nC. Là điều kiện lao động, công ăn, việc làm và thu nhập của công dân\nD. Thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động\nAnswer: A\n\nQuestion: 404. Trong giai đoạn hiện nay, tại sao Nhà nước lại khuyến khích mỗi cặp vợ chồng “nên sinh đủ hai con”?(NHUNG HOÀNG)\n\nA. Do Việt Nam đang chuyển sang giai đoạn già hóa dân số\n\nB. Do dân số Việt Nam quá ít so với mật độ trung bình của thế giới\n\nC. Do tỷ lệ tử vong và tuổi thọ trung bình người Việt Nam quá thấp\n\nD. Tất cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 405. Gia đình có bao nhiều chức năng cơ bản?(NHUNG HOÀNG)\n\nA. 3\n\nB. 4\n\nC. 5\n\nD. 6\nAnswer: A\n\nQuestion: 406. Phát kiến học thuyết giá trị thặng dư của C.Mác và Ph.Ăngghen có ý nghĩa gì đối với chủ nghĩa xã hội khoa học?\nA. Chỉ ra sự suy vong tự nhiên của chủ nghĩa tư bản\nB. Chỉ ra con đường đấu tranh giai cấp tiến lên chủ nghĩa xã hội\nC. Khẳng định về phương diện kinh tế sự diệt vong không thể tránh khỏi của chủ nghĩa tư bản và sự ra đời tất yếu của chủ nghĩa xã hội\nD. Khẳng định sự thiết lập nền chuyên chính vô sản bằng cách mạng xã hội là con đường duy nhất tiến đến chủ nghĩa xã hội\nAnswer: C\n\nQuestion: 407. \"Đạo Cao Đài, Phật giáo Hòa Hảo là hai trong số những tôn giáo nội sinh ở Việt Nam. Lịch sử từng ghi nhận rằng hai tôn giáo này đã cùng với người dân Nam Bộ tham gia kháng chiến chống giặc cứu nước\". Vấn đề vừa nếu thuộc đặc điểm thứ mấy trong số các đặc điểm tôn giáo ở Việt Nam?\nA. 1\nB. 2\nC. 3\nD. 4\nAnswer: D\n\nQuestion: 408. Chủ nghĩa xã hội khoa học sử dụng phương pháp luận nào?\nA. Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử\nB. Chủ nghĩa duy vật siêu hình và chủ nghĩa duy vật lịch sử\nC. Chủ nghĩa duy vật chất phác và chủ nghĩa duy vật lịch sử\nD. Chủ nghĩa duy tâm biện chứng và chủ nghĩa duy vật lịch sử\nAnswer: A\n\nQuestion: 409. Tác phẩm “Tuyên ngôn của Đảng Cộng sản\" đã đánh dấu sự ra đời của bộ phận lý luận nào của chủ nghĩa Mác – Lênin?(NHUNG HOÀNG)\n\nA. Chủ nghĩa Mác – Lênin\n\nB. Kinh tế chính trị Mác - Lênin\n\nC. Chủ nghĩa xã hội khoa học\n\nD. Triết học Mác – Lênin\nAnswer: C\n\nQuestion: 410. Phần lớn các tín đồ tôn giáo ở nước ta có đặc điểm chung là gì?\n\nA. Là nhân dân lao động, có lòng yêu nước, tinh thần dân tộc\nB. Là giai cấp yếu thế, có cuộc sống cơ cực, tin vào tôn giáo như một yếu tố giải thoát\nC. Có ý thức chống lại chủ nghĩa duy vật biện chứng\nD. Tham gia vào các phong trào đấu tranh chống chính quyền\nAnswer: A\n\nQuestion: 411. C.Mác và Ph.Ăngghen từng cho rằng: \"Quan hệ thứ ba tham dự ngay từ đầu vào quá trình phát triển lịch sử: hằng ngày tái tạo ra đời sống của bản thân mình, con người bắt đầu tạo ra những người khác, sinh sôi nẩy nở\". Cụm từ \"quan hệ thứ ba\" trong câu trên dùng để chi cái gì?\n\nA. Phát triển\nB. Sinh nở\nC. Bạn bè\nD. Gia đình\nAnswer: D\n\nQuestion: 412. Trong thời kỳ đổi mới, giai cấp công nhân nước ta có sử mệnh lịch sử to lớn là gì?(NHUNG HOÀNG)\n\nA. Giai cấp lãnh đạo cách mạng thông qua đội tiên phong là Đảng Cộng sản Việt Nam\n\nB. Giai cấp tiêu biểu cách mạng thông qua đội tiên phong là Đảng Cộng sản Việt Nam\n\nC. Giai cấp đại diện thông qua đội tiên phong là Đảng Cộng sản Việt Nam\n\nD. Giai cấp nòng cốt thông qua đội tiên phong là Đảng Cộng sản Việt Nam\nAnswer: A\n\nQuestion: 413. Cách mạng vô sản là:\nA. Cuộc cách mạng của giai cấp nông dân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, được thực hiện bằng con đường bạo lực cách mạng nhằm lật đổ chế độ tư bản chủ nghĩa, thiết lập nhà nước chuyên chính vô sản\nB. Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, trên thực tế được thực hiện bằng con đường tuyên truyền giáo dục nhằm lật đổ chế độ tư bản chủ nghĩa, thiết lập nhà nước chuyển chính vô sản\nC. Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, trên thực tế được thực hiện bằng con đường bạo lực cách mạng nhằm lật đổ chế độ phong kiến, thiết lập nhà nước chuyên chính vô sản\nD. Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, được thực hiện bằng con đường bạo lực cách mạng nhằm lật đổ chế độ tư bản chủ nghĩa, thiết lập nhà nước chuyên chính vô\nAnswer: A\n\nQuestion: 414. Giai cấp công nhân Việt Nam, giai cấp nông dân, đội ngũ trí thức, đội ngũ đoanh nhân. Đâu là lực lượng đi đấu trong sự nghiệp công nghiệp hoa, hiện đại hoa đất nước?(NHUNG HOÀNG)\n\nA. Giai cấp công nhân\n\nB. Giai cấp nông dân\n\nC. Đội Ngũ Trí thức\n\nD. Đội ngũ doanh nhân\nAnswer: A\n\nQuestion: 415. Theo V.I Lênin, vì sao các cộng đồng dân cư lại muốn tách ra để hình thành các cộng đồng dân tộc độc lập?(NHUNG HOÀNG)\n\nA. Do sự đàn áp, thống trị quá khắt nghiệt của chủ nghĩa thực dân\n\nB. Do mâu thuẫn lợi ích, quyền lợi\n\nC. Do sự thức tinh, trường thành về ý thức dân tộc\n\nD. Do sự phát triển về số lượng quá lớn\nAnswer: C\n\nQuestion: 416. Nhà nước xã hội chủ nghĩa là nhà nước của ai?(NHUNG HOÀNG)\n\nA. Nhân dân\n\nB. Công nhân- Nông dân\n\nC. Cống nhân- Nông dân - Trí thức\n\nD. Lãnh đạo, Đảng viên\nAnswer: A\n\nQuestion: 417. Những biểu hiện cơ bản của tư tưởng xã hội chủ nghĩa là gì?\nA. Là những ước mơ nguyện vọng về một chế độ xã hội ai cũng có việc làm ai cũng lao động\nB. Là quan niệm về một chế độ xã hội mà tư liệu sản xuất đều thuộc về mọi thành viên xã hội\nC. Là những tư tưởng về một xã hội, trong đó mọi người đều bình đẳng, có cuộc sống ấm no, tự do, hạnh phúc.\nD. Cả a, b và c\nAnswer: D\n\nQuestion: 418. Sự liên minh giữa giai cấp công nhãn vối giai cấp nông dẫn và tầng lớp trí thức là do điều gì quy định?(NHUNG HOÀNG)\n\nA. Do mong muốn của công nhân.\n\nB. Yêu cầu của nông dân\n\nC. Yêu cầu của trí thức\n\nD. Do đòi hỏi khách quan của cả công nhân, nông dân và trí thức.\nAnswer: D\n\nQuestion: 419. Về nội dung chính trị - xã hội, sứ mệnh lịch sử của giai cấp công nhân được thể hiện như thế nào?(NHUNG HOÀNG)\n\nA. Giai cấp công nhân cùng với nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản phải tiến hành cách mạng chính trị lật đổ quyền thống trị của giai cấp tư sản\n\nB. Giai cấp công nhân phải lãnh đạo được các giai cấp khác và lãnh đạo được Đảng Cộng sản để tiến hành cách mạng tư sản xóa bỏ chế độ thống trị của giai cấp tư sản\n\nC. Giai cấp công nhân phải cùng với nhân dân lao động lãnh đạo Đảng Cộng sản tiến hành cách mạng chính trị lật đồ chính quyền của giai cấp phong kiến\n\nD. Giai cấp công nhân phải xác lập được quyền thống trị nhân dân lao động và các giai cấp khác bằng cách thực hiện cách mạng lật đổ chính quyền của giai cấp tư sản\nAnswer: A\n\nQuestion: 420. Trong xã hội phong kiến, các mỗi quan hệ của gia đình có đặc điểm như thế nào?(NHUNG HOÀNG)\n\nA. Tuyệt đối hóa vai trò của người đàn ông, người chồng, người cha\n\nB. Tuyệt đối hóa vai trò của người phụ nữ, người vợ, người mẹ\n\nC. Mối quan hệ bình đẳng, sẻ chia\n\nD. Các mỗi quan hệ chịu sự chi phối của điều kiện kinh tế gia đình\nAnswer: A\n\nQuestion: 421. Trong nhà nước pháp quyền, điều gì được thượng tôn?(NHUNG HOÀNG)\n\nA. Quyền lợi của giai cấp công nhân\n\nB. Quyền lợi cùa nhà nước\n\nC. Pháp luật\n\nD. Ý chí, nguyện vọng của nhân dân lao động\nAnswer: C\n\nQuestion: 422. Thực hiện công nghiệp hóa, gắn liền công nghiệp hóa với hiện đại hóa, đẩy mạnh công nghiệp hóa gắn với phát triển kinh tế trí thức, bảo vệ tài nguyên, môi trường là nhiệm vụ của giai cấp công nhân trên lĩnh vực nào?\n\nA. Chính trị- xã hội\nB. Kinh tế\nC. Văn hóa\nD. Tư tưởng\nAnswer: B\n\nQuestion: 423. Theo quan điểm của chủ nghĩa Mác - Lênin, nguyên nhân chính quyết định sự biến đổi của cộng đồng dân tộc là gì?(NHUNG HOÀNG)\n\nA. Sự biến đối của giai cấp thống trị\n\nB. Sự biến đối của kiến trúc thượng tầng xã hội\n\nC. Sự biến đổi của cơ sở hạ tầng xã hội\n\nD. Sự biến đổi của phương thức sản xuất\nAnswer: D\n\nQuestion: 424. Điền vào chỗ trống: C. Mác và Ph. Ăngghen chi rõ: \"Từ chỗ là những hình thức phát triển của các lực lượng sản xuất, những quan hệ sản xuất ấy trở thành những xiềng xích của của các lực lượng sản xuất. Khi đó bắt đầu thời đại...\":\n\nA. Một cuộc tổng tiến công\nB. Một cuộc cải cách\nC. Tất cả đều đúng\nD. Một cuộc cách mạng\nAnswer: D\n\nQuestion: 425. Cơ cấu xã hội - giai cấp là gì?(NHUNG HOÀNG)\n\nA. Là hệ thông giai cấp, tầng lớp xã hội tồn tại khách quan trong một chế độ xã hội nhất định, thông qua những môi quan hệ về sở hữu tư liệu sản xuất, về tổ chức, quản lý quá trình sản xuất, vẽ địa vị chính trị xã hội ... giữa các giai cấp, tầng lớp đó\n\nB. Là hệ thống giai cấp, tầng lớp xã hội tồn tại chủ quan trong một chế độ xã hội nhất định, thông qua những mỗi quan hệ về sở hữu tư liệu sản xuất, về tố chức, quản lý quá trình sản xuất, về địa vị chính trị xã hội... giữa các giai cấp, tầng lớp đó\n\nC. Là hệ thống giai cấp, tầng lớp xã hội tồn tại khách quan trong một chế độ xã hội nhất định, thông qua những mỗi quan hệ về phân chia quyền lực nhà nước... giữa các giai cấp, tầng lớp đó\n\nD. Là hệ thống giai cấp, tầng lớp xã hội tồn tại chủ quan trong một chế độ xã hội nhất định, thông qua những mỗi quan hệ về phân chia quyền lực nhà nước... giữa các giai cấp, tăng lớp đó\nAnswer: A\n\nQuestion: 426. Đặc trưng nào dưới đây là quan trọng nhất, là cơ sở gắn kết các bộ phận, các thành viên trong dân tộc, tạo nên tính thống nhất, ổn định, bền vững của dân tộc?(NHUNG HOÀNG)\n\nA. Chung một vùng lãnh thổ\n\nB. Chung một phương thức sinh hoạt kinh tế\n\nC. Chung một ngôn ngữ làm công cụ giao tiếp\n\nD. Chung một nên văn hóa và tâm lý\nAnswer: B\n\nQuestion: 427. Nội dung nào dưới đây không phải là điều kiện dẫn tới sự ra đời của chủ nghĩa xã hội?\n\nA. Sự phát triển của lực lượng sản xuất\nB. Sự trưởng thành của giai cấp công nhân\nC. Quan hệ sản xuất tư bản chủ nghĩa trở nên lỗi thời\nD. Mong muốn chủ quan của giai cấp công nhân\nAnswer: D\n\nQuestion: 428. Tôn giáo là một hiện tượng xã hội phản ánh sự bất lực và bế tắc của con người trước tự nhiên và xã hội, tuy nhiên, tôn giáo cũng chứa đựng một số giá trị phù hợp với đạo đức, đạo lí của con người thể hiện nội dung gì?(NHUNG HOÀNG)\n\nA. Nguồn gốc của tôn giáo\n\nB. Tính chất của tôn giáo\n\nC. Chức năng của tôn giáo\n\nD. Bản chất của tôn giáo\nAnswer: D\n\nQuestion: 429. Cơ sở kinh tế của nền dân chủ xã hội chủ nghĩa là gì?\n\nA. Nền kinh tế hàng hóa nhiều thành phần\nB. Chế độ công hữu về những tư liệu sản xuất chủ yếu của xã hội\nC. Chế độ sở hữu tư nhân về tư liệu sản xuất\nD. Nền kinh tế thị trường xã hội chủ nghĩa\nAnswer: B\n\nQuestion: 430. Trong gia đình, quan hệ thứ ba tham gia ngay từ đầu vào quá trình phát triển lịch sử, đó là quan hệ nào?(NHUNG HOÀNG)\n\nA. Quan hệ giữa chồng và vợ, quan hệ giữa cha mẹ và con cái\n\nB. Quan hệ giữa ông bà với con cái, quan hệ giữa vợ và chồng\n\nC. Quan hệ giữa tổ tiên và ông bà, cha mẹ\n\nD. Quan hệ giữa con cái và cha mẹ\nAnswer: A\n\nQuestion: 431. Trong sứ mệnh lịch sửa của giai cấp công nhân trên lĩnh vực văn hóa, tư tưởng, những giá trị mà nhân loại thừa nhận và phấn đấu thực hiện là gì?(NHUNG HOÀNG)\n\nA. Lao động; sáng tạo; công bằng; dân chủ, bình đẳng và tự do\n\nB. Tự do; bình đẳng; bác ái\n\nC. Độc lập; tự do; dẫn chủ, văn minh\n\nD. Dân giàu, nước mạnh; công bằng, dân chủ và văn minh\nAnswer: A\n\nQuestion: 432. Nội dung nào dưới đây không phản ánh đúng vị trí của gia đình trong xã hội?(NHUNG HOÀNG)\n\nA. Gia đình là tế bào của xã hội\n\nB. Gia đình là tổ ấm của mỗi thành viên\n\nC. Gia đình là cầu nối giữa cá nhân và xã hội\n\nD. Gia đình là bộ phận của làng xã\nAnswer: D\n"</script><script>const QUESTIONS = [{"id": 1, "text": "Nghị quyết \"Về phát huy sức mạnh đại đoàn kết dân tộc vì dân giàu nước mạnh, xã hội công bằng, dân chủ, văn minh\" được đề cập đến ở Hội nghị Trung ương nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Hội nghị Trung ương VII khoá IX"}, {"key": "B", "text": "Hội nghị Trung ương II khoá VII"}, {"key": "C", "text": "Hội nghị Trung ương V khóa VIII"}, {"key": "D", "text": "Hội nghị Trung ương VI khóa VIII"}], "answer": ["A"], "note": "", "block": 1}, {"id": 2, "text": "Quá độ gián tiếp lên chủ nghĩa xã hội là bỏ qua chế độ gì?", "options": [{"key": "A", "text": "Phong kiến"}, {"key": "B", "text": "Tư bản chủ nghĩa"}, {"key": "C", "text": "Chiếm hữu nô lệ"}, {"key": "D", "text": "Cộng sản nguyên thủy"}], "answer": ["B"], "note": "", "block": 1}, {"id": 3, "text": "Hiện nay, kiểu gia đình nào đang trở nên rất phổ biến ở các đô thị và cả ở nông thôn Việt Nam ?", "options": [{"key": "A", "text": "Gia đình hạt nhân"}, {"key": "B", "text": "Gia đình truyền thống"}, {"key": "C", "text": "Gia đình đồng đại"}, {"key": "D", "text": "Gia đình kết nối"}], "answer": ["A"], "note": "", "block": 1}, {"id": 4, "text": "Dựa vào bản chất chính trị thì yếu tố nào được xem là yếu tố quan trọng để đảm bảo quyền lực thực sự thuộc về nhân dân?", "options": [{"key": "A", "text": "Giai cấp nông dân lãnh đạo"}, {"key": "B", "text": "Đảng Cộng sản lãnh đạo"}, {"key": "C", "text": "Nhà nước lãnh đạo"}, {"key": "D", "text": "Giai cấp tư sản lãnh đạo"}], "answer": ["B"], "note": "", "block": 1}, {"id": 5, "text": "Trong thời đại hiện nay, ở các nước phát triển, sự phát triển của giai cấp công nhân có mối quan hệ như thế nào với phát triển kinh tế?", "options": [{"key": "A", "text": "Tỷ lệ thất nghiệp gia tăng, làm tăng nguy cơ khủng hoảng"}, {"key": "B", "text": "Tỷ lệ thuận"}, {"key": "C", "text": "Tỷ lệ nghịch"}, {"key": "D", "text": "Mâu thuẫn đối kháng"}], "answer": ["B"], "note": "", "block": 1}, {"id": 6, "text": "Theo cương lĩnh dân tộc của chủ nghĩa Mác - Lenin, trong các nội dung của quyền dân tộc tự quyết thì nội dung nào được coi là cơ bản nhất, tiên quyết nhất?", "options": [{"key": "A", "text": "Tự quyết về lãnh thổ"}, {"key": "B", "text": "Tự quyết về văn hóa"}, {"key": "C", "text": "Tự quyết về kinh tế"}, {"key": "D", "text": "Tự quyết về chính trị"}], "answer": ["D"], "note": "", "block": 1}, {"id": 7, "text": "Câu nói sau đây do ai nói: \"Vô sản tất cả các nước và các dân tộc bị áp bức, đoàn kết lại!\"?", "options": [{"key": "A", "text": "V.I.Lênin"}, {"key": "B", "text": "Chủ tịch Hồ Chí Minh"}, {"key": "C", "text": "C.Mác"}, {"key": "D", "text": "Ph.Ăngghen"}], "answer": ["A"], "note": "", "block": 1}, {"id": 8, "text": "Theo V.I. Lênin, nguyên tắc cao nhất của chuyên chính vô sản ở Nga khi thực hiện cách mạng tháng Mười và cả giai đoạn sau đó là gì?", "options": [{"key": "A", "text": "Duy trì khối liên minh giữa giai cấp vô sản và nông dân để giai cấp vô sản có thẻ giữ được vai trò lãnh đạo"}, {"key": "B", "text": "Duy trì trấn áp giai cấp, duy trì quyền lãnh đạo duy nhất của giai cấp công nhân"}, {"key": "C", "text": "Duy trì khối liên minh tất cả giai cấp, tầng lớp sau khi đã giành được chính quyền"}, {"key": "D", "text": "Điều hòa mâu thuẫn giữa các giai cấp, bảo đảm các bên có quyền lợi và nghĩa vụ như nhau"}], "answer": ["A"], "note": "", "block": 1}, {"id": 9, "text": "Theo cấp độ quốc gia, đâu là tín ngưỡng truyền thống quan trọng của dân tộc Việt Nam?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tín ngưỡng thờ cúng tổ tiên"}, {"key": "B", "text": "Tín ngưỡng thành hoàng"}, {"key": "C", "text": "Tín ngưỡng thờ cúng vua Hùng"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["C"], "note": "", "block": 1}, {"id": 10, "text": "Đáp án nào không phải là một phương pháp nghiên cứu của chủ nghĩa xã hội khoa học?", "options": [{"key": "A", "text": "Phương pháp kết hợp lịch sử và logic"}, {"key": "B", "text": "Phương pháp khảo sát và phân tích về mặt chính trị xã hội"}, {"key": "C", "text": "Phương pháp trừu tượng hóa khoa học"}, {"key": "D", "text": "Phương phép so sánh"}], "answer": ["C"], "note": "", "block": 1}, {"id": 11, "text": "Xu hướng phát triển của mối quan hệ dân tộc nào nổi lên trong giai đoạn chủ nghĩa tư bản đã phát triển thành chủ nghĩa đế quốc đi bóc lột thuộc địa?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc độc lập"}, {"key": "B", "text": "Các dân tộc trong từng quốc gia, thậm chí các dân tộc ở nhiều quốc gia muốn liên hiệp lại với nhau"}, {"key": "C", "text": "Cộng đồng dân tộc yếu thể có xu hướng xác nhập với các dân tộc có trình độ phát triển cao hơn"}, {"key": "D", "text": "Cộng đồng dân tộc phát triển hưng thịnh sẽ có ý định tách ra hình thành quốc gia - dân tộc độc lập"}], "answer": ["B"], "note": "(Kiểu hỏi khác: Theo V.I.Lênin, các xu hướng khách quan của sự phát triển quan hệ dân tộc là gì?)", "block": 1}, {"id": 12, "text": "Tại sao trong thời kì quá độ lên chủ nghĩa xã hội, cơ cấu xã hội - giai cấp lại biến đổi phức tạp, đa dạng?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Vì đó là thời kì chuyển tiếp giữa cái cũ và cái mới, có nhiều yếu tố đan xen"}, {"key": "B", "text": "Vì các giai cấp cạnh tranh quyền lực lãnh đạo của nhau"}, {"key": "C", "text": "Vì sự chống phá của các thế lực thù địch bên ngoài"}, {"key": "D", "text": "Vì trong xã hội còn tồn tại nhiều giai cấp, tầng lớp"}], "answer": ["A"], "note": "", "block": 1}, {"id": 13, "text": "Về phương diện kinh tế - xã hội, giai cấp công nhân lao động bằng phương thức công nghiệp ngày càng hiện đại với đặc điểm nổi bật nào?", "options": [{"key": "A", "text": "Sản xuất bằng máy móc"}, {"key": "B", "text": "Tạo ra những tiền đề của cải vật chất cho xã hội mới"}, {"key": "C", "text": "Lao động có tính chất xã hội hóa và năng suất lao động cao"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 1}, {"id": 14, "text": "Một trong những đặc trưng cơ bản của dân tộc - tộc người là gì?", "options": [{"key": "A", "text": "Cộng đồng về giáo dục"}, {"key": "B", "text": "Cộng đồng về y tế"}, {"key": "C", "text": "Cộng đồng về ngôn ngữ"}, {"key": "D", "text": "Cộng đồng lao động"}], "answer": ["C"], "note": "", "block": 1}, {"id": 15, "text": "Tại sao trong bất kì xã hội nào, muốn tiền lên chủ nghĩa xã hội đều tất yếu phải trải qua thời kỳ quá độ?", "options": [{"key": "A", "text": "Vì chủ nghĩa xã hội có bản chất đối lập với các chế độ xã hội bóc lột trước đó, giai cấp vô sản cần có thời gian để cải tạo xã hội cũ, xây dựng xã hội mới"}, {"key": "B", "text": "Vì chủ nghĩa xã hội là thực hiện ý chí chủ quan của giai cấp công nhân và nhân dân lao động"}, {"key"

</style></head><body><aside><a class="brand" href="#home"><span class="brand-icon">M</span><span>Góc ôn tập<small>MLN131 · CNXH khoa học</small></span></a><div class="nav-label">KHÔNG GIAN HỌC TẬP</div><nav id="nav" aria-label="Chức năng"></nav><div class="sidebar-bottom"><span class="source-dot"></span>432 câu từ tài liệu của bạn<p>Tiến độ lưu trên trình duyệt này.</p><a href="source.txt" download>Tải tài liệu gốc</a></div></aside><div class="workspace"><header><span id="breadcrumb">Tổng quan</span><span class="header-right">Học từng chút, nhớ thật lâu <span class="avatar">K</span></span></header><main id="app"></main><footer>MLN131 · 432 câu hỏi <span>Đáp án và ghi chú được giữ theo file nguồn.</span></footer></div><div id="toast" role="status" aria-live="polite"></div><script type="application/json" id="original-source">"\nQuestion: 1. Nghị quyết \"Về phát huy sức mạnh đại đoàn kết dân tộc vì dân giàu nước mạnh, xã hội công bằng, dân chủ, văn minh\" được đề cập đến ở Hội nghị Trung ương nào?(NHUNG HOÀNG)\n\nA. Hội nghị Trung ương VII khoá IX\n\nB. Hội nghị Trung ương II khoá VII\n\nC. Hội nghị Trung ương V khóa VIII\n\nD. Hội nghị Trung ương VI khóa VIII\nAnswer: A\n\nQuestion: 2. Quá độ gián tiếp lên chủ nghĩa xã hội là bỏ qua chế độ gì?\nA. Phong kiến\nB. Tư bản chủ nghĩa\nC. Chiếm hữu nô lệ\nD. Cộng sản nguyên thủy\nAnswer: B\n\nQuestion: 3. Hiện nay, kiểu gia đình nào đang trở nên rất phổ biến ở các đô thị và cả ở nông thôn Việt Nam ?\nA. Gia đình hạt nhân\nB. Gia đình truyền thống\nC. Gia đình đồng đại\nD. Gia đình kết nối\nAnswer: A\n\nQuestion: 4. Dựa vào bản chất chính trị thì yếu tố nào được xem là yếu tố quan trọng để đảm bảo quyền lực thực sự thuộc về nhân dân?\nA. Giai cấp nông dân lãnh đạo\nB. Đảng Cộng sản lãnh đạo\nC. Nhà nước lãnh đạo\nD. Giai cấp tư sản lãnh đạo\nAnswer: B\n\nQuestion: 5. Trong thời đại hiện nay, ở các nước phát triển, sự phát triển của giai cấp công nhân có mối quan hệ như thế nào với phát triển kinh tế?\nA. Tỷ lệ thất nghiệp gia tăng, làm tăng nguy cơ khủng hoảng\nB. Tỷ lệ thuận\nC. Tỷ lệ nghịch\nD. Mâu thuẫn đối kháng\nAnswer: B\n\nQuestion: 6. Theo cương lĩnh dân tộc của chủ nghĩa Mác - Lenin, trong các nội dung của quyền dân tộc tự quyết thì nội dung nào được coi là cơ bản nhất, tiên quyết nhất?\n\na. Tự quyết về lãnh thổ\nb. Tự quyết về văn hóa\nc. Tự quyết về kinh tế\nd. Tự quyết về chính trị\nAnswer: d\n\nQuestion: 7. Câu nói sau đây do ai nói: \"Vô sản tất cả các nước và các dân tộc bị áp bức, đoàn kết lại!\"?\nA. V.I.Lênin\nB. Chủ tịch Hồ Chí Minh\nC. C.Mác\nD. Ph.Ăngghen\nAnswer: A\n\nQuestion: 8. Theo V.I. Lênin, nguyên tắc cao nhất của chuyên chính vô sản ở Nga khi thực hiện cách mạng tháng Mười và cả giai đoạn sau đó là gì?\n\na. Duy trì khối liên minh giữa giai cấp vô sản và nông dân để giai cấp vô sản có thẻ giữ được vai trò lãnh đạo\nb. Duy trì trấn áp giai cấp, duy trì quyền lãnh đạo duy nhất của giai cấp công nhân\nc. Duy trì khối liên minh tất cả giai cấp, tầng lớp sau khi đã giành được chính quyền\nd. Điều hòa mâu thuẫn giữa các giai cấp, bảo đảm các bên có quyền lợi và nghĩa vụ như nhau\nAnswer: a\n\nQuestion: 9. Theo cấp độ quốc gia, đâu là tín ngưỡng truyền thống quan trọng của dân tộc Việt Nam?(NHUNG HOÀNG)\n\nA. Tín ngưỡng thờ cúng tổ tiên\n\nB. Tín ngưỡng thành hoàng\n\nC. Tín ngưỡng thờ cúng vua Hùng\n\nD. Tất cả các đáp án đều đúng\nAnswer: C\n\nQuestion: 10. Đáp án nào không phải là một phương pháp nghiên cứu của chủ nghĩa xã hội khoa học?\nA. Phương pháp kết hợp lịch sử và logic\nB. Phương pháp khảo sát và phân tích về mặt chính trị xã hội\nC. Phương pháp trừu tượng hóa khoa học\nD. Phương phép so sánh\nAnswer: C\n\nQuestion: 11. Xu hướng phát triển của mối quan hệ dân tộc nào nổi lên trong giai đoạn chủ nghĩa tư bản đã phát triển thành chủ nghĩa đế quốc đi bóc lột thuộc địa?(NHUNG HOÀNG)\n\nA. Cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc độc lập\n\nB. Các dân tộc trong từng quốc gia, thậm chí các dân tộc ở nhiều quốc gia muốn liên hiệp lại với nhau\n\nC. Cộng đồng dân tộc yếu thể có xu hướng xác nhập với các dân tộc có trình độ phát triển cao hơn\n\nD. Cộng đồng dân tộc phát triển hưng thịnh sẽ có ý định tách ra hình thành quốc gia - dân tộc độc lập\nAnswer: B\n\n(Kiểu hỏi khác: Theo V.I.Lênin, các xu hướng khách quan của sự phát triển quan hệ dân tộc là gì?)\n\nQuestion: 12. Tại sao trong thời kì quá độ lên chủ nghĩa xã hội, cơ cấu xã hội - giai cấp lại biến đổi phức tạp, đa dạng?(NHUNG HOÀNG)\n\nA. Vì đó là thời kì chuyển tiếp giữa cái cũ và cái mới, có nhiều yếu tố đan xen\n\nB. Vì các giai cấp cạnh tranh quyền lực lãnh đạo của nhau\n\nC. Vì sự chống phá của các thế lực thù địch bên ngoài\n\nD. Vì trong xã hội còn tồn tại nhiều giai cấp, tầng lớp\nAnswer: A\n\nQuestion: 13. Về phương diện kinh tế - xã hội, giai cấp công nhân lao động bằng phương thức công nghiệp ngày càng hiện đại với đặc điểm nổi bật nào?\nA. Sản xuất bằng máy móc\nB. Tạo ra những tiền đề của cải vật chất cho xã hội mới\nC. Lao động có tính chất xã hội hóa và năng suất lao động cao\nD. Tất cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 14. Một trong những đặc trưng cơ bản của dân tộc - tộc người là gì?\nA. Cộng đồng về giáo dục\nB. Cộng đồng về y tế\nC. Cộng đồng về ngôn ngữ\nD. Cộng đồng lao động\nAnswer: C\n\nQuestion: 15. Tại sao trong bất kì xã hội nào, muốn tiền lên chủ nghĩa xã hội đều tất yếu phải trải qua thời kỳ quá độ?\nA. Vì chủ nghĩa xã hội có bản chất đối lập với các chế độ xã hội bóc lột trước đó, giai cấp vô sản cần có thời gian để cải tạo xã hội cũ, xây dựng xã hội mới\nB. Vì chủ nghĩa xã hội là thực hiện ý chí chủ quan của giai cấp công nhân và nhân dân lao động\nC. Vì chủ nghĩa xã hội thực hiện sự thống trị của giai cấp, tầng lớp nghèo nàn trong xã hội\nD. Vì chủ nghĩa xã hội là giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa\nAnswer: A\n\nQuestion: 16. Nguồn gốc gây nên tình trạng thống trị của người đàn ông trong gia đình, sự bất bình đẳng nam, nữ, giữa vợ chồng, sự nô dịch đối với phụ nữ trong gia đình là gì?\nA. Là chế độ phong kiến\nB. Là chế độ hôn nhân phụ hệ\nC. Là chế độ tư hữu về tư liệu sản xuất\nD. Là các quan niệm đạo đức lỗi thời\nAnswer: C\n\nQuestion: 17. Có bao nhiêu phương hướng được đề ra tại Văn kiện Đại hội đại biểu toàn quốc lần thứ XI trong thời kỳ quá độ lên chủ nghĩa xã hội?\nA. 5\nB. 6\nC. 8\nD. 9\nAnswer: C\n\nQuestion: 18. Điểm khác biệt cơ bản nhất giữa cách hiểu về dân chủ thời cổ đại và hiện nay là gì? (Chọn 2 đáp án)\nA. Tính chất trực tiếp của mối quan hệ sở hữu quyền lực công cộng\nB. Nội hàm khái niệm nhân dân\nC. Giai Cấp tổ chức quyền lực dân chủ\nD. Tính triệt để hay không triệt để của dân chủ\nAnswer: AB\n\nQuestion: 19. Ở nước ta, nội dung chính trị của liên minh công - nông - trí thức thể hiện ở điểm gì?\nA. Giữ vững lập trường chính trị - tư tưởng của giai cấp công nhân, vai trò lãnh đạo của Đảng Cộng sản Việt Nam, giữ vững độc lập dân tộc và định hướng đi lên chủ nghĩa xã hội\nB. Giữ vững nền kinh tế thị trường theo hướng hiện đại, kiên định con đường đi lên chủ nghĩa xã hội\nC. Giữ vững địa vị thống trị của giai cấp công nhân thông qua Đảng Cộng sản Việt Nam trong mối liên minh giai cấp\nD. Giữ vững vai trò định hướng, kim chỉ nam của kinh tế nhà nước trong nền kinh tế thị trường tự do hiện đại\nAnswer: A\n\nQuestion: 20. Hình thức dân chủ ở Việt Nam mà người dân bầu ra cơ quan quyền lực nhà nước cao nhất, ủy quyền cho họ thực hiện quyền lực của nhân dân được gọi là hình thức dân chủ gì?\nA. Hình thức dân chủ trực tiếp\nB. Hình thức dân chủ gián tiếp\nC. Hình thức dân chủ đại nghị\nD. Hình thức dân chủ công khai\nAnswer: B\n\nQuestion: 21. Trên lĩnh vực kinh tế, trong thời kỳ quá độ lên chủ nghĩa xã hội tất yếu tồn tại nền kinh tế như thế nào?(NHUNG HOÀNG)\n\nA. Kinh tế nhiều thành phần, trong đó có thành phần đối lập\n\nB. Kinh tế kế hoạch hóa tập trung cao độ\n\nC. Kinh tế thị trường tự do\n\nD. Kinh tế hàng hóa giản đơn\nAnswer: A\n\nQuestion: 22. Nguyên nhân nào làm xuất hiện các tầng lớp xã hội mới?\nA. Cơ cấu xã hội biến đổi phức tạp, đa dạng\nB. Cơ cấu giai cấp biến đổi phức tạp, đa dạng\nC. Cơ cấu xã hội - giai cấp thiếu tính đồng bộ\nD. Cơ cấu xã hội - giai cấp biến đổi phức tạp, đa dạng\nAnswer: D\n\nQuestion: 23. Giai cấp công nhân Việt Nam ra đời trong bối cảnh nào?\nA. Trong bối cảnh của các cuộc khai thác thuộc địa của thực dân Pháp ở Việt Nam\nB. Trong giai đoạn công nghiệp hóa phát triển mạnh mẽ ở nước ta\nC. Trong phong trào đấu tranh giành chính quyền từ khi có Đảng Cộng sản\nD. Trong lúc Đảng Cộng sản đã giành được chính quyền\nAnswer: A\n\nQuestion: 24. Chức năng chính trị của gia đình thể hiện điều gì?\nA. Gia đình là nơi tổ chức thực hiện chính sách, pháp luật của nhà nước và hưởng lợi từ hệ thống chính sách, pháp luật đó\nB. Gia đình là một công cụ thực thi quyền lực thống trị chính trị, mang bản chất của giai cấp cầm quyền\nC. Gia đình là tổ chức chính trị nhỏ nhất trong xã hội, thực thi quyền lực thống trị của người giữ vai trò quyết định kinh tế\nD. Tất cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 25. Trong thời kì quá độ lên chủ nghĩa xã hội ở nước ta hiện nay, giai Cấp nông dân có sự biến đã theo xu hướng nào?\nA. Giảm dân về số lượng và tỷ lệ trong cơ Cấu xã hội - giai Cấp\nB. Tăng dân vệ sở lương và tỷ lệ trong cơ Cấu xã hội - giai Cấp\nC. Giảm dần về Số lượng nhưng tăng dân Về tỷ lệ trong cơ cảu xã hội - giai Cấp\nD. Tăng dân Về SỐ lượng nhưng giảm dân Về tỷ lệ trong cơ Cấu xã hội - giai Cấp\nAnswer: A\n\nQuestion: 26. Nội dung giáo dục gia đình hiện nay ở Việt Nam hướng đến giáo dục điều gì?\nA. Giáo dục kiến thức khoa học hiện đại, trang bị công cụ để con cái hòa nhập với thế giới\nB. Giáo dục tinh thần làm giàu, kinh doanh, sản mà\nC. Giáo dục con cái hướng đến các giá trị truyền thống xưa\nD. Tất cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 27. Điền cụm từ thích hợp vào (...): \"cần phải có một thời kỳ quá độ khá lâu dài từ ... lên ...\"(NHUNG HOÀNG)\n\nA. Chủ nghĩa tư bản/ Chủ nghĩa xã hội\n\nB. Người bị bóc lột/ lên làm chủ\n\nC. Giai cấp công nhân/ người nắm chính quyền\n\nD. Chủ nghĩa xã hội/ Chủ nghĩa cộng sản\nAnswer: A\n\nQuestion: 28. Những đặc điểm cơ bản của thời kì quá độ lên chủ nghĩa xã hội là gì?\n(Chọn 2 đáp án)\nA. Thời kì cải tạo cách mạng sâu sắc, triệt để xã hội tư bản chủ nghĩa trên mọi lĩnh vực\nB. Thời kì xây dựng từng bước cơ sở vật chất - kỹ thuật và đời sống tinh thần của chủ nghĩa xã hội\nC. Thời kì đấu tranh giai cấp khi tương quan lực lượng cân bằng\nD. Thời kì thực hiện nền chuyên chính lao động\nAnswer: AB\n\nQuestion: 29. Vai trò của giai cấp công nhân là:(NHUNG HOÀNG)\n\nA. Là khách thể của quá trình sản xuất vật chất để sản xuất ra của cải vật chất ngày càng nhiều đáp ứng nhu cầu ngày càng tăng của con ngưòi và xã hội\n\nB. Là chủ thể của quá trình sản xuất vật chất đã sản xuất ra của cải vật chất ngày càng nhiều đáp ứng nhu cầu ngày càng tăng của con người và xã hội\n\nC. Là chủ thể của quá trình sản xuất nông nghiệp\n\nD. Là chủ thể của quá trình sản xuất tinh thần\nAnswer: B\n\nQuestion: 30. Theo nghĩa hẹp, chủ nghĩa xã hội khoa học được hiểu là gì?\n\na. Là một trong ba bộ phận hợp thành chủ nghĩa Mác - Lênin\nb. Là những thành tựu của con người đạt được trong quá trình đấu tranh giai cấp\nc. Là sự chuyển biến tất yếu của xã hội loài người từ chủ nghĩa tư bản lên một xã hội tốt đẹp hơn\nd. Là một hình thái kinh tế - xã hội\nAnswer: a\n\nQuestion: 31. Ngày nay, xu hướng \"trí tuệ hóa\" tăng nhanh, đã tạo ra hệ quả gì cho giai cấp công nhân?\nA. Giai cấp công nhân tham gia ở những vị trí, cấp bậc cao hơn trong các công xưởng, doanh nghiệp và ngày càng có xu hướng thỏa hiệp với giai cấp tư sản\nB. Nhu cầu vật chất, tinh thần ngày càng tăng, phong phú và đa dạng hơn\nC. Xu hướng đình công, bãi công ngày càng diễn ra rộng rãi\nD. Giai cấp công nhân có trí tuệ cao hơn, có xu hướng chuyển biến thành giai cấp tư sản\nAnswer: B\n\nQuestion: 32. Theo chủ nghĩa Mác - Lênin, hình thái kinh tế- xã hội cộng sản chủ nghĩa có khác biệt đặc trưng nào với các hình thái kinh tế xã hội chiếm hữu nô lệ, phong kiến và tư bản chủ nghĩa?(NHUNG HOÀNG)\n\nA. Hình thái kinh tế- xã hội công sản chủ nghĩa là giai đoạn phát triển cao nhất và cuối cùng của lịch sử loài người\n\nB. Hình thái kinh tế — xã hội công sản chủ nghĩa khác biệt về chất, đó là xã hội không có giai Cấp đối kháng như các xã hội trước đó\n\nC. Hình thái kinh tế — xã hội công sản chủ nghĩa là phiên bản điều chỉnh tốt hơn tứ tư bản chủ nghĩa\n\nD. Hình thái kinh tế - xã hội cộng sản chủ nghĩa là quay trở lại công sản nguyên thủy\nAnswer: B\n\nQuestion: 33. Tại sao nói việc sở hữu một lượng tư liệu sản xuất xã hội thông qua chế độ cổ phần không làm thay đổi bản chất bị bóc lột của giai cấp công nhân trong xã hội tư bản chủ nghĩa?(NHUNG HOÀNG)\n\nA. Do quá trình sản xuất và phân chia lợi nhuận vẫn bị phụ thuộc vào các nhà tư sản lớn\n\nB. Do tỷ lệ sở hữu của giai cấp công nhân không cao\n\nC. Tất cả các đáp án đều đúng\n\nD. Do việc làm và lao động vẫn là nhân tố quyết định mức thu nhập và đời sống của công nhân\nAnswer: A\n\nQuestion: 34. Trong hai mặt của vấn đề tôn giáo, mặt nào phản ánh mâu thuẫn mang tính chất đối kháng giữa các giai cấp và các thế lực lợi dụng tôn giáo chống lại sự nghiệp cách mạng của nhân dân lao động?\nA. Mặt chính trị\nB. Mặt tư tưởng\nC. Không có mặt nào có tính chất mâu thuẫn đối kháng\nD. Cả hai mặt đều có tính chất mâu thuẫn đối kháng\nAnswer: A\n\nQuestion: 35. Dân chủ được hiểu là:\n\nA. Một giá trị xã hội phản ánh các quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại\nB. Một giá trị xã hội phản ảnh các quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp tư sản cầm quyền; có quá trình ra đời, phát triển cùng với lịch sử xã hội nhân loại\nC. Một giá trị xã hội phản ánh các quyền cơ bản của con người; là một hình thức tổ chức nhà nước của giai cấp thống trị cầm quyền; có quá trình ra đời, phát triển từ xã hội chiếm hữu nô lệ\nD. Một giá trị xã hội phản ánh các quyền cơ bản của con người; là một hình thức tổ chức\nAnswer: A\n\nQuestion: 36. Cho đến nay, hình thức quá độ lên chủ nghĩa xã hội nào chưa từng diễn ra trên thực tế?\nA. Quá độ toàn diện\nB. Quả độ trực tiếp\nC. Quá độ bộ phận\nD. Quá độ gián tiếp\nAnswer: B\n\nQuestion: 37. Nguyên tắc phân phối chủ yếu của chủ nghĩa xã hội là gì?\nA. Làm theo năng lực, hướng theo nhu cầu\nB. Làm theo năng lực, hướng theo lao động\nC. Làm theo năng lực, hướng theo phúc lợi xã hội\nD. Làm theo công việc, hướng theo tiền lương\nAnswer: B\n\nQuestion: 38. Cùng với sự phát triển mạnh mẽ của nền đại công nghiệp cơ khí là sự trưởng thành vượt bậc cả về số lượng và chất lượng của giai cấp nào?\nA. Công nhân\nB. Nông dân\nC. Tư sản\nD. Chủ nô\nAnswer: A\n\nQuestion: 39. Tác phẩm nào đánh dấu sự ra đời của chủ nghĩa xã hội khoa học?\nA. Tuyên ngôn của Đảng Cộng sản\nB. Tình cảnh nước Anh\nC. Bộ Tư bản\nD. Góp phần phê phán triết học pháp quyền của Hêghen - Lời nói đầu\nAnswer: A\n\nQuestion: 40. Bản chất dân chủ của Chế độ nước ta hiện nay được hiểu như thế nào?\nA. Chế độ ta là do nhân dân làm chủ, quyền lực thuộc vệ nhân dân\nB. Chế đó ta là do Đảng Cộng sản Việt Nam làm chủ, là đai diện ý chí, nguyện vọng của nhân dân\nC. Chế đó ta là do giai Cấp công nhân làm chủ, quyền lực thuộc về giai Cấp công nhân\nD. Chế đó ta là do Cá nhân làm chủ, được hiện thực hóa thông qua vai trò làm chủ duy nhất của Đảng Cộng sản Việt Nam\nAnswer: A\n\nQuestion: 41. Tiền đề kinh tế- xã hội dẫn tới sự sụp đổ không tránh khỏi của chủ nghĩa tư bản là:\nA. Sự phát triển về lực lượng sản xuất và sự trưởng thành của giai cấp công nhân\nB. Sự phát triển về quan hệ sản xuất và sự trưởng thành của giai cấp công nhân\nC. Sự phát triển về lực lượng sản xuất và sự trưởng thành của giai cấp nông dân\nD. Sự phát triển về lực lượng sản xuất và sự trưởng thành của tầng lớp tri thức\nAnswer: A\n\nQuestion: 42. Điều kiện và tiền đề kinh tế - XH để xây dựng gia đình trong CNXH là gì?\nA. Xóa bỏ chế tư hữu, xác lập chế độ công hữu về tư liệu sản xuất.\nB. Phát triển kinh tế - XH\nC. Nhà nước XHCN ban hành và thực hiện luật hôn nhân và nâng cao trình độ văn hóa và dân trí cho mọi người dân\nD. Tất cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 43. Ai đã khẳng định: \"Từ khi bộ Tư bản ra đời... quan niệm duy vật lịch sử không còn là một giả thuyết của, ma la một nguyên lý đã được chứng minh một cách khoa học?\nA. V.I.Lênin\nB. Các Mác\nC. Ph.Ăngghen\nD. S.Phurie\nAnswer: A\n\nQuestion: 44. Phát hiện ra sự phân chia xã hội thành giai Cấp và đấu tranh giai Cấp là công lao của ai?\nA. Các Mác\nB. V.I. Lênin\nC. Ph.Ảng ghen\nD. Các nhà sử học tư sản trước Mác\nAnswer: D\n\nQuestion: 45. Để tạo sức mạnh tổng hợp đảm bảo cho thắng lợi của cuộc cách mạng xã hội chủ nghĩa thì cần phải có sự lãnh đạo của tổ chức nào?\nA. Công đoàn\nB. Đảng Cộng sản\nC. Hội Thanh niên\nD. Đoàn Thanh niên Cộng sản Hồ Chí Minh\nAnswer: B\n\nQuestion: 46. Hành vi nào dưới đây được cho là lợi dụng tín ngưỡng, tôn giáo mà Nhà nước Việt Nam nghiêm cấm?(Chọn 3)\nA. Hoạt động mê tín dị đoan\nB. Lợi dụng giáo dân và tôn giáo để hoạt động trái pháp luật và chính sách của Nhà nước\nC. Kích động chia rẽ nhân dân, chia rẽ dân tộc, gây rối, xâm phạm an ninh quốc gia\nD. Kêu gọi sự giúp đỡ từ tổ chức tôn giáo quốc tế đối với các tôn giáo du nhập từ bên ngoài\nAnswer: ABC\n\nQuestion: 47. Dân chủ xã hội chủ nghĩa chỉ có thể có và được duy trì với điều kiện tiên quyết là gì?\nA. Giai cấp công nhân phải nắm được quyền thống trị xã hội\nB. Bảo đảm vai trò lãnh đạo duy nhất của Đảng Cộng sản\nC. Thực hiện dân chủ rộng rãi đối với mọi giai cấp, tầng lớp\nD. Thực hiện đa nguyên chính trị\nAnswer: B\n\nQuestion: 48. Gia đình Việt Nam hiện đại có mấy thế hệ cùng sống chung?\nA. 1\nB. 2\nC. 4\nD. 3\nAnswer: B\n\nQuestion: 49. Sự kiện gì đánh dấu việc V.I.Lênin đã biến chủ nghĩa xã hội từ khoa học, lý luận thành hiện thực?\nA. Cách mạng tháng Mười Nga và sự ra đời của Nhà nước Xô - viết Nga 1917\nB. Sự ra đời của Liên Xô\nC. Sự chiến thắng của nước Nga trong giai đoạn nội chiến\nD. Tất cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 50. Đâu là điều kiện tiên quyết để xây dựng nền dân chủ xã hội chủ nghĩa Việt Nam?\nA. Xây dựng Đảng Cộng sản Việt Nam trong sạch, vững mạnh\nB. Xây dựng nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân\nC. Xây dựng khối đại đoàn kết dân tộc\nD. Xây dựng nhà nước phát triển và hợp tác quốc tế tốt\nAnswer: A\n\nQuestion: 51. Trong Văn kiện Đại hội đại biểu toàn quốc lần thứ IX, Đảng Cộng sản Việt Nam đã nêu rõ:\nA. Vấn đề dân tộc có vai trò quan trọng đối với sự nghiệp phát hiện kinh tế- xã hội ở nước ta hiện nay.\nB. Vấn đề dân tộc và đoàn kết các dân tộc luôn có vị trí chiến lược trong sự nghiệp cách mạng.\nC. Vấn đề dân tộc và đoàn kết các dân tộc có vị trí quyết định đến sự sống còn của dân tộc ta hiện nay.\nD. Vấn đề dân tộc và tăng cường khối đại đoàn kết toàn dân tộc là vấn đề chiến lược của Việt Nam hiện nay.\nAnswer: B\n\n(Kiểu hỏi khác: Đảng Cộng sản Việt Nam đã nêu rõ vấn để nào trong Văn kiện Đại hội đại biểu toàn quốc lần thứ XII?)\n\nQuestion: 52. Xây dựng gia đình Việt Nam hiện nay là xây dựng mô hình gia đình như thế nào?\nA. Hiện đại với tiến trình công nghiệp hóa, hiện đại hóa đất nước và hội nhập kinh tế quốc tế\nB. Hiện đại, phù hợp với tiến trình công nghiệp hóa, hiện đại hóa đất nước và hội nhập kinh tế quốc tế\nC. Phù hợp với tiến trình công nghiệp hóa, hiện đại hóa đất nước và hội nhập kinh tế quốc tế\nD. Hiện đại, phù hợp với tiến trình công nghiệp hóa đất nước và hội nhập kinh tế quốc tế\nAnswer: B\n\nQuestion: 53. Dựa trên phương diện chính trị - xã hội, giai cấp công nhân được hiểu là:\nA. Là những người nông dân nghèo bị bóc lột sức lao động\nB. Là những người tri thức tham gia vào sản xuất\nC. Là sản phẩm xã hội của quá trình phát triển tư bản chủ nghĩa\nD. A và B đều đúng\nAnswer: C\n\nQuestion: 54. Các khẩu hiệu \"sống có việc làm hay là chết trong đấu tranh\" (1831) và \"cộng hòa hay là chết (1834) xuất hiện trong phong trào đấu tranh của công nhân dệt ở Lion (Pháp) có ý nghĩa gì?\nA. Phong trào đấu tranh của giai cấp công nhân đã chuyển từ mục đích kinh tế sang mục đích chính trị\nB. Phong trào đấu tranh của giai cấp công nhân đã có lý luận soi đường\nC. Phong trào đấu tranh của giai cấp công nhân đã có những thắng lợi to lớn\nD. Phong trào đấu tranh của giai cấp công nhân chuyển từ tự phát sang tự giác\nAnswer: A\n\nQuestion: 55. Vấn đề: \"Tập hợp đồng bào theo tín ngưỡng, tôn giáo và đồng bào không theo tín ngưỡng, tôn giáo xây dựng khối đại đoàn kết toàn dân tộc, xây dựng và bảo vệ Tổ quốc\" được đề cập trong Luật nào?\nA. Luật tín ngưỡng, tôn giáo\nB. Luật phòng, chống bạo lực gia đình\nC. Luật giáo dục\nD. Luật mê tín, tôn giáo\nAnswer: A\n\nQuestion: 56. Mức đó tác động của gia đình đối với xã hội phụ thuộc vào yếu tố nào?(Chọn 3)\nA. Vào bản chất của từng chế độ xã hội\nB. Vào đường lối, chủ trương của giai Cấp cầm quyền\nC. Vào bản thân mô hình, kết cấu, đặc điểm của mới hình thức gia đình trong lịch sử\nD. Vào ý chí, nguyện vọng của các thành viên trong gia đình\nAnswer: ABC\n\nQuestion: 57. Sự ra đời của Đảng Cộng sản Việt Nam có tính đặc thù gì so với quy luật chung của sự ra đời các Đảng Cộng sản theo chủ nghĩa Mác - Lênin?\nA. Có sự kết hợp với phong trào yêu nước của dân tộc\nB. Có lãnh tụ xuất sắc\nC. Có sự ủng hộ của các Đảng Cộng sản khác\nD. Có sự liên kết với giai cấp nông dân\nAnswer: A\n\nQuestion: 58. Quan hệ nào được coi là quan hệ cơ bản nhất trong gia đình?\nA. Quan hệ hôn nhân và huyết thống\nB. Quan hệ quân tụ trong một không gian sinh tồn\nC. Quan hệ hôn nhân\nD. Quan hệ nuôi dưỡng\nAnswer: A\n\nQuestion: 59. Thực chất của liên minh công - nông - tri thức ở nước ta Về nội dung kinh tế là gì?\nA. Là sự hợp tác giữa họ, đồng thời mở rộng liên kết với các lực lượng khác để xây dựng nền kinh tế mới xã hội chủ nghĩa hiện đại\nB. Là sự hợp tác giữa họ, đồng thời mô rộng liên kết với các lực lượng khác để xây dựng nền kinh tế thị trường tự do hiện đại\nC. Là sự hợp tác và đấu tranh giữa họ, đồng thời mở rộng liên kết và đấu tranh với các lực lượng khác để xây dựng nền kinh tế mới\nD. Là sự hợp tác giữa họ, đồng thời mở rộng liên kết với các lực lượng khác để xây dựng nền chính trị dân chủ\nAnswer: A\n\nQuestion: 60. \"Dân chủ quân sự\" dùng để chỉ chế độ dân chủ nào?\nA. Chế độ cộng sản nguyên thủy\nB. Chế độ tư bản chủ nghĩa\nC. Chế độ phong kiến\nD. Chế độ chiếm hữu nô lệ\nAnswer: A\n\nQuestion: 61. Tôn giáo nào du nhập vào Việt Nam mà không chịu ảnh hưởng của bản sắc văn hóa Việt Nam?\nA. Phật giáo\nB. Công giáo\nC. Hồi giáo\nD. Không có\nAnswer: D\n\nQuestion: 62. Cơ sở chính trị - xã hội để xây dựng gia đình trong chủ nghĩa xã hội là gì?\nA. Tất cả các đáp án đều đúng\nB. Thiết lập chế độ công hữu về tư liệu sản xuất\nC. Xây dựng văn hóa xã hội chủ nghĩa\nD. Thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa\nAnswer: D\n\nQuestion: 63. Giáo dục gia đình và giáo dục của xã hội có vị trí, vai trò như thế nào trong quá trình phát triển của mỗi cá nhân?\nA. Giáo dục gia đình đóng vai trò quyết định sự phát triển của cá nhân\nB. Giáo dục của xã hội đóng vai trò quyết định sự phát triển của cá nhân\nC. Giáo dục gia đình gắn liền với giáo dục của xã hội trong quá trình phát triển của mỗi cá nhân\nD. Giáo dục gia đình và giáo dục của xã hội chịu sự chi phối của quá trình nhận thức riêng biệt của mỗi cá nhân dựa trên tâm tư, tình cảm, tri thức chủ quan của cá nhân đó\nAnswer: C\n\nQuestion: 64. Nền dân chủ xã hội chủ nghĩa mang bản chất của giai cấp nào?\nA. Giai cấp công nhân\nB. Giai cấp tư sản\nC. Giai cấp tiểu tư sản\nD. Giai cấp nông dân\nAnswer: A\n\nQuestion: 65. Sứ mệnh của nhà nước xã hội chủ nghĩa là gì?\nA. Xây dựng thành công chủ nghĩa công sản, đưa tất cả các giai cấp, tầng lớp lên địa vị làm chủ trên tất cả các mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội cộng sản chủ nghĩa\nB. Xây dựng thành công chủ nghĩa xã hội, đưa giai cấp công nhân lên địa vị thống trị trên tất cả các mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội xã hội chủ nghĩa\nC. Xây dựng thành công chủ nghĩa xã hội, đưa nhân dân lao động lên địa vị làm chủ trên tất cả các mặt của đời sống xã hội trong một xã hội phát triển cao - xã hội xã hội chủ nghĩa\nD. Xây dựng thành công xã hội chủ nghĩa, đưa tất cà các giai cấp, tầng lớp lên địa vị\nAnswer: C\n\nQuestion: 66. Theo chủ nghĩa Mác - Lênin, tính chất chính trị của tôn giáo xuất hiện từ khi nào?(NHUNG HOÀNG)\n\nA. Khi xã hội đã có phân chia giai cấp và đối kháng giai cấp\n\nB. Khi xă hội đã thủ tiêu được giai Cấp\n\nC. Khi loài người bước vào đêm trường trung cổ\n\nD. Khi chủ nghĩa Mác - Lênin ra đời\nAnswer: A\n\nQuestion: 67. Nhằm xây dựng thành công chủ nghĩa xã hội, thì cơ cấu kinh tế trong thời kỳ quá độ lên chủ nghĩa xã hội cần vận động theo cơ chế nào?\nA. Cơ chế kinh tế\nB. Cơ chế quản lý\nC. Cơ chế định hướng xã hội chủ nghĩa\nD. Cơ chế thị trường\nAnswer: D\n\nQuestion: 68. Theo chủ nghĩa Mác - Lênin, chủ nghĩa xã hội được hiểu là:(NHUNG HOÀNG)\n\nA. Giai đoạn đầu của hình thái kinh tế - xã hội cộng sản chủ nghĩa\n\nB. Một hình thái kinh tế - xã hội\n\nC. Là một chế độ xã hội, trong đó sự thống trị của giai cấp công nhân được xác lập\n\nD. Là giai đoạn phát triển cao của hình thái kinh tế - xãa hội cộng sản chủ nghĩa\nAnswer: A\n\nQuestion: 69. Cuộc đấu tranh của giai cấp vô sản chống lại nội dung gì của giai cấp tư sản?\nA. Chống lại sự thống trị, áp bức\nB. Chống lại chế độ độc tài\nC. Chống lại sự bóc lột\nD. Chống lại sự thống trị, độc tôn\nAnswer: A\n\nQuestion: 70. Trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay, giai cấp, tầng lớp nào đang đóng góp tích cực vào việc thực hiện chiến lược phát triển kinh tế - xã hội, tạo việc làm cho người lao động?\nA. Giai cấp công nhân\nB. Giai cấp nông dân\nC. Tầng lớp trí thức\nD. Tầng lớp doanh nhân\nAnswer: D\n\nQuestion: 71. Cơ sở văn hóa để xây dựng gia đình trong chủ nghĩa xã hội là gì?\nA. Thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động, nhà nước xã hội chủ nghĩa\nB. Thiết lập chế độ công hữu về tư liệu sản xuất\nC. Giá trị văn hóa được xây dựng trên nền tảng hệ tư tưởng chính trị của giai cấp công nhân\nD. Tất cả các đáp án đều đúng\nAnswer: C\n\nQuestion: 72. Nội dung văn hóa - xã hội trong liên minh giai cấp, tầng lớp ở nước ta hiện nay đòi hỏi phải đảm bảo điều gì?\nA. Gắn tăng trưởng kinh tế với phát hiện văn hóa, phát triển con người và thực hiện tiến bộ, công bằng xã hội\nB. Gắn tăng trưởng kinh tế với độc lập, tự do, phát huy nguồn lực lãnh đạo của kinh tế tư nhân\nC. Thực hiện tăng trưởng kinh tế bằng mọi giá, tiến nhanh đến nền kinh tế thị trường hiện đại\nD. Tiếp thu toàn bộ các yếu tố văn hóa nhân loại trong tiến trình hội nhập và tăng trưởng kinh tế\nAnswer: A\n\nQuestion: 73. Dân chủ trong lĩnh vực nào là quan trọng hàng đầu và nổi bật nhất?\nA. Trong lĩnh vưc kinh tế và chính trị\nB. Trong lĩnh vưc văn hóa tinh thần và tư tưởng\nC. Trong lĩnh vực chính trị và tư tưởng\nD. Trong lĩnh vực kinh tế và tư tưởng\nAnswer: A\n\nQuestion: 74. Trong giai đoạn hiện nay, lực lượng nào đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa, gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên và môi trường?\nA. Công nhân tri thức\nB. Giai cấp công nhân\nC. Giai cấp nông dân\nD. Tiểu tư sản\nAnswer: B\n\nQuestion: 75. Sự biến đổi của cơ cấu xã hội nào sẽ tất yếu dẫn đến sự biến đổi của các cơ cấu xã hội khác và đồng thời làm biến đổi toàn bộ cơ câu xã hội nói chung?\nA. Cơ cấu xã hội - chính trị\nB. Cơ cấu xã hội - giai cấp\nC. Cơ cấu xã hội - dân tộc\nD. Cơ cấu xã hội - kinh tế\nAnswer: B\n\nQuestion: 76. Việc thờ cúng các vị thần như: Bà Thiên Hậu, Quan Thánh Đế Quân, Na Tra, Thái Thượng Lão Quân trong cộng đồng người Hoa ở Việt Nam được gọi là gì?\nA. Tôn giáo\nB. Tín ngưỡng\nC. Mê tín\nD. Mê tín dị đoan\nAnswer: B\n\nQuestion: 77. Đại hội XIII của Đảng Cộng sản Việt Nam đã đề ra mục tiêu gì vào năm 2030 trên con đường xây dựng chủ nghĩa xã hội?\nA. Là nước đang phát triển, có thu nhập trung bình\nB. Là nước đang phát triển, có công nghiệp hiện đại, thu nhập trung bình cao\nC. Là nước phát triển, có thu nhập trung bình cao\nD. Là nước phát triển, có thu nhập cao\nAnswer: B\n\nQuestion: 78. Đại hội XIII của Đảng Cộng sản Việt Nam đã đề ra mục tiêu gì vào năm 2025 trên con đường xây dựng chủ nghĩa xã hội?\nA. Là nước đang phát triển, có công nghiệp theo hướng hiện đại, vượt qua mức thu nhập trung bình thấp\nB. Là nước phát triển, có công nghiệp hóa, hiện đại hóa cao, đạt mức thu nhập cao\nC. Là nước đang phát triển, có công nghiệp theo hướng hiện đại, đạt được mức thu nhập trung bình\nD. Là nước phát triển, có thành tựu khoa học - kỹ thuật hiện đại, phát triển nguồn lực nội sinh\nAnswer: A\n\nQuestion: 79. Đại hội XIII của Đảng Cộng sản Việt Nam đã đề ra mục tiêu gì vào năm 2045 trên con đường xây dựng chủ nghĩa xã hội?\nA. Trở thành nước phát triển, thu nhập cao\nB. Trở thành con rồng châu Á\nC. Trở thành nước phát triển thu nhập trung bình cao\nD. Trở thành nước phát triển, có kinh tế tri thức, thu nhập trung bình cao\nAnswer: A\n\nQuestion: 80. Trong giai đoạn 1843 -1844, C. Mác và Ph. Ăng ghen đã chuyển biến lập trường của mình như thế nào?( Chọn 2 Đáp án)\nA. Từ thế giới quan duy tâm sang thế giới quan duy vật\nB. Từ lập trường dân chủ cách mạng sang lập trường cộng sản chủ nghĩa\nC. Từ lập trường cách mạng dân chủ sang lập trường dân tộc chủ nghĩa\nD. Từ phương pháp luận siêu hình sang phương pháp luận biện chứng\nAnswer: AB\n\nQuestion: 81. Sự thống trị của giai cấp tư sản, đặc biệt của bộ phận tư sản đại công nghiệp là điều kiện ban đầu cho sự phát triển của giai cấp nào?\nA. Sự phát triển giai cấp tư sản\nB. Sự phát triển giai cấp chủ nô\nC. Sự phát triển giai cấp nông dân\nD. Sự phát triển giai cấp công nhân\nAnswer: D\n\nQuestion: 82. Đâu là một trong những nội dung của mối quan hệ lớn trong xây dựng chủ nghĩa xã hội ở Việt Nam hiện nay?\nA. Giữa tăng trưởng kinh tế, thực hiện tiến bộ, công bằng xã hội, bảo vệ môi trường sống\nB. Giữa tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, bảo vệ môi trường, y tế, giáo dục\nC. Giữa tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, công bằng xã hội, bảo vệ môi trường\nD. Giữa tăng trưởng kinh tế và phát triển văn hóa, thực hiện tiến bộ, công bằng xã hội\nAnswer: D\n\nQuestion: 83. Theo quan điểm của Đảng Cộng Sản Việt Nam, quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa, tức là:(NHUNG HOÀNG)\n\nA. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng tư bản chủ nghĩa\n\nB. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất tư bản chủ nghĩa\n\nC. Bỏ qua việc xác lập vị trí thống trị của kiến trúc thượng tầng chủ nghĩa xã hội\n\nD. Bỏ qua việc xác lập vị trí thống trị của quan hệ sản xuất và kiến trúc thượng tầng chủ nghĩa xã hội\nAnswer: A\n\nQuestion: 84. Chủ nghĩa xã hội có mấy đặc trưng bản chất?\nA. 4\nB. 5\nC. 6\nD. 7\nAnswer: C\n\nQuestion: 85. Thuật ngữ \"giai cấp công nhân\" được các nhà kinh điển xác định theo bao nhiêu phương diện cơ bản?(NHUNG HOÀNG)\n\nA. 2\n\nB. 3\n\nC. 4\n\nD. 5\nAnswer: A\n\nQuestion: 86. Dân chủ xã hội chủ nghĩa có vai trò như thế nào đối với nhà nước xã hội chủ nghĩa?\nA. Dân chủ xã hội chủ nghĩa tạo ra cơ chế hạn chế quyền lực của nhà nước xã hội chủ nghĩa\nB. Dân chủ xã hội chủ nghĩa là nguyên nhân sinh ra nhà nước xã hội chủ nghĩa\nC. Dân chủ xã hội chủ nghĩa là cơ sở, nền tảng cho việc xây dựng và hoạt động của nhà nước xã hội chủ nghĩa\nD. Tất cả các đáp án đều đúng\nAnswer: C\n\nQuestion: 87. Trong quá trình giải quyết vấn đề tôn giáo, chúng ta cần phân biệt hai mặt nào của tôn giáo?\nA. Chính trị và pháp quyền\nB. Chính trị và tư tưởng\nC. Tư tưởng và văn hóa\nD. Giáo dục và tư tưởng\nAnswer: B\n\nQuestion: 88. Giai cấp nào có sứ mệnh thủ tiêu chủ nghĩa tư bản, xây dựng thành công chủ nghĩa xã hội và chủ nghĩa cộng sản?(NHUNG HOÀNG)\n\na. Nông dân\n\nb. Tư sản\n\nc. Chủ nô\n\nd. Công nhân\nAnswer: d\n\nQuestion: 89. Một trong những hướng phát triển dân chủ mà Chủ tịch Hồ Chí Minh đã đề ra là\nA. Dân chủ là một giá trị nhân loại chung\nB. Dân chủ là người dân được tự do, hạnh phúc\nC. Dân chủ là phát triển đất nước Xã hội chủ nghĩa ở Việt Nam\nD. B và C đều đúng\nAnswer: A\n\nQuestion: 90. Tại sao chủ nghĩa xã hội khoa học tập trung nghiên cứu cơ cấu xã hội - giai cấp mà không phải là các cơ cấu xã hội khác?\nA. Vì cơ cấu xã hội -giai cấp là cơ cấu phổ biến rộng rãi nhất\nB. Vì bản chất của chủ nghĩa xã hội là trấn áp giai Cấp\nC.Vì đó là một trong những cơ sở để nghiên cứu văn đề liên minh giai cấp - tầng lớp trong một chế độ xã hội nhất định\nD. Vì đó là một trong những cơ sở để nghiên cứu văn đề phân chia quyền lực trong một Chế độ xã hội nhất định\nAnswer: C\n\nQuestion: 91. Theo V.I.Lênin: Thời kỳ quá độ ở nước Nga tồn tại bao nhiều thành phần kinh tế?\nA. 3\nB. 4\nC. 5\nD. 6\nAnswer: C (5:- KT gia trưởng- KT hàng hóa nhỏ- KT tư bản- KT tư bản nhà nước- KT xã hội chủ nghĩa)\n\nQuestion: 92. Về phương diện chính trị - xã hội, giai cấp công nhân có vị trí như thế nào?\nA. Là những người nắm giữ tư liệu sản xuất của xã hội tư bản chủ nghĩa, tư tổ chức sản xuất kinh doanh lớn mà không hợp tác với giai Cấp nào\nB. Là những người không có sở hữu tư liệu sản xuất chủ yếu của xã hội, phải bán sức lao động cho nhà tư bản và bị bóc lột giá trị thặng dư\nC. Là những người số hữu tư liệu sản xuất, hợp tác với nhà tư bản để kiếm sống\nD. Là những người có số hữu một số tư liệu sản xuất nhỏ, có thể tự sản xuất, nhưng nhỏ lẻ, để phá sản nên phải bán sức lao động cho nhà tư bản là chính\nAnswer: B\n\nQuestion: 93. Đâu không phải là một chức năng của gia đình?\nA. Chức năng nghề nghiệp\nB. Chức năng nuôi dưỡng, giáo dục\nC. Chức năng kinh tế và tổ chức tiêu dùng\nD. Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm\nAnswer: A\n\nQuestion: 94. Đặc điểm nào trong 06 đặc điểm dân tộc ở Việt Nam đã tạo điều kiện thuận lợi để các dân tộc tăng cường hiểu biết, mở rộng giao lưu, giúp đỡ nhau cùng phát triển?\nA. Có sự chênh lệch vệ dân số giữa các tộc người\nB. Dân tộc thiểu số ở Việt Nam phân bố chủ yếu ở các địa bàn có vị trí chiến lược quan trọng\nC. Dân tộc ở Việt Nam có trình độ phát triển không đều\nD. Các dân tộc cư trú xen kẽ nhau\nAnswer: D\n\nQuestion: 95. Trong giai đoạn hiện nay, Cách mạng công nghiệp lần thứ tư đang phát triển mạnh mẽ thì vai trò của lực lượng nào trong xã hội càng trở nên quan trọng?(NHUNG HOÀNG)\n\nA. Công nhân\n\nB. Nông dân\n\nC. Trí thức\n\nD. Doanh nhân\nAnswer: C\n\nQuestion: 96. Điều kiện chủ quan đề giai cấp công nhân thực hiện sứ mệnh lịch sử của mình là gì?(NHUNG HOÀNG)\n\nA. Sự phát triển của bản thân giai cấp công nhân về cả số lượng và chất lượng\n\nB. Phải có Đảng Cộng sản lãnh đạo\n\nC. Phải có sự liên minh giữa giai cấp công nhân với giai cấp nông dân và các tầng lớp lao động khác\n\nD. Tất cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 97. Chế độ hôn nhân tiến bộ được đảm bảo trên nguyên tắc nào? (chọn 3)\nA. Hôn nhân tư nguyên\nB. Hôn nhân một vợ một chồng, vợ chồng bỉnh đảng\nC. Hôn nhân được đảm bảo về mặt pháp lý\nD. Hôn nhân được đảm bảo về mặt kinh tế\nAnswer: ABC\n\nQuestion: 98. Ở nước ta, cư trú của các dân tộc có đặc trưng như thế nào?\nA. Mỗi dân tộc tập trung cư trú duy nhất trên một địa bàn, ngoại trừ dân tộc Kinh\nB. Các dân tộc cư trú xen kẽ nhau, không có một dân tộc nào tập trung duy nhất trên một địa bàn\nC. Các dân tộc phân bổ đồng đều\nD. Các dân tộc được phân chia lãnh thổ theo vị trí địa lý và đặc điểm ra đời, phát triển của dân tộc đó\nAnswer: D\n\nQuestion: 99. Theo chủ nghĩa Mác - Lenin, để thực hiện được sứ mệnh lịch sử của mình, giai cấp công nhân phải thiết lập được sự liên minh với giai cấp, tầng lớp nào?(NHUNG HOÀNG)\n\na. Liên minh với giai cấp công nhân thế giới\n\nb. Liên minh với giai cấp nông dân và các tầng lớp lao động khác\n\nc. Liên minh với một bộ phận giai cấp tư sản tiến bộ\n\nd. Liên minh với giai cấp nông dân và tầng lớp tiểu tư sản\nAnswer: b\n\nQuestion: 100. Ở Việt Nam, từ những năm 70 và 80 của thế kỉ XX, Nhà nước đã tuyên truyền, phổ biến và vận động, khuyến khích mỗi cặp vợ chồng có bao nhiêu con? (NHUNG HOÀNG)\n\nA. Chỉ nên có từ 1 đến 2 con\n\nB. Có từ 4 con trở lên\n\nC. Có đủ 3 con\n\nD. Còn đông con càng tốt\nAnswer: A\n\nQuestion: 101. Cùng với sự phát triển của đại công nghiệp, các giai cấp khác đều suy tàn và tiêu vong, giai cấp nào là sản phẩm của bản thân nền đại công nghiệp?(NHUNG HOÀNG)\n\nA. Nô lệ\n\nB. Tư sản\n\nC. Công nhân\n\nD. Nông dân\nAnswer: C\n\nQuestion: 102. Trong hệ thống chính sách xã hội của nước ta, các chính sách liên quan đến cơ cấu xã hội nào phải được đặt lên vị trí hàng đầu?\nA. Cơ Cấu xã hội - giai Cấp\nB. Cơ cấu xã hội - kinh tế\nC. Cơ Cấu xã hội - nghề nghiệp\nD. Cơ Cấu xã hội - dân tộc\nAnswer: A\n\nQuestion: 103. Theo nghĩa rộng, chủ nghĩa xã hội khoa học được hiểu là gì?\n\nA. Là một trong ba bộ phận hợp thành chủ nghĩa Mác - Lênin\nB. Là chủ nghĩa Mác - Lênin, luận giải từ các giác độ triết học, kinh tế học chính trị và chính trị xã hội về sự chuyển biến tất yếu của xã hội loài người từ chủ nghĩa tư bản lên chủ nghĩa xã hội và chủ nghĩa cộng sản\nC. Là một học thuyết trình bày sự ra đời, phát triển và suy vong của chủ nghĩa tư bản\nD. Là một hình thái kinh tế - xã hội trong tiến trình lịch sử tự nhiên của loài người\nAnswer: B\n\nQuestion: 104. Nơi nào được xem là cộng đồng xã hội đầu tiên mà mỗi cá nhân sinh sống?\nA. Gia đình\nB. Trường học\nC. Quê hương\nD. Xã hội\nAnswer: A\n\nQuestion: 105. Ai đã khẳng định vấn đề sau: \"Nước ta là nước dân chủ, địa vị cao nhất là dân, vì dân là chủ\"?(NHUNG HOÀNG)\n\nA. C.Mác\n\nB. V.I.Lênin\n\nC. Ph.Ăngghen\n\nD. Chủ tịch Hồ Chí Minh\nAnswer: D\n\nQuestion: 106. Ưu tiên đầu tư phát triển kinh tế - xã hội ở các vùng dân tộc và miền núi, trước hết, tập trung vào phát triển vẫn đề gì?\nA. Giao thông và cơ sở hạ tầng, xóa đói giảm nghèo\nB. Cơ sở hạ tầng kỹ thuật, xóa đói giảm nghèo, y tế, giáo dục\nC. Giao thông và kiến trúc thượng tầng, xóa đói giảm nghèo\nD. Giao thông và cơ sở hạ tầng, y tế, giáo dục\nAnswer: B\n\nQuestion: 107. Ở nước ta, nhân dân có quyền bầu ra những người đại diện cho mình để thực thi quyền làm chủ, đồng thời với quyền đó là quyền gì?\n\na. Quyền giải tán hệ thống chính trị\nb. Quyền bãi miễn những đại biểu không xứng đáng\nc. Quyền tự mình tham gia trở thành đại biểu không qua bầu cử\nd. Quyền tự do ngôn luận\nAnswer: b\n\nQuestion: 108. Công tác tôn giáo ở nước ta hiện nay là trách nhiệm của ai?\nA. Của Đảng Cộng sản Việt Nam\nB. Của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam\nC. Của cả hệ thống chính trị\nD. Của quần chúng nhân dân\nAnswer: C\n\nQuestion: 109. Sự kiện gì được xem là cuộc cách mạng vô sản đầu tiên trên thế giới xóa bỏ được giai cấp tư sản và thiết lập chính quyền của giai cấp vô sản?\nA. Công xã Pari\nB. Phong trào Hiến chương Anh\nC. Cách mạng tháng Mười Nga\nD. Sự ra đời của Quốc tế I\nAnswer: C\n\nQuestion: 110. Ai đã đánh giá về chủ nghĩa của C. Mác là: \"Học thuyết của Mác là học thuyết vạn năng vì nó là một học thuyết chính xác\"?\nA. Tập Cận Binh\nB. Chủ tịch Hồ Chi Minh\nC. Ph.Ăngghen\nD. V.I.Lênin\nAnswer: D\n\nQuestion: 111. Trong phạm vi một quốc gia, xu hướng nào thể hiện sự nỗ lực của từng dân tộc để đi tới sự tự do, bình đẳng và phồn vinh của dân tộc mình?\nA. Cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc độc lập\nB. Cộng đồng dân cư của một quốc gia thành lập cộng đồng dân tộc độc lập\nC. Cộng đồng xã hội muốn tách ra để phát triển đất nước\nD. Cộng đồng dân cư muốn tách ra để hình thành cộng đồng dân tộc\nAnswer: A\n\nQuestion: 112. Điều kiện khách quan quy định sứ mệnh lịch sử của giai cấp công nhân là gì? ( Chọn 2 đáp án )\nA. Là giai cấp có khả năng thống trị được toàn thể xã hội xây dựng xã hội mới\nB. Xuất thân từ giai cấp nông dân trong xã hội phong kiến cũ\nC. Địa vị chính trị - xã hội của giai cấp công nhân\nD. Địa vị kinh tế của giai cấp công nhân\nAnswer: CD\n\nQuestion: 113. Khó khăn về xuất phát điểm của Việt Nam khi tiến vào thời kỳ quá độ lên chủ nghĩa xã hội là gì?(NHUNG HOÀNG)\n\na. Xuất phát từ một xã hội vốn là thuộc địa, nửa phong kiến, lực lượng sản xuất rất thấp, chiến tranh kéo dài, để lại nhiều tàn dư tiêu cực\n\nb. Xuất phát từ một xã hội phong kiến phát triển, trải qua thời kỳ thuộc địa nên bị đồng hóa nhiều về tư tưởng, văn hóa\n\nc. Xuất phát từ một xã hội phong kiến lạc hậu, trình độ lực lượng sản xuất nông nghiệp kém, được sử khai hóa của thực dân Pháp nhưng không có sự cải biến tốt hơn\n\nd. Xuất phát từ một nước công nghiệp phát hiện tiến lên chủ nghĩa xã hội\nAnswer: a\n\nQuestion: 114. Vấn đề: ... phải \"bắc những nhịp cầu nhỏ\" đi xuyên qua kinh tế tư bản để từng bước xây dựng Chủ nghĩa xã hội. Đồng thời, lưu ý \"chúng ta phải hiểu những đường lối, thể thức, thủ đoạn và phương sách trung gian cần thiết để chuyển từ những quan hệ tiền tư bản chủ nghĩa lên chủ nghĩa xã hội. Đó là mẫu chốt của vấn đề. Thông qua vấn đề trên hãy cho biết VILênin muốn đề cập đến đó là hình thức cơ bản nào của thời kỳ quá độ lên chủ nghĩa xã hội?\nA. Trực tiếp\nB. Vừa trực tiếp vừa gián tiếp\nC. Gián tiếp\nD. Không trải qua\nAnswer: C\n\nQuestion: 115. Theo C.Mác và Ph.Ăngghen: \"giai cấp tư sản không chỉ tạo ra vũ khí sẽ giết chết mình mà còn tạo ra những người sử dụng vũ khí đó ...\" - những người đó là ai?(NHUNG HOÀNG)\n\nA. Giai cấp công nhân hiện đại\n\nB. Giai cấp nông dân hiện đại\n\nC. Những nhà tư sản trí thức\n\nD. Tầng lớp trí thức\nAnswer: A\n\nQuestion: 116. Cho đến nay, kinh tế gia đình Việt Nam đã có bước chuyển biến mang tính bước ngoặt nào? ( chọn 2 đáp án)\nA. Từ kinh tế tự cấp, tự túc thành kinh tế hàng hóa\nB. Từ đơn vị kinh tế đáp ứng nhu cầu của thị trường quốc gia thành đơn vị kinh tế đáp ứng nhu cầu của thị trướng toàn cầu\nC. Từ kinh tế hàng hóa thành kinh tế tự cấp, tự túc\nD. Từ kinh tế kế hoạch hóa tập trung sang kinh tế thị trường tự do\nAnswer: AB\n\nQuestion: 117. Vấn đề \"Giai cấp tư sản, trong quá trình thống trị giai cấp chưa đầy một thế kỷ, đã tạo ra những lực lượng sản xuất nhiều hơn và đồ số hơn lực lượng sản xuất của tất cả các thế hệ trước kia gộp lại\" được C.Mác và PhĂngghen viết trong tác phẩm nào dưới đây ?\nA. Tuyên ngôn của Đảng Cộng sản\nB. Tư bản\nC. Góp phần phê phán triết học pháp quyền của Hêghen\nD. Gia đình thần thánh\nAnswer: A\n\nQuestion: 118. Đối tượng nghiên cứu của chủ nghĩa xã hội khoa học là gì?\nA. Là những quy luật và tính quy luật chính trị -xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội cộng sản chủ nghĩa\nB. Là những quy luật hình thành, phát triển và hoàn thiện của các hình thái kinh tế - xã hội\nC. Là những quy luật và tính quy luật chính trị -xã hội của quá trình phát sinh, hình thành và phát triển hình thái kinh tế - xã hội chủ nghĩa xã hội\nD. Tất Cả các đáp án đều đúng\nAnswer: A\n\nQuestion: 119. Chị B tuổi Dần quen với Anh A tuổi Hợi. Anh A đã dẫn chị B về nhà ra mắt gia đình để thảo luận về chuyện hôn nhân. Khi mẹ của Anh A biết chị B tuổi Dần, còn bản thân mình tuổi Tỵ, bà lập tức phán đoán về chuyện hôn sự. Bà cho rằng \"khác tuổi\", và nếu Anh A và Chị B kết hôn, gia đình sẽ gặp xui xẻo và chết. Đây được xem là mê tín (loại hình) nào sau đây?(NHUNG HOÀNG)\n\nA. Tôn giáo\n\nB. Mê tín dị đoan\n\nC. Tín ngưỡng\n\nD. Mê tín\nAnswer: B\n\nQuestion: 120. Chủ nghĩa xã hội khoa học ra đời dựa trên mấy tiền đề?\nA. 2\nB. 3\nC. 4\nD. 5\nAnswer: A\n\nQuestion: 121. Sau Hội nghị Mátxcơva (1960), hoạt động lý luận và thực tiễn của Đảng Cộng sản và công nhân như thế nào?\nA. Tăng cường hơn trước\nB. Chỉ có công nhân phát triển\nC. Bị chủ nghĩa tư bản thủ tiêu\nD. Không phát triển\nAnswer: A\n\nQuestion: 122. Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam hiện nay tồn tại hình thức phân phối nào?\nA. Phân phối theo tiền lương\nB. Phân phối theo bao cấp\nC. Phân phối theo lao động, theo mức độ đóng góp và quỹ phúc lợi xã hội\nD. Phân phối theo tiền lương và phân phối theo nhu cầu\nAnswer: C\n\nQuestion: 123. Nền sản xuất đại công nghiệp và phương thức sản xuất tiên tiến đã rèn luyện giai cấp công nhân có những phẩm chất gì đặc biệt hơn các giai cấp khác?\nA. Tinh thần yêu thương. đùm bọc lẫn nhau\nB. Tính tổ chức. kỷ luật lao động. tinh thần hợp tác cao\nC. Phẩm chất cần cù. siêng năng và chịu khó\nD. Sự' khổ luyện. kiên trì lao động vì tiền lương\nAnswer: B\n\nQuestion: 124. Dân chủ xã hội chủ nghĩa đã được phôi thai từ khi nào?\nA. Thực tiễn đấu tranh giai cấp ở Việt Nam\nB. Thực tiến đấu tranh giai cấp ở Pháp và Công xã Pari năm 1871\nC. Thành công của cách mạng tháng 8 năm 1945\nD. Phong trào cách mạng 1930 -1931\nAnswer: B\n\nQuestion: 125. V.I.Lênin gọi thời kỳ quá độ lên chủ nghĩa xã hội là gì?\nA. \"Cuộc đấu tranh giai cấp trong bôi cảnh mới\"\nB. \"Quá trình gian nan. phức tạp\"\nC. \"Những cơn đau đẻ kéo dài\"\nD. \"Sự đảo lộn trật tự\" sâu sắc\"\nAnswer: C\n\nQuestion: 126. Nguyên tắc cơ bản của nền dân chủ xã hội chủ nghĩa là:\nA. Không ngừng mở rộng kiến trúc thượng tầng, nâng cao mức độ giải phóng cho những ngưòi lao động, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội\nB. Không ngừng mở rộng kinh tế, nâng cao mức độ giải phóng cho những người thống trị, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội\nC. Không ngừng mở rộng dân chủ, nâng cao mức độ giải phóng cho những người lao động,thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản lý xã hội\nD. Không ngừng mở rộng cơ sở hạ tầng, nâng cao mức độ giải phóng cho những người lao động, thu hút họ tham gia tự giác vào công việc quản lý nhà nước, quản l\nAnswer: C\n\nQuestion: 127. Đâu là căn cứ cơ bản để xây dựng chính sách phát triển kinh tế, văn hóa, xã hội của mỗi xã hội trong từng giai đoạn lịch sử cụ thể?\nA. Cơ cấu văn hóa, tư tưởng, giáo dục\nB. Cơ cấu tổ chức, quản lý và đào tạo\nC. Cơ cấu xã hội - giai cấp\nD. Cơ cấu kinh tế - xã hội\nAnswer: C\n\nQuestion: 128. Bản chất chính trị của dân chủ xã hội chủ nghĩa được thể hiện như thế nào?\nA. Thực hiện dân chủ đối với tất cả mọi người\nB. Nền dân chủ do Đảng Cộng sản là đảng duy nhất lãnh đạo, thực hiện quyền lợi và lợi ích của toàn thể nhân dân lao động\nC. Nền dân chủ do các đáng phải đòi lập nhau cạnh tranh công bằng để nhận được sự tín nhiệm của mọi người\nD. Thực hiện nhất quân một nguyên tắc duy nhất là tập trung dân chủ\nAnswer: B\n\nQuestion: 129. Một trong ba phát kiến vĩ đại của C.Mác và Phăng ghen là gì?\nA. Ủng hộ nhân dân lao động\nB. A và B đều đúng\nC. Thành lập quốc tế cộng sản\nD. Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân\nAnswer: D\n\nQuestion: 130. Ai đã đưa ra quan niệm \"chủ nghĩa xã hội là sự phản kháng và đấu tranh chống sự bóc lột người lao động, mục tiêu cuộc đấu tranh nhằm hoàn toàn xóa bỏ sự bóc lột\"?\nA. S.Phuriê\nB. V.l.Lênin\nC. C.Mác\nD. Ph.Ănghen\nAnswer: B\n\nQuestion: 131. Quá độ lên chủ nghĩa xã hội bỏ qua chế độ tư bản chủ nghĩa là tạo ra sự biến đổi như thế nào của xã hội trên tất cả các lĩnh vực?\nA. Biến đổi về lượng\nB. Biến đổi về chất\nC. Khuynh hướng phát triển\nD. Thực hiện bước nhảy\nAnswer: B\n\nQuestion: 132. Về nội dung kinh tế, sứ mệnh lịch sử của giai Cấp công nhân được thể hiện như thế nào?\nA. Giai cấp công nhân tạo tiền đề vật chất - kỹ thuật cho sự ra đời của xã hội mới\nB. Tất cả các đáp án đều đúng\nC. Giai cấp công nhân thực hiện tiến bộ và công bằng xã hội thông qua các nguyên tắc sở hữu. quản lí và phân phối phù hợp\nD. Giai cấp công nhân thiết lập một quan hệ sản xuất mới phù hợp với sự phát triển của lực lượng sản xuất\nAnswer: B (Nếu không có Tất cả thì chọn D)\n\nQuestion: 133. Nội dung cơ bản và trực tiếp để xây dựng gia đình ở Việt Nam hiện nay là gì?\nA. Phát triển kinh tế - xã hội\nB. Xây dựng gia đình no ấm, bình đẳng, tiến bộ và hạnh phúc\nC. Giải phóng người phụ nữ\nD. Nâng cao trình độ dân trí cho nhân dân lao động\nAnswer: B\n\nQuestion: 134. Trong thời kì quá độ lên chủ nghĩa xã hội giai cấp tư sản có vị thế như thế nào?\nA. Đã bị đánh bại nhưng vẫn còn sức mạnh về kinh tế\nB. Đã tự thân mình chuyển biến thành giai cấp liên minh với giai cấp cách mạng\nC. Đã bị loại bỏ hoàn toàn\nD. Đã bị chuyển hóa thành giai cấp công nhân\nAnswer: A\n\nQuestion: 135. Theo chủ nghĩa Mác - Lênin, quy luật chung, phố biển cho sự ra đời của Đảng Cộng sản là gì?\nA. Là sự kết hợp giữa phong trào công nhân với phong trào nông dân\nB. Là sự kết hợp giữa chủ nghĩa xã hội khoa học với phong trào công nhân\nC. Là sự kết hợp giữa chủ nghĩa xã hội khoa học và phong trào yêu nước\nD. Là sự kết hợp giữa phong trào công nhân và phong trào yêu nước\nAnswer: B\n\nQuestion: 136. Đại hội XI đã đề ra phương hướng phát triển nền kinh tế như thế nào trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam trong giai đoạn tới?\n\na. Phát triển nền kinh tế thị trường xã hội chủ nghĩa\nb. Phát triển nền kinh tế thị trường hiệp đồng\nc. Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa\nd. Phát triển nền kinh tế kế hoạch hóa tập trung\nAnswer: c\n\nQuestion: 137. Trong thời kỳ quá độ lên chủ nghĩa xã hội, các giai cấp và tầng lớp tồn tại như thế nào?\nA. Chỉ còn tồn tại giai cấp công nhân và các tầng lớp nhân dân lao động\nB. Tồn tại nhiều giai cấp. tầng lớp. mâu thuẫn. xung đột ngày càng gay gắt với nhau\nC. Không còn tồn tại giai cấp và đối kháng giai cấp\nD. Tồn tại nhiều giai cấp, tầng lớp, có sự khác biệt, vừa hợp tác, vừa đấu tranh với nhau\nAnswer: D\n\nQuestion: 138. Làm thế nào để có thể tạo sự đồng thuận và phát huy tinh thần đoàn kết thống nhất giữa các lực lượng trong khối liên minh và toàn xã hội Việt Nam hiện nay?\nA. Xây dựng chủ trương, chính sách phù hợp, đúng dân, giải quyết hài hòa lợi ích của từng đã tượng liên minh cụ thể và đảm bảo lợi ích chung\nB. Mọi văn đề, mọi pháp luật khi đưa ra đều phải thông qua tất cả công dân để được ban hành, đảm bảo tinh cũng thuận tuyệt đối\nC. Có chính sách gắn kết, ràng buộc lợi ích kinh tế giữa các giai Cấp, tầng lớp đã họ thông nhất ký ích kinh tế với nhau, từ đó đồng thuận và đoàn kết trong mọi Vấn đề\nD. Tất cả đáp án đều đúng\nAnswer: A\n\nQuestion: 139. Đâu không phải là một trong những chính sách đối với đội ngũ trí thức nhằm phát huy vai trò của tầng lớp này, trong cơ cấu xã hỏi - giai cấp ở Việt Nam hiện nay?\nA. Tôn trong và phát huy tư do tư tường trong hoạt động nghiên cứu. sáng tạo\nB. Đảm bảo tư tường của giai Cấp công nhân giữ vị trí chủ đạo trong hoat động nghiên cứu, sáng tạo\nC. Trong dụng trí thức trên cơ số đánh giá đúng phẩm chất, năng lưc và kết quả công hiện\nD. Bảo Vệ quyền sở hữu trí tuệ, đãi ngộ và tôn Vinh xứng đáng những cống hiến của đội ngũ trí thức\nAnswer: B\n\nQuestion: 140. Với tư cách là một hình thái nhà nước, nền dân chủ nào là nền dân chủ của tất cả mọi người\nA. Dân chủ xã hội chủ nghĩa\nB. Dân chủ chủ nô\nC. Dân chủ tư sản\nD. Không có bất cứ nền dân chủ nào là của tất cả mọi người\nAnswer: D\n\nQuestion: 141. Nội dung cương lĩnh dân tộc của chủ nghĩa Mác — Lênin là:\nA. Các dân tộc hoàn toàn bình đẳng, các dân tộc được quyền tự quyết, liên hiệp công nhân tất cả các dân tộc lại.\nB. Các dân tộc đoàn kết, bình đẳng và liên hiệp công nhân tất cả các dân tộc lại.\nC. Các dân tộc có quyền tự quyết, các dân tộc có quyền bình đẳng, liên hiệp công nhân tất cả các dân tộc lại.\nD. Các dân tộc hoàn toàn bình đẳng, tự quyết và liên hiệp công nhân các nước.\nAnswer: A\n\nQuestion: 142. Chức năng cơ bản nào của gia đình được xem là chức năng đặc thù nhất?\nA. Chức năng nuôi dưỡng, giáo dục\nB. Chức năng kinh tế và tổ chức tiêu dùng\nC. Chức năng tái sản xuất ra con người\nD. Chức năng thỏa mãn nhu cầu tâm sinh lý, duy trì tình cảm gia đinh\nAnswer: C\n(Trong 04 chức năng cơ bản của gia đình, thì chức năng nào được xem là chức năng đặc thủ của gia đình?)\n\nQuestion: 143. Chính sách dân tộc của nước ta về chính trị hướng tới đảm bảo đại đoàn kết toàn dân tộc thống nhất vì mục tiêu chung là gì?\nA. Lợi ích kinh tế\nB. Điêu hòa mâu thuẫn giữa các dân tộc\nC. Dân giàu, nước mạnh, dân chủ, công bằng và văn minh\nD. Lợi ích thiết thân của từng dân tộc\nAnswer: C\n\nQuestion: 144. Dựa trên phương diện kinh tế - xã hội, giai cấp công nhân được hiểu là:\nA. Sản phẩm của nền sản xuất đại công nghiệp\nB. Chủ thể của nền sản xuất đại công nghiệp\nC. Là người mua sức lao động và đi bóc lột giá trị thặng dư\nD. A và B đều đúng\nAnswer: A\n\nQuestion: 145. Sự biến đổi của cơ cấu xã hội - giai cấp tất yếu sẽ ảnh hưởng và tác động như thế nào đến toàn bộ cơ cấu xã hội?\nA. Tác động đến sự biến đổi của toàn bộ cơ cấu xã hội\nB. Ảnh hưởng đến sự biến đổi của các cơ cấu xã hội khác và tác động đến sự biến đổi của toàn bộ cơ cấu xã hội\nC. Ảnh hưởng đến sự phát triển và quản lý xã hội\nD. Ảnh hưởng đến sự biến đổi của các cơ cấu xã hội\nAnswer: B\n\nQuestion: 146. Đảng Cộng sản Việt Nam chủ trương xây dựng chế độ dân chủ xã hội chủ nghĩa, mở rộng và phát huy quyền làm chủ của nhân dân dựa trên tư tưởng của ai?(NHUNG HOÀNG)\n\nA. PhAngghen.\n\nB. V.I.Lênin\n\nC. C.Mác\n\nD. Chủ tịch Hồ Chí Minh\nAnswer: D\n\nQuestion: 147. Chức năng tái sản xuất ra con người của gia đình nên được thực hiện theo xu hướng hạn chế hay khuyến khích?\nA. Tùy theo từng nơi, theo từng nhu cầu cụ thể của xã hôi\nB. Cần khuyến khích phát triển để phát triển kinh tế\nC. Cần hạn chế để tránh dân số quá đông\nD. Không nên can thiệp, vì đây là chức năng tự nhiên. quyền tự do của mỗi gia đình\nAnswer: A\n\nQuestion: 148. Phong trào công nhân ở Việt Nam vào thế kỉ XX cho thấy đặc trưng của giai cấp công nhân Việt Nam khác với giai cấp công nhân các nước tư bản như thế nào?\n\na. Giai cấp công nhân Việt Nam chưa hăng hái tỏng các phong trào đấu tranh như công nhân các nước tư bản chủ nghĩa\nb. Giai cấp công nhân Việt Nam khi ra đời chưa có sự lãnh đạo kịp thời của Đảng Cộng sản như các nước tư bản chủ nghĩa\nc. Giai cấp công nhân Việt Nam thể hiện đặc tính cách mạng về ý thức giai cấp và cả về ý thức dân tộc\nd. Mâu thuẫn giữa giai cấp công nhân Việt Nam và giai cấp tư sản trong giai đoạn này chưa gay gắt như các nước tư bản chủ nghĩa\nAnswer: c\n\nQuestion: 149. Theo chủ nghĩa Mác - Lênin, điều cần thiết trước hết để khắc phục dân các ảnh hưởng tiêu cực của tôn giáo là gì?\nA. Thực thi mệnh lệnh hành chính giảm bớt các tôn giáo\nB. Tuyên truyền chủ nghĩa Mác — Lênin\nC. Can thiệp vào công việc nội bộ của các tôn giáo\nD. Xác lập một thế giới hiện thực không có áp bức. bất công. nghèo đói và thất học...\nAnswer: D\n\nQuestion: 150. Điền cụm từ thích hợp vào (...): \"Tôn trọng, bảo đảm quyền tự do ... và không ... của nhân dân\".\n\na. Tôn giáo\nb. Tín ngưỡng\nc. Tín ngưỡng và tôn giáo\nd. Tôn giáo và tín ngưỡng\nAnswer: b\n\nQuestion: 151. Tại sao nói dân chủ trong xã hội chiếm hữu nô lệ là dân chủ thiểu số?\nA. Vì số lượng con người thời đó rất ít\nB. Vì nội hàm của khái niệm \"dân\" chỉ bao gồm giai cấp chủ nô và một bộ phân nhỏ công dân tư do\nC. Vì sức tập trung lãnh thổ của các lãnh chúa nhỏ bé\nD. Vì quyền lực thực sự thuộc vào tay một lãnh chúa lớn nhất\nAnswer: B\n\nQuestion: 152. Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam hiện nay, hình thức phân phối nào giữ vai trò chủ đạo?\nA. Phân phối theo nhu cầu\nB. Phân phối theo lao động\nC. Phân phối theo bao cấp\nD. Phân phối quỹ phúc lợi xã hội\nAnswer: B\n\nQuestion: 153. Quan hệ nào là quan hệ tự nhiên, là yếu tố mạnh mẽ nhất gắn kết các thành viên trong gia đình với nhau?\nA. Quan hệ nuôi dưỡng\nB. Quan hệ huyết thống\nC. Quan hệ kinh tế\nD. Quan hệ hôn nhân\nAnswer: B\n\nQuestion: 154. Quan hệ dân tộc và tôn giáo ở Việt Nam chịu sự chi phối mạnh mẽ bởi yếu tố nào?\nA. Yếu tố giai Cấp\nB. Yếu tố quản lý của Nhà nước\nC. Yếu tố tín ngưỡng truyền thống\nD. Tất cả các đáp án đều đúng\nAnswer: C\n\nQuestion: 155. Đâu là một phương hướng trong việc phát huy vai trò của phụ nữ trong cơ cấu xã hội Việt Nam hiện nay?\nA. Có kế hoạch chăm sóc sức khỏe sinh sản, đảm bảo quyền tự do kế hoạch hóa gia đình của phụ nữ\nB. Tăng tỷ lệ phụ nữ tham gia vào các cấp ủy và bộ máy quản lý các cấp\nC. Có chính sách ưu đãi xã hội đối với nữ giới để đảm bảo quyền bình đẳng\nD. Tăng cường đội ngũ doanh nhân nữ giới\nAnswer: B\n\nQuestion: 156. Quan hệ dân tộc và tôn giáo ở nước ta được thiết lập và cũng cố trên cơ sở nào?\nA. Sự thống nhất quản lý của Đảng Cộng sản Việt Nam\nB. sự thông nhất lợi ích kinh tế giữa các giai cấp\nC. Sự thống nhất trong cùng cộng đồng quốc gia - dân tộc\nD. Tất cả các đáp án đều đúng\nAnswer: C\n\nQuestion: 157. Cần làm gì để tăng cường công tác giám sát, phản biện xã hội, phát huy quyền làm chủ của ta?\n\na. Công khai hóa, pháp luật hóa chủ trương, chính sách của Đảng và Nhà nước\nb. Công khai hóa, minh bạch hóa, dân chủ hóa về thông tin, chủ trương, chính sách của Đảng và Nhà nước\nc. Công khai hóa, thực thi hóa chủ trương, chính sách của Đảng, Nhà nước và của cả hệ thống chính trị\nd. Triển khai mạnh mẽ, đồng bộ hóa hệ thống pháp luật\nAnswer: b\n\nQuestion: 158. Theo quan điểm của chủ nghĩa Mác - Lênin, loài người đã trải qua các hình thức cộng đồng từ thấp đến cao theo thứ tự là\nA. Thị tộc, bộ lạc, bộ tộc và dân tộc\nB. Bộ tộc, bộ lạc, thị tộc và dân tộc\nC. Dân tộc, thị tộc, bộ lạc và bộ tộc\nD. Bộ lạc, bộ tộc, thị tộc và dân tộc\nAnswer: A\n\nQuestion: 159. Câu nói sau do ai khẳng định: \"Nếu không giải phóng phụ nữ là xây dựng chủ nghĩa xã hội chỉ một nửa\" là của ai?\nA. V.I.Lênin\nB. C.Mác\nC. Chủ tịch Hồ Chí Minh\nD. Ph.Ăngghen\nAnswer: C\n\nQuestion: 160. Trong các nền dân chủ đã và đang tồn tại trong lịch sử loài người, thì nền dân chủ nào là nền dân chủ phát triển cao nhất về chất?\nA. Dân chủ xã hội chủ nghĩa\nB. Dân chủ cộng sản chủ nghĩa\nC. Dân chủ tư sản\nD. Dân chủ chủ nô\nAnswer: A\n\nQuestion: 161. Nội dung cốt lõi của công tác tôn giáo ở nước ta hiện nay là gì?\nA. Công tác giáo dục chủ nghĩa duy vật biện chứng\nB. Công tác cảm hóa giáo dân\nC. Công tác vận động quần chúng\nD. Công tác điều hòa mâu thuẫn giữa các tôn giáo\nAnswer: C\n\nQuestion: 162. Các tôn giáo ở nước ta có đặc điểm tồn tại như thể nào trong lòng quốc gia - dân tộc?\nA. Thống nhất dưới sự thống trị của Đảng Cộng sản Việt Nam\nB. Đa dạng, đan xen, đấu tranh với nhau để giành vị trí thống trị\nC. Đa dạng, đan xen, cạnh tranh với nhau\nD. Đa dạng, đan xen, chúng sống hóa bình và không có xung đột, chiến tranh tôn giáo\nAnswer: D\n\nQuestion: 163. Quan hệ dân tộc và tôn giáo là gì?\nA. Là sự liên kết, tác động qua lại, chi phối lẫn nhau giữa dân tộc với tôn giáo trong nội bộ một quốc gia, hoặc giữa các quốc gia với nhau trong mọi lĩnh vực đời sống xã hội\nB. Là sự liên kết, tác động qua lại, chi phối lẫn nhau giữa dân tộc với tôn giáo trong nội bộ một quốc gia trong mọi lĩnh vưc đời sống xã hội\nC. Là sự liên kết, tác động qua tại, chi phối lẫn nhau giữa dân tộc với tôn giáo giữa các quốc gia với nhau trong mọi lĩnh vực đời sống xã hội\nD. Là đấu tranh bài trừ lẫn nhau giữa dân tộc với tôn giáo trong nội bộ một quốc gia, hoặc giữa các quốc gia với nhau trong mọi lĩnh vực đời sống xã hội\nAnswer: A\n\nQuestion: 164. Quy mô gia đình ở Việt Nam hiện nay tồn tại theo xu hướng nào?\nA. Thu nhỏ số lượng thành viên trong gia đình\nB. Mở rộng số lượng thành viên trong gia đình\nC. Liên kết các gia đình đơn\nD. Quy mô nhỏ ở nông thôn và quy mô lớn ở thành thị\nAnswer: A\n\nQuestion: 165. Các yếu tố của chủ nghĩa xã hội xuất hiện\nA. Trong lòng xã hội chiếm hữu nô lệ\nB. Trong lòng xã hội tư bản\nC. Trong lòng xã hội phong kiến\nAnswer: B\n\nQuestion: 166. Cuộc cải tổ xã hội chủ nghĩa diễn ra đầu tiên tại\nA. Liên Xô\nB. Việt Nam\nC. Trung Quốc\nAnswer: A\n\nQuestion: 167. Theo chủ nghĩa Mác - Lênin, sự thay thế hình thái kinh tế - xã hội tư bản chủ nghĩa bằng hình thái kinh tế - xã hội cộng sản chủ nghĩa là:\nA. Một sự cải biến mang tính chất chủ quan\nB. Một bước ngoặt phát triễn mới, đưa nhân loại thoát khỏi lối mòn cũ\nC. Một quá trình lịch sử - tự nhiên\nD. Một quá trình can thiệp của con người bằng ý chỉ nhằm cải biến lịch sử theo hướng nhân văn, tích cực hơn\nAnswer: C\n\nQuestion: 168. Liên Xô và Đông Âu sụp đổ là do\nA. Bản chất của chủ nghĩa Mác- Lênin\nB. Vận dụng sai chủ nghĩa Mác- Lênin\nC. Sai lầm của chủ nghĩa Mác- Lênin\nAnswer: B\n\nQuestion: 169. Theo C.Mác và Ph.Ăngghen, khi thực hiện cách mạng xã hội chủ nghĩa xóa bỏ được tình trạng người bóc lột người, giai cấp này bóc lột giai cấp khác thì có thể tiến tới xóa bỏ điều gì?\n\na. Xóa bỏ tình trạng dân tộc này bóc lột dân tộc khác\nb. Xóa bỏ sự tồn tại của chế độ sở hữu tư nhân về công cụ lao động\nc. Xóa bỏ được tệ nạn xã hội\nd. Xóa bỏ được tôn giáo\nAnswer: a\n\nQuestion: 170. Cuộc cải cách và mở cửa diễn ra đầu tiên tại\nA. Liên Xô\nB. Đông Âu\nC. Trung Quốc\nAnswer: C\n\nQuestion: 171. Cách mạng xã hội chủ nghĩa muốn thành công phải bằng phương pháp\nA. Bạo lực\nB. Kinh tế\nC. Chính trị\nAnswer: A\n\nQuestion: 172. Phát kiến nào của C.Mác và Ph.Ăngghen đã khắc phục triệt để được những hạn chế có tính lịch sử của chủ nghĩa xã hội không tưởng Pháp?\nA. Chủ nghĩa duy vật lịch sử\nB. Chủ nghĩa duy vật biện chứng\nC. Học thuyết về giá trị thặng dư\nD. Học thuyết về sứ mệnh lịch sử toàn thế giới của giai cấp công nhân\nAnswer: D\n\nQuestion: 173. Ở Việt Nam hiện nay, tổ chức nào đại diện cho quyền lợi, lợi ích hợp pháp và là nơi để giai cấp công nhân chủ động, tích cực tham gia xây dựng, chỉnh đốn Đảng, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ nhân dân?\nA. Hệ thống tố chức Công đoàn\nB. Quốc hội\nC. Mặt trận Tổ quốc Việt Nam\nD. Hội đồng nhân dân các Cấp\nAnswer: A\n\nQuestion: 174. Mô hình kinh tế mới tại Liên Xô viết tắt là\nA. USR\nB. NEP\nC. CCCP\nAnswer: B\n\nQuestion: 175. Cuộc cách mạng xã hội chủ nghĩa đầu tiên trên thể giới là\nA. Cách mạng tháng Tám\nB. Cách mạng Tân Hợi\nC. Cách mạng tháng Mười Nga\nAnswer: C\n\nQuestion: 176. Cách mạng xã hội chân chính và triệt để phải(NHUNG HOÀNG)\n\nA. Giải phóng loài người ra khỏi áp bức bóc lột\n\nB. Giải phóng xã hội ra khỏi áp bức bóc lột\n\nC. Giải phóng giai cấp công nhân ra khỏi áp bức bóc lột\nAnswer: A\n\nQuestion: 177. Trích dẫn: \"... các giai cấp khác đều suy tàn và tiêu vong cùng với sự phát triển của đại công nghiệp, còn giai cấp vô sản lại là sản phẩm của bản thân nền đại công nghiệp đó\" được C.Mác Và Ph.Ăngghen đề cập trong tác phẩm nào?(NHUNG HOÀNG)\n\nA. Tình cảnh công nhân Anh\n\nB. Bộ Tư bản\n\nC. Tuyên ngôn của Đảng Cộng sản\n\nD. Chống Đuyrinh\nAnswer: C\n\nQuestion: 178. Sau khi lật đổ được sự thống trị của giai cấp thống trị, sứ mệnh lịch sử của giai cấp công nhân được tiếp tục thực hiện như thế nào?\n\na. Thiết lập nhà nước kiểu mới, mang bản chất giai cấp công nhân\nb. Xây dựng nền dân chủ xã hội chủ nghĩa\nc. Thực hiện quyền lực, quyền làm chủ của tuyệt đại đa số nhân dân lao động\nd. Tất cả các đáp án đều đúng\nAnswer: d\n\nQuestion: 179. Về mặt thực tiễn, việc nghiên cứu chủ nghĩa xã hội khoa học có ý nghĩa gì?\nA. Thấy rõ khoảng cách giữa lý luận chủ nghĩa xã hội khoa học và thực tiễn vận dung nó\nB. Sự sụp đổ của Liên Xô và Đông Âu là do đã nhận thức và hành động trên nhiều vấn đề trái Với chủ nghĩa xã hội khoa học, trải với chủ nghĩa Mác - Lênin chủ không phải là do đi theo chủ nghĩa xã hội khoa học làm cho các nước này khủng hoảng\nC. Cần có bản lĩnh vững vàng, sáng suốt và sáng tạo trong việc vận dụng chủ nghĩa xã hội khoa học và bối cảnh lịch sử cụ thể của từng quốc gia, tránh giáo điều, bảo thủ, duy ý chí.\nD. Tất cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 180. Một bộ phận giai cấp công nhân đã tham gia vào sở hữu một lượng tư liệu sản xuất của xã hội thông qua chế độ cổ phần là một biểu hiện của xu hướng nào của giai cấp công nhân trong thời đại hiện nay?\nA. Xu hướng thỏa hiệp\nB. Xu hướng \"trung lưu hóa\"\nC. Xu hướng cải cách\nD. Xu hướng \"trí tuệ hóa\"\nAnswer: B\n\nQuestion: 181. *Công cuộc đổi mới xã hội chủ nghĩa diễn ra ở nước nào sau đây\nA. Cu Ba\nB. Trung Quốc\nC. Việt Nam\nAnswer: C\n\nQuestion: 182. Trong thời kỳ quá độ lên chủ nghĩa xã hội ở Việt Nam, hình thức sở hữu và thành phần kinh tế nào tuy còn tồn tại nhưng không giữ vai trò chủ đạo?\nA. Sở hữu tư nhân tư bản chủ nghĩa và thành phần kình tế tập thể\nB. Sở hữu tư nhân tư bản chủ nghĩa và thành phần kinh tế tư nhân tư bản chủ nghĩa\nC. Sở hữu tập thể và thành phần kinh tế tập thể\nD. Sở hữu hổn hợp và thành phần kinh tế tư nhân tư bản chủ nghĩa\nAnswer: B\n\nQuestion: 183. Vị trí của gia đình trong xã hội là:\nA. Gia đình là tớ ấm mang lại các giá trị hạnh phúc, sự hài hòa trong đười sóng Cả nhân của môi thành viện\nB. Gia đình là cầu nối giữa cá nhân và xã hội\nC. Gia đình là tế bào của xã hội\nD. Tất Cả các đáp án đều đúng\nAnswer: D\n\nQuestion: 184. Nội dung cơ bản, lâu dài tạo điều kiện cho liên minh giai cấp, tầng lớp phát triển bền vững ở nước ta là gì?(Chọn 3 đáp án)\nA. Nâng cao chất lượng nguồn nhân lực, xóa đói giảm nghèo\nB. Thực hiện tốt chính sách xã hội đối với các thành phần liên minh\nC. Chăm lo sức khỏe, nâng cao chất lượng sống, nâng cao dân trí cho mọi tầng lớp nhân dân\nD. Đảm bảo phân chia lợi ích kinh tế công bằng trong mô hình kinh tế thị trường tư do hiện đại\nAnswer: ABC\n\nQuestion: 185. Tôn giáo là một phạm trù lịch sử bởi vì:\nA. Là sản phẩm của con người\nB. Là do điều kiện kinh tế - xã hội sinh ra\nC. Tôn giáo ra đời, tồn tại và biến đã trong một giai doan lịch sử nhất định của loài người\nD. Tôn giáo sẽ tồn tại và phát triển cùng Với sự phát triển của lịch sử nhân loại\nAnswer: C\n\nQuestion: 186. Đặc trưng cơ bản đầu tiên của chủ nghĩa xã hội là:\nA. Chủ nghĩa xã hội có nhà nước kiểu mới mang bản chất giai cấp công nhân, đại biểu cho lợi ích, quyền lực và ý chỉ của nhân dân lao động\nB. Chủ nghĩa xã hội là xã hội do nhân dân lao động làm chủ\nC. Chủ nghĩa xã hội có nền kinh tế phát triễn cao dựa trên lực lượng sản xuất hiện đại và chế độ công hữu về tư liệu sản xuất chủ yếu\nD. Chủ nghĩa xã hội giải phóng giai cấp, giải phóng dân tộc, giải phóng xã hội, giải phóng con người, tạo điều kiện để con người phát triển toàn diện\nAnswer: D\n\nQuestion: 187. Sau khi chế độ xã hội chủ nghĩa Liên Xô và Đông Âu sụp đổ, chủ nghĩa xã hội khoa học được bổ sung và phát triển như thế nào?\nA. Được giới tri thức thế giới nghiên cứu như một học thuyết đã lỗi thời\nB. Được các nước Xã hội chủ nghĩa bổ sung và phát triển trong tình hình mới, phù hợp với bối cảnh từng nước\nC. Các nước tư bản chủ nghĩa nghiên cứu chủ nghĩa xã hội khoa học như một học thuyết nhằm khắc phục các khuyết tật của thời đại mới\nD. Được dung hòa cùng với các học thuyết tư sản khác\nAnswer: B\n\nQuestion: 188. Xu hướng phát triển cơ cấu xã hội - giai cấp ở Việt Nam trong thời kỳ quá độ mang tính đa dạng và thống nhất chủ yếu do yếu tố nào quyết định?\n\na. Tất cả đều đúng\nb. Do sự mong muốn của giai cấp công nhân\nc. Do nền kinh tế nhiều thành phần\nd. Do trình độ phát triển không đồng đều\nAnswer: c\n\nQuestion: 189. Cơ cấu xã hội - giai cấp của nước ta trước thời kì đổi mới bao gồm các giai cấp, tầng lớp nào?(Chọn 3 đáp án)\nA. Đội ngũ đảng viên\nB. Đội ngũ tri thức\nC. Giai cấp công nhân\nD. Giai cấp nông dân\nAnswer: BCD\n\nQuestion: 190. C.Mác và Ph.Ăngghen đánh giá: \"Giai cấp tư sản trong quá trình thống trị giai cấp chưa đầy một thế kỉ đã tạo ra một lực lượng sản xuất nhiều hơn và đồ sộ hơn lực lượng của tất cả các thế hệ trước đây gộp lại\" trong tác phẩm nào?\n\na. Chống Đuyrinh\nb. Lược khảo khoa kinh tế - chính trị\nc. Tuyên ngôn của Đảng Cộng sản\nd. Bộ Tư bản\nAnswer: c\n\nQuestion: 191. Từ sau khi V.I.Lênin mất đến năm 1953, ai là người có ảnh hưởng trực tiếp trong việc vận dụng và phát triển chủ nghĩa xã hội khoa học?\nA. J.Xtalin\nB. S.Phurie\nC. G.Đi-mi-trốp\nD. S.Simon\nAnswer: A\n\nQuestion: 192. Nhà nước xã hội chủ nghĩa ra đời là kết quả của:\nA. Cuộc cách mạng do giai Cấp vô sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản\nB. Sự chuyển biến tích cực của nhà nước tư sản\nC. Cuộc cách mạng tư sản do giai Cấp tư sản và nhân dân lao động tiến hành dưới sự lãnh đạo của Đảng Cộng sản\nD. Cuộc cách mạng vô sản do giai Cấp nông nhân tiến hành\nAnswer: A\n\nQuestion: 193. Cương lĩnh xây dựng đất nước trong thời quá độ lên chủ nghĩa xã hội (Bổ sung và phát triển năm 2011) xác định phương hưởng đầu tiên, phản ánh con đường đi lên chủ nghĩa xã hội ở nước ta là :\nA. Đẩy mạnh công nghiệp hoá, hiện đại hoá đất nước gắn với phát triển kinh tế tri thức, bảo vệ tài nguyên, môi trường\nB. Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa\nC. Xây dựng nền văn hoá tiên tiến, đậm đà bản sắc dân tộc; xây dựng con người, nâng cao đời sống nhân dân, thưc hiện tiến bộ và công bằng xã hội\nD. Bảo đảm vững chắc quốc phòng và an ninh quốc gia, trật tự, an toàn xã hội\nAnswer: A\n\nQuestion: 194. Cương lĩnh xây dựng đất nước trong thời quá độ lên chủ nghĩa xã hội (Bổ sung và phát triển năm 2011) xác định phương hướng thứ hai, phản ánh con đường đi lên chủ nghĩa xã hội ở nước ta là:\n\na. Phát triển nền kinh tế thị trường định hướng xã hội chủ nghĩa\nb. Xây dựng nền văn hóa tiên tiến, đậm đà bản sắc dân tộc; xây dựng con người, nâng cao đời sống nhân dân, thực hiện tiến bộ và công bằng xã hội\nc. Bảo đảm vững chắc quốc phòng và an ninh quốc gia, trật tự, an toàn xã hội\nd. Thực hiện đường lối đối ngoại độc lập, tự chủ, hòa bình, hữu nghị, hợp tác và phát triển; chủ động và tích cực hội nhập quốc tế\nAnswer: a\n\nQuestion: 195. Đại hội XI, trong Cương lĩnh xây dựng đất nước trong thời quá độ lên chủ nghĩa xã hội (Bổ sung và phát triển năm 2011) xác định bao nhiêu phương hướng phản ánh con đường đi lên chủ nghĩa xã hội ở nước ta?\n\na. 5\nb. 6\nc. 7\nd. 8\nAnswer: d\n\nQuestion: 196. Nền kinh tế thị trường phát triển mạnh với tính cạnh tranh cao, cộng với xu thế hội nhập ngày càng sâu rộng trong thời đại hiện nay đã làm cho các giai cấp, tầng lớp trong xã hội chuyển biến như thế nào?\nA. Làm cho các giai cấp, tầng lớp trở nên năng động, có khả năng thích ứng nhanh, chủ động và sáng tạo hơn\nB. Tất cả các đáp án đều đúng\nC. Làm thay đổi bản chất của các giai cấp cách mạng, chạy theo lợi nhuận mà đánh mất sứ mệnh lịch sử của mình\nD. Làm cho một bộ phận giai cấp công nhân, nông dân và trí thức không còn tin tưởng vào lí tưởng xã hội chủ nghĩa\nAnswer: A\n\nQuestion: 197. Xây dựng gia đình mới ở Việt Nam hiện nay cần phải kế thừa, phát huy truyền thống nào của gia đình truyền thống?\n\na. Phong tục cưới hỏi\nb. Uy quyền tuyệt đối của người chồng\nc. Sự cố kết chặt chẽ giữa các thành viên\nd. Gia đình đông con\nAnswer: c\n\nQuestion: 198. Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam coi yếu tố nào là chủ thể, là trung tâm của sự phát triển?(NHUNG HOÀNG)\n\na. Giai cấp công nhân\n\nb. Nhân dân lao động\n\nc. Con người\n\nd. Đảng Cộng sản Việt Nam\nAnswer: c\n\nQuestion: 199. Trong cơ cấu xã hội - giai cấp ở Việt Nam hiện nay, giai cấp, tầng lớp nào là lực lượng sáng tạo đặc biệt quan trọng trong tiến trình đẩy mạnh công nghiệp hóa, hiện đại hóa, xây dựng nền kinh tế tri thức?\nA. Giai cấp công nhân\nB. Giai Cấp nông dân\nC. Tầng lớp trí thức\nD. Tầng lớp doanh nhân\nAnswer: C\n\nQuestion: 200. Dân chủ trong 2 lĩnh vực nổi bật và quan trọng nhất là:\nA. Trong lĩnh vực chính trị và tư tưởng\nB. Trong lĩnh vực kinh tế và chính trị\nC. Trong lĩnh vực kinh tế và tư tưởng\nD. Trong lĩnh vực văn hóa tinh thần và tư tưởng\nAnswer: B\n\nQuestion: 201. Đâu không phải là một tầng lớp xã hội mới xuất hiện và phát triển trong thời kì quá độ lên chủ nghĩa xã hội?\n\na. Tầng lớp doanh nhân, tiểu chủ\nb. Tầng lớp những người giàu có\nc. Tầng lớp trung lưu\nd. Tầng lớp trí thức\nAnswer: d\n\nQuestion: 202. Trong thời đại hiện nay, ở các nước xã hội chủ nghĩa, sứ mệnh lịch sử của giai cấp công nhân hội là gì?\n\na. Đấu tranh giành chính quyền về tay giai cấp công nhân và nhân dân lao động\nb. Chống bất công, bất bình đẳng xã hội\nc. Lãnh đạo công cuộc đổi mới, giải quyết thành công các nhiệm vụ trong thời kỳ quá độ lên chủ nghĩa xã hội\nd. Đấu tranh đòi các quyền tự do, dân chủ\nAnswer: c\n\nQuestion: 203. Cơ cấu xã hội nào có vai trò quan trọng nhất?\nA. Cơ cấu giai cấp\nB. Cơ cấu dân tộc\nC. Cơ cấu dân cư\nD. Cơ cấu nghề nghiệp\nAnswer: A\n\nQuestion: 204. Chế độ dân chủ nhân dân ở nước ta được xác lập khi nào?\nA. Từ khi cách mạng tháng Tám thành công\nB. Từ sau chiến thắng Điện Biên Phủ 1954\nC. Ngay sau khi thống nhất đất nước vào năm 1975\nD. Từ khi tiến hành đổi mới vào năm 1986\nAnswer: A\n\nQuestion: 205. Cấu trúc cơ bản của một hình thái kinh tế - xã hội là:\nA. Lực lượng sản xuất, quan hệ sản xuất và kiến trúc thượng tầng\nB. Tất cả đều đúng\nC. Cơ sở kinh tế và thể chế nhà nước\nD. Lực lượng sản xuất và quan hệ sản xuất\nAnswer: A\n\nQuestion: 206. Nhà nước xã hội chủ nghĩa có vai trò như thế nào đối với dân chủ Xã hội chủ nghĩa?\nA. Nhà nước xã hội chủ nghĩa là công cụ trấn áp dân chủ Xã hội chủ nghĩa\nB. Nhà nước Xã hội chủ nghĩa trở thành công cụ quan trọng cho việc thực thi quyền làm chủ của người dân\nC. Nhà nước xã hội chủ nghĩa là động lực, nền tảng thực hiện dân chủ Xã hội chủ nghĩa\nD. Nhà nước Xã hội chủ nghĩa là cơ sở, điều kiện tiên quyết cho việc tổ chức dân chủ triệt để đối với mọi giai cấp\nAnswer: B\n\nQuestion: 207. Chức năng nào được coi là chức năng cơ bản và riêng có của gia đình?\nA. Tổ chức đời sống gia đình\nB. Tái sản xuất ra con người\nC. Giáo dục gia đình\nD. Thỏa mãn tâm sinh lý\nAnswer: B\n\nQuestion: 208. Để tăng cường, củng cố khối đại đoàn kết dân tộc ở nước ta hiện nay thì chính sách cụ thể nào của Đảng và Nhà nước ta được coi là vấn đề cực kỳ quan trọng?\n\na. Tôn trọng lợi ích, truyền thống, văn hoá của các dân tộc.\nb. Phát huy truyền thống đoàn kết giữa các dân tộc.\nc. Phát triển kinh tế hàng hoá ở các vùng dân tộc thiểu số.\nd. Tăng cường bồi dưỡng, đào tạo đội ngũ cán bộ là người dân tộc thiểu số.\nAnswer: b\n\nQuestion: 209. Trong thời kì quá độ lên chủ nghĩa xã hội, các giai cấp, tầng lớp trong cơ cấu xã hội - giai cấp biến đổi trong mối quan hệ như thế nào?\n\na. Đấu tranh với nhau trong bối cảnh mới\nb. Không còn sự phân chia giai cấp\nc. Vừa hợp tác vừa đấu tranh và ngày càng xích lại gần nhau\nd. Hợp tác, liên minh toàn diện với nhau\nAnswer: c\n\nQuestion: 210. Nội dung nào quan trọng nhất trong các nội dung liên minh công-nông-trí thức ?\nA. Chính trị\nB. Kinh tế\nC. Tư tưởng\nD. Văn hóa-xã hội\nAnswer: B\n\nQuestion: 211. Các thế lực thù địch sử dụng chiến lược \"diễn biến hòa bình\" chống phá sự nghiệp xây dựng Tổ quốc xã hội chủ nghĩa của nhân dân ta trên phương diện nào?\n\na. Kinh tế, chính trị - xã hội\nb. Đạo đức, lối sống\nc. Tất cả các đáp án đều đúng\nd. Ngoại giao\nAnswer: c \n\n(Kiểu hỏi khác: Các thế lực thủ địch sử dụng chiến lược \"diễn biến hòa bình\" chống phá sự nghiệp xây dựng Tổ quốc xã hội chủ nghĩa của nhân dân ta trên phương diện trọng yếu nào?\n\nA. Ngoại giao\n\nB. Chính trị, tư tưởng\n\nC. Đạo đức, lối sống\n\nD. Quân sự, chạy đua vũ trang)\n\nQuestion: 212. Điều gì vừa là thách thức vừa tạo ra thời cơ cho Việt Nam trong thời kỳ quá độ chủ nghĩa xã hội hiện nay?\nA. Cuộc cách mạng khoa học công nghệ và xu thế toàn cầu hóa\nB. Sự trở dậy của chủ nghĩa xã hội, tiêu biểu là Trung Quốc\nC. Sự thay đổi trật tự thế giới\nD. Sự gia tăng nhanh chóng của lực lượng lao động nước ta\nAnswer: A\n\nQuestion: 213. Khi nghiên cứu thực tiễn phong trào đấu tranh của giai cấp công nhân châu Âu từ giữa thế kỉ XIX, C.Mác và Ph.Ăngghen cho rằng giai cấp công nhân thất bại là do đã không liên minh được với \"người bạn đồng hành tự nhiên\" của mình. Người bạn đó là giai cấp nào?\n\na. Giai cấp nông dân\nb. Giai cấp tư sản\nc. Giai cấp địa chủ phong kiến\nd. Tầng lớp doanh nhân\nAnswer: a\n\nQuestion: 214. Lợi ích cơ bản của giai cấp công nhân có quan hệ như thế nào với lợi ích cơ bản của các giai cấp khác trong xã hội? ( 2 đáp án)\nA. Đối lập trực tiếp với lợi ích cơ bản của giai cấp tư sản\nB. Thống nhất với lợi ích cơ bản của đa số nhân dân tao động\nC. Đối lập trực tiếp với lợi ích cơ bản của giai cấp nông dân\nD. Thống nhất với lợi ích cơ bản của giai cấp tư sản\nAnswer: AB\n\nQuestion: 215. Những nhược điểm, hạn chế vốn có do hoàn cảnh lịch sử và nguồn gốc xã hội sinh ra của giai Cấp công nhân Việt Nam là gì?\nA. Tâm lý tiểu nông, thói quen, tập quán lạc hậu tứ truyền thông xã hội nông nghiệp cổ truyền\nB. Tư tưởng dễ thỏa hiệp, không kiên quyết đấu tranh đến cùng\nC. Sư tư phát, lẻ tế trong phong trào công nhân, không được giác ngộ tư tưởng chính trị\nD. Tâm lý chịu đựng, mê tín dị đoan\nAnswer: A\n\nQuestion: 216. Đâu không phải là một hình thái kinh tế - xã hội theo phân kì lịch sử loài người của chủ nghĩa Mác - Lênin?\nA. Xã hội chủ nghĩa\nB. Tư bản chủ nghĩa\nC. Cộng sản chủ nghĩa\nD. Phong kiến\nAnswer: A\n\nQuestion: 217. Mâu thuẫn cơ bản và chủ yếu trong xã hội tư bản chủ nghĩa, bắt buộc nó phải được thay thế bằng hình thái kinh tế - xã hội khác phù hợp hơn là gì?\n\na. Mâu thuẫn giữa tính chất chuyên môn hóa của lực lượng sản xuất với chế độ chiếm hữu tập thể tư bản chủ nghĩa về tư liệu sản xuất\nb. Mâu thuẫn giữa tính chất xã hội hóa về lực lượng sản xuất với chế độ chiếm hữu công cộng về tư liệu sản xuất\nc. Mâu thuẫn giữa tính chất xã hội hóa của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất\nd. Mâu thuẫn giữa tính chất tư nhân hóa của lực lượng sản xuất với chế độ chiếm hữu tư nhân tư bản chủ nghĩa về tư liệu sản xuất\nAnswer: c\n\nQuestion: 218. Trong thời kì quá độ lên chủ nghĩa xã hội ở Việt Nam hiện nay, giai cấp công nhân có vị trí, vai trò như thế nào trong khối liên minh giai cấp?\n\na. Là lực lượng nòng cốt, tiên phong trong liên minh giai cấp\nb. Là lực lượng hỗ trợ duy trì liên minh\nc. Là lực lượng duy trì khối đại đoàn kết của giai cấp công nhân, nông dân với tư sản và trí thức\nd. Tất cả đáp án đều đúng\nAnswer: a\n\nQuestion: 219. Đâu là tiền đề khoa học tự nhiên cho sự ra đời của chủ nghĩa xã hội khoa học?\nA. Định luật bảo toàn và chuyển hóa năng lượng\nB. Học thuyết tế bào\nC. Tất cả các đáp án đều đúng\nD. Học thuyết tiến hóa\nAnswer: C\n\nQuestion: 220. Theo chủ nghĩa Mác - Lênin, chất lượng của giai cấp công nhân được thế hiện thông qua yếu tố nào?\nA. Sư chuyên nghiệp trong tác phong, kỷ luật lao động\nB. Năng lực tập hợp, vận động và thống trị nhân dân lao động thông qua đội tiên phong của mình - Đảng Cộng sản\nC. Năng lực tổ chức khởi nghĩa giành chính quyền\nD. Trình độ trưởng thành về ý thức chính trị của một giai cấp cách mạng\nAnswer: D\n\nQuestion: 221. Nếu thiếu đi cơ sở văn hóa, hoặc cơ sở văn hóa không đi liền với cơ sở kinh tế, chính tri, thì sẽ ảnh hưởng đến vấn đề gì?\nA. Việc phát triển xã hội\nB. Việc nhận thức về thế giới xung quanh của con người bị hạn chế\nC. Việc xây dựng gia đình sẽ lệch lạc, không đạt hiệu quả cao\nD. Việc phát triển tâm sinh lý của con người\nAnswer: A\n\nQuestion: 222. Cơ cấu xã hội - giai cấp trong thời kì quá độ lên chủ nghĩa xã hội có sư đan xen giữa cái cũ và cái mới, biểu hiện về mặt kinh tế của nó là gì?\nA. Tồn tại nhiều hình thức liên doanh, liên kết tư bản nước ngoài\nB. Tồn tại nhiều giai cấp, tầng lớp đối lập với nhau\nC. Tồn tại kết cấu kinh tế nhiều thành phần\nD. Tồn tại nhiều chủ sở hữu trong cùng một doanh nghiệp\nAnswer: C\n\nQuestion: 223. Trong cách mạng xã hội chủ nghĩa, giai cấp công nhân phải liên minh được với giai cấp nông dân và các tầng lớp nhân dân lao động khác trong giai đoạn nào? ( chọn 2 đáp án )\nA. Giai đoạn xóa bỏ giai cấp sau khi xây dựng thành công chủ nghĩa xã hội\nB. Giai đoạn xây dựng chế độ xã hội mới\nC. Giai đoạn đấu tranh đòi các quyền tư do, dân chủ\nD. Giai đoạn giành chính quyền\nAnswer: BD\n\nQuestion: 224. Quan hệ dân tộc và tôn giáo Việt Nam chịu sự chỉ phối mạnh mẽ bởi vấn đề gì?\nA. Tín ngưỡng truyền thống\nB. Giáo dục truyền thông\nC. Mê tín dị đoan\nD. Văn hóa tín ngưỡng\nAnswer: A\n\nQuestion: 225. Tính chất xã hội hóa cao của lực lượng sản xuất đòi hỏi vấn đề gì?\nA. Một quan hệ sản xuất mới, phù hợp với chế độ công hữu các tư liệu sản xuất chủ yếu của xã hội\nB. Một cơ sở ha tầng mới, phù hợp với chế độ công hữu các tư liệu sản xuất chủ yếu của xã hội\nC. Một lực lượng sản xuất mới, phù hợp với chế độ công hữu các tư liệu sản xuất chủ yếu của xã hội\nD. Một kiến trúc thượng tầng mới, phù hợp với lực

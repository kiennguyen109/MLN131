ay so với thế kỉ XIX?", "options": [{"key": "A", "text": "Giai cấp công nhân vẫn là lực lượng sản xuất hàng đầu của xã hội hiện đại"}, {"key": "B", "text": "Giai cấp công nhân vẫn bị chủ nghĩa tư bản và giai cấp tư sản bóc lột giá trị thặng dư"}, {"key": "C", "text": "Giai cấp công nhân vẫn có lợi ích cơ bản xung đột với lợi ích cơ bàn của giai cấp tư sản"}, {"key": "D", "text": "Giai cấp công nhân vẫn làm việc với cường độ cao, trình độ lao động ngày càng yếu kém"}], "answer": ["D"], "note": "", "block": 7}, {"id": 344, "text": "Sự ra đời của công nghiệp cơ khí là bước tiến to lớn của lực lượng sản xuất trong cuộc cách mạng công nghiệp lần thứ mấy?", "options": [{"key": "A", "text": "Cách mạng công nghiệp lần thứ nhất"}, {"key": "B", "text": "Cách mạng công nghiệp lần thứ hai"}, {"key": "C", "text": "Cách mạng công nghiệp lần thứ ba"}, {"key": "D", "text": "Cách mạng công nghiệp lần thứ tư"}], "answer": ["A"], "note": "", "block": 7}, {"id": 345, "text": "Trong gia đình truyền thống, ai được xem là trụ cột của gia đình?", "options": [{"key": "A", "text": "Người vợ"}, {"key": "B", "text": "Người chồng"}, {"key": "C", "text": "Cà vợ và chồng"}, {"key": "D", "text": "Người con trong gia đình"}], "answer": ["B"], "note": "", "block": 7}, {"id": 346, "text": "Theo V.I.Lênin, đối với những nước chưa có chủ nghĩa tư bản phát triên cao thì cần phải có một thời kỳ gì để từ chủ nghĩa tư bản lên chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Thời kỳ khai sáng"}, {"key": "B", "text": "Thời kỳ tiến lên"}, {"key": "C", "text": "Thời kỳ quá độ"}, {"key": "D", "text": "Thời kỳ phát triển"}], "answer": ["C"], "note": "", "block": 7}, {"id": 347, "text": "Mâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là:", "options": [{"key": "A", "text": "Mâu thuẫn giữa lực lượng sản xuất xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bàn chủ nghĩa về tư liệu sản xuất"}, {"key": "B", "text": "Mâu thuẫn giữa quan hệ sản xuất xã hội hóa ngày càng rộng lớn với lực lượng sàn xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất"}, {"key": "C", "text": "Mâu thuẫn giữa cơ sở hạ tầng và kiến trúc thượng tầng"}, {"key": "D", "text": "Mâu thuẫn giữa tôn tại xã hội và ý thức xã hội"}], "answer": ["A"], "note": "(Kiểu hỏi khác: \n\nMâu thuẫn cơ bản của phương thức sản xuất tư bản chủ nghĩa là:\n\na. Mâu thuẫn giữa giai cấp tư sản và giai cấp vô sản\n\nb. Mâu thuẫn giữa chủ nghĩa tư bản và chủ nghĩa xã hội\n\nc. Mâu thuẫn giữa lực lượng sản xuất xã hội hóa ngày càng rộng lớn với quan hệ sản xuất tư bản chủ nghĩa dựa trên chế độ tư hữu tư bản chủ nghĩa về tư liệu sản xuất\n\nd. Mâu thuẫn giữa lực lượng sản xuất và quan hệ sản xuất)", "block": 7}, {"id": 348, "text": "Nguyên tắc phân phối chủ yếu của chủ nghĩa cộng sản là gì?", "options": [{"key": "A", "text": "Làm theo năng lực, hướng theo nhu cầu"}, {"key": "B", "text": "Làm theo năng lực, hướng theo lao động"}, {"key": "C", "text": "Làm theo năng lực, hướng theo phúc lợi xã hội"}, {"key": "D", "text": "Làm theo công việc, hướng theo tiền lương"}], "answer": ["A"], "note": "", "block": 7}, {"id": 349, "text": "Trình độ phát triển của các dân tộc ở Việt Nam như thế nào?", "options": [{"key": "A", "text": "Đồng đều, có sự hỗ trợ của nhà nước"}, {"key": "B", "text": "Không đồng đêu, có sự chênh lệch khá lớn"}, {"key": "C", "text": "Tương đối đồng đều, trong đó dẫn tộc Kinh phát triển cao nhất"}, {"key": "D", "text": "Không thế so sánh"}], "answer": ["B"], "note": "", "block": 7}, {"id": 350, "text": "Trong các kiểu nhà nước dưới dây, nhà nước nào là nhà nước của tất cả mọi người, mọi giai cấp", "options": [{"key": "A", "text": "Nhà nước chiếm hữu nô lệ"}, {"key": "B", "text": "Nhà nước tư sản"}, {"key": "C", "text": "Nhà nước xã hội chủ nghĩa"}, {"key": "D", "text": "Không có kiểu nhà nước nào là của tất cả giai cấp"}], "answer": ["D"], "note": "", "block": 7}, {"id": 351, "text": "Đánh giá sau được trích trong tác phẩm nào: \"tác phẩm chủ yếu và cơ bản ấy trình bày chủ nghĩa xã hội khoa học... những yếu tổ tử đó này sinh ra chế độ tương lai\"?", "options": [{"key": "A", "text": "Chống Đuyring"}, {"key": "B", "text": "Đường Kách mệnh"}, {"key": "C", "text": "Tuyên ngôn của Đảng Cộng sản"}, {"key": "D", "text": "Tư bản"}], "answer": ["D"], "note": "", "block": 8}, {"id": 352, "text": "Ở Việt Nam hiện nay, tồn tại mô hình người chủ gia đình nào?", "options": [{"key": "A", "text": "Người đàn ông - người chồng làm chủ gia đình"}, {"key": "B", "text": "Người phụ nữ - người vợ làm chủ gia đình"}, {"key": "C", "text": "Cả hai vợ chồng cùng làm chủ gia đình"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["D"], "note": "", "block": 8}, {"id": 353, "text": "Học thuyết về hình thái kinh tế - xã hội do ai khởi xướng, và sau đó được ai bổ sung, phát triển?", "options": [{"key": "A", "text": "C.Mác - V.I.Lênin khôi xướng, Ph. Ăngghen bổ sung phát triển"}, {"key": "B", "text": "C.Mác - Ph. Ăngghen khởi xướng, V.I Lênin bổ sung phát triển"}, {"key": "C", "text": "C.Mác - Ph. Ăngghen khởi xướng, Chủ tịch Hồ Chí Minh bố sung phát triển"}, {"key": "D", "text": "C.Mác khởi xướng, Ph. Ăngghen bổ sung phát triển"}], "answer": ["B"], "note": "", "block": 8}, {"id": 354, "text": "Đâu là truyền thống quý báu của các dân tộc ở Việt Nam góp phần quyết định mọi thẳng lợi của dân tộc trong các giai đoạn lịch sử?", "options": [{"key": "A", "text": "Yêu nước, yêu quê hương"}, {"key": "B", "text": "Đoàn kết dân tộc"}, {"key": "C", "text": "Tinh thần học tập không ngừng"}, {"key": "D", "text": "Hiếu thảo với ông bà cha mẹ"}], "answer": ["A"], "note": "(Câu trả lời khác: Chống giặc ngoại xâm)", "block": 8}, {"id": 355, "text": "Những biến đối và khác biệt của giai cấp công nhân hiện đại so với giai cấp công nhân thế ki XIX là gì? (Chọn 3)", "options": [{"key": "A", "text": "Xu hướng trí tuệ hóa tăng nhanh"}, {"key": "B", "text": "Xu hướng trung lưu hóa gia tăng"}, {"key": "C", "text": "Là giai cấp giữ vai trò lãnh đạo, cầm quyền trong quá trình xây dựng chủ nghĩa xã hội ở một số quốc gia"}, {"key": "D", "text": "Xu hưởng bần cùng hóa gia tăng nhanh chóng"}], "answer": ["A", "B", "C"], "note": "", "block": 8}, {"id": 356, "text": "Tín đồ có chức vụ, phẩm sắc trong tôn giáo được gọi là gì?", "options": [{"key": "A", "text": "Lãnh đạo tôn giáo"}, {"key": "B", "text": "Quản lý tôn giáo"}, {"key": "C", "text": "Giáo chủ tôn giáo"}, {"key": "D", "text": "Chức sắc tôn giáo"}], "answer": ["D"], "note": "", "block": 8}, {"id": 357, "text": "Quyền tự do kết hôn trên cơ sở tình yêu và quyền tự do ly hôn là hai quyền thực hiện nguyên tắc nào của chế độ hôn nhân tiến bộ?", "options": [{"key": "A", "text": "Hôn nhân tự nguyện"}, {"key": "B", "text": "Hôn nhân một vợ một chồng, vợ chồng bình đẳng"}, {"key": "C", "text": "Hôn nhân được đàm bảo về mặt pháp lý"}, {"key": "D", "text": "Hôn nhân được đàm bảo về mặt kinh tế"}], "answer": ["A"], "note": "", "block": 8}, {"id": 358, "text": "Đâu không phải là hôn nhân tiến bộ?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Hôn nhân tự nguyện"}, {"key": "B", "text": "Hôn nhân một vợ, một chồng, vợ chồng bình đẳng"}, {"key": "C", "text": "Hôn nhân một vợ, một chồng, chồng nắm quyền"}, {"key": "D", "text": "Hôn nhân được đảm bảo về pháp lý"}], "answer": ["C"], "note": "", "block": 8}, {"id": 359, "text": "Trong sứ mệnh lịch sử của giai cấp công nhân trên lĩnh vực văn hóa - tư tưởng, hệ giá trị mỗi mà giai cấp công nhân cần tập trung xây dựng là gì?", "options": [{"key": "A", "text": "Lao động, công bằng; dân chủ, bình đẳng và tự do"}, {"key": "B", "text": "Tự do; bình đẳng; bác ái"}, {"key": "C", "text": "Độc lập; tự do; dân chủ, văn minh"}, {"key": "D", "text": "Dân giàu, nước mạnh; công bằng dân chủ và văn minh"}], "answer": ["A"], "note": "", "block": 8}, {"id": 360, "text": "Hôn nhân xuất phát từ tinh yêu giữa nam và nữ được xem là hôn nhân như thế nào?", "options": [{"key": "A", "text": "Hôn nhân chậm tiến bộ"}, {"key": "B", "text": "Hôn nhân tiến bộ"}, {"key": "C", "text": "Hôn nhân không được đàm bảo"}, {"key": "D", "text": "Hôn nhân huyết thống"}], "answer": ["B"], "note": "", "block": 8}, {"id": 361, "text": "Nền dân chủ xã hội chủ nghĩa đầu tiên chính thức được xác lập khi nào?", "options": [{"key": "A", "text": "Cách mạng tháng 8 năm 1945 thành công"}, {"key": "B", "text": "Bản tuyên ngôn nhân quyền và dân quyền của Pháp (1789)"}, {"key": "C", "text": "Tuyên ngôn độc lập của Mỹ (1776)"}, {"key": "D", "text": "Cách mạng Tháng Mười Nga thành công với sự ra đời của nhà nước xã hội chủ nghĩa đầu tiên trên thế giới (1917)"}], "answer": ["D"], "note": "", "block": 8}, {"id": 362, "text": "Dân chủ xã hội chủ nghĩa được xem là phôi thai tử thực tiễn đấu tranh giai cấp ở quốc gia nào?", "options": [{"key": "A", "text": "Ở Đức"}, {"key": "B", "text": "Ở Pháp"}, {"key": "C", "text": "Ở Liên Xô"}, {"key": "D", "text": "Ở Trung Quốc"}], "answer": ["B"], "note": "", "block": 8}, {"id": 363, "text": "Có bao nhiêu phương hướng cơ bản xây dựng và phát triển gia đình Việt Nam trong thời kỳ quá độ lên chủ nghĩa xã hội?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": ["B"], "note": "", "block": 8}, {"id": 364, "text": "Về nội dung văn hóa, tư tưởng, sứ mệnh lịch sử của giai cấp công nhân được thể hiện như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai cấp công nhân thực hiện xây dựng và củng cố ý thức hệ tiên tiến của mình."}, {"key": "B", "text": "Giai cấp công nhân thực hiện xây dựng đạo đức và lối sống mới xã hội chủ nghĩa"}, {"key": "C", "text": "Tất cả các đáp án đều đúng"}, {"key": "D", "text": "Giai cấp công nhân thực hiện xây dựng con người mới xã hội chủ nghĩa"}], "answer": ["C"], "note": "", "block": 8}, {"id": 365, "text": "Sự biến đổi của cơ cấu xã hội - giai cấp gắn liền và được quy định bởi sự biến động của cơ cấu nào?", "options": [{"key": "A", "text": "Cơ cấu xã hội - dân số"}, {"key": "B", "text": "Cơ cấu xã hội - kinh tế"}, {"key": "C", "text": "Cơ cấu xã hội - dân tộc"}, {"key": "D", "text": "Cơ cấu xã hội - dân cư"}], "answer": ["B"], "note": "", "block": 8}, {"id": 366, "text": "Điền cụm từ thích hợp vào (_):\"Các dân tộc hoàn toàn ..., các dân tộc được quyền tự quyết, liên hiệp... tất cả các dân tộc lại\"", "options": [{"key": "A", "text": "Bình đẳng/ công nhân"}, {"key": "B", "text": "Hòa bình/ công nhân"}, {"key": "C", "text": "Công nhân/ nông dân"}, {"key": "D", "text": "Hòa bình/ bình đẳng"}], "answer": ["A"], "note": "", "block": 8}, {"id": 367, "text": "\"Tôn giáo là một hiện tượng xã hội - văn hóa do con người sáng tạo ra\" là khẳng định xuất phát từ:", "options": [{"key": "A", "text": "Tư tưởng Hồ Chí Minh"}, {"key": "B", "text": "Đảng Cộng sản Việt Nam"}, {"key": "C", "text": "Chủ nghĩa Mác - Lênin"}, {"key": "D", "text": "Ph. Ăngghen"}], "answer": ["C"], "note": "", "block": 8}, {"id": 368, "text": "Điền cụm từ thích hợp vào (.): Tôn giáo là một hiện tượng ... -... do con người sáng tạo.", "options": [{"key": "A", "text": "Xã hội/ văn hóa"}, {"key": "B", "text": "Kinh tế/ văn hóa"}, {"key": "C", "text": "Chính trị/ xã hội"}, {"key": "D", "text": "Giáo dục/ y tế"}], "answer": ["A"], "note": "", "block": 8}, {"id": 369, "text": "Trong gia đình Việt Nam hiện đại, sự bền vững của hôn nhân phụ thuộc rất nhiều vào yếu tố nào?", "options": [{"key": "A", "text": "Có con hay không có con"}, {"key": "B", "text": "Có con trai hay không có con trai"}, {"key": "C", "text": "Tâm lý, tình cảm, kinh tế"}, {"key": "D", "text": "Địa vị xã hội, kinh tế"}], "answer": ["C"], "note": "", "block": 8}, {"id": 370, "text": "Hình thức dân chủ nào ở Việt Nam mà thông qua nó, người dân băng hành động của minh thực hiện quyền làm chủ nhà nước và xã hội, không thông qua chủ thế trung gian?", "options": [{"key": "A", "text": "Hình thức dân chủ trực tiếp"}, {"key": "B", "text": "Hình thức dân chủ gián tiếp"}, {"key": "C", "text": "Hình thức dân chủ đại nghị"}, {"key": "D", "text": "Hình thức dân chủ công khai"}], "answer": ["A"], "note": "", "block": 8}, {"id": 371, "text": "Tuyên ngôn của Đảng Cộng sản đánh dấu sự ra đời của:", "options": [{"key": "A", "text": "Chủ nghĩa Mác - Lênin"}, {"key": "B", "text": "Kinh tế chính trị Mác - Lênin"}, {"key": "C", "text": "Chủ nghĩa xã hội khoa học"}, {"key": "D", "text": "Triết học Mác - Lênin"}], "answer": ["C"], "note": "", "block": 8}, {"id": 372, "text": "Thách thức lớn nhất đặt ra cho các gia đình Việt Nam hiện nay là gì?", "options": [{"key": "A", "text": "Vấn đề thất nghiệp, mất ổn định về kinh tế"}, {"key": "B", "text": "Vẫn đề học tập, phát triển của con cái - thế hệ tương lai"}, {"key": "C", "text": "Vấn đề mâu thuẫn giữa các thế hệ do sự khác biệt về tuổi tác"}, {"key": "D", "text": "Vẫn đê kế hoạch hóa gia đình"}], "answer": ["C"], "note": "", "block": 8}, {"id": 373, "text": "Cuối thế kỷ XIV - đầu thế ký XV, giai cấp tư sản với những tư tường tiến bộ về tự do, công bằng, dân chủ đã mở đường cho sự ra đời của nền dân chủ nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Dân chủ nông dân"}, {"key": "B", "text": "Dân chủ tư sản"}, {"key": "C", "text": "Dân chủ vô sản"}, {"key": "D", "text": "Dân chủ hòa bình"}], "answer": ["B"], "note": "", "block": 8}, {"id": 374, "text": "Điền cụm từ thích hợp vào (...): \"Về lý luận, không thể nghi ngờ gì được rằng giữa ... và ..., có một thời kỳ quá độ nhất định\"(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chủ nghĩa tư bản/ chủ nghĩa cộng sản"}, {"key": "B", "text": "Chủ nghĩa tư băn/ Giai cấp công nhân"}, {"key": "C", "text": "Nhân dân lao động/ chính quyền"}, {"key": "D", "text": "Chính trị/ xã hội"}], "answer": ["A"], "note": "", "block": 8}, {"id": 375, "text": "Làm sao để xóa bò triệt để ngay lập tức các giai cấp, tăng lớp của cơ cấu xã hội - giai cấp trong thời kì quá độ lên chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Giai cấp công nhân, liên minh cùng với các giai cấp, tầng lớp khác tổ chức nhà nước và thực hiện công cụ chuyên chính vô sản thực thi xóa bò ngay lập tức giai cấp tư sản, và sau đó xóa bò luôn giai cấp mình"}, {"key": "B", "text": "Các giai cấp, tầng lớp chủ động đứng vào hàng ngũ của Đảng Cộng sản để thống nhất xóa bò sự tồn tại của giai cấp"}, {"key": "C", "text": "Sự tôn tại các giai cấp, tầng lớp trong thời kì quá độ lên chủ nghĩa xã hội là vấn đề mang tính quy luật, chỉ có thê cải tạo dần chứ chưa thế xóa bò triệt để, ngay lập tức được"}, {"key": "D", "text": "Quốc hữu hóa tất cà tài sản, tịch thu ruộng đất, gia"}], "answer": ["C"], "note": "", "block": 8}, {"id": 376, "text": "Trong quá trình xây dựng chủ nghĩa xã hội, liên minh giữa giai cấp công nhân, giai cấp nông dân và tầng lớp trí thức dưới góc độ nào giữ vai trò quyết định?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chính trị"}, {"key": "B", "text": "Kinh tế"}, {"key": "C", "text": "Văn hoá"}, {"key": "D", "text": "Tư tưởng"}], "answer": ["B"], "note": "", "block": 8}, {"id": 377, "text": "Dân chủ với tư cách là một hình thức tổ chức thiết chế chính trị hay một hình thái nhà nước, thì nó là:", "options": [{"key": "A", "text": "Phạm trù vĩnh viễn, tồn tại trong mọi chế độ xã hội"}, {"key": "B", "text": "Phạm trù lịch sử, mất đi khi nhà nước tiêu vong"}, {"key": "C", "text": "Phạm trù lịch sử, mất đi khi tiến lên chủ nghĩa xã hội"}, {"key": "D", "text": "Phạm trù lịch sử, tồn tại trong các chế độ xã hội ngoài chế độ quân chủ phong kiến"}], "answer": ["B"], "note": "", "block": 8}, {"id": 378, "text": "Theo nghĩa rộng, dân tộc có bao nhiêu đặc trưng cơ bản?", "options": [{"key": "A", "text": "4"}, {"key": "B", "text": "5"}, {"key": "C", "text": "6"}, {"key": "D", "text": "7"}], "answer": ["B"], "note": "", "block": 8}, {"id": 379, "text": "Theo nghĩa hẹp, dân tộc có bao nhiêu đặc trưng cơ bản?", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": ["A"], "note": "", "block": 8}, {"id": 380, "text": "Tổ chức và hoạt động của bộ máy nhà nước pháp quyền xã hội chủ nghĩa Việt Nam thực hiện theo nguyên tắc nào?", "options": [{"key": "A", "text": "Nguyên tắc tập trung dân chủ"}, {"key": "B", "text": "Nguyên tắc dân chủ rộng rãi"}, {"key": "C", "text": "Nguyên tắc cá nhân phụ trách"}, {"key": "D", "text": "Nguyên tắc lập pháp"}], "answer": ["A"], "note": "", "block": 8}, {"id": 381, "text": "Công cuộc đổi mới do Đảng Cộng sản Việt Nam khởi xướng và lãnh đạo tại Đại hội lần thứ bao nhiêu?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Lần thứ IV"}, {"key": "B", "text": "Lần thứ VI"}, {"key": "C", "text": "Lần thứ X"}, {"key": "D", "text": "Lần thứ XIII"}], "answer": ["B"], "note": "", "block": 8}, {"id": 382, "text": "Về mặt thực tiền, đâu không phải là một ý nghĩa của việc nghiên cứu chủ nghĩa xã hội khoa học?", "options": [{"key": "A", "text": "Thấy rõ khoảng cách giữa lý luận chủ nghĩa xã hội khoa học và thực tiễn vận dụng nó"}, {"key": "B", "text": "Sự sụp đổ của Liên Xô và Đông Âu là do đã nhận thức và hành động trên nhiều vẫn đê trái với chủ nghĩa xã hội khoa học, trái với chủ nghĩa Mác - Lênin chứ không phải là do đi theo chủ nghĩa xã hội khoa học làm cho các nước này khủng hoảng"}, {"key": "C", "text": "Cần có bản lĩnh vững vàng, sáng suốt và sáng tạo trong việc vận dụng chủ nghĩa xã hội khoa học vào bối cành lịch sử cụ thể của từng quốc gia, tránh giáo điều, bảo thủ, duy ý chí"}, {"key": "D", "text": "Giúp chúng ta có căn cứ nhận thức khoa học để luôn cảnh giác, phân tích đúng và đấu tranh chống"}], "answer": ["D"], "note": "", "block": 8}, {"id": 383, "text": "Giải quyết hai vấn đề nào sau đây cần phải đặt trong mối quan hệ với cộng đồng quốc gia - dân tộc thống nhất theo định hướng xã hội chủ nghĩa?", "options": [{"key": "A", "text": "Văn hóa và hội nhập quốc tế"}, {"key": "B", "text": "Tư sản và vô sản"}, {"key": "C", "text": "Giáo dục và y tế"}, {"key": "D", "text": "Dân tộc và tôn giáo"}], "answer": ["D"], "note": "", "block": 8}, {"id": 384, "text": "Trong thời kỳ quá độ lên chủ nghĩa xã hội, yếu tố nào quyết định mỗi quan hệ hợp tác, gẵn bó chặt chẽ giữa các giai cấp, tầng lớp?", "options": [{"key": "A", "text": "Họ cùng nhau cải tạo xã hội cũ, xây dựng xã hội mới trong mọi lĩnh vực của đời sống xã hội"}, {"key": "B", "text": "Họ cùng nhau xây dựng xã hội mới trong mọi lĩnh vực của đời sống xã hội"}, {"key": "C", "text": "Họ cùng nhau cải tạo xã hội cũ trong mọi lĩnh vực của đời sống xã hội"}, {"key": "D", "text": "Họ cùng nhau cải tạo xã hội cũ, xây dựng xã hội mới trong lĩnh vực kinh tế, chính trị"}], "answer": ["A"], "note": "", "block": 8}, {"id": 385, "text": "Vấn đề: \"Xây dựng nhà nước do nhân dân lao động làm chủ, đó là Nhà nước của dân, do dân, vì dân\" là đặc điềm thứ mấy trong các đặc điểm của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam? (NHUNG HOÀNG)", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "3"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": ["A"], "note": "", "block": 8}, {"id": 386, "text": "Đâu không phải là hạn chế của chủ nghĩa xã hội không tưởng Pháp?", "options": [{"key": "A", "text": "Không chỉ ra được những biện pháp để hiện thực hóa học thuyết của mình"}, {"key": "B", "text": "Không phát hiện ra quy luật phát triển vận động của xã hội nói chung và của xã hội tư bản chủ nghĩa nói riêng"}, {"key": "C", "text": "Không phát hiện ra sứ mệnh lịch sử của giai cấp công nhân"}, {"key": "D", "text": "Không biết được vai trò của nô lệ trong cách mạng xã hội"}], "answer": ["D"], "note": "", "block": 8}, {"id": 387, "text": "Vấn đề nổi bật nhất đối với việc thực hiện sứ mệnh lịch sử của giai cấp công nhân Việt Nam hiện nay là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Phát huy vai trò và trách nhiệm của lực lượng đi đầu trong sự nghiệp đấy mạnh công nghiệp hóa, hiện đại hóa đất nước"}, {"key": "B", "text": "Phát huy vai trò của lực lượng đi đầu trong sự nghiệp đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước"}, {"key": "C", "text": "Phát huy trách nhiệm của lực lượng đi đầu trong sự nghiệp đấy mạnh công nghiệp hóa, hiện đại hóa đất nước"}, {"key": "D", "text": "Phát huy sức chiến đấu của bản thân trong sự nghiệp đấy mạnh công nghiệp hóa, hiện đại hóa đất nước"}], "answer": ["A"], "note": "", "block": 8}, {"id": 388, "text": "Quyền nào là cơ sở để thực hiện quyền dân tộc tự quyết và xây dựng mỗi quan hệ hữu nghị, hợp tác giữa các dân tộc?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Quyền tự quyết của các dân tộc"}, {"key": "B", "text": "Quyền tự do ngôn luận"}, {"key": "C", "text": "Quyền bình đẳng giữa các dân tộc"}, {"key": "D", "text": "Quyền lập pháp của các dân tộc"}], "answer": ["C"], "note": "", "block": 8}, {"id": 389, "text": "Trong gia đình Việt Nam hiện nay, người chủ gia đình là ai? (NHUNG HOÀNG)", "options": [{"key": "A", "text": "Người lớn tuổi nhất trong gia đình"}, {"key": "B", "text": "Người có trình độ cao nhất trong gia đình"}, {"key": "C", "text": "Nguời lớn tuổi nhất và có trình độ cao nhất trong gia đình"}, {"key": "D", "text": "Có thể là người đàn ông, người phụ nữ hoặc cả hai"}], "answer": ["D"], "note": "", "block": 8}, {"id": 390, "text": "Nếu thiếu đi cơ sở văn hóa, hoặc cơ sở văn hóa không đi liền với cơ sở kinh tế, chính trị thì việc xây dựng gia đình sẽ bị ảnh hưởng như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Việc xây dựng gia đình sẽ lệch lạc, không đạt hiệu quả"}, {"key": "B", "text": "Hệ thống chính sách, pháp luật về xây dựng gia đình sẽ không thể hoàn thiện"}, {"key": "C", "text": "Việc xây dựng gia đình không còn dựa trên nền tảng hệ tư tưởng chính trị"}, {"key": "D", "text": "Việc xây dựng gia đình sẽ không hướng tới đời sống văn hóa, tinh thần"}], "answer": ["A"], "note": "", "block": 8}, {"id": 391, "text": "Theo nghĩa hẹp, các tiêu chí xác định các đặc trưng cơ bản của một dân tộc - tộc người là gì? Lựa chọn các đáp án đúng. (3)", "options": [{"key": "A", "text": "Cộng đồng về ngôn ngữ"}, {"key": "B", "text": "Cộng đồng về văn hóa"}, {"key": "C", "text": "Ý thức tự giác tộc người"}, {"key": "D", "text": "Cộng đồng về lãnh thổ"}], "answer": ["A", "B", "C"], "note": "", "block": 8}, {"id": 392, "text": "Trong các cơ cấu xã hội, cơ cấu xã hội nào có vị trí quan trọng hàng đầu, chi phối các loại hình cơ cấu xã hội khác?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Cơ cấu xã hội - dân tộc"}, {"key": "B", "text": "Cơ cấu xã hội dân cư"}, {"key": "C", "text": "Cơ cấu xã hội - nghề nghiệp"}, {"key": "D", "text": "Cơ cấu xã hội - giai cấp"}], "answer": ["D"], "note": "", "block": 8}, {"id": 393, "text": "\"Do lực lượng sản xuất chưa phát triển, con người cảm thấy yếu đuối, bất lực, không giải thích được, nên con người đã gán cho tự nhiên một sức mạnh, quyền lực thần bí, vấn đề này nói lên nguồn gốc nào của tôn giáo?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Nguồn gốc tâm lý"}, {"key": "B", "text": "Nguồn gốc nhận thức"}, {"key": "C", "text": "Nguồn gốc tự nhiên, kinh tế - xã hội"}, {"key": "D", "text": "Nguồn gốc ý chí"}], "answer": ["C"], "note": "", "block": 8}, {"id": 394, "text": "Giai cấp nào được xem là con đẻ của nền đại công nghiệp tư bản chủ nghĩa?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tư sản"}, {"key": "B", "text": "Nông dân"}, {"key": "C", "text": "Công nhân"}, {"key": "D", "text": "Bị bóc lột"}], "answer": ["C"], "note": "", "block": 8}, {"id": 395, "text": "Đâu không phải là một cơ sở xây dụng gia đình trong thời kì quá độ lên chủ nghĩa xã hội?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Cơ sở kinh tế - xã hội"}, {"key": "B", "text": "Cơ sở chính trị - xã hội"}, {"key": "C", "text": "Cơ sở văn hóa"}, {"key": "D", "text": "Cơ sở lao động, sản xuất"}], "answer": ["D"], "note": "", "block": 8}, {"id": 396, "text": "Nhân tố nào sau đây có vai trò quyết định đến sự tồn tại và phát triển của xã hội? (NHUNG HOÀNG)", "options": [{"key": "A", "text": "Con người"}, {"key": "B", "text": "Gia đinh"}, {"key": "C", "text": "Tư duy"}, {"key": "D", "text": "Khoa học kỹ thuật"}], "answer": ["A"], "note": "", "block": 8}, {"id": 397, "text": "Ở nước ta hiện nay, sự bền vững của hôn nhân phụ thuộc vào yếu tố nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Yếu tố con cái nhiều hay ít"}, {"key": "B", "text": "Yếu tố con cái là trai hay gái"}, {"key": "C", "text": "Yếu tố truyền thống gia trưởng"}, {"key": "D", "text": "Yếu tố tâm lý, tình cảm và kinh tế"}], "answer": ["D"], "note": "", "block": 8}, {"id": 398, "text": "Chức năng và nhiệm vụ của chủ nghĩa xã hội khoa học là gì?", "options": [{"key": "A", "text": "Là trang bị những tri thức khoa học của chủ nghĩa Mác - Lênin đã phát hiện ra và luận giải về quá trình tất yếu lịch sử dẫn đến hình thành, phát triển hình thái kinh tế - xã hội cộng sản, giải phóng xã hội, giải phóng con người."}, {"key": "B", "text": "Là giáo dục, trang bị lập trường tư tưởng chính trị của giai cấp công nhân cho đảng cộng sản, giai cấp công nhân và nhân dân lao động."}, {"key": "C", "text": "Là định hướng về chính trị - xã hội cho mọi hoạt động của giai cấp công nhân, của đảng cộng sản, của nhà nước và của nhân dân lao động trên mọi lĩnh vực."}, {"key": "D", "text": "Cả a, b và c đều đúng"}], "answer": ["D"], "note": "", "block": 8}, {"id": 399, "text": "Nội dung văn hóa - xã hội của liên minh giai cấp, tầng lớp là gì?", "options": [{"key": "A", "text": "Xây dựng nền văn hóa và con người Việt Nam phát triễn toàn diện"}, {"key": "B", "text": "Xây dựng nền văn hóa và nhà nước của dân, do dân, vì dân"}, {"key": "C", "text": "Xây dựng nền văn hóa và xây dựng Đảng trong sạch, vững mạnh"}, {"key": "D", "text": "Xây dựng nền văn hóa và tăng cường bản chất giai cấp công nhân"}], "answer": ["A"], "note": "", "block": 8}, {"id": 400, "text": "Vấn đê nào dễ dẫn tối nguy cơ gây mất ổn định chính trị, xã hội, dễ tạo cơ hội cho các thế lực thủ địch bên ngoài can thiệp vào công việc nội bộ của đất nước? (NHUNG HOÀNG)", "options": [{"key": "A", "text": "Vẫn đê tôn giáo và dẫn tộc"}, {"key": "B", "text": "Vãn đê mê tín dị đoan và thờ cúng ông bà"}, {"key": "C", "text": "Vấn đê ngoại giao"}, {"key": "D", "text": "Vấn đề chính trị"}], "answer": ["A"], "note": "", "block": 8}, {"id": 401, "text": "Bản chất của chủ nghĩa xã hội ở nước Nga Xôviết có mấy đặc trưng?", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": ["D"], "note": "", "block": 9}, {"id": 402, "text": "Về phương diện thế giới quan, đa số các tôn giáo mang thế giới quan nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Duy tâm"}, {"key": "B", "text": "Duy vật"}, {"key": "C", "text": "Duy vật biện chứng"}, {"key": "D", "text": "Duy vật siêu hình"}], "answer": ["A"], "note": "", "block": 9}, {"id": 403, "text": "Cơ sở kinh tế - xã hội để xây dựng gia đình trong thời kỳ quá độ lên chủ nghĩa xã hội là gì?", "options": [{"key": "A", "text": "Là sự phát triển của lực lượng sản xuất và tương ứng với nó là quan hệ sản xuất mới, xã hội chủ nghĩa"}, {"key": "B", "text": "Là sự phát triển của trình độ lao động, khoa học kỹ thuật của xã hội"}, {"key": "C", "text": "Là điều kiện lao động, công ăn, việc làm và thu nhập của công dân"}, {"key": "D", "text": "Thiết lập chính quyền nhà nước của giai cấp công nhân và nhân dân lao động"}], "answer": ["A"], "note": "", "block": 9}, {"id": 404, "text": "Trong giai đoạn hiện nay, tại sao Nhà nước lại khuyến khích mỗi cặp vợ chồng “nên sinh đủ hai con”?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Do Việt Nam đang chuyển sang giai đoạn già hóa dân số"}, {"key": "B", "text": "Do dân số Việt Nam quá ít so với mật độ trung bình của thế giới"}, {"key": "C", "text": "Do tỷ lệ tử vong và tuổi thọ trung bình người Việt Nam quá thấp"}, {"key": "D", "text": "Tất cả các đáp án đều đúng"}], "answer": ["A"], "note": "", "block": 9}, {"id": 405, "text": "Gia đình có bao nhiều chức năng cơ bản?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "3"}, {"key": "B", "text": "4"}, {"key": "C", "text": "5"}, {"key": "D", "text": "6"}], "answer": ["A"], "note": "", "block": 9}, {"id": 406, "text": "Phát kiến học thuyết giá trị thặng dư của C.Mác và Ph.Ăngghen có ý nghĩa gì đối với chủ nghĩa xã hội khoa học?", "options": [{"key": "A", "text": "Chỉ ra sự suy vong tự nhiên của chủ nghĩa tư bản"}, {"key": "B", "text": "Chỉ ra con đường đấu tranh giai cấp tiến lên chủ nghĩa xã hội"}, {"key": "C", "text": "Khẳng định về phương diện kinh tế sự diệt vong không thể tránh khỏi của chủ nghĩa tư bản và sự ra đời tất yếu của chủ nghĩa xã hội"}, {"key": "D", "text": "Khẳng định sự thiết lập nền chuyên chính vô sản bằng cách mạng xã hội là con đường duy nhất tiến đến chủ nghĩa xã hội"}], "answer": ["C"], "note": "", "block": 9}, {"id": 407, "text": "\"Đạo Cao Đài, Phật giáo Hòa Hảo là hai trong số những tôn giáo nội sinh ở Việt Nam. Lịch sử từng ghi nhận rằng hai tôn giáo này đã cùng với người dân Nam Bộ tham gia kháng chiến chống giặc cứu nước\". Vấn đề vừa nếu thuộc đặc điểm thứ mấy trong số các đặc điểm tôn giáo ở Việt Nam?", "options": [{"key": "A", "text": "1"}, {"key": "B", "text": "2"}, {"key": "C", "text": "3"}, {"key": "D", "text": "4"}], "answer": ["D"], "note": "", "block": 9}, {"id": 408, "text": "Chủ nghĩa xã hội khoa học sử dụng phương pháp luận nào?", "options": [{"key": "A", "text": "Chủ nghĩa duy vật biện chứng và chủ nghĩa duy vật lịch sử"}, {"key": "B", "text": "Chủ nghĩa duy vật siêu hình và chủ nghĩa duy vật lịch sử"}, {"key": "C", "text": "Chủ nghĩa duy vật chất phác và chủ nghĩa duy vật lịch sử"}, {"key": "D", "text": "Chủ nghĩa duy tâm biện chứng và chủ nghĩa duy vật lịch sử"}], "answer": ["A"], "note": "", "block": 9}, {"id": 409, "text": "Tác phẩm “Tuyên ngôn của Đảng Cộng sản\" đã đánh dấu sự ra đời của bộ phận lý luận nào của chủ nghĩa Mác – Lênin?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chủ nghĩa Mác – Lênin"}, {"key": "B", "text": "Kinh tế chính trị Mác - Lênin"}, {"key": "C", "text": "Chủ nghĩa xã hội khoa học"}, {"key": "D", "text": "Triết học Mác – Lênin"}], "answer": ["C"], "note": "", "block": 9}, {"id": 410, "text": "Phần lớn các tín đồ tôn giáo ở nước ta có đặc điểm chung là gì?", "options": [{"key": "A", "text": "Là nhân dân lao động, có lòng yêu nước, tinh thần dân tộc"}, {"key": "B", "text": "Là giai cấp yếu thế, có cuộc sống cơ cực, tin vào tôn giáo như một yếu tố giải thoát"}, {"key": "C", "text": "Có ý thức chống lại chủ nghĩa duy vật biện chứng"}, {"key": "D", "text": "Tham gia vào các phong trào đấu tranh chống chính quyền"}], "answer": ["A"], "note": "", "block": 9}, {"id": 411, "text": "C.Mác và Ph.Ăngghen từng cho rằng: \"Quan hệ thứ ba tham dự ngay từ đầu vào quá trình phát triển lịch sử: hằng ngày tái tạo ra đời sống của bản thân mình, con người bắt đầu tạo ra những người khác, sinh sôi nẩy nở\". Cụm từ \"quan hệ thứ ba\" trong câu trên dùng để chi cái gì?", "options": [{"key": "A", "text": "Phát triển"}, {"key": "B", "text": "Sinh nở"}, {"key": "C", "text": "Bạn bè"}, {"key": "D", "text": "Gia đình"}], "answer": ["D"], "note": "", "block": 9}, {"id": 412, "text": "Trong thời kỳ đổi mới, giai cấp công nhân nước ta có sử mệnh lịch sử to lớn là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai cấp lãnh đạo cách mạng thông qua đội tiên phong là Đảng Cộng sản Việt Nam"}, {"key": "B", "text": "Giai cấp tiêu biểu cách mạng thông qua đội tiên phong là Đảng Cộng sản Việt Nam"}, {"key": "C", "text": "Giai cấp đại diện thông qua đội tiên phong là Đảng Cộng sản Việt Nam"}, {"key": "D", "text": "Giai cấp nòng cốt thông qua đội tiên phong là Đảng Cộng sản Việt Nam"}], "answer": ["A"], "note": "", "block": 9}, {"id": 413, "text": "Cách mạng vô sản là:", "options": [{"key": "A", "text": "Cuộc cách mạng của giai cấp nông dân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, được thực hiện bằng con đường bạo lực cách mạng nhằm lật đổ chế độ tư bản chủ nghĩa, thiết lập nhà nước chuyên chính vô sản"}, {"key": "B", "text": "Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, trên thực tế được thực hiện bằng con đường tuyên truyền giáo dục nhằm lật đổ chế độ tư bản chủ nghĩa, thiết lập nhà nước chuyển chính vô sản"}, {"key": "C", "text": "Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, trên thực tế được thực hiện bằng con đường bạo lực cách mạng nhằm lật đổ chế độ phong kiến, thiết lập nhà nước chuyên chính vô sản"}, {"key": "D", "text": "Cuộc cách mạng của giai cấp công nhân và nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản, được thực hiện bằng con đường bạo lực cách mạng nhằm lật đổ chế độ tư bản chủ nghĩa, thiết lập nhà nước chuyên chính vô"}], "answer": ["A"], "note": "", "block": 9}, {"id": 414, "text": "Giai cấp công nhân Việt Nam, giai cấp nông dân, đội ngũ trí thức, đội ngũ đoanh nhân. Đâu là lực lượng đi đấu trong sự nghiệp công nghiệp hoa, hiện đại hoa đất nước?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai cấp công nhân"}, {"key": "B", "text": "Giai cấp nông dân"}, {"key": "C", "text": "Đội Ngũ Trí thức"}, {"key": "D", "text": "Đội ngũ doanh nhân"}], "answer": ["A"], "note": "", "block": 9}, {"id": 415, "text": "Theo V.I Lênin, vì sao các cộng đồng dân cư lại muốn tách ra để hình thành các cộng đồng dân tộc độc lập?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Do sự đàn áp, thống trị quá khắt nghiệt của chủ nghĩa thực dân"}, {"key": "B", "text": "Do mâu thuẫn lợi ích, quyền lợi"}, {"key": "C", "text": "Do sự thức tinh, trường thành về ý thức dân tộc"}, {"key": "D", "text": "Do sự phát triển về số lượng quá lớn"}], "answer": ["C"], "note": "", "block": 9}, {"id": 416, "text": "Nhà nước xã hội chủ nghĩa là nhà nước của ai?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Nhân dân"}, {"key": "B", "text": "Công nhân- Nông dân"}, {"key": "C", "text": "Cống nhân- Nông dân - Trí thức"}, {"key": "D", "text": "Lãnh đạo, Đảng viên"}], "answer": ["A"], "note": "", "block": 9}, {"id": 417, "text": "Những biểu hiện cơ bản của tư tưởng xã hội chủ nghĩa là gì?", "options": [{"key": "A", "text": "Là những ước mơ nguyện vọng về một chế độ xã hội ai cũng có việc làm ai cũng lao động"}, {"key": "B", "text": "Là quan niệm về một chế độ xã hội mà tư liệu sản xuất đều thuộc về mọi thành viên xã hội"}, {"key": "C", "text": "Là những tư tưởng về một xã hội, trong đó mọi người đều bình đẳng, có cuộc sống ấm no, tự do, hạnh phúc."}, {"key": "D", "text": "Cả a, b và c"}], "answer": ["D"], "note": "", "block": 9}, {"id": 418, "text": "Sự liên minh giữa giai cấp công nhãn vối giai cấp nông dẫn và tầng lớp trí thức là do điều gì quy định?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Do mong muốn của công nhân."}, {"key": "B", "text": "Yêu cầu của nông dân"}, {"key": "C", "text": "Yêu cầu của trí thức"}, {"key": "D", "text": "Do đòi hỏi khách quan của cả công nhân, nông dân và trí thức."}], "answer": ["D"], "note": "", "block": 9}, {"id": 419, "text": "Về nội dung chính trị - xã hội, sứ mệnh lịch sử của giai cấp công nhân được thể hiện như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Giai cấp công nhân cùng với nhân dân lao động dưới sự lãnh đạo của Đảng Cộng sản phải tiến hành cách mạng chính trị lật đổ quyền thống trị của giai cấp tư sản"}, {"key": "B", "text": "Giai cấp công nhân phải lãnh đạo được các giai cấp khác và lãnh đạo được Đảng Cộng sản để tiến hành cách mạng tư sản xóa bỏ chế độ thống trị của giai cấp tư sản"}, {"key": "C", "text": "Giai cấp công nhân phải cùng với nhân dân lao động lãnh đạo Đảng Cộng sản tiến hành cách mạng chính trị lật đồ chính quyền của giai cấp phong kiến"}, {"key": "D", "text": "Giai cấp công nhân phải xác lập được quyền thống trị nhân dân lao động và các giai cấp khác bằng cách thực hiện cách mạng lật đổ chính quyền của giai cấp tư sản"}], "answer": ["A"], "note": "", "block": 9}, {"id": 420, "text": "Trong xã hội phong kiến, các mỗi quan hệ của gia đình có đặc điểm như thế nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Tuyệt đối hóa vai trò của người đàn ông, người chồng, người cha"}, {"key": "B", "text": "Tuyệt đối hóa vai trò của người phụ nữ, người vợ, người mẹ"}, {"key": "C", "text": "Mối quan hệ bình đẳng, sẻ chia"}, {"key": "D", "text": "Các mỗi quan hệ chịu sự chi phối của điều kiện kinh tế gia đình"}], "answer": ["A"], "note": "", "block": 9}, {"id": 421, "text": "Trong nhà nước pháp quyền, điều gì được thượng tôn?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Quyền lợi của giai cấp công nhân"}, {"key": "B", "text": "Quyền lợi cùa nhà nước"}, {"key": "C", "text": "Pháp luật"}, {"key": "D", "text": "Ý chí, nguyện vọng của nhân dân lao động"}], "answer": ["C"], "note": "", "block": 9}, {"id": 422, "text": "Thực hiện công nghiệp hóa, gắn liền công nghiệp hóa với hiện đại hóa, đẩy mạnh công nghiệp hóa gắn với phát triển kinh tế trí thức, bảo vệ tài nguyên, môi trường là nhiệm vụ của giai cấp công nhân trên lĩnh vực nào?", "options": [{"key": "A", "text": "Chính trị- xã hội"}, {"key": "B", "text": "Kinh tế"}, {"key": "C", "text": "Văn hóa"}, {"key": "D", "text": "Tư tưởng"}], "answer": ["B"], "note": "", "block": 9}, {"id": 423, "text": "Theo quan điểm của chủ nghĩa Mác - Lênin, nguyên nhân chính quyết định sự biến đổi của cộng đồng dân tộc là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Sự biến đối của giai cấp thống trị"}, {"key": "B", "text": "Sự biến đối của kiến trúc thượng tầng xã hội"}, {"key": "C", "text": "Sự biến đổi của cơ sở hạ tầng xã hội"}, {"key": "D", "text": "Sự biến đổi của phương thức sản xuất"}], "answer": ["D"], "note": "", "block": 9}, {"id": 424, "text": "Điền vào chỗ trống: C. Mác và Ph. Ăngghen chi rõ: \"Từ chỗ là những hình thức phát triển của các lực lượng sản xuất, những quan hệ sản xuất ấy trở thành những xiềng xích của của các lực lượng sản xuất. Khi đó bắt đầu thời đại...\":", "options": [{"key": "A", "text": "Một cuộc tổng tiến công"}, {"key": "B", "text": "Một cuộc cải cách"}, {"key": "C", "text": "Tất cả đều đúng"}, {"key": "D", "text": "Một cuộc cách mạng"}], "answer": ["D"], "note": "", "block": 9}, {"id": 425, "text": "Cơ cấu xã hội - giai cấp là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Là hệ thông giai cấp, tầng lớp xã hội tồn tại khách quan trong một chế độ xã hội nhất định, thông qua những môi quan hệ về sở hữu tư liệu sản xuất, về tổ chức, quản lý quá trình sản xuất, vẽ địa vị chính trị xã hội ... giữa các giai cấp, tầng lớp đó"}, {"key": "B", "text": "Là hệ thống giai cấp, tầng lớp xã hội tồn tại chủ quan trong một chế độ xã hội nhất định, thông qua những mỗi quan hệ về sở hữu tư liệu sản xuất, về tố chức, quản lý quá trình sản xuất, về địa vị chính trị xã hội... giữa các giai cấp, tầng lớp đó"}, {"key": "C", "text": "Là hệ thống giai cấp, tầng lớp xã hội tồn tại khách quan trong một chế độ xã hội nhất định, thông qua những mỗi quan hệ về phân chia quyền lực nhà nước... giữa các giai cấp, tầng lớp đó"}, {"key": "D", "text": "Là hệ thống giai cấp, tầng lớp xã hội tồn tại chủ quan trong một chế độ xã hội nhất định, thông qua những mỗi quan hệ về phân chia quyền lực nhà nước... giữa các giai cấp, tăng lớp đó"}], "answer": ["A"], "note": "", "block": 9}, {"id": 426, "text": "Đặc trưng nào dưới đây là quan trọng nhất, là cơ sở gắn kết các bộ phận, các thành viên trong dân tộc, tạo nên tính thống nhất, ổn định, bền vững của dân tộc?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Chung một vùng lãnh thổ"}, {"key": "B", "text": "Chung một phương thức sinh hoạt kinh tế"}, {"key": "C", "text": "Chung một ngôn ngữ làm công cụ giao tiếp"}, {"key": "D", "text": "Chung một nên văn hóa và tâm lý"}], "answer": ["B"], "note": "", "block": 9}, {"id": 427, "text": "Nội dung nào dưới đây không phải là điều kiện dẫn tới sự ra đời của chủ nghĩa xã hội?", "options": [{"key": "A", "text": "Sự phát triển của lực lượng sản xuất"}, {"key": "B", "text": "Sự trưởng thành của giai cấp công nhân"}, {"key": "C", "text": "Quan hệ sản xuất tư bản chủ nghĩa trở nên lỗi thời"}, {"key": "D", "text": "Mong muốn chủ quan của giai cấp công nhân"}], "answer": ["D"], "note": "", "block": 9}, {"id": 428, "text": "Tôn giáo là một hiện tượng xã hội phản ánh sự bất lực và bế tắc của con người trước tự nhiên và xã hội, tuy nhiên, tôn giáo cũng chứa đựng một số giá trị phù hợp với đạo đức, đạo lí của con người thể hiện nội dung gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Nguồn gốc của tôn giáo"}, {"key": "B", "text": "Tính chất của tôn giáo"}, {"key": "C", "text": "Chức năng của tôn giáo"}, {"key": "D", "text": "Bản chất của tôn giáo"}], "answer": ["D"], "note": "", "block": 9}, {"id": 429, "text": "Cơ sở kinh tế của nền dân chủ xã hội chủ nghĩa là gì?", "options": [{"key": "A", "text": "Nền kinh tế hàng hóa nhiều thành phần"}, {"key": "B", "text": "Chế độ công hữu về những tư liệu sản xuất chủ yếu của xã hội"}, {"key": "C", "text": "Chế độ sở hữu tư nhân về tư liệu sản xuất"}, {"key": "D", "text": "Nền kinh tế thị trường xã hội chủ nghĩa"}], "answer": ["B"], "note": "", "block": 9}, {"id": 430, "text": "Trong gia đình, quan hệ thứ ba tham gia ngay từ đầu vào quá trình phát triển lịch sử, đó là quan hệ nào?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Quan hệ giữa chồng và vợ, quan hệ giữa cha mẹ và con cái"}, {"key": "B", "text": "Quan hệ giữa ông bà với con cái, quan hệ giữa vợ và chồng"}, {"key": "C", "text": "Quan hệ giữa tổ tiên và ông bà, cha mẹ"}, {"key": "D", "text": "Quan hệ giữa con cái và cha mẹ"}], "answer": ["A"], "note": "", "block": 9}, {"id": 431, "text": "Trong sứ mệnh lịch sửa của giai cấp công nhân trên lĩnh vực văn hóa, tư tưởng, những giá trị mà nhân loại thừa nhận và phấn đấu thực hiện là gì?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Lao động; sáng tạo; công bằng; dân chủ, bình đẳng và tự do"}, {"key": "B", "text": "Tự do; bình đẳng; bác ái"}, {"key": "C", "text": "Độc lập; tự do; dẫn chủ, văn minh"}, {"key": "D", "text": "Dân giàu, nước mạnh; công bằng, dân chủ và văn minh"}], "answer": ["A"], "note": "", "block": 9}, {"id": 432, "text": "Nội dung nào dưới đây không phản ánh đúng vị trí của gia đình trong xã hội?(NHUNG HOÀNG)", "options": [{"key": "A", "text": "Gia đình là tế bào của xã hội"}, {"key": "B", "text": "Gia đình là tổ ấm của mỗi thành viên"}, {"key": "C", "text": "Gia đình là cầu nối giữa cá nhân và xã hội"}, {"key": "D", "text": "Gia đình là bộ phận của làng xã"}], "answer": ["D"], "note": "", "block": 9}];

'use strict';
const KEY='mln131-study-v1', $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const blank=()=>({known:[],seen:[],wrong:[],attempts:0,correct:0,history:[],examDate:'',daily:30,days:{}});
let state=blank(), storageOK=true;try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){storageOK=false}
const pages=[['home','◫','Tổng quan'],['schedule','▦','Lịch học'],['flash','▱','Flashcard'],['practice','◉','Luyện tập'],['exam','◷','Thi thử'],['wrong','▧','Câu sai'],['search','⌕','Tra cứu'],['progress','▥','Tiến độ']];
let page='home',session=null, tick=null, searchLimit=30;
const stat=n=>state[n].length, pct=(a,b)=>b?Math.round(a/b*100):0, normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').toLowerCase();
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false;toast('Không thể lưu tiến độ. Hãy xuất bản sao lưu.')}}
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').classList.remove('show'),3200)}
function add(k,id){if(!state[k].includes(id))state[k].push(id)}function remove(k,id){state[k]=state[k].filter(x=>x!==id)}
function seen(id){add('seen',id);save()}function record(q,yes){state.attempts++;state.correct+=Number(yes);add('seen',q.id);if(yes)remove('wrong',q.id);else{add('wrong',q.id);remove('known',q.id)}save()}
function equal(a,b){return a.length===b.length&&a.every(x=>b.includes(x))}function shuffled(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function route(){const next=location.hash.slice(1)||'home';page=pages.some(p=>p[0]===next)?next:'home';render()}
function render(){if(session&&page!==session.type){if(session.type==='exam'&&!session.done){/* keep exam available on return */}else session=null}$('#nav').innerHTML=pages.map(([id,icon,name])=>`<a href="#${id}" class="${page===id?'active':''}" ${page===id?'aria-current="page"':''}><span class="icon">${icon}</span>${name}${id==='wrong'&&stat('wrong')?` <span class="badge">${stat('wrong')}</span>`:''}</a>`).join('');$('#breadcrumb').textContent=pages.find(p=>p[0]===page)[2];$('#app').innerHTML=({home:home,schedule:schedule,flash:()=>studySetup('flash'),practice:()=>studySetup('practice'),exam:examSetup,wrong:wrong,search:searchPage,progress:progress}[page])();if(session&&session.type===page)renderSession();if(page==='search')searchResults();}
function title(eye,heading,desc){return `<div class="eyebrow">${eye}</div><h1>${heading}</h1><p class="muted">${desc}</p>`}
function cards(){return `<div class="stats"><div class="stat"><small>NGÂN HÀNG CÂU HỎI</small><strong>432</strong><span>409 câu một đáp án · 23 câu nhiều đáp án</span></div><div class="stat"><small>ĐÃ THUỘC</small><strong class="accent">${stat('known')}<small> / 432</small></strong><div class="bar"><i style="width:${pct(stat('known'),432)}%"></i></div></div><div class="stat"><small>ĐÃ HỌC</small><strong>${stat('seen')}</strong><span>${432-stat('seen')} câu đang chờ bạn</span></div><div class="stat"><small>CẦN ÔN LẠI</small><strong>${stat('wrong')}</strong><span>Ôn lại để nhớ vững hơn</span></div></div>`}
function blocks(){return Array.from({length:9},(_,i)=>{let from=i*50+1,to=Math.min((i+1)*50,432),n=state.known.filter(x=>x>=from&&x<=to).length;return `<button class="block" data-block="${i+1}"><small>BỘ ${String(i+1).padStart(2,'0')}</small><strong>Câu ${from}–${to}</strong><div class="bar"><i style="width:${pct(n,to-from+1)}%"></i></div><small>${n}/${to-from+1} câu đã thuộc</small></button>`}).join('')}
function home(){return `<section class="hero"><div><span class="eyebrow">Mỗi ngày một bước tiến</span><h1>Hiểu hôm nay.<br>Vững vàng ngày thi.</h1><p>432 câu hỏi MLN131, một góc học tập của riêng bạn. Bắt đầu với vài thẻ và giữ nhịp ôn tập mỗi ngày.</p><div class="buttons"><button class="primary" data-go="flash">Bắt đầu học thẻ</button><button data-go="practice">Luyện tập nhanh</button></div></div><div class="hero-mark" aria-hidden="true"><div class="book">▤</div><small>HỌC · NHỚ · VẬN DỤNG</small></div></section>${cards()}<div class="grid2"><section><div class="section-head"><h2>Chia nhỏ để học dễ hơn</h2><span class="muted" style="font-size:12px">Theo thứ tự trong tài liệu</span></div><div class="block-grid">${blocks()}</div></section><section><div class="section-head"><h2>Nhịp học của bạn</h2></div><div class="panel soft-panel"><span class="badge">MỤC TIÊU HÔM NAY</span><h2 style="margin-top:18px">${state.daily} câu, thêm một chút tự tin.</h2><p class="muted" style="font-size:14px">${state.examDate?'Ngày thi: '+formatDate(state.examDate)+'. ':'Đặt ngày thi để có lịch học phù hợp. '}Ôn những câu chưa nhớ trước, rồi thử sức với câu mới.</p><button data-go="schedule">Xem lịch học</button></div><div class="tip"><b>01 · Tự nhớ trước khi lật</b><br><span class="muted">Đọc câu hỏi và thử trả lời trong đầu.</span></div><div class="tip"><b>02 · Đừng bỏ qua câu sai</b><br><span class="muted">Luyện lại để kiểm tra điều mình còn nhầm.</span></div></section></div><p class="source-note">Nguồn: FE_MLN131_FE_NhungHoang (1).txt. Có 12 câu kèm ghi chú; giữ theo tài liệu, chưa thẩm định học thuật.</p>`}
function filterFields(type){return `<div class="pill-row">${Array.from({length:9},(_,i)=>`<button data-range="${i+1}">Bộ ${i+1}</button>`).join('')}<button data-range="0">Toàn bộ</button></div><div class="filters"><label>Từ câu<input id="from" type="number" min="1" max="432" value="1"></label><label>Đến câu<input id="to" type="number" min="1" max="432" value="432"></label><label>Lọc câu<select id="filter"><option value="all">Tất cả câu hỏi</option><option value="unseen">Chưa học</option><option value="unknown">Chưa thuộc</option><option value="wrong">Câu sai / chưa nhớ</option><option value="multi">Nhiều đáp án</option><option value="notes">Có ghi chú nguồn</option></select></label>${type!=='flash'?'<label>Số câu<input id="count" type="number" min="1" max="432" value="20"></label>':''}<label class="check-label"><input id="shuffle" type="checkbox" ${type==='flash'?'':'checked'}>Xáo trộn câu</label></div>`}
function studySetup(type){return `${title('Ôn tập chủ động',type==='flash'?'Học bằng flashcard':'Luyện tập từng câu',type==='flash'?'Tự trả lời trước khi lật thẻ. Đánh dấu những câu đã thuộc và quay lại câu chưa nhớ.':'Chọn đáp án, kiểm tra ngay và xem nội dung đúng theo tài liệu.')}<div class="panel">${filterFields(type)}<button class="primary" data-start="${type}">${type==='flash'?'Bắt đầu học thẻ':'Bắt đầu luyện tập'}</button></div><p class="source-note">Câu nhiều đáp án được ghi rõ số lựa chọn cần chọn. Đáp án và các kiểu hỏi khác được giữ theo nguồn.</p>`}
function getPool(){let from=Number($('#from').value),to=Number($('#to').value);if(!Number.isInteger(from)||!Number.isInteger(to)||from<1||to>432||from>to){toast('Khoảng câu phải nằm trong 1–432, từ câu nhỏ đến câu lớn.');return null}let f=$('#filter').value;return QUESTIONS.filter(q=>q.id>=from&&q.id<=to&&(f==='all'||f==='unseen'&&!state.seen.includes(q.id)||f==='unknown'&&!state.known.includes(q.id)||f==='wrong'&&state.wrong.includes(q.id)||f==='multi'&&q.answer.length>1||f==='notes'&&q.note))}
function start(type){if(session?.type==='exam'&&!session.done){toast('Hãy hoàn tất bài thi đang làm trước.');location.hash='exam';return}let pool=getPool();if(!pool)return;if(!pool.length){toast('Không có câu nào khớp bộ lọc này.');return}if($('#shuffle').checked)pool=shuffled(pool);if(type!=='flash'){let n=Number($('#count').value);if(!Number.isInteger(n)||n<1||n>432){toast('Số câu phải từ 1 đến 432.');return}pool=pool.slice(0,n)}let minutes=type==='exam'?Number($('#minutes').value):0;if(type==='exam'&&(!Number.isFinite(minutes)||minutes<1||minutes>240)){toast('Thời gian thi phải từ 1 đến 240 phút.');return}session={type,pool,index:0,flipped:false,selected:[],checked:false,right:0,answers:{},results:[],done:false,end:Date.now()+minutes*60000};renderSession();if(type==='exam'){clearInterval(tick);tick=setInterval(updateTimer,1000)}}
function optionHTML(q,interactive,selected=[],reveal=false){return `<div class="options">${q.options.map(o=>`<${interactive?'button':'div'} class="option ${selected.includes(o.key)?'selected':''} ${reveal&&q.answer.includes(o.key)?'correct':''} ${reveal&&selected.includes(o.key)&&!q.answer.includes(o.key)?'incorrect':''}" ${interactive?`data-option="${o.key}" aria-pressed="${selected.includes(o.key)}"`:''}><b>${o.key}</b><span>${esc(o.text)}</span></${interactive?'button':'div'}>`).join('')}</div>`}
function answerHTML(q){return `<div class="answer-box"><b>Đáp án ${q.answer.join(', ')}</b>${q.options.filter(o=>q.answer.includes(o.key)).map(o=>`<div>${o.key}. ${esc(o.text)}</div>`).join('')}</div>${q.note?`<div class="note"><b>Ghi chú trong tài liệu</b><br>${esc(q.note)}</div>`:''}`}
function renderSession(){if(!session||page!==session.type)return;let s=session;if(s.done){renderResult();return}let q=s.pool[s.index];if(s.type==='flash')seen(q.id);let isExam=s.type==='exam',selected=isExam?(s.answers[q.id]||[]):s.selected;$('#app').innerHTML=`<div class="session"><div class="session-top"><span class="badge">${s.type==='flash'?'THẺ HỌC':isExam?'BÀI THI':'LUYỆN TẬP'} ${s.index+1} / ${s.pool.length}</span>${isExam?'<span id="timer" class="timer" aria-label="Thời gian còn lại"></span>':''}<button data-action="exit">${isExam?'Kết thúc và chấm điểm':'Đổi bộ câu'}</button></div><div class="bar" style="margin-bottom:22px"><i style="width:${pct(s.index,s.pool.length)}%"></i></div><article class="card"><div class="section-head" style="margin:0"><span class="muted">Câu ${q.id} · Bộ ${q.block}</span><span class="badge ${q.answer.length>1?'warn':''}">Chọn ${q.answer.length} đáp án</span></div><div class="question">${esc(q.text)}</div>${optionHTML(q,s.type!=='flash'&&!s.checked,selected,s.type==='practice'&&s.checked)}${s.type==='flash'&&s.flipped?answerHTML(q):''}${s.type==='practice'&&s.checked?`<div class="answer-box ${equal(selected,q.answer)?'':'bad'}"><b>${equal(selected,q.answer)?'Chính xác!':'Chưa đúng, hãy ghi nhớ đáp án.'}</b></div>${answerHTML(q)}`:''}</article><div class="session-controls">${s.type==='flash'?(s.flipped?'<button data-action="forget">Chưa nhớ</button><button class="primary" data-action="know">Nhớ rồi</button>':'<button class="primary" style="width:100%" data-action="flip">Lật thẻ · Space</button>'):isExam?`<button data-action="prev" ${s.index===0?'disabled':''}>Câu trước</button><button class="primary" data-action="next">${s.index===s.pool.length-1?'Xem tổng quan bài thi':'Câu tiếp theo'}</button>`:s.checked?'<button class="primary" data-action="next">Tiếp tục · Enter</button>':'<button class="primary" data-action="check">Kiểm tra đáp án · Enter</button>'}</div>${isExam?`<div class="panel"><h3>Các câu trong bài thi</h3><p class="muted" style="font-size:13px">Đã trả lời ${Object.values(s.answers).filter(a=>a.length).length}/${s.pool.length}. Bạn có thể quay lại từng câu.</p><div class="number-grid">${s.pool.map((q,i)=>`<button aria-label="Đến câu ${i+1}" class="${i===s.index?'current':''} ${s.answers[q.id]?.length?'answered':''}" data-jump="${i}">${i+1}</button>`).join('')}</div><button class="primary" data-action="submit">Nộp bài</button></div>`:`<p class="keyboard">${s.type==='flash'?'Space: lật thẻ · Khi đã lật: phím 1 chưa nhớ, phím 2 nhớ rồi':'A–E: chọn đáp án · Enter: kiểm tra / tiếp tục'}</p>`}</div>`;if(isExam)updateTimer()}
function next(){if(session.index+1>=session.pool.length){if(session.type==='exam'){toast('Bạn đã đến câu cuối. Kiểm tra các câu bên dưới rồi nộp bài.');return}session.done=true;renderResult()}else{session.index++;session.flipped=false;session.selected=[];session.checked=false;renderSession()}}
function grade(){let s=session;return s.pool.reduce((n,q)=>n+Number(equal(s.answers[q.id]||[],q.answer)),0)}
function submit(){let s=session;clearInterval(tick);s.right=grade();s.pool.forEach(q=>record(q,equal(s.answers[q.id]||[],q.answer)));s.done=true;state.history.unshift({date:new Date().toISOString(),score:s.right,total:s.pool.length});state.history=state.history.slice(0,30);save();renderResult()}
function renderResult(){let s=session,isFlash=s.type==='flash';$('#app').innerHTML=`<div class="session"><div class="panel empty"><span class="badge">${isFlash?'HOÀN TẤT BỘ THẺ':'KẾT QUẢ ÔN TẬP'}</span><h1>${isFlash?'Bạn đã hoàn thành một bước tiến.':'Thêm một lần luyện, thêm vững kiến thức.'}</h1>${isFlash?`<div class="score">${s.pool.length}</div><p>thẻ đã ôn · ${s.right} thẻ chọn “Nhớ rồi” trong lượt này</p>`:`<div class="score">${s.right}<small style="font-size:28px"> / ${s.pool.length}</small></div><p>Đúng ${pct(s.right,s.pool.length)}% · Câu trả lời sai đã được đưa vào mục Câu sai.</p>`}<div class="buttons" style="justify-content:center"><button class="primary" data-action="restart">Chọn bộ mới</button><button data-go="wrong">Ôn câu sai</button><button data-go="home">Tổng quan</button></div></div>${!isFlash?`<section class="review"><h2>Xem lại bài làm</h2>${s.pool.map(q=>{let selected=s.answers[q.id]||[];return `<details class="panel search-result"><summary><span class="badge ${equal(selected,q.answer)?'':'warn'}">${equal(selected,q.answer)?'Đúng':'Sai'}</span> Câu ${q.id}: ${esc(q.text)}</summary><p>Bạn chọn: ${selected.join(', ')||'Chưa trả lời'}</p>${optionHTML(q,false,selected,true)}${answerHTML(q)}</details>`}).join('')}</section>`:''}</div>`;renderNavOnly()}
function renderNavOnly(){$('#nav').innerHTML=pages.map(([id,icon,name])=>`<a href="#${id}" class="${page===id?'active':''}"><span class="icon">${icon}</span>${name}${id==='wrong'&&stat('wrong')?` <span class="badge">${stat('wrong')}</span>`:''}</a>`).join('')}
function examSetup(){if(session?.type==='exam')return '';return `${title('Sẵn sàng thử sức','Thi thử theo nhịp của bạn','Làm bài với đồng hồ đếm ngược. Đáp án chỉ xuất hiện sau khi nộp bài.')}<div class="panel">${filterFields('exam')}<div class="filters"><label>Thời gian (phút)<input id="minutes" type="number" value="60" min="1" max="240"></label></div><p class="muted" style="font-size:14px">Mặc định 20 câu / 60 phút. Bạn có thể tùy chỉnh; đây không phải cấu trúc kỳ thi chính thức. Bài đang làm được giữ khi chuyển mục, nhưng sẽ mất nếu tải lại trang.</p><button class="primary" data-start="exam">Bắt đầu thi thử</button></div>`}
function updateTimer(){if(!session||session.type!=='exam'||session.done){clearInterval(tick);return}let sec=Math.max(0,Math.ceil((session.end-Date.now())/1000));let t=$('#timer');if(t)t.textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;if(!sec){let prior=page;page='exam';location.hash='exam';submit();toast('Hết thời gian, bài đã được chấm.')}}
function wrong(){let qs=QUESTIONS.filter(q=>state.wrong.includes(q.id));return `${title('Biến nhầm lẫn thành kiến thức','Những câu cần ôn lại',`${qs.length} câu từ các lượt luyện tập, thi thử và thẻ “Chưa nhớ”.`)}${qs.length?`<div class="buttons"><button class="primary" data-wrong="flash">Ôn lại bằng flashcard</button><button data-wrong="practice">Luyện lại câu sai</button></div>${qs.map(q=>`<details class="panel search-result"><summary>Câu ${q.id} · ${esc(q.text)}</summary>${optionHTML(q,false)}${answerHTML(q)}</details>`).join('')}`:'<div class="panel empty"><div class="empty-icon">✓</div><h2>Chưa có câu cần ôn lại</h2><p class="muted">Bắt đầu luyện tập để tìm những phần bạn muốn củng cố.</p><button class="primary" data-go="practice">Luyện tập ngay</button></div>'}`}
function searchPage(){return `${title('Kho kiến thức của bạn','Tra cứu câu hỏi','Tìm bằng số câu, từ khóa có dấu hoặc không dấu.')}<label><span class="muted" style="font-size:13px">Từ khóa hoặc số câu</span><input id="search" class="search" type="search" placeholder="Ví dụ: dân chủ, gia đình, 131…"></label><div class="filters"><label>Loại câu<select id="searchFilter"><option value="all">Tất cả</option><option value="multi">Nhiều đáp án</option><option value="notes">Có ghi chú nguồn</option></select></label></div><div id="results"></div>`}
function searchResults(){let term=normalize($('#search').value.trim()),f=$('#searchFilter').value;let qs=QUESTIONS.filter(q=>(!term||(/^\d+$/.test(term)?q.id===Number(term):normalize(q.text+' '+q.options.map(o=>o.text).join(' ')).includes(term)))&&(f==='all'||f==='multi'&&q.answer.length>1||f==='notes'&&q.note));$('#results').innerHTML=`<p class="muted" style="font-size:13px">${qs.length} câu khớp${qs.length>searchLimit?` · Hiển thị ${searchLimit} câu đầu`:''}</p>${qs.slice(0,searchLimit).map(q=>`<details class="panel search-result"><summary><span class="badge">Câu ${q.id}</span> ${esc(q.text)} ${q.answer.length>1?`<span class="badge warn">Chọn ${q.answer.length}</span>`:''}</summary>${optionHTML(q,false)}${answerHTML(q)}</details>`).join('')||'<div class="panel empty">Không tìm thấy câu phù hợp. Thử từ khóa ngắn hơn.</div>'}${qs.length>searchLimit?'<button data-action="loadmore">Hiện thêm 30 câu</button>':''}`}
function formatDate(s){return new Date(s+'T12:00:00').toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric'})}
function schedule(){let date=state.examDate;let remaining=QUESTIONS.filter(q=>!state.known.includes(q.id));let today=new Date();today.setHours(0,0,0,0);let deadline=date?new Date(date+'T00:00:00'):null;let days=deadline?Math.ceil((deadline-today)/86400000):0;let per=days>0?Math.ceil(remaining.length/days):state.daily;let daily=Math.max(state.daily,per),chunks=[];for(let i=0;i<remaining.length;i+=daily)chunks.push(remaining.slice(i,i+daily));return `${title('Một kế hoạch vừa sức','Giữ nhịp học mỗi ngày','Chia 432 câu thành những buổi ngắn. Lịch tự điều chỉnh theo số câu chưa thuộc.')}<div class="panel"><div class="filters" style="margin-top:0"><label>Ngày thi của bạn<input type="date" id="examDate" value="${esc(date)}"></label><label>Mục tiêu câu / ngày<input id="daily" type="number" min="1" max="432" value="${state.daily}"></label><button class="primary" data-action="saveplan">Cập nhật lịch học</button></div><p class="muted" style="font-size:14px">${date?(days>0?`Còn ${days} ngày đến ${formatDate(date)}. Gợi ý ${daily} câu/ngày để học hết ${remaining.length} câu chưa thuộc.`:'Ngày thi đã đến hoặc đã qua. Bạn vẫn có thể tiếp tục ôn theo mục tiêu mỗi ngày.'):'Chưa đặt ngày thi. Lịch bên dưới dùng mục tiêu '+daily+' câu/ngày, bắt đầu từ hôm nay.'}</p></div><div class="section-head"><h2>Lộ trình ôn tập</h2><span class="muted" style="font-size:13px">${chunks.length} buổi học câu hỏi</span></div><div class="panel">${chunks.length?chunks.map((qs,i)=>{let d=new Date(today);d.setDate(d.getDate()+i);let day=d.toLocaleDateString('en-CA'),key=qs.map(q=>q.id).join('-');return `<div class="day-row"><span class="day-date">${d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'})}<small>Buổi ${i+1}</small></span><input type="checkbox" data-day="${key}" aria-label="Hoàn tất buổi ${i+1}" ${state.days[key]?'checked':''}><div class="day-desc"><b>Học ${qs.length} câu chưa thuộc</b><small>Câu ${qs[0].id}–${qs.at(-1).id} · Flashcard rồi luyện tập</small></div><button data-plan="${qs.map(q=>q.id).join(',')}">Bắt đầu</button></div>`}).join(''):'<p>Bạn đã đánh dấu thuộc toàn bộ 432 câu. Hãy thi thử và ôn lại câu sai để củng cố.</p>'}<div class="day-row"><div class="day-desc"><b>Củng cố trước ngày thi</b><small>Ôn câu sai, thi thử 50 câu và xem lại ghi chú trong tài liệu.</small></div><button data-go="exam">Thi thử</button></div></div>`}
function progress(){return `${title('Nhìn lại để tiến xa hơn','Tiến độ của bạn','Mọi lần luyện tập đều là một bước tiến. Xuất bản sao lưu để chuyển sang thiết bị khác.')}${cards()}<div class="grid2"><div class="panel"><h2>Mức độ thuộc theo từng bộ</h2>${Array.from({length:9},(_,i)=>{let a=i*50+1,b=Math.min((i+1)*50,432),n=state.known.filter(x=>x>=a&&x<=b).length;return `<div class="progress-row"><label>Câu ${a}–${b}</label><div class="bar"><i style="width:${pct(n,b-a+1)}%"></i></div><span>${n}/${b-a+1}</span></div>`}).join('')}</div><div class="panel"><h2>Chất lượng luyện tập</h2><div class="score" style="font-size:50px">${pct(state.correct,state.attempts)}%</div><p class="muted">${state.correct} lượt đúng / ${state.attempts} lượt trả lời đã chấm.</p><h3>Các lần thi thử gần nhất</h3>${state.history.length?state.history.slice(0,8).map(h=>`<div class="tip">${new Date(h.date).toLocaleDateString('vi-VN')} <b style="float:right">${h.score}/${h.total}</b></div>`).join(''):'<p class="muted">Chưa có bài thi thử nào.</p>'}</div></div><div class="panel" style="margin-top:24px"><h2>Sao lưu tiến độ</h2><p class="muted">Tiến độ được lưu trên trình duyệt hiện tại. Dùng file sao lưu để khôi phục trên thiết bị khác.</p><div class="buttons"><button data-action="export">Xuất tiến độ JSON</button><label class="file-label">Nhập bản sao lưu<input id="import" type="file" accept="application/json,.json" hidden></label><button class="danger" data-action="reset">Đặt lại tiến độ</button></div>${!storageOK?'<p class="note">Trình duyệt đang hạn chế lưu trữ. Hãy xuất tiến độ trước khi đóng trang.</p>':''}</div>`}
function go(p){location.hash=p;if(page===p)render()}
document.addEventListener('click',e=>{let b=e.target.closest('button,[data-go]');if(!b)return;let d=b.dataset;if(d.go){go(d.go);return}if(d.block){go('flash');setRange(Number(d.block));return}if(d.range!==undefined){setRange(Number(d.range));return}if(d.start){start(d.start);return}if(d.wrong){let pool=QUESTIONS.filter(q=>state.wrong.includes(q.id));launchPool(d.wrong,pool);return}if(d.plan){launchPool('flash',d.plan.split(',').map(id=>QUESTIONS[Number(id)-1]));return}if(d.option){let s=session,q=s.pool[s.index];if(s.type==='flash'||s.checked)return;let selected=s.type==='exam'?(s.answers[q.id]||[]):s.selected;selected=q.answer.length===1?[d.option]:(selected.includes(d.option)?selected.filter(x=>x!==d.option):[...selected,d.option]);if(s.type==='exam')s.answers[q.id]=selected;else s.selected=selected;renderSession();return}if(d.jump!==undefined){session.index=Number(d.jump);renderSession();return}let a=d.action,s=session;if(a==='flip'){s.flipped=true;renderSession()}if(a==='know'||a==='forget'){let q=s.pool[s.index];seen(q.id);if(a==='know'){add('known',q.id);remove('wrong',q.id);s.right++}else{remove('known',q.id);add('wrong',q.id)}save();next()}if(a==='check'){let q=s.pool[s.index];if(!s.selected.length){toast('Hãy chọn đáp án trước.');return}s.checked=true;s.answers[q.id]=[...s.selected];let yes=equal(s.selected,q.answer);s.right+=Number(yes);record(q,yes);renderSession()}if(a==='next')next();if(a==='prev'){s.index=Math.max(0,s.index-1);renderSession()}if(a==='submit'||a==='exit'&&s?.type==='exam'){let blank=s.pool.filter(q=>!s.answers[q.id]?.length).length;if(confirm(`Nộp bài và chấm điểm?${blank?' Còn '+blank+' câu chưa trả lời.':''}`))submit()}else if(a==='exit'||a==='restart'){session=null;render()}if(a==='loadmore'){searchLimit+=30;searchResults()}if(a==='saveplan'){let n=Number($('#daily').value);if(!Number.isInteger(n)||n<1||n>432){toast('Mục tiêu phải từ 1 đến 432 câu/ngày.');return}state.daily=n;state.examDate=$('#examDate').value;save();render();toast('Đã cập nhật lịch học.')}if(a==='export'){let blob=new Blob([JSON.stringify({version:1,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='mln131-tien-do.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(a==='reset'&&confirm('Đặt lại toàn bộ tiến độ, lịch học và lịch sử thi? Hãy xuất bản sao lưu trước nếu cần.')){state=blank();session=null;clearInterval(tick);save();render();toast('Đã đặt lại tiến độ.')}});
function setRange(n){$('#from').value=n?(n-1)*50+1:1;$('#to').value=n?Math.min(n*50,432):432;document.querySelectorAll('[data-range]').forEach(b=>b.classList.toggle('active',Number(b.dataset.range)===n))}
function launchPool(type,pool){if(session?.type==='exam'&&!session.done){toast('Hãy hoàn tất bài thi đang làm trước.');go('exam');return}session={type,pool,index:0,flipped:false,selected:[],checked:false,right:0,answers:{},done:false};page=type;location.hash=type;render()}
document.addEventListener('input',e=>{if(e.target.id==='search'){searchLimit=30;searchResults()}});
document.addEventListener('change',async e=>{if(e.target.id==='searchFilter'){searchLimit=30;searchResults()}if(e.target.dataset.day){state.days[e.target.dataset.day]=e.target.checked;save()}if(e.target.id==='import'&&e.target.files[0]){try{let s=JSON.parse(await e.target.files[0].text());for(let k of ['known','seen','wrong'])if(!Array.isArray(s[k])||s[k].some(id=>!Number.isInteger(id)||id<1||id>432))throw Error();if(!Number.isInteger(s.attempts)||!Number.isInteger(s.correct)||s.correct<0||s.correct>s.attempts||s.attempts<0)throw Error();if(!Array.isArray(s.history)||s.history.some(h=>!Number.isInteger(h.score)||!Number.isInteger(h.total)||h.score<0||h.score>h.total||h.total<1||h.total>432||isNaN(Date.parse(h.date))))throw Error();if(s.examDate&&!/^\d{4}-\d{2}-\d{2}$/.test(s.examDate))throw Error();if(!confirm('Thay thế tiến độ hiện tại bằng bản sao lưu này?'))return;state={...blank(),known:[...new Set(s.known)],seen:[...new Set(s.seen)],wrong:[...new Set(s.wrong)],attempts:s.attempts,correct:s.correct,history:s.history.slice(0,30),examDate:s.examDate||'',daily:Number.isInteger(s.daily)&&s.daily>0&&s.daily<=432?s.daily:30,days:s.days&&typeof s.days==='object'?s.days:{}};save();render();toast('Đã khôi phục tiến độ.')}catch(err){toast('File sao lưu không hợp lệ. Tiến độ hiện tại được giữ.')}}});
document.addEventListener('keydown',e=>{if(!session||session.done||page!==session.type||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.altKey||e.metaKey)return;let s=session;if(e.code==='Space'&&s.type==='flash'){e.preventDefault();if(!s.flipped)$('[data-action="flip"]')?.click()}if(s.type==='flash'&&s.flipped){if(e.key==='1')$('[data-action="forget"]')?.click();if(e.key==='2')$('[data-action="know"]')?.click()}if(s.type!=='flash'){let key=e.key.toUpperCase();if(/^[A-H]$/.test(key))$(`[data-option="${key}"]`)?.click();if(e.key==='Enter'){e.preventDefault();if(s.type==='practice'&&s.checked)$('[data-action="next"]')?.click();else if(s.type==='practice')$('[data-action="check"]')?.click();else $('[data-action="next"]')?.click()}}});
window.addEventListener('hashchange',route);window.addEventListener('beforeunload',e=>{if(session?.type==='exam'&&!session.done){e.preventDefault();e.returnValue=''}});route();

const sourceLink=document.querySelector('a[href="source.txt"]');sourceLink.href=URL.createObjectURL(new Blob([JSON.parse(document.getElementById('original-source').textContent)],{type:'text/plain;charset=utf-8'}));sourceLink.download='FE_MLN131_FE_NhungHoang.txt';</script></body></html>
